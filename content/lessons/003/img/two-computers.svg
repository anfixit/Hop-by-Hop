<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Печать на принтере соседнего компьютера</text>

  <!-- Компьютер A -->
  <rect x="40" y="80" width="360" height="470" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <text x="220" y="118" text-anchor="middle" font-size="26" font-weight="bold" fill="#0E1830">Компьютер A</text>
  <g font-size="22" text-anchor="middle" fill="#0E1830">
    <rect x="80" y="140" width="280" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="220" y="178">Клиент печати</text>
    <rect x="80" y="240" width="280" height="60" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <text x="220" y="278">Операционная система</text>
    <rect x="80" y="340" width="280" height="60" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
    <text x="220" y="378">Драйвер сетевой карты</text>
    <rect x="80" y="440" width="280" height="60" rx="10" fill="#0E1830"/>
    <text x="220" y="478" fill="#FFFFFF">Сетевая карта</text>
  </g>
  <g stroke="#0E1830" stroke-width="3">
    <line x1="220" y1="200" x2="220" y2="232"/><line x1="220" y1="300" x2="220" y2="332"/><line x1="220" y1="400" x2="220" y2="432"/>
  </g>
  <g fill="#0E1830">
    <polygon points="220,240 212,226 228,226"/><polygon points="220,340 212,326 228,326"/><polygon points="220,440 212,426 228,426"/>
  </g>

  <!-- Компьютер B -->
  <rect x="800" y="80" width="360" height="470" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <text x="980" y="118" text-anchor="middle" font-size="26" font-weight="bold" fill="#0E1830">Компьютер B</text>
  <g font-size="22" text-anchor="middle" fill="#0E1830">
    <rect x="840" y="140" width="280" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="980" y="178">Сервер печати</text>
    <rect x="840" y="240" width="280" height="60" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <text x="980" y="278">Операционная система</text>
    <rect x="840" y="340" width="280" height="60" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
    <text x="980" y="378">Драйвер сетевой карты</text>
    <rect x="840" y="440" width="280" height="60" rx="10" fill="#0E1830"/>
    <text x="980" y="478" fill="#FFFFFF">Сетевая карта</text>
  </g>
  <g stroke="#0E1830" stroke-width="3">
    <line x1="980" y1="208" x2="980" y2="240"/><line x1="980" y1="308" x2="980" y2="340"/><line x1="980" y1="408" x2="980" y2="440"/>
  </g>
  <g fill="#0E1830">
    <polygon points="980,200 972,214 988,214"/><polygon points="980,300 972,314 988,314"/><polygon points="980,400 972,414 988,414"/>
  </g>

  <!-- линия связи -->
  <line x1="360" y1="470" x2="840" y2="470" stroke="#14B8A6" stroke-width="8"/>
  <text x="600" y="455" text-anchor="middle" font-size="22" fill="#0F766E">линия связи: биты по одному</text>
  <text x="600" y="505" text-anchor="middle" font-size="20" fill="#475569">порты карт, соединённые кабелем</text>

  <!-- протокол -->
  <line x1="360" y1="170" x2="840" y2="170" stroke="#B45309" stroke-width="3"/>
  <polygon points="840,170 826,162 826,178" fill="#B45309"/>
  <polygon points="360,170 374,162 374,178" fill="#B45309"/>
  <text x="600" y="155" text-anchor="middle" font-size="22" fill="#B45309">протокол службы печати</text>
  <text x="600" y="198" text-anchor="middle" font-size="20" fill="#475569">логический интерфейс: формат и правила</text>

  <!-- принтер -->
  <rect x="890" y="570" width="180" height="55" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="980" y="605" text-anchor="middle" font-size="22" fill="#0E1830">Принтер</text>
  <line x1="1120" y1="270" x2="1150" y2="270" stroke="#64748B" stroke-width="3"/>
  <line x1="1150" y1="270" x2="1150" y2="597" stroke="#64748B" stroke-width="3"/>
  <line x1="1150" y1="597" x2="1070" y2="597" stroke="#64748B" stroke-width="3"/>

  <text x="220" y="600" text-anchor="middle" font-size="20" fill="#475569">данные идут вниз по цепочке,</text>
  <text x="220" y="626" text-anchor="middle" font-size="20" fill="#475569">на приёме - вверх</text>
</svg>
