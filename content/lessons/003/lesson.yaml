id: 3
title: Простейшая сеть из двух компьютеров
status: published
summary: >
  Разбираем сеть из двух компьютеров и принтера: что делают приложение, ОС,
  драйвер и сетевая карта, чем физический интерфейс отличается от протокола,
  как биты идут по линии, что такое пропускная способность и узкое место,
  зачем нужны топологии и адреса. И почему физический доступ почти всегда
  означает полный доступ.

quiz:
  - q: Приложение на компьютере хочет отправить данные по сети. Кто непосредственно управляет сетевой картой?
    options:
      - Само приложение, через системный вызов
      - Драйвер сетевой карты, запущенный ОС
      - Сама карта, без драйвера
      - Приложение на компьютере-получателе
    answer: 1
    explain: >
      Приложение просит ОС выполнить операцию (такая просьба и называется системным
      вызовом), ОС запускает драйвер, а драйвер уже управляет картой: передаёт ей байты
      и команды. Приложение напрямую с картой не работает, а карта без драйвера не знает,
      что и когда передавать.

  - q: Что такое логический интерфейс, или протокол?
    options:
      - Разъём с контактами и параметры сигналов на них
      - Программа, которая управляет сетевой картой
      - Формат сообщений и правила обмена ими
      - Скорость, с которой данные передаются по линии
    answer: 2
    explain: >
      Разъём и сигналы - это физический интерфейс (порт), программа управления картой -
      драйвер, скорость - характеристика канала. Протокол - это договорённость о формате
      сообщений и логике обмена ими.

  - q: Путь данных проходит по участкам 1000 Мбит/с, 100 Мбит/с и 1000 Мбит/с. Какая у пути пропускная способность?
    options:
      - 2100 Мбит/с
      - 1000 Мбит/с
      - 700 Мбит/с
      - 100 Мбит/с
    answer: 3
    explain: >
      Данные проходят участки последовательно, поэтому путь не быстрее самого медленного
      участка - узкого места. Здесь это 100 Мбит/с. Скорости не складываются и не
      усредняются.

  - q: Чем полудуплексный канал отличается от дуплексного?
    options:
      - Передаёт в обе стороны, но по очереди
      - Передаёт только в одну сторону
      - Передаёт вдвое медленнее дуплексного
      - Использует половину проводов кабеля
    answer: 0
    explain: >
      Полудуплексный канал работает в обе стороны по очереди, дуплексный - в обе стороны
      одновременно, а симплексный - только в одну сторону. К скорости и числу проводов
      это определение прямо не относится.

  - q: Сколько линий связи нужно, чтобы соединить каждый с каждым 10 компьютеров?
    options:
      - 10
      - 20
      - 45
      - 100
    answer: 2
    explain: >
      Для полносвязной топологии нужно N(N-1)/2 линий: 10 × 9 / 2 = 45. Каждую пару
      соединяет одна линия, а пар из 10 компьютеров 45. Поэтому на практике используют
      звезду и дерево.

  - q: Данные отправлены на broadcast-адрес. Кто их получит?
    options:
      - Один конкретный интерфейс
      - Все узлы сети
      - Все члены заранее заданной группы
      - Один узел из группы, например ближайший
    answer: 1
    explain: >
      Broadcast - это широковещательная рассылка всем узлам сети. Один интерфейс - это
      unicast, группа - multicast, один узел из группы - anycast.

  - q: Почему IP-адрес называют иерархическим, а MAC-адрес - плоским?
    options:
      - IP-адрес длиннее, поэтому в нём больше уровней
      - MAC пишут в hex, а IP-адрес - десятичными числами
      - В IP-адресе есть номер сети и номер узла
      - IP-адрес назначает администратор, а MAC - производитель
    answer: 2
    explain: >
      Иерархический адрес устроен как почтовый: сначала номер сети, потом номер узла в ней,
      и доставлять данные между сетями можно по одному номеру сети. MAC-адрес не несёт
      информации о том, где находится карта. Длина и форма записи здесь ни при чём
      (IPv4-адрес в 4 байта даже короче 6-байтового MAC), а кто
      назначает адрес, не делает его иерархическим: IP-адрес тоже может выдаваться
      автоматически.

  - q: В выводе ip -s link счётчик errors в строке RX постоянно растёт. О чём это говорит в первую очередь?
    options:
      - Кто-то пытается взломать компьютер
      - Приходят повреждённые кадры: проверь кабель
      - Сеть перегружена, пакеты стоят в очереди
      - В системе закончилась оперативная память
    answer: 1
    explain: >
      Счётчик RX errors растёт, когда принятые кадры оказываются с ошибками, в первую
      очередь с неверной контрольной суммой, то есть данные повреждены по пути. Чаще всего
      виноваты кабель, разъём или помехи. Это не признак взлома и не перегрузка.

  - q: Злоумышленник перехватывает данные по пути и подменяет их. Защитит ли от этого контрольная сумма?
    options:
      - Да, получатель заметит несовпадение суммы
      - Да, если контрольная сумма достаточно длинная
      - Нет, злоумышленник пересчитает её заново
      - Нет, сумма передаётся отдельно от данных
    answer: 2
    explain: >
      Контрольная сумма считается по открытому алгоритму и без секрета, поэтому тот, кто
      подменил данные, просто посчитает её заново. Она защищает только от случайных помех.
      От намеренной подмены защищает криптография.

open_questions:
  - q: Опиши своими словами путь сообщения от приложения на одном компьютере до приложения на другом в простейшей сети из двух машин. Кто что делает на каждом шаге?
    reference: >
      Приложение A формирует сообщение по своему протоколу, кладёт его в память и просит
      операционную систему отправить. ОС запускает драйвер сетевой карты, драйвер передаёт
      байты карте, карта превращает биты в сигнал и отправляет по линии связи. На
      компьютере B карта принимает биты, собирает байты и проверяет, не повреждены ли они;
      драйвер переносит данные в память, и приложение B читает сообщение и обрабатывает его
      по тому же протоколу. Если нужен ответ, путь повторяется в обратную сторону.
    key_points:
      - приложение не работает с картой напрямую, а обращается к ОС
      - ОС запускает драйвер, драйвер управляет сетевой картой
      - карта передаёт биты сигналом по линии, на приёме собирает байты и проверяет ошибки
      - приложения понимают друг друга благодаря общему протоколу

  - q: Объясни разницу между пропускной способностью канала и скоростью передачи данных. Что такое узкое место и почему гигабитная карта может не ускорить интернет?
    reference: >
      Пропускная способность - максимально возможная скорость канала, предел, заданный
      средой и технологией. Скорость передачи данных - сколько данных реально прошло за
      время, она средняя и не превышает пропускную способность. Путь из нескольких участков
      не быстрее самого медленного из них - узкого места. Если провайдер даёт 100 Мбит/с,
      то гигабитная карта в компьютере не поможет: узкое место на участке провайдера.
    key_points:
      - пропускная способность - предел канала
      - скорость передачи - фактический средний результат, не выше предела
      - путь ограничен самым медленным участком - узким местом
      - пример с гигабитной картой и медленным каналом провайдера

  - q: В переговорной компании есть сетевая розетка, подключённая к внутренней сети. Почему это может быть проблемой безопасности и что с этим делают?
    reference: >
      Физический доступ к сети почти всегда даёт полный доступ. Посетитель может подключить
      к розетке свой ноутбук или маленькое устройство-шпион и оказаться во внутренней сети
      компании в обход внешних защит: подслушивать трафик, атаковать внутренние серверы.
      Защищаются тем, что отключают неиспользуемые порты и проверяют устройства при
      подключении к сети.
    key_points:
      - физический доступ к сети почти всегда означает полный доступ
      - через розетку можно попасть во внутреннюю сеть в обход внешних защит
      - защита - отключать неиспользуемые порты и проверять устройства при подключении
