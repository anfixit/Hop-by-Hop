<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Скользящее окно: взгляд отправителя</text>

  <text x="60" y="80" font-size="18" font-weight="bold" fill="#0E1830">Поток байтов, которые программа отдала TCP:</text>
  <rect x="60" y="120" width="280" height="80" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <rect x="340" y="120" width="260" height="80" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
  <rect x="600" y="120" width="240" height="80" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <rect x="840" y="120" width="300" height="80" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <g font-size="16" text-anchor="middle" fill="#0E1830">
    <text x="200" y="154">отправлено</text><text x="200" y="178">и подтверждено</text>
    <text x="470" y="154">отправлено,</text><text x="470" y="178">подтверждения нет</text>
    <text x="720" y="154">можно</text><text x="720" y="178">отправлять</text>
    <text x="990" y="154">пока нельзя:</text><text x="990" y="178">за пределами окна</text>
  </g>

  <line x1="340" y1="212" x2="340" y2="248" stroke="#0E1830" stroke-width="3"/>
  <line x1="840" y1="212" x2="840" y2="248" stroke="#0E1830" stroke-width="3"/>
  <line x1="340" y1="236" x2="840" y2="236" stroke="#0E1830" stroke-width="3"/>
  <text x="590" y="266" text-anchor="middle" font-size="18" font-weight="bold" fill="#0E1830">окно: столько байт объявил получатель в поле Window</text>

  <g font-size="15" fill="#475569">
    <text x="340" y="106" text-anchor="middle">номер подтверждения</text>
    <text x="840" y="106" text-anchor="middle">номер подтверждения + окно</text>
  </g>

  <text x="60" y="330" font-size="18" font-weight="bold" fill="#0E1830">Пришло подтверждение - окно сдвинулось вправо:</text>
  <rect x="60" y="350" width="420" height="80" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <rect x="480" y="350" width="120" height="80" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
  <rect x="600" y="350" width="380" height="80" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <rect x="980" y="350" width="160" height="80" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <line x1="480" y1="442" x2="480" y2="478" stroke="#0E1830" stroke-width="3"/>
  <line x1="980" y1="442" x2="980" y2="478" stroke="#0E1830" stroke-width="3"/>
  <line x1="480" y1="466" x2="980" y2="466" stroke="#0E1830" stroke-width="3"/>
  <g font-size="15" text-anchor="middle" fill="#0E1830">
    <text x="270" y="396">подтверждено больше</text>
    <text x="790" y="396">открылось место для новых данных</text>
  </g>

  <rect x="40" y="505" width="1120" height="75" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="534" text-anchor="middle" font-size="17" fill="#0E1830">Левый край двигают подтверждения, размер задаёт получатель: он зависит от свободного места в его буфере.</text>
  <text x="600" y="560" text-anchor="middle" font-size="17" fill="#0E1830">Если получатель перестал сдвигать правый край, левый догоняет его: окно 0, отправитель ждёт.</text>
</svg>