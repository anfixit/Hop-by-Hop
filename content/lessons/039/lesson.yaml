id: 39
title: "Скользящее окно и управление потоком"
status: published
summary: >
  Сколько данных можно отправить, не дожидаясь подтверждений: метод простоя и метод
  скользящего окна, возвращение на N пакетов и выборочное повторение. Окно TCP в байтах,
  буферы, управление потоком, нулевое окно и пробные сегменты. Отложенные подтверждения,
  алгоритм Нейгла и TCP_NODELAY, синдром глупого окна и правило Кларка. На практике -
  получатель, который не читает, окно, уменьшающееся до нуля, и 200 записей по одному
  байту с алгоритмом Нейгла и без него.

quiz:
  - q: Чем метод скользящего окна лучше метода простоя источника?
    options:
      - Он не требует подтверждений от получателя
      - Он позволяет не нумеровать пакеты совсем
      - Он разрешает слать пакеты, не дожидаясь квитанций
      - Он исключает потери пакетов на линии связи
    answer: 2
    explain: >
      При методе простоя следующий пакет отправляется только после квитанции на
      предыдущий, и линия в основном простаивает. Окно разрешает держать в пути сразу
      несколько неподтверждённых пакетов; квитанции сдвигают окно вперёд.

  - q: Что означает значение поля Window в сегменте TCP?
    options:
      - Сколько байт отправитель сегмента готов принять
      - Сколько байт отправитель сегмента хочет передать
      - Сколько сегментов уже находится в пути
      - Сколько байт данных несёт этот сегмент
    answer: 0
    explain: >
      Окно объявляет тот, кто отправил сегмент, в роли получателя данных: столько
      байт, считая от номера подтверждения, он ещё может принять. Значение отражает свободное место в его буфере приёма и меняется
      от сегмента к сегменту.

  - q: От чего защищает управление потоком с помощью окна?
    options:
      - От перегрузки маршрутизаторов на пути
      - От подделки сегментов посторонним
      - От потери подтверждений в сети
      - От переполнения буфера получателя
    answer: 3
    explain: >
      Окно получателя не даёт быстрому отправителю завалить медленного получателя.
      Перегрузку сети оно не учитывает: для этого у отправителя есть второе окно, окно
      перегрузки (урок 41), и действует меньшее из двух.

  - q: Получатель объявил нулевое окно. Что делает отправитель?
    options:
      - Закрывает соединение сегментом FIN
      - Время от времени шлёт пробный сегмент
      - Продолжает отправку с прежней скоростью
      - Сбрасывает соединение сегментом RST
    answer: 1
    explain: >
      Отправитель останавливается, но по таймеру настойчивости отправляет пробные
      сегменты, на которые получатель отвечает текущим окном. Иначе потеря сегмента с
      новым окном привела бы к вечному ожиданию с обеих сторон.

  - q: Получатель объявляет окно 64 000 байт, время оборота 200 мс. Какую скорость нельзя превысить, как ни быстра линия?
    options:
      - Примерно 320 000 байт в секунду
      - Примерно 64 000 байт в секунду
      - Примерно 12 800 байт в секунду
      - Примерно 3 200 000 байт в секунду
    answer: 0
    explain: >
      За одно время оборота нельзя передать больше одного окна. 64 000 байт за 0,2
      секунды - это 320 000 байт в секунду. Поэтому на быстрых и длинных линиях нужны
      большие окна и масштаб окна.

  - q: Программа делает много записей по одному байту подряд. Как поступит алгоритм Нейгла?
    options:
      - Отправит каждый байт отдельным сегментом
      - Задержит все байты на 500 миллисекунд
      - Отбросит все байты, кроме первого
      - Первый отправит, остальные пока накопит
    answer: 3
    explain: >
      Первая маленькая порция уходит сразу, следующие копятся, пока не придёт
      подтверждение, и уходят одним сегментом. В опыте 200 записей превратились в два
      сегмента: 1 и 199 байт.

  - q: Зачем программы включают параметр TCP_NODELAY?
    options:
      - Чтобы увеличить буфер приёма сокета
      - Чтобы отключить алгоритм Нейгла
      - Чтобы отключить подтверждения сегментов
      - Чтобы ускорить установление соединения
    answer: 1
    explain: >
      Алгоритм Нейгла задерживает мелкие сообщения до подтверждения предыдущих, что
      плохо для терминалов, игр и обмена короткими запросами, особенно вместе с
      отложенными подтверждениями на другой стороне. TCP_NODELAY отключает его для
      сокета.

  - q: В чём состоит правило Кларка против синдрома глупого окна?
    options:
      - Отправитель удваивает окно после каждого подтверждения
      - Получатель подтверждает каждый байт отдельным сегментом
      - Получатель не объявляет крошечные окна, а ждёт места
      - Отправитель повторяет сегменты, не дожидаясь таймера
    answer: 2
    explain: >
      Получатель молчит о новом окне, пока не сможет принять полный сегмент или пока
      буфер не освободится наполовину; отправитель тоже не шлёт мелочь. Иначе при
      программе, читающей по байту, данные шли бы по одному байту в пакете.

open_questions:
  - q: Как работает скользящее окно в TCP и как с его помощью получатель управляет отправителем?
    reference: >
      Отправителю разрешено иметь в пути несколько неподтверждённых байт - не больше
      окна. Окно объявляет получатель в поле Window каждого сегмента: сколько байт,
      считая от номера подтверждения, он готов принять; это свободное место в его
      буфере приёма. Подтверждения сдвигают левый край окна, и отправитель может
      передавать новые данные. Если программа получателя читает медленно, буфер
      заполняется, окно уменьшается, и отправитель замедляется - это управление потоком.
      При нулевом окне отправитель останавливается и по таймеру настойчивости шлёт
      пробные сегменты, чтобы не пропустить открытие окна.
    key_points:
      - окно - сколько байт получатель готов принять от номера подтверждения
      - отражает свободное место в буфере приёма
      - подтверждения сдвигают окно
      - нулевое окно, пробные сегменты

  - q: Что такое отложенные подтверждения и алгоритм Нейгла и почему вместе они могут мешать?
    reference: >
      Отложенное подтверждение: получатель не подтверждает сегмент сразу, а немного
      ждёт, чтобы отправить подтверждение вместе с данными в обратную сторону или
      одним подтверждением покрыть два сегмента. Алгоритм Нейгла: отправитель первую
      маленькую порцию отправляет сразу, а следующие копит до прихода подтверждения и
      отправляет одним сегментом. Оба экономят пакеты. Вместе они дают задержку:
      отправитель ждёт подтверждения, чтобы отправить остаток, а получатель тянет с
      подтверждением, ожидая данных. Программы с мелкими срочными сообщениями отключают
      алгоритм Нейгла параметром TCP_NODELAY.
    key_points:
      - отложенное подтверждение - подождать данных или второго сегмента
      - Нейгл - копить мелкие порции до подтверждения
      - взаимное ожидание даёт задержку
      - TCP_NODELAY

  - q: Что ты увидишь в tcpdump и ss, если программа-получатель перестала читать данные из соединения?
    reference: >
      Буфер приёма получателя заполняется, и в его подтверждениях значение окна
      уменьшается до нуля. В ss у получателя растёт очередь приёма (Recv-Q). Отправитель
      перестаёт передавать данные: у него растёт очередь отправки (Send-Q), а программа
      блокируется на записи. Отправитель периодически, с растущими промежутками, шлёт
      пробные сегменты без данных, получатель отвечает подтверждением с нулевым окном.
      Когда программа снова начнёт читать, получатель объявит ненулевое окно, и передача
      продолжится; данные при этом не теряются.
    key_points:
      - окно в подтверждениях падает до нуля
      - Recv-Q у получателя, Send-Q у отправителя
      - пробные сегменты с растущими промежутками
      - после чтения окно открывается, потерь нет
