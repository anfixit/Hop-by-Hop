<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <rect width="1200" height="420" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Пойманный кадр: 74 байта по уровням</text>

  <!-- 74 байта на 1080 px, ~14.6 px/байт; x0=60 -->
  <rect x="60" y="90" width="204" height="90" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/>
  <text x="162" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#0E1830">Ethernet</text>
  <text x="162" y="160" text-anchor="middle" font-size="18" fill="#475569">14 байт</text>
  <rect x="264" y="90" width="292" height="90" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="410" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#0E1830">IP</text>
  <text x="410" y="160" text-anchor="middle" font-size="18" fill="#475569">20 байт</text>
  <rect x="556" y="90" width="584" height="90" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/>
  <text x="848" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#0E1830">TCP (с опциями)</text>
  <text x="848" y="160" text-anchor="middle" font-size="18" fill="#475569">40 байт, данных пока нет</text>

  <!-- указатели к трём выноскам в ряд -->
  <g stroke="#0E1830" stroke-width="2">
    <line x1="245" y1="180" x2="220" y2="260"/>
    <line x1="400" y1="180" x2="600" y2="260"/>
    <line x1="600" y1="180" x2="980" y2="260"/>
  </g>
  <g fill="#0E1830"><circle cx="245" cy="180" r="6"/><circle cx="400" cy="180" r="6"/><circle cx="600" cy="180" r="6"/></g>

  <rect x="40" y="260" width="360" height="90" rx="10" fill="#F8FAFC" stroke="#BE185D" stroke-width="2"/>
  <text x="220" y="295" text-anchor="middle" font-size="19" font-weight="bold" fill="#BE185D">байты 12-13: EtherType 0800</text>
  <text x="220" y="325" text-anchor="middle" font-size="17" fill="#475569">внутри IPv4 - отдать IP</text>

  <rect x="420" y="260" width="360" height="90" rx="10" fill="#F8FAFC" stroke="#B45309" stroke-width="2"/>
  <text x="600" y="295" text-anchor="middle" font-size="19" font-weight="bold" fill="#B45309">байт 23: Protocol 06</text>
  <text x="600" y="325" text-anchor="middle" font-size="17" fill="#475569">внутри TCP - отдать TCP</text>

  <rect x="800" y="260" width="360" height="90" rx="10" fill="#F8FAFC" stroke="#4338CA" stroke-width="2"/>
  <text x="980" y="295" text-anchor="middle" font-size="19" font-weight="bold" fill="#4338CA">байты 36-37: порт 0050</text>
  <text x="980" y="325" text-anchor="middle" font-size="17" fill="#475569">80 - отдать программе на порту 80</text>

  <text x="600" y="395" text-anchor="middle" font-size="19" fill="#475569">Каждый уровень оставляет следующему записку "кому нести дальше"</text>
</svg>
