<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Три карты одних и тех же уровней</text>
  <g font-size="24" font-weight="bold" text-anchor="middle" fill="#0E1830">
    <text x="210" y="95">OSI</text><text x="600" y="95">TCP/IP</text><text x="990" y="95">Курс (гибрид)</text>
  </g>

  <!-- OSI: 7 уровней по 64 px, от y=110 -->
  <g font-size="21" text-anchor="middle" fill="#0E1830">
    <rect x="60" y="110" width="300" height="60" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="210" y="148">7 Прикладной</text>
    <rect x="60" y="176" width="300" height="60" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="210" y="214">6 Представления</text>
    <rect x="60" y="242" width="300" height="60" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="210" y="280">5 Сеансовый</text>
    <rect x="60" y="308" width="300" height="60" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/><text x="210" y="346">4 Транспортный</text>
    <rect x="60" y="374" width="300" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="210" y="412">3 Сетевой</text>
    <rect x="60" y="440" width="300" height="60" rx="8" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/><text x="210" y="478">2 Канальный</text>
    <rect x="60" y="506" width="300" height="60" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="210" y="544">1 Физический</text>
  </g>

  <!-- TCP/IP -->
  <g font-size="21" text-anchor="middle" fill="#0E1830">
    <rect x="450" y="110" width="300" height="192" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="600" y="200">Прикладной</text><text x="600" y="228" font-size="18" fill="#475569">HTTP, DNS, SSH</text>
    <rect x="450" y="308" width="300" height="60" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/><text x="600" y="337">Транспортный</text><text x="600" y="359" font-size="16" fill="#475569">TCP, UDP</text>
    <rect x="450" y="374" width="300" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="600" y="403">Межсетевой</text><text x="600" y="425" font-size="16" fill="#475569">IP, ICMP</text>
    <rect x="450" y="440" width="300" height="126" rx="8" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/><text x="600" y="498">Канальный</text><text x="600" y="524" font-size="18" fill="#475569">Ethernet, Wi-Fi</text>
  </g>

  <!-- Гибрид -->
  <g font-size="21" text-anchor="middle" fill="#0E1830">
    <rect x="840" y="110" width="300" height="192" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="990" y="212">L7 Прикладной</text>
    <rect x="840" y="308" width="300" height="60" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/><text x="990" y="346">L4 Транспортный</text>
    <rect x="840" y="374" width="300" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="990" y="412">L3 Сетевой</text>
    <rect x="840" y="440" width="300" height="60" rx="8" fill="#FCE7F3" stroke="#BE185D" stroke-width="2"/><text x="990" y="478">L2 Канальный</text>
    <rect x="840" y="506" width="300" height="60" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="990" y="544">L1 Физический</text>
  </g>

  <text x="600" y="610" text-anchor="middle" font-size="21" fill="#475569">Думаем протоколами TCP/IP, называем уровни номерами OSI:</text>
  <text x="600" y="640" text-anchor="middle" font-size="21" fill="#475569">"проблема на L2", "L4-балансировщик", "фильтрация на L7"</text>
</svg>
