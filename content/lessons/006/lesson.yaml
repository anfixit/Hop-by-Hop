id: 6
title: "Модели OSI и TCP/IP: инкапсуляция по-настоящему"
status: published
summary: >
  Даём уровням настоящие имена: семь уровней OSI, четыре уровня TCP/IP и гибридная
  модель, которой пользуется вся индустрия. Почему победил TCP/IP, как называются
  порции данных на каждом уровне, где живут MAC, IP и порты, как получатель
  разбирает матрёшку по полям-указателям. И разбираем по байтам настоящий кадр,
  пойманный tcpdump.

quiz:
  - q: Сколько уровней в модели OSI?
    options:
      - 4
      - 5
      - 7
      - 9
    answer: 2
    explain: >
      Модель OSI семиуровневая: физический, канальный, сетевой, транспортный, сеансовый,
      представления и прикладной. Четыре уровня у модели TCP/IP, пять - у гибридной
      модели Таненбаума, которую используем в курсе.

  - q: Каких уровней OSI нет как отдельных уровней в модели TCP/IP?
    options:
      - Физического и канального
      - Сеансового и представления
      - Сетевого и транспортного
      - Транспортного и прикладного
    answer: 1
    explain: >
      В TCP/IP нет сеансового уровня и уровня представления: приложения сами выполняют
      нужные им функции. Физический и канальный в TCP/IP объединены в канальный, но
      сами функции никуда не делись.

  - q: На каком уровне работает обычный коммутатор локальной сети?
    options:
      - Только на физическом
      - На физическом и канальном
      - На физическом, канальном и сетевом
      - На всех семи
    answer: 1
    explain: >
      Коммутатор пересылает кадры по MAC-адресам, это канальный уровень, а работает он,
      конечно, и на физическом. Только физический уровень - у концентратора (хаба),
      сетевой добавляет маршрутизатор; для пересылки чужих кадров полный стек не нужен.

  - q: Как называется порция данных с IP-заголовком?
    options:
      - Кадр
      - Сегмент
      - Пакет
      - Бит
    answer: 2
    explain: >
      Пакет - единица сетевого уровня. Кадр - канального (Ethernet), сегмент - TCP,
      у UDP то же самое называют дейтаграммой.

  - q: Какие адреса переписываются на каждом маршрутизаторе по пути?
    options:
      - MAC-адреса в заголовке Ethernet
      - IP-адреса в заголовке IP
      - Номера портов в заголовке TCP
      - Никакие, все адреса остаются неизменными
    answer: 0
    explain: >
      MAC-адреса нужны только до ближайшего соседа, поэтому на каждом участке пути
      маршрутизатор создаёт новый кадр с новыми MAC. IP-адреса и порты обычный
      маршрутизатор не меняет, а роутер с NAT обычно меняет и то, и другое.

  - q: В заголовке Ethernet стоит EtherType 0x0800. Что это значит для получателя?
    options:
      - Кадр предназначен всем компьютерам сети
      - Внутри кадра лежит IPv4-пакет
      - Кадр повреждён и должен быть отброшен
      - Внутри кадра лежит TCP-сегмент без IP
    answer: 1
    explain: >
      EtherType - поле-указатель: 0x0800 значит IPv4, 0x86DD - IPv6, 0x0806 - ARP.
      Получатель по нему решает, какому протоколу отдать содержимое кадра.

  - q: В IP-заголовке поле Protocol равно 17. Какой протокол внутри?
    options:
      - TCP
      - ICMP
      - UDP
      - IPv6
    answer: 2
    explain: >
      Протокол 17 - UDP, 6 - TCP, 1 - ICMP. По этому полю IP-уровень получателя
      решает, какому транспортному протоколу отдать данные.

  - q: Почему в выводе tcpdump -v у исходящего TCP-пакета может быть написано cksum incorrect?
    options:
      - Пакет повреждён и не дойдёт до получателя
      - Сумму досчитывает сетевая карта после tcpdump
      - tcpdump неправильно считает контрольные суммы
      - Пакет подменила вредоносная программа
    answer: 1
    explain: >
      Это checksum offload: ядро поручает подсчёт контрольной суммы сетевой карте, и
      tcpdump видит пакет раньше, чем карта её заполнит. Пакет уходит с правильной суммой.

  - q: Ты открываешь сайт по HTTPS. Что видит узел на пути, перехвативший твои пакеты?
    options:
      - "Ничего: HTTPS шифрует пакет целиком, включая адреса"
      - IP-адреса и порты, но не содержимое запроса
      - Содержимое запроса, но не адреса
      - Только MAC-адрес твоей сетевой карты
    answer: 1
    explain: >
      TLS шифрует содержимое прикладного уровня, а заголовки IP и TCP остаются открытыми,
      иначе маршрутизаторы не смогли бы доставить пакет. Твой MAC до узлов в интернете
      вообще не доходит: он живёт только в пределах локальной сети.

open_questions:
  - q: Объясни, почему инженеры говорят "проблема на L2" или "L7-фильтрация", хотя интернет построен не по модели OSI. Чем модели OSI и TCP/IP отличаются и почему победил TCP/IP?
    reference: >
      Модель OSI с семью уровнями стала общим языком: её номера уровней удобно
      использовать для описания любых сетей. А реальный интернет построен на стеке
      TCP/IP с четырьмя уровнями: канальный, межсетевой, транспортный, прикладной;
      сеансового уровня и уровня представления в нём нет, приложения делают эти функции
      сами. TCP/IP победил, потому что появился раньше и уже работал в университетах,
      был проще, имел удачные бесплатные реализации (Berkeley UNIX), а OSI был сложным,
      с медленными реализациями и воспринимался как навязанный сверху. Поэтому
      используют гибрид: протоколы TCP/IP, номера уровней OSI.
    key_points:
      - OSI - семь уровней, стала общим языком и системой номеров
      - TCP/IP - четыре уровня, по нему построен интернет, нет сеансового и представления
      - причины победы TCP/IP - время, простота, удачные бесплатные реализации, политика
      - на практике гибрид - протоколы TCP/IP, номера уровней OSI

  - q: Опиши, как компьютер-получатель разбирает пришедший кадр до программы. Какие поля он смотрит на каждом уровне?
    reference: >
      Сетевая карта принимает кадр и проверяет контрольную сумму FCS. Ethernet смотрит
      MAC назначения и поле EtherType: 0x0800 означает, что внутри IPv4, и содержимое
      отдаётся IP. IP проверяет адрес назначения и смотрит поле Protocol: 6 означает TCP,
      17 - UDP. Транспортный уровень смотрит порт назначения и отдаёт данные программе,
      которая этот порт слушает, например веб-серверу на порту 80 или 443. На каждом
      шаге заголовок снимается, а выше передаётся только содержимое.
    key_points:
      - Ethernet смотрит EtherType (0x0800 - IPv4)
      - IP смотрит поле Protocol (6 - TCP, 17 - UDP)
      - TCP/UDP смотрит порт назначения и отдаёт данные программе
      - на каждом шаге заголовок снимается

  - q: Представь, что ты сидишь на узле посередине пути между пользователем и сайтом и видишь его пакеты. Что ты можешь узнать, если он пользуется HTTP, и что - если HTTPS? Почему заголовки нельзя спрятать так же, как содержимое?
    reference: >
      При HTTP видно всё: IP-адреса обеих сторон, порты, а на прикладном уровне весь
      запрос и ответ, включая адрес страницы и введённые данные. При HTTPS содержимое
      прикладного уровня зашифровано, но IP-адреса и порты по-прежнему видны, а также
      объём и время передачи. Заголовки IP и TCP нельзя зашифровать так же, как
      содержимое, потому что по ним маршрутизаторы и получатель доставляют пакет:
      узлы на пути должны прочитать адрес назначения. MAC-адрес пользователя за
      пределами его локальной сети не виден вообще.
    key_points:
      - при HTTP видно и заголовки, и содержимое
      - при HTTPS содержимое скрыто, IP-адреса, порты, объём и время видны
      - заголовки нужны для доставки, поэтому их не шифруют
