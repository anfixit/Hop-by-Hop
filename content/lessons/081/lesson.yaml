id: 81
title: "Возобновление сессий и PSK"
status: published
summary: >
  Зачем возобновлять сессии, идентификатор сессии и билеты в TLS 1.2,
  сокращённое рукопожатие, PSK в TLS 1.3 (NewSessionTicket, pre_shared_key,
  binder, режимы psk_ke и psk_dhe_ke) и внешний PSK без сертификатов. На
  практике - возобновление через кеш и через билет, PSK-рукопожатие TLS 1.3 в
  выводе openssl s_client -trace, сервер только с PSK и неверный ключ.
  Безопасность: ключи билетов, прямая секретность, связывание соединений.

quiz:
  - q: Где хранится состояние сессии при возобновлении по идентификатору в TLS 1.2?
    options:
      - У клиента, в зашифрованном билете
      - В кеше на сервере
      - В DNS-записи сайта
      - В сертификате сервера
    answer: 1
    explain: >
      Сервер держит сессию в кеше под идентификатором, клиент присылает его в
      ClientHello. В кластере кеш приходится разделять между серверами.

  - q: Каких сообщений нет в сокращённом рукопожатии TLS 1.2?
    options:
      - ChangeCipherSpec и Finished
      - ClientHello и ServerHello
      - Certificate и сообщений обмена ключами
      - ServerHello и Finished сервера
    answer: 2
    explain: >
      Ключи выводятся из прежнего главного секрета и новых случайных чисел, поэтому
      сертификат и обмен ключами не нужны. В опыте Finished первым прислал сервер.

  - q: Что содержит билет сессии TLS 1.2 по RFC 5077?
    options:
      - Состояние сессии под ключом билетов
      - Закрытый ключ сертификата сервера
      - Пароль пользователя сайта
      - Только идентификатор записи в кеше сервера
    answer: 0
    explain: >
      Сервер шифрует параметры и главный секрет своим ключом и отдаёт клиенту; сам
      сервер ничего не хранит, кроме ключа билетов.

  - q: Зачем в расширении pre_shared_key нужен binder?
    options:
      - Чтобы зашифровать SNI
      - Чтобы указать срок жизни билета
      - Чтобы выбрать группу для (EC)DHE
      - Доказать, что клиент знает PSK
    answer: 3
    explain: >
      Binder - HMAC над ClientHello на ключе из PSK. В опыте с неверным ключом он не
      сошёлся, и сервер оборвал рукопожатие.

  - q: Какой режим TLS 1.3 даёт возобновлённой сессии прямую секретность?
    options:
      - psk_ke
      - psk_dhe_ke
      - session_ticket
      - early_data
    answer: 1
    explain: >
      В psk_dhe_ke к PSK добавляется новый обмен (EC)DHE, поэтому утечка PSK или
      ключа билетов не раскрывает записанный трафик возобновлённой сессии (кроме
      ранних данных 0-RTT). В psk_ke обмена нет.

  - q: Чего не было в PSK-рукопожатии TLS 1.3 в опыте?
    options:
      - EncryptedExtensions
      - Finished
      - Certificate и CertificateVerify
      - Расширения pre_shared_key в ServerHello
    answer: 2
    explain: >
      Подлинность обеспечивает знание PSK, поэтому сертификат не передаётся. После
      EncryptedExtensions сразу шёл Finished.

  - q: Почему клиенту не стоит использовать один билет дважды?
    options:
      - Билет связывает соединения
      - Билет действует только с одного IP-адреса
      - Сервер сочтёт его поддельным
      - Билет увеличится вдвое
    answer: 0
    explain: >
      Одинаковый билет в разных соединениях позволяет наблюдателю связать их (RFC
      8446, прил. C.4). Поэтому сервер выдаёт новые билеты, а клиент каждый
      использует один раз.

  - q: Каким должен быть внешний PSK?
    options:
      - Запоминающимся словом для удобства людей
      - Одним на все устройства организации
      - Открытым текстом в общей конфигурации
      - Случайным и своим у каждого клиента
    answer: 3
    explain: >
      PSK - это пароль. Короткий или придуманный человеком ключ можно подобрать
      по записанному рукопожатию.

open_questions:
  - q: Сравни возобновление по идентификатору сессии и по билету в TLS 1.2.
    reference: >
      По идентификатору сервер хранит сессию в кеше, клиент присылает ID; кеш нужно
      ограничивать и разделять в кластере. По билету сервер шифрует состояние
      своим ключом и отдаёт клиенту, а сам хранит только ключ билетов. В обоих
      случаях сокращённое рукопожатие без сертификата и обмена ключами, тот же
      главный секрет и новые случайные числа.
    key_points:
      - кеш на сервере
      - билет у клиента
      - сокращённое рукопожатие
      - тот же главный секрет

  - q: Как устроено возобновление в TLS 1.3?
    reference: >
      После рукопожатия сервер присылает зашифрованный NewSessionTicket; из
      секрета возобновления и nonce выводится PSK. Клиент предъявляет билет в
      расширении pre_shared_key с binder (HMAC на ключе из PSK) и указывает режим
      в psk_key_exchange_modes. Сервер принимает PSK в ServerHello, Certificate и
      CertificateVerify нет; в режиме psk_dhe_ke есть новый (EC)DHE.
    key_points:
      - NewSessionTicket
      - pre_shared_key и binder
      - psk_dhe_ke
      - без сертификата

  - q: От чего зависит безопасность возобновления и как её обеспечить?
    reference: >
      От ключа билетов, режима обмена и качества PSK. Ключи билетов регулярно
      менять и уничтожать старые, ограничивать сроки жизни, разрешать только
      psk_dhe_ke, внешний PSK делать случайным и своим для каждого клиента, а
      клиентам не использовать билет повторно, чтобы соединения нельзя было
      связать.
    key_points:
      - ключ билетов
      - psk_dhe_ke
      - качество PSK
      - однократные билеты
