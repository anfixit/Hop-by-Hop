<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Полное рукопожатие и возобновление</text>
  <g font-size="20" font-weight="bold" fill="#0E1830" text-anchor="middle">
    <text x="210" y="95">TLS 1.2, полное</text>
    <text x="600" y="95">TLS 1.2, сокращённое</text>
    <text x="990" y="95">TLS 1.3 с PSK</text>
  </g>
  <g font-size="17" fill="#0E1830" text-anchor="middle">
    <rect x="50" y="115" width="320" height="34" rx="6" fill="#DBEAFE"/><text x="210" y="138">ClientHello</text>
    <rect x="50" y="155" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="210" y="178">ServerHello</text>
    <rect x="50" y="195" width="320" height="34" rx="6" fill="#FEE2E2"/><text x="210" y="218">Certificate</text>
    <rect x="50" y="235" width="320" height="34" rx="6" fill="#FEE2E2"/><text x="210" y="258">ServerKeyExchange</text>
    <rect x="50" y="275" width="320" height="34" rx="6" fill="#FEE2E2"/><text x="210" y="298">ServerHelloDone</text>
    <rect x="50" y="315" width="320" height="34" rx="6" fill="#FEE2E2"/><text x="210" y="338">ClientKeyExchange</text>
    <rect x="50" y="355" width="320" height="34" rx="6" fill="#DBEAFE"/><text x="210" y="378">ChangeCipherSpec, Finished</text>
    <rect x="50" y="395" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="210" y="418">ChangeCipherSpec, Finished</text>

    <rect x="440" y="115" width="320" height="34" rx="6" fill="#DBEAFE"/><text x="600" y="138">ClientHello + session ID / билет</text>
    <rect x="440" y="155" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="600" y="178">ServerHello</text>
    <rect x="440" y="195" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="600" y="218">ChangeCipherSpec, Finished</text>
    <rect x="440" y="235" width="320" height="34" rx="6" fill="#DBEAFE"/><text x="600" y="258">ChangeCipherSpec, Finished</text>

    <rect x="830" y="115" width="320" height="34" rx="6" fill="#DBEAFE"/><text x="990" y="138">ClientHello + pre_shared_key</text>
    <rect x="830" y="155" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="990" y="178">ServerHello + pre_shared_key</text>
    <rect x="830" y="195" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="990" y="218">EncryptedExtensions</text>
    <rect x="830" y="235" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="990" y="258">Finished</text>
    <rect x="830" y="275" width="320" height="34" rx="6" fill="#DBEAFE"/><text x="990" y="298">Finished</text>
    <rect x="830" y="315" width="320" height="34" rx="6" fill="#DCFCE7"/><text x="990" y="338">NewSessionTicket (новый)</text>
  </g>
  <g font-size="16" fill="#475569" text-anchor="middle">
    <text x="210" y="465">два круга, проверка сертификата,</text>
    <text x="210" y="487">новый обмен ключами</text>
    <text x="600" y="305">один круг, тот же главный секрет,</text>
    <text x="600" y="327">новые случайные числа</text>
    <text x="990" y="385">один круг, нет Certificate,</text>
    <text x="990" y="407">с psk_dhe_ke - новый (EC)DHE</text>
  </g>
  <g font-size="16" fill="#0E1830">
    <rect x="50" y="560" width="22" height="22" fill="#DBEAFE"/><text x="80" y="577">клиент</text>
    <rect x="170" y="560" width="22" height="22" fill="#DCFCE7"/><text x="200" y="577">сервер</text>
    <rect x="290" y="560" width="22" height="22" fill="#FEE2E2"/><text x="320" y="577">то, что возобновление пропускает</text>
  </g>
</svg>
