<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Проброс порта: DNAT на маршрутизаторе</text>
  <g font-size="15" fill="#0E1830">
    <rect x="30" y="110" width="220" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="140" y="145" text-anchor="middle" font-weight="bold">клиент s</text><text x="140" y="170" text-anchor="middle">198.51.100.2</text>
    <rect x="360" y="80" width="480" height="230" rx="12" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
    <text x="600" y="110" text-anchor="middle" font-weight="bold" font-size="17">маршрутизатор r, 198.51.100.254</text>
    <text x="380" y="145">prerouting: tcp dport 80 dnat to 10.0.0.10:8080</text>
    <text x="380" y="175">forward: ct status dnat accept</text>
    <text x="380" y="205">postrouting: masquerade для выхода наружу</text>
    <text x="380" y="245" font-size="13" fill="#475569">conntrack: исходный кортеж  dst 198.51.100.254:80</text>
    <text x="458" y="268" font-size="13" fill="#475569">ответный кортеж  src 10.0.0.10:8080</text>
    <text x="380" y="295" font-size="13" fill="#475569">ответ возвращается с адресом 198.51.100.254:80</text>
    <rect x="950" y="90" width="220" height="140" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="1060" y="122" text-anchor="middle" font-weight="bold">сервер a</text><text x="1060" y="146" text-anchor="middle">10.0.0.10</text><text x="1060" y="176" text-anchor="middle">:8080 сайт - открыт</text><text x="1060" y="204" text-anchor="middle">видит 198.51.100.2</text>
    <rect x="950" y="245" width="220" height="60" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="1060" y="270" text-anchor="middle">:5432 база</text><text x="1060" y="292" text-anchor="middle" font-size="13">не проброшена - закрыта</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none"><line x1="250" y1="155" x2="346" y2="155"/><line x1="840" y1="160" x2="936" y2="160"/></g>
  <g fill="#475569"><polygon points="360,155 346,148 346,162"/><polygon points="950,160 936,153 936,167"/></g>
  <text x="305" y="143" text-anchor="middle" font-size="13" fill="#475569">на :80</text>
  <text x="895" y="148" text-anchor="middle" font-size="13" fill="#475569">на :8080</text>
  <rect x="30" y="345" width="1140" height="150" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
  <text x="600" y="377" text-anchor="middle" font-size="18" font-weight="bold" fill="#B91C1C">Каждый проброс - служба, открытая всему интернету</text>
  <g font-size="16" fill="#0E1830" text-anchor="middle">
    <text x="600" y="408">один порт на один адрес, а не весь узел; DMZ-хост и UPnP выключить</text>
    <text x="600" y="434">ограничивать источник; административные службы не пробрасывать</text>
    <text x="600" y="460">трафик после DNAT идёт через FORWARD - правила INPUT его не защищают</text>
    <text x="600" y="486">регулярно проверять список пробросов и доступность снаружи</text>
  </g>
</svg>