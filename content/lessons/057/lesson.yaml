id: 57
title: "SNAT, MASQUERADE, DNAT и проброс портов в Linux"
status: published
summary: >
  Настройка NAT в Linux: цепочки типа nat и роль conntrack, SNAT и MASQUERADE на
  postrouting, DNAT на prerouting, проброс порта и его следствия, разрешение
  проброшенного трафика через ct status dnat. На практике - выход сети через SNAT и
  masquerade, проброс порта 80 на внутренний сайт, запись conntrack и фильтр с
  политикой drop. Безопасность: случайно открытые наружу сервисы.

quiz:
  - q: Какие пакеты соединения проверяются правилами цепочки типа nat?
    options:
      - Все пакеты соединения в обе стороны
      - Только первый пакет соединения
      - Только пакеты TCP с флагом FIN
      - Только ответные пакеты сервера
    answer: 1
    explain: >
      Правила nat видят первый пакет, решение записывается в conntrack, и все
      остальные пакеты соединения преобразуются по записи автоматически. Поэтому
      изменение правил NAT не касается уже установленных соединений.

  - q: Когда лучше использовать masquerade, а не snat to адрес?
    options:
      - Когда нужно менять адрес получателя
      - Когда все соединения идут по UDP
      - Когда публичный адрес меняется
      - Когда внутри сети нет частных адресов
    answer: 2
    explain: >
      masquerade берёт адрес выходного интерфейса в момент начала соединения, и
      правило не нужно переписывать при смене адреса провайдером. snat to задаёт
      адрес явно и подходит для постоянного публичного адреса.

  - q: На каком хуке делается DNAT для входящих соединений?
    options:
      - prerouting, до выбора маршрута
      - postrouting, перед отправкой
      - input, после выбора маршрута
      - forward, после выбора маршрута
    answer: 0
    explain: >
      Адрес получателя меняют до решения о маршруте, чтобы маршрут выбирался уже
      для нового адреса. Для пакетов самой машины DNAT делают на хуке output.

  - q: Какой адрес клиента видит внутренний сервер после проброса порта?
    options:
      - Адрес маршрутизатора 198.51.100.254
      - Внутренний адрес маршрутизатора
      - Адрес провайдера из 100.64.0.0/10
      - Настоящий адрес клиента s
    answer: 3
    explain: >
      DNAT меняет только получателя. В опыте сайт на a увидел 198.51.100.2 - адрес
      клиента s. Чтобы ответ вернулся, он должен пройти через тот же маршрутизатор.

  - q: Почему в опыте проброс перестал работать после фильтра с политикой drop?
    options:
      - DNAT несовместим с фильтром с состоянием
      - Новое соединение снаружи не разрешено
      - Политика drop отключает все правила NAT
      - conntrack выключается при политике drop
    answer: 1
    explain: >
      Проброшенный трафик идёт через forward, и первый пакет нового соединения
      снаружи не подходил ни под одно разрешение. Правило ct status dnat accept
      разрешило соединения, к которым применён DNAT.

  - q: Через какую цепочку маршрутизатора идёт трафик после DNAT на внутренний сервер?
    options:
      - INPUT, потому что DNAT делается после выбора маршрута
      - OUTPUT, потому что маршрутизатор его изменил
      - FORWARD, потому что пакет адресован другому узлу
      - Ни через какую, NAT обходит netfilter
    answer: 2
    explain: >
      После DNAT пакет адресован внутреннему серверу, а не маршрутизатору, и идёт
      через FORWARD. Поэтому правила INPUT маршрутизатора к пробросу отношения не
      имеют.

  - q: Что опаснее всего сделать при открытии службы наружу?
    options:
      - Пробросить весь узел, а не порт
      - Пробросить один порт на один адрес
      - Ограничить источник в правиле DNAT
      - Защитить службу паролем и обновлениями
    answer: 0
    explain: >
      Проброс всего узла (DMZ-хост, DNAT без порта) открывает наружу все его
      службы, включая базы данных и панели администрирования. Пробрасывают минимум
      и по возможности ограничивают источник.

  - q: Как правильно дать себе удалённый доступ к SSH внутреннего сервера?
    options:
      - Пробросить порт 22 всему интернету
      - Включить UPnP на домашнем маршрутизаторе
      - Включить режим DMZ-хост для сервера
      - Заходить через VPN своей организации
    answer: 3
    explain: >
      Административные службы не пробрасывают наружу: к ним заходят через VPN или
      один хорошо защищённый вход. UPnP и DMZ-хост открывают больше, чем нужно.

open_questions:
  - q: Чем SNAT отличается от MASQUERADE и где в netfilter они работают?
    reference: >
      Обе заменяют адрес отправителя (NAPT) на хуке postrouting с приоритетом
      srcnat, когда маршрут и выходной интерфейс уже известны. snat to задаёт
      адрес явно - для постоянного публичного адреса. masquerade берёт адрес
      выходного интерфейса в момент начала соединения - удобно для динамических
      адресов; при выключении интерфейса ядро забывает его соединения. Правила
      видят только первый пакет, дальше работает запись conntrack.
    key_points:
      - замена отправителя на postrouting
      - snat - заданный адрес
      - masquerade - адрес интерфейса, динамический адрес
      - первый пакет и conntrack

  - q: Как работает проброс порта и что нужно учесть при его настройке?
    reference: >
      Правило DNAT на prerouting (dnat to адрес:порт) меняет адрес получателя у
      соединений, пришедших на публичный адрес и порт маршрутизатора, на адрес
      внутреннего сервера. Сервер видит настоящий адрес клиента, ответ должен
      вернуться через тот же маршрутизатор (там запись conntrack для обратной
      замены). Трафик идёт через FORWARD, а не INPUT: при политике drop нужно
      разрешение, удобно ct status dnat accept. Для обращения изнутри на
      публичный адрес нужны отдельные правила (hairpin).
    key_points:
      - DNAT на prerouting
      - сервер видит адрес клиента, ответ через тот же маршрутизатор
      - FORWARD, ct status dnat
      - hairpin отдельно

  - q: Как избежать случайно открытых наружу сервисов?
    reference: >
      Каждый проброс - служба, доступная всему интернету. Пробрасывать минимум:
      один порт на один адрес, без DMZ-хоста и UPnP; ограничивать источник, если
      служба нужна не всем; административные службы не пробрасывать, а заходить
      через VPN; публиковать порты Docker на 127.0.0.1, если они нужны локально;
      помнить, что после DNAT трафик идёт через FORWARD и правила INPUT его не
      защищают; регулярно проверять список пробросов и доступность снаружи;
      защищать саму службу как службу в интернете.
    key_points:
      - минимум пробросов, без DMZ-хоста и UPnP
      - ограничение источника, админка через VPN
      - FORWARD вместо INPUT, Docker
      - аудит и проверка снаружи
