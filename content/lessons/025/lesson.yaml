id: 25
title: "IP-пакет: заголовок поле за полем"
status: published
summary: >
  Что обещает IP (без соединения, по возможности) и из чего состоит заголовок IPv4:
  версия, длина заголовка, DSCP и ECN, общая длина, поля фрагментации, TTL, протокол,
  контрольная сумма, адреса и опции. Что маршрутизатор делает с заголовком. На
  практике - один пакет до и после маршрутизатора: TTL уменьшился, контрольная сумма
  пересчитана. В безопасности - подмена адреса отправителя и защита от неё: BCP 38,
  проверка обратного пути, отказ от доверия по IP.

quiz:
  - q: Какова длина заголовка IPv4 без опций?
    options:
      - 20 байт
      - 14 байт
      - 40 байт
      - 60 байт
    answer: 0
    explain: >
      Обязательная часть заголовка - 20 байт (IHL = 5). С опциями он может вырасти до
      60 байт. 14 байт - заголовок Ethernet.

  - q: Что маршрутизатор делает с полем TTL?
    options:
      - Копирует без изменений в следующий кадр
      - Увеличивает на 1, чтобы считать переходы
      - Уменьшает на 1 и при нуле удаляет пакет
      - Записывает в него время пересылки пакета
    answer: 2
    explain: >
      Каждый маршрутизатор уменьшает TTL на 1. Если получился ноль, пакет уничтожается,
      а отправителю обычно уходит сообщение ICMP. Так пакеты не кружат вечно.

  - q: Почему контрольную сумму заголовка IPv4 пересчитывают на каждом маршрутизаторе?
    options:
      - Потому что в пути меняется адрес получателя
      - Потому что маршрутизатор меняет поле TTL
      - Потому что она защищает данные от подделки
      - Потому что меняется версия протокола
    answer: 1
    explain: >
      Маршрутизатор уменьшает TTL, а TTL входит в заголовок, поэтому сумму приходится
      поправлять. В опыте TTL стал 63, а сумма выросла на 0x0100.

  - q: Что защищает контрольная сумма заголовка IPv4?
    options:
      - Весь пакет от случайных ошибок и от подделки
      - Только данные пакета от случайных ошибок
      - Только заголовок пакета от случайных ошибок
      - Только адреса от подделки злоумышленником
    answer: 2
    explain: >
      Сумма считается только по заголовку и ловит случайные ошибки. Данные проверяют
      TCP, UDP и канальный уровень, а от подделки она не защищает: пересчитать её может
      кто угодно.

  - q: Что означает значение 6 в поле Protocol?
    options:
      - Версию IPv6
      - Шесть опций IP
      - Протокол TCP
      - Шестой хоп
    answer: 2
    explain: >
      Поле Protocol указывает, кому отдать содержимое: 1 - ICMP, 6 - TCP, 17 - UDP.
      Версия протокола записана в отдельном поле Version.

  - q: Зачем нужен бит DF?
    options:
      - Запрещает маршрутизаторам делить пакет на части
      - Помечает последний фрагмент разделённого пакета
      - Разрешает маршрутизатору удалить опции пакета
      - Запрещает уменьшать TTL на маршрутизаторах
    answer: 0
    explain: >
      DF (Don't Fragment) запрещает фрагментацию: если пакет не проходит, маршрутизатор
      отбрасывает его и сообщает отправителю. Последний фрагмент отличается тем, что у
      него не стоит MF.

  - q: Почему в IP возможна подмена адреса отправителя?
    options:
      - Адрес отправителя шифруется слабым ключом
      - Адрес отправителя никто в пути не проверяет
      - Адрес отправителя хранится только в кадре Ethernet
      - Контрольная сумма не покрывает поле адреса отправителя
    answer: 1
    explain: >
      Маршрутизатор выбирает путь по адресу получателя, а адрес отправителя просто
      переносит дальше. Проверки, что пакет действительно пришёл с этого адреса, в IP
      нет.

  - q: Что такое фильтрация по BCP 38?
    options:
      - Шифрование всех пакетов между провайдерами
      - Отбрасывание пакетов с опциями на маршрутизаторах
      - Провайдер не выпускает чужие адреса отправителя
      - Проверка контрольной суммы на каждом маршрутизаторе
    answer: 2
    explain: >
      Провайдер знает адреса своих клиентов и не выпускает в интернет пакеты с чужими
      адресами отправителя. Если бы так делали все, клиенты могли бы подделать только
      адреса из своей же сети.

open_questions:
  - q: Перечисли поля заголовка IPv4 и кратко объясни назначение каждого.
    reference: >
      Version - версия (4). IHL - длина заголовка в 32-битных словах (5-15, то есть
      20-60 байт). DSCP и ECN - класс обслуживания и уведомление о перегрузке (бывший
      Type of Service). Total Length - длина всего пакета, до 65 535 байт.
      Identification, флаги DF и MF и Fragment Offset - для фрагментации. TTL -
      уменьшается на каждом маршрутизаторе, при нуле пакет уничтожается. Protocol -
      кому отдать содержимое (1 ICMP, 6 TCP, 17 UDP). Header Checksum - контрольная
      сумма только заголовка. Адреса отправителя и получателя по 32 бита. Options -
      необязательные поля до 40 байт, почти не используются.
    key_points:
      - версия, длина заголовка, DSCP/ECN, общая длина
      - поля фрагментации (Identification, DF, MF, смещение)
      - TTL и Protocol
      - контрольная сумма заголовка, адреса, опции

  - q: Что происходит с заголовком пакета при прохождении маршрутизатора?
    reference: >
      Маршрутизатор проверяет контрольную сумму заголовка и отбрасывает пакет при
      ошибке. Уменьшает TTL на 1 и отбрасывает пакет, если получился ноль (обычно
      сообщая отправителю через ICMP). Выбирает путь по адресу получателя. Если пакет
      не помещается в следующую сеть, делит его на фрагменты или при DF отбрасывает.
      Пересчитывает контрольную сумму, потому что TTL изменился, и отправляет пакет в
      новом кадре со своим MAC-адресом. Адреса отправителя и получателя не меняются
      (если нет NAT). В опыте TTL стал 63, а сумма изменилась на 0x0100.
    key_points:
      - проверка контрольной суммы
      - TTL минус 1, при нуле пакет уничтожается
      - выбор пути по адресу получателя, фрагментация
      - пересчёт суммы, адреса не меняются

  - q: Объясни принцип подмены адреса отправителя, её ограничения и защиту.
    reference: >
      Маршрутизаторы выбирают путь по адресу получателя, а адрес отправителя не
      проверяют, поэтому отправитель может указать любой. Ответы уходят на
      подставленный адрес, поэтому, если подменивший не стоит на пути этих ответов,
      полноценно общаться с поддельного адреса нельзя (в частности, установить
      TCP-соединение), но можно воздействовать в одну сторону:
      затопление, отражение и усиление через чужие серверы, обход фильтров, доверяющих
      адресам. Защита: фильтрация на входе у провайдеров (BCP 38), проверка обратного
      пути (uRPF, rp_filter), отбрасывание невозможных адресов, криптографическая
      аутентификация вместо доверия по IP, защита своих служб от роли отражателя.
    key_points:
      - адрес отправителя не проверяется
      - ответы уходят на чужой адрес, соединение не установить (если не стоишь на пути ответов)
      - затопление, отражение и усиление, обход фильтров
      - BCP 38, rp_filter, bogons, криптографическая аутентификация
