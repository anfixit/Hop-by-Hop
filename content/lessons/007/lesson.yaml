id: 7
title: "Характеристики сети: задержка, джиттер, потери, скорость"
status: published
summary: >
  Переводим жалобу "интернет тормозит" на язык чисел. Односторонняя задержка, RTT
  и время реакции, джиттер, процентили вместо среднего, средняя, мгновенная и
  пиковая скорость, потери и девятки доступности. Почему при загрузке канала около
  90% задержки уже заметно растут, как правильно читать mtr, почему из далёкой страны качается
  медленнее и как DoS бьёт по доступности.

quiz:
  - q: Чем время оборота (RTT) удобнее односторонней задержки для измерений?
    options:
      - RTT точнее односторонней задержки, потому что меряется дважды
      - Для RTT не нужны синхронизированные часы у двух сторон
      - RTT показывает, в какую сторону задержка больше и насколько
      - RTT не зависит ни от расстояния до узла, ни от очередей
    answer: 1
    explain: >
      RTT меряет сам отправитель по своим часам: отметил время отправки и дождался
      ответа. Для односторонней задержки нужны синхронизированные часы на обоих концах.
      Зато RTT как раз не показывает, в какую сторону задержка больше, и от расстояния
      он, конечно, зависит.

  - q: Сайт отвечает за 3 секунды, а ping до сервера - 30 мс. Где в первую очередь искать причину?
    options:
      - В сети: 30 мс - это слишком много
      - На сервере: почти всё время уходит на обработку запроса
      - В DNS: медленные сайты чаще всего из-за него
      - В кабеле: нужно проверить счётчик ошибок
    answer: 1
    explain: >
      Время реакции включает работу сервера, а RTT - только путь по сети. Чтобы набрать
      3 секунды при RTT 30 мс, нужна сотня оборотов, а обычной странице хватает
      нескольких. Скорее всего, долго думает сервер. Проверить можно через curl -w:
      разница между ttfb и tls будет намного больше одного RTT.

  - q: Что такое джиттер?
    options:
      - Средняя задержка пакетов
      - Доля потерянных пакетов
      - Разброс задержек разных пакетов
      - Максимальная скорость канала
    answer: 2
    explain: >
      Джиттер - вариация задержки: насколько по-разному задерживаются пакеты. Он
      критичен для голоса и видео в реальном времени. Средняя задержка, потери и
      скорость - другие характеристики.

  - q: Из каждых 50 пакетов 49 приходят за 20 мс, а один - за 2 секунды. Почему среднее значение здесь плохо описывает сеть?
    options:
      - Среднее прилично, а каждый пятидесятый запрос висит 2 секунды
      - Среднее нельзя честно посчитать, если все задержки разные
      - Среднее в таком случае совпадает с максимальным значением
      - Среднее учитывает только потерянные пакеты, а не пришедшие
    answer: 0
    explain: >
      Среднее около 60 мс выглядит прилично, но редкие огромные задержки пользователь
      замечает. Поэтому смотрят ещё медиану и процентили: здесь 99-й процентиль равен
      2 секундам и сразу показывает "хвост" распределения задержек.

  - q: Доступность сервиса 99,9% ("три девятки"). Сколько примерно он может простаивать за год?
    options:
      - Около 5 минут
      - Около 53 минут
      - Около 8,8 часа
      - Около 3,7 суток
    answer: 2
    explain: >
      0,1% от года (8766 часов) - это около 8,8 часа. Около 53 минут - это четыре
      девятки, около 5 минут - пять, около 3,7 суток - две.

  - q: Канал загружен в среднем на 50%. Будут ли на нём очереди?
    options:
      - Нет: мощности вдвое больше, чем нужно, очереди не будет
      - Да: пакеты приходят случайно, иногда несколько подряд
      - Будут, только если по каналу идёт UDP, а не TCP
      - Нет: очереди появляются, только когда загрузка выше 100%
    answer: 1
    explain: >
      Средняя загрузка ничего не говорит о коротких промежутках: пакеты приходят
      случайно, и иногда их приходит больше, чем интерфейс успевает отправить. Поэтому
      очереди есть уже при ρ около 0,5, а при приближении к 1 время ожидания растёт
      очень быстро.

  - q: В отчёте mtr на 8-м узле худшая задержка 190 мс, а на последнем узле (сервере) - 68 мс и 0% потерь. Как это понимать?
    options:
      - На 8-м узле проблема, и нужно срочно писать провайдеру
      - Сервер назначения работает быстрее маршрутизаторов перед ним
      - Узел 8 медленно отвечает mtr, а трафик пропускает нормально
      - mtr не умеет мерить промежуточные узлы и выдаёт случайные числа
    answer: 2
    explain: >
      Маршрутизаторы быстро пересылают чужие пакеты, а отвечают mtr во вторую
      очередь. Проблема есть, только если задержка или потери появились на
      узле и сохраняются на всех следующих, вплоть до последнего. Здесь последний узел
      в порядке.

  - q: Файл одного размера через один и тот же канал скачивается из Франкфурта (RTT 28 мс) со скоростью 233 Мбит/с, а из Токио (RTT 254 мс) - 44 Мбит/с. Что главным образом объясняет разницу?
    options:
      - Серверы в Токио слабее европейских и поэтому отдают файлы медленнее
      - Задержка: скорость TCP не больше объёма данных в пути, делённого на RTT
      - Японские провайдеры специально ограничивают скорость для пользователей из Европы
      - Файл из Токио хуже сжимается при передаче по длинному пути
    answer: 1
    explain: >
      TCP отправляет данные и ждёт подтверждений, поэтому его скорость не больше, чем
      объём неподтверждённых данных в пути, делённый на RTT. При RTT в девять раз больше
      нужно в девять раз больше данных в пути, а на длинном пути ещё и редкие потери
      сильнее тормозят TCP. Свой вклад вносят и разные серверы и маршруты. Подробно - в
      уроках про окно и контроль перегрузки TCP.

  - q: Как DoS-атака мешает пользоваться сервисом?
    options:
      - Крадёт пароли пользователей через поддельную форму входа
      - Подменяет содержимое страниц, которые видят пользователи
      - Доводит загрузку до предела, и пакеты всех начинают теряться
      - Перехватывает трафик пользователей на пути к серверу
    answer: 2
    explain: >
      DoS бьёт по доступности: мусорный трафик или запросы доводят загрузку до предела,
      очереди растут, буферы переполняются, и страдают все пользователи. Кража паролей
      и перехват трафика бьют по конфиденциальности, подмена страниц - по целостности.

open_questions:
  - q: Пользователь жалуется, что "интернет тормозит". Какие характеристики ты измеришь, чтобы понять, что именно не так, и какими командами?
    reference: >
      Жалобу нужно разложить на измеримые характеристики. Задержку и её разброс (джиттер)
      и потери можно померить ping со статистикой; по какому участку пути они появляются -
      через mtr, глядя, сохраняются ли проблемы до последнего узла. Отделить сеть от
      сервера помогает curl -w с временем DNS, соединения, TLS и первого байта: если долго
      до первого байта намного больше одного RTT - медленный сервер. Скорость можно
      проверить скачиванием тестового файла; стоит помнить, что она зависит от задержки.
    key_points:
      - разложить жалобу на задержку, джиттер, потери, скорость, время реакции сервера
      - ping со статистикой для задержки, разброса и потерь
      - mtr для поиска участка, где начинается проблема (смотреть до последнего узла)
      - curl -w, чтобы отделить сеть (DNS, соединение) от сервера (время до первого байта)

  - q: Объясни, почему канал, загруженный в среднем на 90%, уже работает плохо, хотя мощности формально хватает. Что с этим делают?
    reference: >
      Пакеты приходят не равномерно, а случайно и всплесками. На коротких промежутках
      их приходит больше, чем интерфейс успевает отправить, и они встают в очередь.
      По теории очередей время ожидания растёт нелинейно с загрузкой: при 0,5 очередь
      уже есть, а при приближении к 1 она растёт очень быстро, в пределе бесконечно;
      чем сильнее пульсирует трафик, тем раньше. Поэтому при 90% задержки уже заметно
      растут, а ближе к 100% буферы переполняются и начинаются потери. Бороться можно запасом пропускной способности (держать загрузку ниже)
      или QoS - делить ресурс между классами трафика с приоритетом для чувствительного.
    key_points:
      - трафик приходит случайно и всплесками, на коротких промежутках его больше, чем можно отправить
      - время ожидания в очереди растёт нелинейно при приближении загрузки к 1
      - пульсирующий трафик ухудшает картину
      - решения - запас пропускной способности или QoS

  - q: Как DoS-атака связана с загрузкой канала и очередями? Какими способами от неё защищаются?
    reference: >
      DoS - атака на доступность. Атакующий создаёт столько мусорного трафика или
      запросов, что загрузка канала или сервера подходит к пределу: очереди растут,
      буферы переполняются, и пакеты всех пользователей начинают теряться. Защищаются
      запасом пропускной способности, фильтрацией мусора как можно ближе к источнику
      (у провайдера или в центрах очистки), ограничением скорости запросов с одного
      адреса и распределением сервиса по многим точкам, например через CDN. Знание
      нормальных характеристик сети помогает быстро заметить атаку.
    key_points:
      - DoS - атака на доступность, доводит загрузку до предела
      - растут очереди, переполняются буферы, страдают все пользователи
      - защита - запас, фильтрация у источника, ограничение скорости, распределение (CDN)
