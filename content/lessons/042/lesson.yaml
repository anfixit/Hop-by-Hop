id: 42
title: "MSS и MTU: почему в туннелях ломаются большие пакеты"
status: published
summary: >
  Откуда берётся неисправность "соединяется, но большие передачи висят": MTU участка и
  MSS, который узел объявляет по своему интерфейсу, накладные расходы туннелей,
  определение MTU пути по сообщениям ICMP и чёрная дыра, когда эти сообщения не
  доходят. Четыре способа лечения: не фильтровать ICMP, подрезать MSS на маршрутизаторе,
  зондирование у отправителя, честный MTU на туннеле. На практике - путь с узким
  участком, правильное определение MTU, чёрная дыра и два способа из неё выйти.

quiz:
  - q: Из чего узел вычисляет MSS, который объявляет в своём SYN?
    options:
      - Из наименьшего MTU на всём пути
      - Из MTU интерфейса получателя
      - Из MTU собственного интерфейса
      - Из размера окна получателя
    answer: 2
    explain: >
      Узел знает только MTU своего интерфейса и объявляет MSS = MTU минус 40 байт
      заголовков (для IPv4). Об участках пути с меньшим MTU он при установлении
      соединения ничего не знает.

  - q: Интерфейс с MTU 1500, IPv4. Какой MSS объявит узел?
    options:
      - 1460
      - 1480
      - 1500
      - 1448
    answer: 0
    explain: >
      1500 минус 20 байт заголовка IP и 20 байт заголовка TCP. Параметры TCP в MSS не
      входят: с метками времени данных в сегменте получается 1448, но объявляется 1460.

  - q: Как отправитель в норме узнаёт, что его пакет не помещается в участок пути?
    options:
      - Получатель сообщает об этом в поле Window
      - Пакет фрагментируется, отправитель не узнаёт
      - Срабатывает таймер, и MSS уменьшается вдвое
      - Маршрутизатор присылает ему сообщение ICMP
    answer: 3
    explain: >
      Пакеты TCP идут с флагом DF. Маршрутизатор перед узким участком отбрасывает пакет
      и возвращает ICMP "нужна фрагментация" с подходящим MTU; отправитель запоминает
      его и уменьшает сегменты.

  - q: Что такое чёрная дыра MTU?
    options:
      - Участок пути, где теряются все пакеты подряд
      - Большие пакеты пропадают, а ICMP не доходит
      - Маршрутизатор, который фрагментирует каждый пакет
      - Туннель, в котором MTU больше, чем у линии
    answer: 1
    explain: >
      Большой пакет отброшен, но сообщение ICMP отфильтровано по дороге. Отправитель
      ничего не узнаёт и повторяет тот же большой сегмент. Маленькие пакеты при этом
      проходят.

  - q: Рукопожатие TCP проходит, короткие запросы работают, а загрузка большого файла висит. Что проверить первым?
    options:
      - Открыт ли порт на сервере
      - Совпадают ли версии TLS
      - MTU пути и доходит ли ICMP
      - Срок сертификата сервера
    answer: 2
    explain: >
      Порт открыт, раз рукопожатие прошло. Зависание именно больших передач - признак
      чёрной дыры MTU. Проверяется командами ping -M do с разными размерами и
      tracepath.

  - q: Что делает подрезание MSS (MSS clamping) на маршрутизаторе?
    options:
      - Уменьшает параметр MSS в проходящих SYN
      - Уменьшает MSS в каждом сегменте с данными
      - Отвечает ICMP на каждый большой пакет
      - Уменьшает MTU на интерфейсах узлов
    answer: 0
    explain: >
      Маршрутизатор у входа в туннель переписывает MSS в сегментах SYN на значение,
      подходящее для узкого участка. Узлы с самого начала отправляют сегменты, которые
      пройдут, и ICMP им не нужен. В опыте 1460 превратилось в 1360.

  - q: Почему подрезание MSS не помогает протоколам поверх UDP?
    options:
      - Пакеты UDP всегда меньше 1400 байт
      - Маршрутизаторы не пропускают UDP в туннели
      - UDP сам фрагментирует свои сообщения
      - В UDP нет ни SYN, ни параметра MSS
    answer: 3
    explain: >
      MSS - параметр TCP, и переписывать маршрутизатору нечего. Протоколы поверх UDP
      ограничивают размер сами: серверы DNS по умолчанию - 1232 байтами, QUIC начинает с
      1200 байт.

  - q: На линии с MTU 1500 поднят туннель WireGuard поверх IPv4. Сколько байт остаётся на внутренний пакет?
    options:
      - 1500, туннель места не занимает
      - 1440, минус 60 байт заголовков
      - 1492, минус 8 байт заголовка
      - 1476, минус 24 байта заголовков
    answer: 1
    explain: >
      WireGuard добавляет заголовки IP, UDP и свои 32 байта: 60 байт поверх IPv4 и 80
      поверх IPv6. По умолчанию интерфейс получает MTU 1420, с запасом на IPv6. 1492 -
      это PPPoE, 1476 - GRE.

open_questions:
  - q: Почему два узла в сетях Ethernet могут объявить друг другу MSS 1460, а большие сегменты между ними всё равно не пройдут?
    reference: >
      MSS вычисляется из MTU собственного интерфейса узла (1500 минус 40), а не из MTU
      пути. Если между узлами есть участок с меньшим MTU, например туннель, который
      тратит часть пакета на свои заголовки, пакет в 1500 байт в него не поместится.
      Пакеты TCP идут с флагом DF, поэтому маршрутизатор перед узким участком
      отбрасывает их и отвечает ICMP "нужна фрагментация". Если это сообщение дошло,
      отправитель уменьшит сегменты; если нет, большие сегменты будут исчезать.
    key_points:
      - MSS считается по своему интерфейсу, не по пути
      - туннель уменьшает MTU на размер своих заголовков
      - DF и сообщение ICMP от маршрутизатора
      - без ICMP большие сегменты исчезают

  - q: Что такое чёрная дыра MTU и как она выглядит для пользователя и в tcpdump?
    reference: >
      Чёрная дыра - участок с меньшим MTU, с которого сообщение ICMP "нужна
      фрагментация" до отправителя не доходит (его фильтрует файервол или его не
      отправляют). Для пользователя: соединение устанавливается, маленькие запросы
      проходят, а большие передачи зависают - страница, файл, рукопожатие TLS. В
      tcpdump: отправитель повторяет один и тот же большой сегмент с удвоением
      промежутков, подтверждений на него нет, сообщений ICMP нет. Проверка - ping с
      запретом фрагментации и разными размерами, tracepath.
    key_points:
      - ICMP не доходит до отправителя
      - рукопожатие и мелочь проходят, большое висит
      - повторы одного большого сегмента с удвоением
      - ping -M do и tracepath

  - q: Какие есть способы избавиться от проблемы MTU в туннеле и чем они отличаются?
    reference: >
      Первый - не фильтровать сообщения ICMP "нужна фрагментация" (и "пакет слишком
      велик" в IPv6): правильное решение для любых протоколов, но зависит от чужих
      устройств. Второй - подрезание MSS: маршрутизатор у туннеля переписывает MSS в
      проходящих SYN, и узлы сразу отправляют подходящие сегменты; работает без участия
      узлов, но только для TCP. Третий - зондирование MTU у отправителя
      (tcp_mtu_probing): TCP сам пробует меньшие сегменты, заметив, что большие не
      проходят; помогает в чужой сети, но срабатывает с задержкой. Четвёртый - задать
      на интерфейсе туннеля честный MTU, чтобы узел сам объявлял подходящий MSS;
      помогает только соединениям самого этого узла. Протоколы поверх UDP ограничивают
      размер пакетов сами.
    key_points:
      - не фильтровать ICMP
      - подрезание MSS в SYN, только TCP
      - зондирование у отправителя, с задержкой
      - честный MTU на туннельном интерфейсе
