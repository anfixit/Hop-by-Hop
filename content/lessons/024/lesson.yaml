id: 24
title: "ARP и Proxy-ARP: как IP-адрес превращается в MAC-адрес"
status: published
summary: >
  Как компьютер узнаёт MAC-адрес по IP-адресу: широковещательный ARP-запрос и адресный
  ответ, формат сообщения, ARP-кэш и состояния записей в Linux, добровольный ARP и
  Proxy-ARP. На практике - обмен ARP в tcpdump, кэш, адрес без ответа, статическая
  запись и маршрутизатор, отвечающий за узел за ним. В безопасности - почему ARP верит
  любому ответу и как от подмены защищают шифрование, DHCP snooping и Dynamic ARP
  Inspection.

quiz:
  - q: Компьютер отправляет пакет на адрес в другой сети. MAC-адрес какого устройства он спрашивает через ARP?
    options:
      - Маршрутизатора, через который идёт пакет
      - Конечного получателя пакета в другой сети
      - DNS-сервера, который знает все адреса
      - Коммутатора, к которому он подключён
    answer: 0
    explain: >
      ARP работает только внутри своей сети. Пакет в другую сеть идёт через шлюз, поэтому
      в кадр ставится MAC-адрес маршрутизатора, а IP-адрес получателя остаётся прежним.

  - q: Кому отправляется ARP-запрос?
    options:
      - Только маршрутизатору
      - Серверу ARP в интернете
      - Всем в своей сети сразу
      - Только коммутатору
    answer: 2
    explain: >
      Запрос рассылается на широковещательный адрес ff:ff:ff:ff:ff:ff, его получают все в
      широковещательном домене. Отвечает только владелец адреса, и уже адресно.

  - q: Почему pc2 смог ответить на пинг, не отправляя свой ARP-запрос?
    options:
      - Коммутатор подсказал ему MAC-адрес pc1
      - Узнал MAC-адрес pc1 из его ARP-запроса
      - MAC-адрес можно вычислить из IP-адреса
      - Ответ на пинг не требует MAC-адреса
    answer: 1
    explain: >
      В ARP-запросе есть IP- и MAC-адрес спрашивающего. pc2 запомнил их и ответил сразу.
      Вычислить MAC-адрес по IP-адресу нельзя: формулы между ними нет.

  - q: Что означает состояние FAILED у записи в таблице соседей?
    options:
      - Запись статическая и никогда не устареет
      - Сосед недавно подтвердил, что он на связи
      - Ядро спрашивало этот адрес, но ответа не было
      - Запись устарела, но ей ещё можно пользоваться
    answer: 2
    explain: >
      FAILED - на ARP-запросы никто не ответил, как с адресом 192.0.2.99 в опыте. Статическая
      запись - PERMANENT, подтверждённая - REACHABLE, устаревшая - STALE.

  - q: Что делает добровольный ARP (gratuitous ARP)?
    options:
      - Спрашивает у сервера новый IP-адрес
      - Объявляет свой адрес, выявляя конфликт
      - Удаляет все записи в ARP-кэше соседей
      - Шифрует ARP-сообщения в локальной сети
    answer: 1
    explain: >
      Компьютер рассылает запрос о собственном адресе: соседи обновляют запись, а если
      кто-то ответил, значит, адрес уже занят. Так же быстро переключают адрес на
      резервный сервер.

  - q: Как работает Proxy-ARP?
    options:
      - Компьютер спрашивает MAC-адрес у прокси-сервера в сети
      - Коммутатор хранит ARP-кэш для всех компьютеров
      - ARP-запросы пересылаются через маршрутизатор
      - Маршрутизатор отвечает своим MAC-адресом за узел
    answer: 3
    explain: >
      Маршрутизатор знает, что узел с адресом из этой сети подключён к нему другим путём, и
      отвечает на ARP-запрос за него своим MAC-адресом. В опыте в кэше pc1 для 192.0.2.50
      оказался MAC-адрес маршрутизатора.

  - q: Почему подмена ARP вообще возможна?
    options:
      - ARP-ответы не проверяются на подлинность
      - ARP-сообщения передаются через интернет
      - MAC-адреса слишком короткие и повторяются
      - Коммутаторы рассылают ARP-ответы всем портам
    answer: 0
    explain: >
      В ARP нет никакой проверки, что ответ пришёл от настоящего владельца адреса.
      Proxy-ARP пользуется этим законно, а подмена - во вред.

  - q: Какая мера защищает от подмены ARP сразу всю сеть, а не одну машину?
    options:
      - Статическая запись шлюза на своём компьютере
      - Отключение широковещательных кадров
      - DHCP snooping и Dynamic ARP Inspection
      - Увеличение времени жизни записей в кэше
    answer: 2
    explain: >
      DHCP snooping запоминает, какой адрес выдан какому порту и MAC-адресу, а Dynamic ARP
      Inspection отбрасывает ARP-сообщения, которые с этим не совпадают. Статические
      записи работают только на конкретной машине.

open_questions:
  - q: Опиши, что происходит, когда компьютер впервые отправляет пакет соседу в своей сети.
    reference: >
      IP-модуль видит, что адрес получателя в своей сети, и нужен его MAC-адрес. Компьютер
      смотрит в ARP-кэш; записи нет, поэтому он рассылает ARP-запрос на широковещательный
      адрес: "у кого этот IP-адрес?", указав свои IP- и MAC-адрес. Запрос получают все в
      сети, отвечает только владелец, адресно, своим MAC-адресом. Спросивший запоминает
      ответ в кэше и отправляет кадр с пакетом. Получатель тоже запоминает адрес
      спросившего из запроса и может ответить без своего запроса. Записи в кэше со
      временем устаревают.
    key_points:
      - проверка кэша
      - широковещательный запрос с адресами спрашивающего
      - адресный ответ владельца
      - запоминание в кэше с обеих сторон, записи устаревают

  - q: Что такое Proxy-ARP, зачем он нужен и что он показывает о свойствах ARP?
    reference: >
      Proxy-ARP - это когда маршрутизатор отвечает на ARP-запрос за другой узел своим
      MAC-адресом. Узла на самом деле нет в этом широковещательном домене: у него адрес
      из этой же сети, но он подключён к маршрутизатору другим путём, или он в соседней
      сети, а отправитель об этом не знает. Спрашивающий думает, что
      получатель рядом, шлёт кадр маршрутизатору, а тот пересылает пакет. Это показывает,
      что ARP-ответ никак не проверяется: отвечать может кто угодно, и спрашивающий
      поверит. Здесь это законно, но то же свойство делает возможной подмену ARP.
    key_points:
      - маршрутизатор отвечает своим MAC за другой узел
      - узла нет в этом широковещательном домене (подключён иначе или в соседней сети)
      - маршрутизатор пересылает пакеты
      - ARP не проверяет ответы

  - q: В чём принцип подмены ARP и как от неё защищаются?
    reference: >
      ARP верит любому ответу. Устройство злоумышленника в той же сети может сообщить
      соседям, что IP-адрес шлюза или другого узла соответствует его MAC-адресу. Тогда
      их кадры пойдут к нему: либо теряются (отказ в обслуживании), либо пересылаются
      дальше, и злоумышленник становится "человеком посередине". Коммутатор не мешает.
      Защита: шифрование (HTTPS, SSH, VPN), DHCP snooping и Dynamic ARP Inspection на
      коммутаторах, статические записи для важных адресов, сегментация и изоляция
      клиентов, наблюдение за изменениями пар IP-MAC.
    key_points:
      - ARP верит любому ответу, нужна та же сеть
      - отказ в обслуживании или человек посередине
      - шифрование, DAI и DHCP snooping, статические записи
      - сегментация и наблюдение
