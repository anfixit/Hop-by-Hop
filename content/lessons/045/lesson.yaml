id: 45
title: "iproute2: ip link, ip addr, ip route, ip neigh"
status: published
summary: >
  Главный инструмент настройки сети в Linux: почему iproute2 заменил ifconfig и route,
  общий вид команды ip и полезные параметры, интерфейсы и их флаги, адреса и область
  их действия, маршруты и их поля, ip route get, маршруты-отказы, таблица соседей и её
  состояния. На практике - интерфейс, адреса, маршруты и соседи на двух узлах, вывод в
  JSON и статистика.

quiz:
  - q: В выводе ip link у интерфейса есть флаг UP, но нет LOWER_UP. Что это значит?
    options:
      - Интерфейс выключен администратором
      - Интерфейс включён, но связи нет
      - У интерфейса нет IP-адреса
      - Интерфейс работает в полном порядке
    answer: 1
    explain: >
      UP - интерфейс включён администратором, LOWER_UP - есть физическая связь (кабель,
      вторая сторона пары veth). UP без LOWER_UP - включён, но кабель не подключён или
      на той стороне никого нет; обычно рядом стоит NO-CARRIER.

  - q: Что означает "proto kernel" в строке маршрута?
    options:
      - Его добавило ядро вместе с адресом
      - Маршрут имеет наивысший приоритет
      - Маршрут нельзя удалить командой ip
      - Маршрут получен по протоколу BGP
    answer: 0
    explain: >
      Поле proto показывает, кто добавил маршрут. kernel - ядро, автоматически при
      добавлении адреса с префиксом: маршрут в сеть этого адреса. static или boot -
      администратор, dhcp, bird и другие - соответствующие программы.

  - q: Какая команда покажет, через какой шлюз и с каким адресом отправителя ядро отправит пакет на нужный адрес?
    options:
      - ip route show table all
      - ip neigh show dev eth0
      - ip route get АДРЕС
      - ip addr show dev eth0
    answer: 2
    explain: >
      ip route get выполняет тот же поиск маршрута, что ядро для настоящего пакета, с
      учётом самого длинного префикса, метрик и правил, и показывает результат: via,
      dev и src.

  - q: Чем маршрут blackhole отличается от unreachable?
    options:
      - blackhole пересылает пакеты на шлюз по умолчанию
      - blackhole работает только для IPv6
      - blackhole сначала спрашивает соседа по ARP
      - blackhole отбрасывает пакеты молча
    answer: 3
    explain: >
      unreachable отбрасывает пакет и сообщает "нет маршрута к узлу", prohibit -
      "запрещено". blackhole просто отбрасывает. В опыте ip route get получил разные
      ошибки: No route to host, Permission denied, Invalid argument; те же получит и
      программа.

  - q: Запись в таблице соседей в состоянии STALE. Что сделает ядро, когда понадобится отправить пакет этому соседу?
    options:
      - Отправит по старому адресу и начнёт перепроверку
      - Откажется отправлять, пока не придёт ответ ARP
      - Удалит запись и начнёт заново с запроса ARP
      - Отправит пакет на широковещательный адрес
    answer: 0
    explain: >
      STALE - адрес помнится, но давно не подтверждался. Ядро отправляет пакет по
      этому адресу, переводит запись в DELAY и, если трафик не подтвердит соседа,
      отправляет ему запрос ARP напрямую (PROBE). В опыте после пинга запись перешла в
      DELAY, а затем, после короткой проверки ARP, в REACHABLE.

  - q: Что произойдёт с адресами и маршрутами, добавленными командой ip, после перезагрузки?
    options:
      - Сохранятся, ip записывает их в файлы
      - Сохранятся до следующего обновления системы
      - Пропадут, их нужно задать в настройках системы
      - Сохранятся, если интерфейс был включён
    answer: 2
    explain: >
      Команда ip меняет текущее состояние ядра. Постоянная настройка хранится в
      средствах дистрибутива (в Ubuntu - netplan) и применяется при загрузке.

  - q: Почему в выводе ip addr на интерфейсе есть адрес fe80::..., хотя его никто не добавлял?
    options:
      - Его выдал DHCP-сервер в локальной сети
      - Это адрес шлюза по умолчанию
      - Его выдал маршрутизатор через NAT
      - Ядро само назначило локальный адрес
    answer: 3
    explain: >
      При включении интерфейса ядро само создаёт локальный адрес IPv6 (scope link) для
      связи внутри сегмента (урок 30). Он не маршрутизируется за пределы сегмента. Часть
      адреса после fe80:: здесь получена из MAC-адреса.

  - q: Как получить маршруты в виде, удобном для разбора программой?
    options:
      - ip -br route
      - ip -j route
      - ip -s route
      - ip -c route
    answer: 1
    explain: >
      -j выводит JSON, который можно разбирать без угадывания формата текста. -br -
      краткий вывод для человека, -s - статистика, -c - цвет.

open_questions:
  - q: Как прочитать строку маршрута "198.51.100.0/24 via 192.0.2.2 dev eth0 proto static metric 100"?
    reference: >
      Пакеты в сеть 198.51.100.0/24 нужно отправлять через шлюз 192.0.2.2 (via), выходя
      через интерфейс eth0 (dev). Маршрут добавлен администратором или
      системой настройки (proto static). Метрика
      100 - приоритет среди маршрутов в ту же сеть: меньше - лучше. Узнать, что ядро
      реально сделает с пакетом на конкретный адрес, можно командой ip route get: она
      учитывает самый длинный префикс, метрики и правила и показывает шлюз, интерфейс и
      адрес отправителя.
    key_points:
      - сеть назначения и шлюз via
      - интерфейс dev
      - proto - кто добавил, metric - приоритет
      - ip route get для проверки

  - q: Опиши состояния записи в таблице соседей и как запись переходит между ними.
    reference: >
      INCOMPLETE - запрос ARP отправлен, ответа ещё нет; пришёл ответ - REACHABLE, нет -
      FAILED. REACHABLE - сосед недавно подтверждён; по истечении срока (обычно 15-45
      секунд) запись становится STALE: адрес помнится, но не подтверждён. Когда нужно
      отправить пакет соседу в STALE, ядро отправляет его и переходит в DELAY - ждёт,
      не подтвердит ли соседа сам трафик; если нет - PROBE, прямые запросы ARP; ответ
      возвращает REACHABLE, его отсутствие - FAILED. PERMANENT - запись, добавленная
      вручную, не истекает.
    key_points:
      - INCOMPLETE, затем REACHABLE или FAILED
      - REACHABLE истекает в STALE
      - STALE при отправке - DELAY, затем PROBE
      - PERMANENT - вручную, не истекает

  - q: Чем iproute2 лучше старых ifconfig и route и что важно помнить об изменениях, сделанных командой ip?
    reference: >
      ifconfig, route и arp из пакета net-tools устарели и не видят многих
      возможностей ядра: несколько адресов на интерфейсе без псевдонимов, несколько
      таблиц маршрутов, правила, пространства имён, типы маршрутов вроде blackhole.
      iproute2 работает с ядром через netlink и показывает всё; у него единый вид
      команд, краткий вывод и JSON для программ. Изменения через ip действуют сразу,
      но не сохраняются после перезагрузки: постоянную настройку задают средствами
      дистрибутива, например netplan.
    key_points:
      - net-tools устарел и видит не всё
      - netlink, единый вид команд
      - краткий вывод и JSON
      - изменения не переживают перезагрузку
