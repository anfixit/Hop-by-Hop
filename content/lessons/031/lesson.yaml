id: 31
title: "IPv6: поиск соседей, автонастройка и жизнь рядом с IPv4"
status: published
summary: >
  Как в IPv6 без ARP и часто без DHCP узел находит соседей и получает адрес: протокол
  Neighbor Discovery на ICMPv6, сообщения RS, RA, NS, NA, группа запрашиваемого узла,
  проверка дубликата адреса, автонастройка SLAAC и DHCPv6. На практике - маршрутизатор
  с radvd и три узла: объявление маршрутизатора, адреса из префикса, временные адреса,
  поиск соседа и неудачная проверка дубликата. Двойной стек, Happy Eyeballs, туннели и
  NAT64. Поддельные объявления и утечки мимо VPN через IPv6 - принципы и защита.

quiz:
  - q: Какой протокол в IPv6 заменил ARP?
    options:
      - DHCPv6, который раздаёт и MAC-адреса
      - Новая версия ARP с 128-битными адресами
      - Neighbor Discovery на сообщениях ICMPv6
      - Никакой, MAC-адрес вшит в адрес IPv6
    answer: 2
    explain: >
      Разрешение адресов в IPv6 делает протокол Neighbor Discovery: запрос соседа (NS)
      и объявление соседа (NA), это сообщения ICMPv6. Отдельного ARP нет.

  - q: Куда узел отправляет запрос соседа, чтобы узнать MAC-адрес соседа?
    options:
      - В группу запрашиваемого узла ff02::1:ff..
      - На широковещательный MAC ff:ff:ff:ff:ff:ff
      - На адрес маршрутизатора, который всё знает
      - На адрес всех маршрутизаторов ff02::2
    answer: 0
    explain: >
      Запрос идёт в группу запрашиваемого узла, построенную из младших 24 бит нужного
      адреса. В неё почти наверняка входит только нужный сосед, поэтому остальные узлы
      такой кадр отбрасывают, не тревожа процессор.

  - q: Зачем все сообщения Neighbor Discovery отправляют с Hop Limit 255?
    options:
      - Чтобы они дошли до самых дальних сетей
      - Чтобы маршрутизаторы обрабатывали их первыми
      - Чтобы шифровать их содержимое на канале
      - Чтобы отбросить сообщения из других сетей
    answer: 3
    explain: >
      Маршрутизатор уменьшил бы 255 до 254. Если пришло 255, сообщение точно из этого же
      канала. Это защищает от сообщений из чужих сетей, но не от соседа по каналу.

  - q: С какого адреса узел отправляет запрос при проверке дубликата адреса?
    options:
      - С проверяемого адреса, раз он уже назначен
      - "С неопределённого адреса ::, адреса ещё нет"
      - С адреса ff02::1, всех узлов канала
      - С адреса маршрутизатора по умолчанию
    answer: 1
    explain: >
      Пока адрес не проверен, им нельзя пользоваться, поэтому запрос отправляют с "::".
      Если кто-то отвечает объявлением соседа, адрес занят, и узел его не использует.

  - q: Как при SLAAC узел получает глобальный адрес?
    options:
      - Выбирает случайный адрес из всего блока 2000::/3
      - Получает готовый адрес от DHCPv6-сервера сети
      - Просит адрес у соседей запросом Neighbor Solicitation
      - Берёт префикс из RA и добавляет свой идентификатор
    answer: 3
    explain: >
      Маршрутизатор объявляет префикс (обычно /64) с флагом A, узел добавляет к нему
      свой идентификатор интерфейса и проверяет адрес на дубликат.

  - q: Откуда узел IPv6 узнаёт шлюз по умолчанию?
    options:
      - Только из ответа DHCPv6-сервера
      - Из записи AAAA в системе DNS
      - Из объявления маршрутизатора RA
      - Из запроса соседа (NS) от шлюза
    answer: 2
    explain: >
      Шлюз по умолчанию - отправитель объявления маршрутизатора, причём по адресу канала.
      DHCPv6 шлюз не раздаёт, поэтому при автонастройке без RA не обойтись.

  - q: Что делает шлюз NAT64 вместе с DNS64?
    options:
      - Даёт узлам только с IPv6 связь с узлами IPv4
      - Раздаёт узлам IPv6-адреса вместо DHCPv6
      - Шифрует пакеты IPv6 для передачи по сети IPv4
      - Превращает все адреса IPv4 в адреса канала
    answer: 0
    explain: >
      DNS64 синтезирует адрес вида 64:ff9b::192.0.2.1 для сайта, у которого есть только
      IPv4, а шлюз NAT64 переводит пакеты IPv6 в IPv4 и обратно, подставляя свой адрес
      IPv4 и порт.

  - q: Почему трафик может пойти мимо VPN через IPv6?
    options:
      - IPv6 шифрует трафик и не пускает его в туннель
      - VPN-клиент завернул в туннель только IPv4
      - Адреса IPv6 не влезают в заголовки VPN
      - Маршрутизаторы IPv6 не пересылают туннели
    answer: 1
    explain: >
      Если VPN-клиент обрабатывает только IPv4, а на компьютере работает двойной стек,
      соединения к адресам IPv6 пойдут напрямую. Защита - обрабатывать оба протокола и
      DNS, разрешать на время VPN только трафик в туннель.

open_questions:
  - q: Как в IPv6 узел узнаёт MAC-адрес соседа и чем это лучше ARP?
    reference: >
      Узел отправляет сообщение ICMPv6 Neighbor Solicitation в группу запрашиваемого узла
      ff02::1:ff плюс младшие 24 бита адреса соседа, в кадре - групповой MAC 33:33:ff:...,
      и указывает свой MAC. Сосед отвечает Neighbor Advertisement напрямую со своим MAC.
      Запись попадает в таблицу соседей. В отличие от широковещательного ARP, запрос
      обрабатывает почти только нужный узел. Сообщения ND идут с Hop Limit 255, поэтому
      сообщения из других сетей отбрасываются.
    key_points:
      - Neighbor Solicitation и Advertisement (ICMPv6)
      - группа запрашиваемого узла, а не широковещание
      - ответ напрямую, таблица соседей
      - Hop Limit 255

  - q: Опиши по шагам, как узел получает адрес по SLAAC.
    reference: >
      Узел назначает себе адрес канала fe80:: плюс идентификатор интерфейса и проверяет
      его на дубликат (NS с адреса ::, пока адрес предварительный). Затем отправляет RS
      на ff02::2, маршрутизатор отвечает RA с префиксом (флаг A), MTU, сроками и, возможно,
      DNS-серверами. Узел добавляет к префиксу свой идентификатор, снова проверяет на
      дубликат, а отправителя RA по адресу канала делает шлюзом по умолчанию. Сроки
      продлеваются новыми объявлениями. Флаги M и O подсказывают, нужен ли DHCPv6.
    key_points:
      - адрес канала и проверка дубликата с ::
      - RS и RA с префиксом
      - префикс плюс идентификатор, снова DAD
      - шлюз из RA по адресу канала; флаги M и O

  - q: Какие риски создают объявления маршрутизатора и двойной стек и как от них защищаются?
    reference: >
      Узел верит любому RA из своего канала, поэтому устройство в той же сети (в том числе
      по ошибке) может стать шлюзом и DNS для соседей, даже в сети, которую считают только
      IPv4. Защита: RA Guard и отслеживание ND на коммутаторе, accept_ra=0 на серверах со
      статическими адресами, наблюдение за неизвестными RA. Если VPN-клиент заворачивает
      в туннель только IPv4, трафик к IPv6-адресам пойдёт мимо туннеля, как и DNS-запросы.
      Защита: обрабатывать оба протокола, разрешать на время VPN только трафик в туннель,
      DNS внутри туннеля, проверять после настройки.
    key_points:
      - поддельные или случайные RA, как чужой DHCP
      - RA Guard, accept_ra=0, наблюдение
      - утечка мимо VPN при туннеле только для IPv4
      - оба протокола и DNS через туннель, проверка
