<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <line x1="600" y1="40" x2="600" y2="520" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Клиент-сервер -->
  <text x="300" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#0E1830">Клиент-сервер</text>
  <g stroke="#94A3B8" stroke-width="4">
    <line x1="110" y1="400" x2="300" y2="185"/>
    <line x1="300" y1="400" x2="300" y2="185"/>
    <line x1="490" y1="400" x2="300" y2="185"/>
  </g>
  <rect x="200" y="115" width="200" height="70" rx="12" fill="#0E1830"/>
  <text x="300" y="160" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#FFFFFF">Сервер</text>
  <g font-family="sans-serif" font-size="22" text-anchor="middle">
    <rect x="35" y="400" width="150" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
    <text x="110" y="438" fill="#0E1830">Клиент</text>
    <rect x="225" y="400" width="150" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
    <text x="300" y="438" fill="#0E1830">Клиент</text>
    <rect x="415" y="400" width="150" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
    <text x="490" y="438" fill="#0E1830">Клиент</text>
  </g>
  <text x="300" y="510" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#475569">Клиенты спрашивают, сервер отвечает</text>

  <!-- P2P -->
  <text x="900" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#0E1830">Одноранговая сеть (P2P)</text>
  <g stroke="#94A3B8" stroke-width="3">
    <line x1="900" y1="120" x2="1042.7" y2="223.6"/>
    <line x1="900" y1="120" x2="988.2" y2="391.4"/>
    <line x1="900" y1="120" x2="811.8" y2="391.4"/>
    <line x1="900" y1="120" x2="757.3" y2="223.6"/>
    <line x1="1042.7" y1="223.6" x2="988.2" y2="391.4"/>
    <line x1="1042.7" y1="223.6" x2="811.8" y2="391.4"/>
    <line x1="1042.7" y1="223.6" x2="757.3" y2="223.6"/>
    <line x1="988.2" y1="391.4" x2="811.8" y2="391.4"/>
    <line x1="988.2" y1="391.4" x2="757.3" y2="223.6"/>
    <line x1="811.8" y1="391.4" x2="757.3" y2="223.6"/>
  </g>
  <g fill="#FEF3C7" stroke="#B45309" stroke-width="3">
    <circle cx="900" cy="120" r="46"/>
    <circle cx="1042.7" cy="223.6" r="46"/>
    <circle cx="988.2" cy="391.4" r="46"/>
    <circle cx="811.8" cy="391.4" r="46"/>
    <circle cx="757.3" cy="223.6" r="46"/>
  </g>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#0E1830">
    <text x="900" y="128">Узел</text>
    <text x="1042.7" y="231.6">Узел</text>
    <text x="988.2" y="399.4">Узел</text>
    <text x="811.8" y="399.4">Узел</text>
    <text x="757.3" y="231.6">Узел</text>
  </g>
  <text x="900" y="510" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#475569">Каждый узел и спрашивает, и отвечает</text>
</svg>
