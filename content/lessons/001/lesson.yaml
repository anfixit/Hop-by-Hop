id: 1
title: Зачем нужна сеть
status: published
summary: >
  Главная задача сети - доставить байты от программы к программе через среду,
  которая их искажает, теряет и перехватывает. Разбираем, кто с кем на самом деле
  разговаривает, откуда взялись сети, на чём построен весь курс и какие вопросы
  задаёт про любые данные специалист по безопасности.

quiz:
  - q: Какая задача для компьютерной сети главная?
    options:
      - Хранить данные пользователей так, чтобы они были доступны с любого устройства
      - Шифровать данные, чтобы их не прочитали по пути
      - Выдавать устройствам адреса, чтобы их можно было найти
      - Передавать байты от программы на одном устройстве программе на другом
    answer: 3
    explain: >
      Хранение, шифрование и выдача адресов - это отдельные службы, которые работают
      поверх сети или помогают ей. Сама сеть существует, чтобы одна программа могла
      передать байты другой.

  - q: Кто источник и получатель прикладных данных - страницы, сообщения, файла?
    options:
      - Сетевые карты двух компьютеров
      - Роутеры на пути между компьютерами
      - Процессы, то есть запущенные программы
      - Операционные системы двух компьютеров
    answer: 2
    explain: >
      Прикладные данные передают процессы: браузер и веб-сервер, ssh и sshd. Операционная
      система, сетевые карты и роутеры обеспечивают доставку, но сама страница или
      сообщение - это разговор двух программ. На одном компьютере одновременно идут
      десятки таких разговоров.

  - q: Чем одноранговая схема (P2P) отличается от клиент-серверной?
    options:
      - В P2P все данные идут через один центральный сервер
      - В P2P участники обмениваются данными только внутри локальной сети
      - В P2P данные между участниками всегда передаются в зашифрованном виде
      - В P2P любой участник может и запрашивать данные, и раздавать их
    answer: 3
    explain: >
      Суть P2P - в отсутствии деления на клиентов и серверы: каждый участник и спрашивает,
      и отвечает, как в торрент-сетях. Центральный сервер, локальность и шифрование
      к определению P2P отношения не имеют.

  - q: Почему компьютерные сети перешли от закреплённых каналов, как в телефонии, к пакетам?
    options:
      - Пакеты передаются по проводу с более высокой скоростью сигнала
      - Каналы нельзя было протянуть между городами и странами
      - Трафик идёт всплесками, и закреплённый канал в паузах простаивал бы
      - Пакеты труднее перехватить, чем разговор в канале
    answer: 2
    explain: >
      Телефонный канал резервируется на весь сеанс и занят даже в паузах. Компьютерные
      данные идут всплесками, поэтому такой канал большую часть времени простаивал бы.
      Пакеты занимают линию только тогда, когда есть что передавать. Скорость сигнала
      от этого не меняется, а перехватить пакет вполне можно.

  - q: Что появилось раньше - глобальные сети или локальные?
    options:
      - Локальные, потому что соединить компьютеры в одном здании проще
      - Глобальные, потому что компьютеров было мало и к ним тянулись издалека
      - Локальные, потому что глобальные сети выросли из объединения локальных
      - Одновременно, потому что их разрабатывали одни и те же люди
    answer: 1
    explain: >
      Пока компьютеры были огромными и дорогими, у организации обычно был один компьютер,
      и связывать внутри здания было нечего. К этой машине сначала подключали удалённые
      терминалы по телефонным линиям, а затем стали связывать между собой сами компьютеры -
      это и были первые глобальные сети. Локальные появились позже, с дешёвыми
      мини-компьютерами.

  - q: В выводе curl -v строки начинаются с символов *, > и <. Что означает символ >?
    options:
      - Заголовки запроса, который отправил клиент
      - Заголовки ответа, который прислал сервер
      - Пояснения curl о его собственных действиях
      - Ошибки, которые возникли при соединении
    answer: 0
    explain: >
      Символом > отмечен запрос клиента: стартовая строка и заголовки. Символом < - ответ
      сервера, а * - пояснения самого curl: нашёл адреса, подключился и так далее.

  - q: Злоумышленник подменил в ответе сервера номер счёта для оплаты. Какое свойство из триады КЦД нарушено?
    options:
      - Конфиденциальность
      - Целостность
      - Доступность
    answer: 1
    explain: >
      Данные изменили по пути незаметно для получателя - это нарушение целостности.
      Если бы номер только подсмотрели, это была бы конфиденциальность, а если бы
      ответ вообще не дошёл - доступность.

  - q: Сервис не отвечает, потому что его завалили огромным количеством мусорных запросов. Какое свойство нарушено?
    options:
      - Конфиденциальность
      - Целостность
      - Доступность
    answer: 2
    explain: >
      Данные никто не прочитал и не подменил, но легальные пользователи не могут получить
      услугу. Это нарушение доступности, а сама атака называется DoS (отказ в обслуживании).

  - q: Почему шифрования недостаточно, чтобы безопасно открыть сайт через чужой Wi-Fi?
    options:
      - Шифрование легко взломать, если трафик идёт через Wi-Fi
      - Злоумышленник может сам зашифровать трафик и выдать себя за сервер
      - Шифрование защищает только пароли, но не остальные данные
      - Wi-Fi не поддерживает зашифрованные соединения
    answer: 1
    explain: >
      Шифрование защищает канал, но не говорит, с кем этот канал. Злоумышленник может
      установить шифрованное соединение с тобой от имени сервера. Поэтому TLS ещё и
      проверяет, что на том конце настоящий сервер (по сертификату). Это свойство
      называется аутентичностью.

open_questions:
  - q: Объясни своими словами, почему фраза "компьютер связался с сервером" неточна. Кто передаёт друг другу данные и какую роль играет оборудование на пути? Приведи пример из своей жизни.
    reference: >
      Прикладные данные передают друг другу процессы - запущенные программы. На одном
      компьютере одновременно работает много программ, и каждая ведёт свои разговоры
      с разными собеседниками: браузер с веб-сервером, мессенджер со своими серверами,
      ssh с sshd. Компьютеры, роутеры и провода обеспечивают доставку этих данных;
      при этом устройства на пути читают служебную часть данных, чтобы решить, куда
      их нести, а некоторые (например, роутер с NAT) её меняют.
    key_points:
      - прикладные данные передают процессы (программы), а не компьютеры целиком
      - на одном устройстве одновременно идёт много независимых разговоров разных программ
      - оборудование на пути в первую очередь обеспечивает доставку, хотя может читать и менять служебную часть
      - уместный пример пары клиент - сервер или P2P

  - q: Ты открыл сайт по обычному HTTP (без S) в кафе, а точка доступа Wi-Fi там оказалась под контролем злоумышленника. Опиши, что он может сделать, и свяжи каждое действие с одним из свойств триады КЦД. Что меняет HTTPS?
    reference: >
      HTTP передаёт запрос и ответ открытым текстом, а точка доступа стоит на пути трафика.
      Злоумышленник может прочитать, какие страницы открываются и какие данные вводятся,
      например пароль: нарушение конфиденциальности. Может подменить ответ сервера,
      например вставить свой код или другой номер счёта: нарушение целостности. Может
      не пропускать трафик, чтобы сайт не открывался: нарушение доступности. HTTPS (TLS)
      шифрует данные, защищает от незаметной подмены и позволяет по сертификату
      убедиться, что на том конце настоящий сервер. От помех передаче, то есть от
      нарушения доступности, HTTPS не защищает.
    key_points:
      - HTTP передаётся открытым текстом, его видят устройства на пути
      - чтение данных - нарушение конфиденциальности
      - подмена ответа - нарушение целостности
      - помеха передаче - нарушение доступности
      - HTTPS/TLS шифрует, защищает от подмены и проверяет подлинность сервера по сертификату

  - q: Зачем курс построен вокруг пути одного пакета, а не как список технологий? Как это помогает, когда "сайт не открывается"?
    reference: >
      Каждая технология вводится в той точке пути, где пакет с ней встречается, поэтому
      знания складываются в одну связную картину, а не в разрозненные карточки. При
      поломке это превращает отладку в проход по маршруту в том же порядке, в каком едет
      пакет: нашёлся ли адрес по имени, ушёл ли пакет, есть ли маршрут, пропустил ли
      фаервол, установилось ли соединение, договорились ли стороны о шифровании. Место,
      где пакет перестаёт проходить, и есть поломка.
    key_points:
      - технологии привязаны к точкам пути пакета и складываются в одну картину
      - отладка - проход по маршруту пакета по порядку
      - поломка там, где пакет перестаёт проходить
