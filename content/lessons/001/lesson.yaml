# ЧЕРНОВИК-ЗАГЛУШКА для проверки бота. Настоящий урок 1 пишется по конвейеру проверки
# (см. docs/program.md) и заменит этот файл.
id: 1
title: Зачем нужна сеть
status: draft
summary: >
  Сеть решает одну задачу: доставить байты от программы на одном компьютере
  программе на другом. Разбираем, почему эту задачу делят на уровни.

quiz:
  - q: Какая единственная задача решается компьютерной сетью в целом?
    options:
      - Хранить файлы пользователей на сервере
      - Доставить данные от программы на одном узле программе на другом
      - Шифровать весь трафик между компьютерами
      - Назначать компьютерам IP-адреса
    answer: 1
    explain: >
      Хранение, шифрование и адресация - это отдельные службы и механизмы.
      Сама сеть существует, чтобы одна программа могла передать данные другой.

  - q: Зачем задачу передачи данных разбивают на уровни?
    options:
      - Чтобы каждый уровень решал свою часть задачи и его можно было менять, не трогая остальные
      - Чтобы пакеты шли быстрее за счёт параллельной обработки уровней
      - Потому что так требует закон
    answer: 0
    explain: >
      Уровни дают независимость: можно заменить медь на оптику, не переписывая TCP,
      или улучшить TCP, не меняя Ethernet. Скорость и законы здесь ни при чём.

  - q: Как называется добавление заголовка очередного уровня при отправке данных?
    options:
      - Маршрутизация
      - Фрагментация
      - Инкапсуляция
      - Мультиплексирование
    answer: 2
    explain: >
      При отправке каждый уровень оборачивает данные верхнего уровня своим заголовком -
      это инкапсуляция. На приёмной стороне заголовки снимаются в обратном порядке.

open_questions:
  - q: Объясни своими словами, что значит "нижний уровень не заглядывает внутрь данных верхнего". Приведи аналогию.
    reference: >
      Каждый уровень обращается со всем, что получил сверху, как с непрозрачным грузом:
      добавляет свой заголовок и передаёт дальше, не разбирая содержимое. Например, Ethernet
      доставляет кадр до соседнего узла и не интерпретирует IP-пакет внутри. Аналогия -
      почтальон доставляет коробку по адресу и не вскрывает её.
    key_points:
      - нижний уровень считает данные верхнего непрозрачной полезной нагрузкой
      - он добавляет свой заголовок и не разбирает содержимое
      - уместная аналогия (почта, курьер, конверт в коробке и т.п.)
