id: 36
title: "TCP: поток байтов, сегмент и заголовок"
status: published
summary: >
  Что обещает TCP и на чём это держится: логическое соединение, поток байтов без границ
  сообщений, нарезка на сегменты по MSS, нумерация каждого байта. Заголовок TCP по
  полям: порты, порядковый номер и номер подтверждения, длина заголовка, восемь флагов,
  окно, контрольная сумма, параметры (MSS, масштаб окна, метки времени, SACK). На
  практике - целое соединение в tcpdump, согласование MSS, относительные и настоящие
  номера, сегмент SYN по байтам.

quiz:
  - q: Что именно нумерует TCP порядковыми номерами?
    options:
      - Каждый сегмент, начиная с единицы
      - Каждый байт передаваемого потока
      - Каждую запись программы в сокет
      - Каждый IP-пакет соединения
    answer: 1
    explain: >
      У каждого байта в соединении свой 32-разрядный номер. Порядковый номер сегмента -
      это номер первого байта его данных. Поэтому потерянное можно отправить заново
      кусками другого размера.

  - q: Программа записала в TCP-сокет 3000 байт одним вызовом. Как они уйдут в сеть Ethernet с MTU 1500?
    options:
      - Одним сегментом, IP его фрагментирует
      - Одним сегментом в 3000 байт данных
      - По одному байту в каждом сегменте
      - Несколькими сегментами не больше MSS
    answer: 3
    explain: >
      TCP режет поток на сегменты так, чтобы каждый помещался в MTU без фрагментации.
      В опыте 3000 байт ушли сегментами по 1348, 1348 и 304 байта. Границы записей при
      этом не сохраняются.

  - q: Что означает номер подтверждения 1359 в сегменте?
    options:
      - Получены байты до 1358, жду байт 1359
      - Получен сегмент 1359, жду сегмент 1360
      - Получено ровно 1359 сегментов данных
      - Последний полученный байт имеет номер 1359
    answer: 0
    explain: >
      Номер подтверждения - это номер следующего ожидаемого байта, а не последнего
      полученного. Подтверждение накопительное: одно число сообщает обо всех данных
      до него.

  - q: Клиент объявил MSS 1460, сервер - MSS 1360. Сегменты какого размера отправит клиент?
    options:
      - Не больше 1460, по своему MSS
      - Не больше 1500, по MTU Ethernet
      - Не больше 1360, по MSS сервера
      - Не больше 1410, среднее из двух
    answer: 2
    explain: >
      MSS - это наибольший сегмент, который узел готов принять, поэтому отправитель
      ориентируется на MSS получателя. В опыте данные шли по 1348 байт: ещё 12 байт
      заняли метки времени.

  - q: Что и в каких единицах измеряет поле Data Offset в заголовке TCP?
    options:
      - Длину заголовка в 32-битных словах
      - Длину данных сегмента в байтах
      - Длину заголовка TCP в байтах
      - Длину всего сегмента в словах
    answer: 0
    explain: >
      Из-за параметров заголовок TCP бывает разной длины, от 20 до 60 байт. Поле
      считает его в 32-битных словах: 5 - это 20 байт, в SYN из опыта было 10, то есть
      40 байт.

  - q: Клиент передал 3010 байт данных и отправил FIN. Какой номер подтверждения покажет tcpdump в относительных номерах?
    options:
      - 3010, по числу байт данных
      - 3011, следующий байт данных
      - 3013, с учётом SYN и FIN
      - 3012, FIN занял один номер
    answer: 3
    explain: >
      Данные заняли относительные номера с 1 по 3010, FIN - номер 3011. Сервер
      подтверждает следующий ожидаемый номер, 3012. SYN и FIN занимают по одному номеру,
      чтобы их можно было подтвердить так же, как данные.

  - q: В записи tcpdump стоит "Flags [P.]". Какие флаги установлены в сегменте?
    options:
      - PSH и FIN
      - PSH и ACK
      - Только PSH
      - PSH и RST
    answer: 1
    explain: >
      Точка в записи tcpdump означает ACK. P - это PSH, просьба не задерживать данные в
      буфере; ядро ставит его на последнем сегменте записи.

  - q: Зачем нужен параметр "масштаб окна"?
    options:
      - Чтобы сегменты были больше 1460 байт
      - Чтобы номера байтов не шли по кругу
      - Чтобы окно могло быть больше 65 535 байт
      - Чтобы уменьшить заголовок до 20 байт
    answer: 2
    explain: >
      Поле окна 16-битное, и на быстрых линиях 65 535 байт слишком мало. Каждая сторона
      объявляет в SYN свой сдвиг, и значение поля умножается на степень двойки. В опыте
      win 502 при масштабе 7 означает 502 * 128 = 64 256 байт.

open_questions:
  - q: Что значит, что TCP - это поток байтов, и как поток превращается в сегменты?
    reference: >
      TCP не сохраняет границы записей: получатель видит непрерывную последовательность
      байтов и не может узнать, какими порциями их отправляли, поэтому протокол поверх
      TCP должен сам размечать сообщения. TCP складывает данные в буфер и вырезает из
      него сегменты, каждый со своим заголовком и в своём IP-пакете. Размер сегмента
      ограничен MSS получателя (обычно MTU минус 40 байт заголовков), чтобы избежать
      фрагментации; несколько записей могут попасть в один сегмент, одна запись - в
      несколько.
    key_points:
      - границы сообщений не сохраняются
      - программа сама размечает сообщения
      - сегмент - кусок потока с заголовком
      - размер ограничен MSS, чтобы не было фрагментации

  - q: Как работают порядковый номер и номер подтверждения?
    reference: >
      В TCP нумеруется каждый байт потока, у каждого направления своя нумерация со
      случайного начального номера. Порядковый номер сегмента - номер первого байта его
      данных. Номер подтверждения - номер следующего байта, который получатель ждёт;
      подтверждение накопительное. SYN и FIN занимают по одному номеру. По номерам
      получатель восстанавливает порядок и отбрасывает повторы, а отправитель понимает,
      что дошло.
    key_points:
      - нумеруются байты, а не сегменты
      - seq - первый байт данных сегмента
      - ack - следующий ожидаемый байт, накопительно
      - SYN и FIN занимают по одному номеру

  - q: Перечисли основные поля заголовка TCP и объясни, зачем нужны параметры MSS и масштаб окна.
    reference: >
      Заголовок от 20 до 60 байт: порты отправителя и получателя, порядковый номер,
      номер подтверждения, длина заголовка в 32-битных словах, флаги (SYN, ACK, FIN,
      RST, PSH, URG, ECE, CWR), окно (сколько байт получатель готов принять),
      обязательная контрольная сумма с псевдозаголовком, указатель срочности и
      параметры. MSS сообщает наибольший сегмент, который узел готов принять, чтобы
      избежать фрагментации. Масштаб окна позволяет окну быть больше 65 535 байт:
      значение 16-битного поля умножается на степень двойки. Оба параметра каждая сторона объявляет в SYN.
    key_points:
      - порты, seq, ack, длина заголовка, флаги, окно, сумма
      - контрольная сумма обязательна
      - MSS - наибольший принимаемый сегмент
      - масштаб окна - окно больше 65 535 байт, объявляется в SYN
