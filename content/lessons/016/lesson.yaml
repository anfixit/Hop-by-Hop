id: 16
title: "Мосты и коммутаторы: как коммутатор узнаёт, куда слать кадр"
status: published
summary: >
  Как устроен коммутатор: алгоритм прозрачного моста 802.1D, обратное обучение по
  адресам отправителей, фильтрация, продвижение и затопление, старение записей,
  store-and-forward и cut-through, области коллизий и широковещательный домен. На
  практике - учебный коммутатор из моста Linux и трёх изолированных "компьютеров". В
  безопасности - почему коммутатор доверчив и как защищают порты: ограничение
  адресов, 802.1X и MACsec.

quiz:
  - q: По какому полю кадра коммутатор узнаёт, за каким портом находится компьютер?
    options:
      - По адресу получателя
      - По адресу отправителя
      - По полю типа EtherType
      - По контрольной сумме кадра
    answer: 1
    explain: >
      Коммутатор запоминает адрес отправителя и порт, на который пришёл кадр. Поэтому
      алгоритм называют обратным обучением: куда слать кадры, коммутатор узнаёт по тому,
      откуда они приходят.

  - q: Коммутатор получил кадр для адреса, которого нет в его таблице. Что он сделает?
    options:
      - Выбросит кадр как ошибочный, раз адрес неизвестен
      - Вернёт кадр отправителю с сообщением об ошибке
      - Отправит на все порты, кроме входного
      - Будет ждать, пока получатель сам сообщит свой порт
    answer: 2
    explain: >
      Кадры для неизвестных адресатов, как и широковещательные, коммутатор рассылает на
      все порты, кроме входного. Это затопление. Когда получатель ответит, коммутатор
      запомнит его порт.

  - q: Получатель кадра находится за тем же портом, с которого кадр пришёл. Что делает коммутатор?
    options:
      - "Выбрасывает кадр: он уже на месте"
      - Отправляет кадр обратно на тот же порт
      - Отправляет кадр на все остальные порты
      - Удаляет запись о получателе из таблицы
    answer: 0
    explain: >
      Это фильтрация. Так бывает, когда за портом стоит хаб или другой сегмент: кадр уже
      дошёл до своего сегмента, и пересылать его никуда не нужно.

  - q: Компьютер включили, но он ещё ничего не передавал. Есть ли его адрес в таблице коммутатора?
    options:
      - Да, сетевая карта сообщает адрес коммутатору при включении кабеля
      - Да, коммутатор узнаёт адреса по сигналу в кабеле
      - Да, коммутатор опрашивает все порты при старте
      - Нет, адрес появится, только когда компьютер что-то передаст
    answer: 3
    explain: >
      Коммутатор учится только по адресам отправителей в проходящих кадрах. Молчащий
      компьютер для него неизвестен, и кадры для него рассылаются на все порты, пока он
      не ответит. В учебной сети урока так и было с pc3.

  - q: Зачем записи в таблице коммутатора стареют и удаляются?
    options:
      - Чтобы коммутатор периодически рассылал все кадры всем
      - Чтобы забывать выключенные и молчащие компьютеры
      - Чтобы защититься от подмены MAC-адресов соседями
      - Чтобы периодически перепроверять контрольные суммы
    answer: 1
    explain: >
      Если компьютер переехал и что-то передал, запись переписывается сразу. Но если он
      выключен или переехал и молчит, кадры для него вечно уходили бы на старый порт.
      Поэтому запись, по которой давно не было кадров, удаляется (по умолчанию через
      300 секунд), и коммутатор заново учится по новым кадрам.

  - q: Чем коммутатор без буферизации (cut-through) хуже коммутатора с промежуточным хранением?
    options:
      - Он не может работать в режиме полного дуплекса
      - Он не умеет читать адрес получателя в кадре
      - Он может переслать испорченный кадр
      - Он пересылает любые кадры сразу на все порты
    answer: 2
    explain: >
      Cut-through начинает пересылку, как только прочитал адрес получателя, и не успевает
      проверить контрольную сумму в конце кадра. Зато задержка меньше. Store-and-forward
      принимает кадр целиком и испорченные кадры дальше не отправляет.

  - q: Что ограничивает широковещательный домен?
    options:
      - Хаб на витой паре
      - Коммутатор второго уровня
      - Маршрутизатор между сетями
      - Мост между двумя сегментами
    answer: 2
    explain: >
      Хабы, мосты и коммутаторы пересылают широковещательные кадры на все порты, поэтому
      все соединённые ими устройства - один широковещательный домен. Остановить его может
      маршрутизатор, а внутри коммутаторов - разбиение сети на VLAN (урок 18).

  - q: Почему переполнение таблицы MAC-адресов опасно для конфиденциальности?
    options:
      - Коммутатор начинает шифровать кадры неверным ключом
      - Не найдя получателей, он рассылает кадры на все порты
      - Коммутатор выключается, и вся сеть перестаёт работать
      - Коммутатор отправляет кадры только злоумышленнику
    answer: 1
    explain: >
      Переполненная таблица не запоминает новые адреса. Кадры для тех, кого в ней нет,
      рассылаются на все порты, и со временем таких становится всё больше: сеть ведёт
      себя похоже на хаб, и чужой трафик доходит до злоумышленника.

  - q: В чём слабое место проводного 802.1X?
    options:
      - Порт открывается, а сами кадры не защищены
      - Он передаёт пароль пользователя открытым текстом
      - Он не умеет работать с сервером RADIUS
      - Он отключает защиту портов на самом коммутаторе
    answer: 0
    explain: >
      802.1X открывает порт после проверки, но дальше отдельные кадры не подписаны. Если
      за портом хаб, через уже открытый порт могут ходить и чужие кадры, в том числе с
      подставленным адресом законного устройства. Полностью это закрывает MACsec.

open_questions:
  - q: Опиши, как коммутатор обрабатывает каждый пришедший кадр и как заполняется его таблица.
    reference: >
      Для каждого кадра коммутатор сначала запоминает адрес отправителя и порт, на
      который кадр пришёл, с отметкой времени. Затем ищет адрес получателя в таблице.
      Если получатель за тем же портом - кадр выбрасывается (фильтрация). Если за другим
      - кадр отправляется только туда (продвижение). Если адреса нет в таблице или кадр
      широковещательный либо групповой - кадр рассылается на все порты, кроме входного
      (затопление). Записи, по которым давно нет кадров, стареют и удаляются, по
      умолчанию через 300 секунд; статические записи администратора не стареют.
    key_points:
      - обучение по адресу отправителя и входному порту
      - фильтрация, продвижение, затопление
      - неизвестные и широковещательные кадры - на все порты кроме входного
      - старение записей, статические записи

  - q: Чем коммутатор лучше хаба и почему он всё же не заменяет шифрование?
    reference: >
      Хаб повторяет сигнал на все порты: все в одной области коллизий и все слышат всех.
      Коммутатор принимает кадр и отправляет его только туда, где получатель: у каждого
      порта своя область коллизий, разные пары портов обмениваются одновременно, чужие
      кадры до других компьютеров не доходят. Но широковещательные кадры и кадры
      неизвестным получателям он рассылает всем, а адресам отправителей верит без
      проверки: таблицу можно переполнить, адрес подменить, и трафик снова пойдёт не
      туда. Поэтому коммутатор лишь затрудняет перехват, а конфиденциальность даёт
      шифрование.
    key_points:
      - своя область коллизий у порта, одновременная работа пар портов
      - кадры идут только получателю, если он известен
      - широковещательные и неизвестные - всем
      - коммутатор верит адресам, поэтому нужна защита портов и шифрование

  - q: Какие средства защищают порты коммутатора и от чего каждое?
    reference: >
      Ограничение адресов на порту (port security) не даёт одному порту завести много
      адресов или чужой адрес: защищает от переполнения таблицы и части подмен. 802.1X
      требует от устройства доказать, кто оно, прежде чем порт начнёт пропускать трафик,
      через сервер аутентификации (обычно RADIUS); но кадры после проверки не защищены,
      и чужое устройство за хабом может этим воспользоваться. MACsec проверяет подлинность
      и, как правило, шифрует каждый кадр на одном звене. Контроль штормов ограничивает
      интенсивность широковещательных, групповых и неизвестных одноадресных кадров, а
      VLAN и маршрутизаторы уменьшают широковещательный домен. Наблюдение за числом
      адресов и их переездами помогает заметить атаку.
    key_points:
      - port security - ограничение адресов на порту
      - 802.1X - аутентификация до открытия порта, но кадры после проверки не защищены
      - MACsec - защита каждого кадра
      - storm control, сегментация, наблюдение
