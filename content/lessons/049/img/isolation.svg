<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Одно ядро - несколько сетевых стеков</text>
  <text x="600" y="75" text-anchor="middle" font-size="16" fill="#475569">служба в своём пространстве имён видит только ту сеть, которую ей дали</text>
  <rect x="30" y="100" width="1140" height="330" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="128" font-size="15" fill="#475569">ядро Linux (одно на всех)</text>
  <g font-size="15" fill="#0E1830">
    <rect x="60" y="145" width="340" height="260" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="230" y="175" text-anchor="middle" font-weight="bold">начальное пространство</text>
    <text x="80" y="210">eth0 - настоящая карта, интернет</text>
    <text x="80" y="238">маршрут по умолчанию</text>
    <text x="80" y="266">файервол хоста (491 строка)</text>
    <text x="80" y="294">ip_forward = 1</text>
    <text x="80" y="322">порты хоста, например 22</text>
    <text x="80" y="360" font-size="13" fill="#475569">net:[4026531840]</text>
    <rect x="430" y="145" width="340" height="260" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="600" y="175" text-anchor="middle" font-weight="bold">hbh-a</text>
    <text x="450" y="210">lo, eth0 (192.0.2.1)</text>
    <text x="450" y="238">свои маршруты</text>
    <text x="450" y="266">свой файервол (пусто)</text>
    <text x="450" y="294">свой ip_forward</text>
    <text x="450" y="322">свой порт 8080</text>
    <text x="450" y="360" font-size="13" fill="#475569">net:[4026532412]</text>
    <rect x="800" y="145" width="340" height="260" rx="12" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
    <text x="970" y="175" text-anchor="middle" font-weight="bold">hbh-b</text>
    <text x="820" y="210">lo, eth0 (192.0.2.2), d0</text>
    <text x="820" y="238">нет маршрута по умолчанию</text>
    <text x="820" y="266">свой файервол</text>
    <text x="820" y="294">свой порт 8080</text>
    <text x="820" y="322">наружу - некуда</text>
  </g>
  <line x1="770" y1="300" x2="800" y2="300" stroke="#475569" stroke-width="3"/>
  <text x="785" y="290" text-anchor="middle" font-size="12" fill="#475569">veth</text>
  <rect x="30" y="450" width="1140" height="86" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/>
  <text x="600" y="482" text-anchor="middle" font-size="16" fill="#0E1830">Изоляция сети - слой защиты, а не вся защита: ядро общее, а процесс с полными правами root может сменить пространство.</text>
  <text x="600" y="510" text-anchor="middle" font-size="16" fill="#0E1830">Её сочетают с отдельным пользователем, отказом от лишних прав, seccomp и AppArmor или SELinux.</text>
</svg>