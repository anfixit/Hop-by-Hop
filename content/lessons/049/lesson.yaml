id: 49
title: "Network namespaces"
status: published
summary: >
  Пространства имён сети в Linux: отдельная копия сетевого стека в одном ядре,
  что в ней своё, команды ip netns, unshare и nsenter, переезд интерфейсов,
  наследование параметров, связь с контейнерами. На практике - пустое новое
  пространство, свои параметры и файервол, один порт в двух пространствах, переезд
  интерфейса, пространство процесса и изоляция без маршрута наружу. Безопасность:
  изоляция как слой защиты и её пределы.

quiz:
  - q: Что есть в только что созданном пространстве имён сети?
    options:
      - Копия всех интерфейсов хоста
      - Только выключенный интерфейс lo
      - Интерфейс eth0 с адресом по DHCP
      - Маршрут по умолчанию через хост
    answer: 1
    explain: >
      Новое пространство почти пустое: в нём только loopback, и тот выключен. Даже
      127.0.0.1 недоступен, пока не выполнить ip link set lo up.

  - q: Две программы слушают 0.0.0.0:8080, каждая в своём пространстве имён. Что произойдёт?
    options:
      - Обе работают, порты в пространствах свои
      - Вторая получит ошибку "адрес занят"
      - Соединения поделятся между ними
      - Вторая займёт порт хоста вместо своего
    answer: 0
    explain: >
      Сокеты и порты у каждого пространства свои. В опыте обе программы слушали
      8080 одновременно, и ss в каждом пространстве видел только свой сокет.

  - q: Сколько пространств имён сети может одновременно содержать один интерфейс?
    options:
      - Сколько угодно, если они связаны veth
      - Два - начальное и ещё одно
      - Ни одного, пока интерфейс выключен
      - Ровно одно, но его можно перенести
    answer: 3
    explain: >
      Интерфейс всегда находится в одном пространстве. Команда ip link set ИМЯ
      netns ПРОСТРАНСТВО переносит его; в опыте d0 после переезда исчез из hbh-a и
      появился в hbh-b.

  - q: Где посмотреть, в каком пространстве имён сети работает процесс?
    options:
      - В выводе ip netns list
      - В ссылке /proc/PID/ns/net
      - В файле /etc/netns/PID
      - В выводе ss -p для его сокетов
    answer: 1
    explain: >
      /proc/PID/ns/net - ссылка вида net:[число], и у процессов одного
      пространства число одинаковое. По имени пространство процесса находит
      ip netns identify PID.

  - q: На хосте пересылка пакетов включена. Каким будет net.ipv4.ip_forward в новом пространстве имён по умолчанию?
    options:
      - Всегда 0, параметры IPv4 сбрасываются
      - Всегда 1, пересылка нужна для veth
      - Скопируется с хоста, то есть 1
      - Его нельзя задать внутри пространства
    answer: 2
    explain: >
      При создании пространства параметры интерфейсов IPv4 (conf/all и
      conf/default, сюда входит ip_forward) копируются из начального пространства,
      а такие же параметры IPv6 ставятся по умолчанию (net.core.devconf_inherit_init_net
      = 0). В опыте на сервере новое пространство получило 1, в WSL2 - 0.

  - q: Что такое контейнер с точки зрения сети Linux?
    options:
      - Виртуальная машина со своим ядром
      - Процесс в своём сетевом пространстве
      - Отдельный пользователь с правами на сеть
      - Программа со своей копией tcpdump
    answer: 1
    explain: >
      Контейнер - процесс в наборе пространств имён (сеть, файлы, процессы и
      другие) с ограничением ресурсов. Ядро общее с хостом, сеть - обычно
      своё пространство и пара veth к хосту.

  - q: Служба запущена в пространстве имён без маршрута по умолчанию. Чем это помогает защите?
    options:
      - Её трафик шифруется автоматически
      - Её нельзя взломать через сеть вообще
      - Ядро проверяет все её пакеты антивирусом
      - Взломанной ей некуда отправить данные
    answer: 3
    explain: >
      Без маршрута наружу служба может говорить только с теми, с кем её связали.
      Даже взломанная, она не передаст данные в интернет и не скачает вредоносный
      код, если у неё нет прав менять маршруты, а соседи не передают её данные дальше. В опыте ping до 1.1.1.1 из hbh-b дал Network is unreachable.

  - q: Почему пространство имён сети не считают полной защитой?
    options:
      - Ядро общее, root хоста может его покинуть
      - Оно не отделяет порты от хоста
      - Правила файервола у него общие с хостом
      - Оно не изолирует маршруты от хоста
    answer: 0
    explain: >
      Все пространства работают на одном ядре: уязвимость ядра затрагивает всех.
      Процесс с полными правами root может перейти в другое пространство. Поэтому
      изоляцию сети сочетают с отдельным пользователем, отказом от лишних прав,
      seccomp и AppArmor или SELinux.

open_questions:
  - q: Что такое пространство имён сети и что в нём своё?
    reference: >
      Это отдельная копия сетевого стека ядра Linux. Своё у каждого пространства:
      интерфейсы (включая loopback), адреса, таблицы маршрутов и правила, таблица
      соседей, правила netfilter и таблица соединений, сокеты и порты, большинство
      параметров net.* и /proc/net. Ядро одно, стеков много. Каждый процесс находится ровно в
      одном пространстве (/proc/PID/ns/net), дочерние наследуют его. Новое
      пространство почти пустое: только выключенный lo.
    key_points:
      - копия сетевого стека в одном ядре
      - интерфейсы, маршруты, файервол, сокеты, sysctl
      - процесс в одном пространстве
      - новое пустое, lo выключен

  - q: Какими командами создают пространства имён сети и работают с ними?
    reference: >
      ip netns add ИМЯ создаёт пространство и привязывает его к файлу в
      /run/netns, чтобы оно жило без процессов; ip netns list и del - список и
      удаление; ip netns exec ИМЯ КОМАНДА запускает программу внутри (и подставляет
      файлы из /etc/netns/ИМЯ); ip -n ИМЯ - короткая запись для команд ip; ip netns
      pids и identify - процессы пространства и пространство процесса. unshare
      --net создаёт безымянное пространство, живущее, пока жив процесс; nsenter
      входит в пространство работающего процесса. Интерфейс переносят командой
      ip link set ИМЯ netns ПРОСТРАНСТВО.
    key_points:
      - ip netns add, exec, del
      - ip -n, pids, identify
      - unshare и nsenter
      - перенос интерфейса

  - q: Как пространства имён сети помогают защите и каковы их пределы?
    reference: >
      Служба в своём пространстве видит только выданную ей сеть: не видит
      интерфейсы хоста и не может записывать чужой трафик, не занимает порты
      хоста, имеет свой файервол; без маршрута по умолчанию и без прав менять
      сеть даже взломанная служба не может связаться с внешним миром. Так изолируют контейнеры, службы systemd
      (PrivateNetwork), процессы браузеров. Пределы: ядро общее, и его уязвимость
      затрагивает всех; процесс с полными правами root может сменить пространство;
      доступ к общим файлам и сокетам Unix хоста обходит изоляцию сети. Поэтому её
      сочетают с понижением прав, user namespaces, seccomp, AppArmor или SELinux.
    key_points:
      - служба видит только свою сеть
      - без маршрута наружу некуда отправить данные
      - ядро общее, root может выйти
      - сочетать с понижением прав
