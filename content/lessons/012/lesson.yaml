id: 12
title: "Как вы подключены к интернету: DSL, PON, кабель, мобильная связь"
status: published
summary: >
  Последняя миля: коммутируемые модемы, ADSL и VDSL на телефонной паре, пассивные
  оптические сети (PON), кабельный интернет DOCSIS, мобильные сети от 2G до 5G и
  спутники. Где среда общая с соседями и что из этого следует. На практике - первые
  узлы пути и то, что видит наблюдатель: открытый DNS и имя сайта в TLS. В
  безопасности - карта всех, кто видит твой трафик.

quiz:
  - q: Почему ADSL намного быстрее модема, хотя работает по той же телефонной паре?
    options:
      - ADSL сжимает данные, а модем передаёт их без сжатия
      - ADSL использует частоты до мегагерц, а не голосовые 3100 Гц
      - ADSL передаёт данные по отдельной паре внутри кабеля
      - ADSL работает по оптике, а до квартиры доходит только сигнал
    answer: 1
    explain: >
      Модем работает внутри голосового канала, который фильтры ограничивают полосой
      около 3100 Гц, и упирается в предел Шеннона. ADSL работает только до DSLAM и
      использует всю полосу пары, около 1 МГц, а в ADSL2+ - 2,2 МГц.

  - q: Почему скорость ADSL зависит от расстояния до станции?
    options:
      - На длинной линии больше соседей делят один канал
      - Провайдер ограничивает дальних абонентов по договору
      - DSLAM обслуживает дальние линии в последнюю очередь
      - Затухание растёт с длиной, высокие частоты гаснут
    answer: 3
    explain: >
      Затухание в медной паре растёт с длиной и с частотой. На длинной линии высокие
      каналы DMT тонут в шуме, модем отключает их или нагружает меньшим числом бит, и
      скорость падает. Своя пара у каждого абонента, так что соседи здесь ни при чём.

  - q: В сети PON OLT отправляет кадр одному абоненту. Кто физически получит этот свет?
    options:
      - Все ONT этого дерева, но принимает кадр только свой
      - "Только ONT адресата: разветвитель выбирает нужное волокно"
      - Только ONT адресата, остальные волокна в это время тёмные
      - Никто, пока ONT адресата не запросит свой тайм-слот
    answer: 0
    explain: >
      Пассивный разветвитель просто делит свет на все выходы, он ничего не выбирает.
      Кадр приходит ко всем ONT дерева, и каждый отбрасывает чужое. Поэтому в GPON поток
      к абонентам обычно шифруют.

  - q: Как в GPON или EPON абоненты передают данные к OLT, не мешая друг другу?
    options:
      - Каждый ONT передаёт на своей длине волны
      - Каждый ONT подключён к OLT своим волокном
      - OLT выделяет каждому ONT тайм-слоты
      - ONT слушают волокно и ждут тишины
    answer: 2
    explain: >
      Все ONT светят в одно общее волокно, и одновременная передача смешала бы
      сигналы. Поэтому OLT распределяет тайм-слоты, и каждый ONT передаёт только в свой.
      Слушать волокно ONT не могут: свет соседей к ним не приходит.

  - q: Почему вечером кабельный интернет (DOCSIS) у многих работает медленнее?
    options:
      - Вечером коаксиальный кабель нагревается и хуже проводит
      - Все дома оптического узла делят один коаксиальный кабель
      - Телевидение вечером занимает все свободные частоты кабеля
      - Провайдер вечером включает принудительное сжатие трафика
    answer: 1
    explain: >
      В кабельной сети все дома узла делят общий коаксиал и его полосу. Когда соседи
      смотрят видео, каждому достаётся меньше. Операторы дробят узлы, чтобы на один
      кабель приходилось меньше домов.

  - q: Чем опасна поддельная базовая станция в сетях 2G?
    options:
      - Она может удалённо перепрограммировать SIM-карту
      - В 2G сеть не доказывает телефону, что она настоящая
      - Она быстро расходует батарею телефонов поблизости
      - В 2G все разговоры передаются совсем без шифрования
    answer: 1
    explain: >
      В 2G телефон доказывает сети, кто он, а сеть телефону - нет. Поэтому телефон может
      подключиться к поддельной станции злоумышленника. В 3G и 4G добавили взаимную
      аутентификацию, но атакующие иногда вынуждают телефон откатиться на 2G.

  - q: Сайт открыт по HTTPS. Что провайдер при этом всё равно может увидеть?
    options:
      - Пароль, который ты ввёл на странице
      - Текст страниц, которые ты читаешь
      - Содержимое загруженных файлов
      - IP-адрес сервера и имя сайта из SNI
    answer: 3
    explain: >
      HTTPS шифрует содержимое: пароли, текст, файлы. Но IP-адреса, объёмы, время и имя
      сайта в поле SNI первого сообщения TLS идут открыто. Открытые DNS-запросы тоже
      выдают имена сайтов.

  - q: Ты включил VPN. Как изменится то, что видит провайдер?
    options:
      - Видит соединение с VPN-сервером, но не с кем дальше
      - Он перестанет видеть твой трафик совсем, даже его объём
      - Ничего не изменится, VPN шифрует только DNS-запросы
      - Он увидит всё то же самое, только с небольшой задержкой
    answer: 0
    explain: >
      VPN шифрует весь трафик до своего сервера. Провайдер видит только соединение с VPN,
      его объём и время. Зато всё, что раньше видел провайдер, теперь может видеть
      владелец VPN: доверие переносится, а не исчезает.

  - q: В выводе tracepath второй узел имеет адрес 100.72.1.1. Что это значит?
    options:
      - Это внутренний адрес провайдера из 100.64.0.0/10
      - Это публичный адрес какого-то сервера в интернете
      - Это адрес твоего домашнего Wi-Fi роутера в квартире
      - Это адрес поддельного узла, который вставил злоумышленник
    answer: 0
    explain: >
      Диапазон 100.64.0.0/10 (адреса от 100.64 до 100.127) выделен для NAT операторского
      уровня, и провайдеры используют его и для адресов своих маршрутизаторов. Публичным
      он не бывает, а домашние роутеры обычно используют 192.168.x.x.

open_questions:
  - q: Сравни DSL, PON и кабельный интернет с точки зрения того, делишь ли ты среду с соседями, и что из этого следует для скорости и безопасности.
    reference: >
      В DSL у каждого абонента своя медная пара до DSLAM, поэтому соседи не занимают
      твою линию и не видят твой сигнал; скорость зависит в основном от расстояния до
      станции. В PON одно волокно и пассивный разветвитель обслуживают целое дерево:
      к абонентам свет идёт во все квартиры, от абонентов - по тайм-слотам, так что
      полоса делится между всеми, а трафик к абонентам приходится шифровать. В
      кабельном интернете DOCSIS все дома оптического узла делят общий коаксиал: вечером
      скорость падает, а данные тоже шифруют. Шифрование в общей среде защищает
      содержимое от соседей, хотя время и объёмы они всё равно могут видеть. От
      провайдера оно не защищает: оно заканчивается на его оборудовании.
    key_points:
      - DSL - своя пара, соседи не мешают, ограничение - расстояние
      - PON - общее дерево, к абонентам всем сразу, от абонентов по тайм-слотам
      - кабель DOCSIS - общий коаксиал узла, скорость зависит от загрузки
      - в общей среде трафик шифруют, но шифрование заканчивается у провайдера

  - q: Перечисли, кто на пути от твоего ноутбука до сайта может видеть твой трафик, и что именно видит каждый при использовании HTTPS.
    reference: >
      Программы на самом устройстве видят всё до шифрования. Владелец локальной сети и
      Wi-Fi видит адреса, объёмы, открытые DNS-запросы, имена сайтов из SNI и
      незашифрованные данные. Соседи по сети доступа (PON, кабель) получают зашифрованные
      на канальном уровне кадры и могут видеть время и объёмы. Провайдер видит все
      пакеты: IP-адреса, время, объёмы, открытые DNS-запросы и имя сайта в SNI, а
      оборудование DPI распознаёт протоколы; по закону он обеспечивает правомерный
      перехват. Мобильный оператор видит то же через свой шлюз. Транзитные сети видят
      адреса, объёмы, имя сайта в SNI, а иногда и открытые DNS-запросы. Сервер назначения видит всё, что ему отправили, и твой IP. HTTPS
      скрывает содержимое, но не метаданные.
    key_points:
      - устройство и программы на нём - всё
      - локальная сеть и Wi-Fi, сеть доступа, провайдер, транзит, сервер
      - провайдер видит адреса, время, объёмы, DNS и SNI
      - HTTPS прячет содержимое, но не метаданные

  - q: Какие меры уменьшают то, что видит провайдер, и какую цену за это приходится платить?
    reference: >
      HTTPS шифрует содержимое, но оставляет видимыми адреса, объёмы и имя сайта в SNI.
      Шифрованный DNS (DoH, DoT) убирает открытые DNS-запросы, а ECH прячет имя сайта в
      TLS. VPN шифрует весь трафик до своего сервера, и провайдер видит только
      соединение с VPN. Цена: доверие переносится на того, кто расшифровывает трафик, -
      на DNS-сервис или владельца VPN, а VPN добавляет задержку. Выбор меры зависит от
      модели нарушителя: от кого именно защищаемся.
    key_points:
      - HTTPS - содержимое, но не метаданные
      - DoH/DoT - DNS (но его видит сервис шифрованного DNS), ECH - имя сайта в TLS
      - VPN - всё до своего сервера, доверие переносится на владельца VPN
      - выбор зависит от модели нарушителя
