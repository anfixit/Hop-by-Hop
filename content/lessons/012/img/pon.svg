<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Пассивная оптическая сеть (PON)</text>

  <!-- OLT -->
  <rect x="40" y="250" width="170" height="100" rx="12" fill="#0E1830"/>
  <text x="125" y="292" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">OLT</text>
  <text x="125" y="322" text-anchor="middle" font-size="17" fill="#CBD5E1">у провайдера</text>

  <!-- общее волокно -->
  <line x1="210" y1="300" x2="520" y2="300" stroke="#A16207" stroke-width="8"/>
  <text x="365" y="285" text-anchor="middle" font-size="18" fill="#0E1830">одно волокно, до 20 км</text>
  <text x="365" y="330" text-anchor="middle" font-size="16" fill="#475569">1490 нм к абонентам, 1310 нм обратно</text>

  <!-- разветвитель -->
  <polygon points="520,270 600,240 600,360 520,330" fill="#FEF3C7" stroke="#A16207" stroke-width="3"/>
  <text x="560" y="395" text-anchor="middle" font-size="17" fill="#0E1830">разветвитель</text>
  <text x="560" y="416" text-anchor="middle" font-size="15" fill="#475569">без питания</text>

  <!-- ветви -->
  <g stroke="#A16207" stroke-width="5" fill="none">
    <line x1="600" y1="255" x2="820" y2="130"/>
    <line x1="600" y1="285" x2="820" y2="250"/>
    <line x1="600" y1="315" x2="820" y2="370"/>
    <line x1="600" y1="345" x2="820" y2="490"/>
  </g>

  <!-- ONT -->
  <g font-size="18">
    <rect x="820" y="100" width="130" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="885" y="137" text-anchor="middle" fill="#0E1830">ONT A</text>
    <rect x="820" y="220" width="130" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="885" y="257" text-anchor="middle" fill="#0E1830">ONT B</text>
    <rect x="820" y="340" width="130" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="885" y="377" text-anchor="middle" fill="#0E1830">ONT C</text>
    <rect x="820" y="460" width="130" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="885" y="497" text-anchor="middle" fill="#0E1830">ONT D</text>
  </g>

  <!-- пометки -->
  <g font-size="16">
    <text x="965" y="126" fill="#0F766E">для A: принят</text>
    <text x="965" y="148" fill="#475569">обратно: в свои слоты</text>
    <text x="965" y="246" fill="#DC2626">для A: пришёл, отброшен</text>
    <text x="965" y="268" fill="#475569">обратно: в свои слоты</text>
    <text x="965" y="366" fill="#DC2626">для A: пришёл, отброшен</text>
    <text x="965" y="388" fill="#475569">обратно: в свои слоты</text>
    <text x="965" y="486" fill="#DC2626">для A: пришёл, отброшен</text>
    <text x="965" y="508" fill="#475569">обратно: в свои слоты</text>
  </g>

  <text x="600" y="560" text-anchor="middle" font-size="19" fill="#0E1830">К абонентам свет приходит во все ONT дерева, поэтому в GPON этот поток обычно шифруют.</text>
  <text x="600" y="586" text-anchor="middle" font-size="19" fill="#0E1830">От абонентов каждый ONT передаёт только в тайм-слоты, которые OLT выдаёт по запросам.</text>
</svg>
