id: 14
title: "Классический Ethernet: общая среда и CSMA/CD"
status: published
summary: >
  Откуда взялся Ethernet и как станции делили один общий кабель: толстый и тонкий
  коаксиал, хабы, CSMA/CD по шагам, двоичная экспоненциальная выдержка и почему кадр не
  может быть короче 64 байт. Что изменили коммутаторы и полный дуплекс. На практике -
  неразборчивый режим сетевой карты и его след в журнале, а в безопасности - почему в
  общей среде все слышат всех.

quiz:
  - q: Чем хаб отличается от одного общего коаксиального кабеля с точки зрения доступа к среде?
    options:
      - Хаб отправляет кадр только получателю
      - "Ничем: хаб повторяет сигнал на все порты, среда общая"
      - Хаб убирает коллизии, потому что у каждого порта свой кабель
      - Хаб шифрует кадры между портами
    answer: 1
    explain: >
      Хаб - многопортовый повторитель: всё, что пришло на один порт, он повторяет на все
      остальные. Логически это та же общая среда: все слышат всех, коллизии возможны.
      Отправлять кадр только на порт получателя (если адрес известен) умеет коммутатор.

  - q: Зачем станция после обнаружения коллизии посылает сигнал jam?
    options:
      - Чтобы заглушить станцию, которая начала передачу позже
      - Чтобы передать получателю номер испорченного кадра
      - Чтобы сбросить счётчик попыток у всех станций
      - Чтобы коллизию точно заметили все станции
    answer: 3
    explain: >
      Короткий сигнал jam гарантирует, что коллизию заметят все участники, даже если
      сама по себе она была короткой и слабой. После этого все столкнувшиеся станции
      прекращают передачу и ждут случайное время.

  - q: Станция попала в третью коллизию подряд. Из какого диапазона она выберет число слотов ожидания?
    options:
      - От 0 до 1
      - От 0 до 3
      - От 0 до 7
      - От 0 до 1023
    answer: 2
    explain: >
      После i-й коллизии выбирается случайное число от 0 до 2^i - 1. После третьей -
      от 0 до 7. Диапазон растёт до 1023 после десятой коллизии, а после 16 неудач кадр
      выбрасывают.

  - q: Почему кадр Ethernet не может быть короче 64 байт?
    options:
      - Иначе в кадр не поместятся MAC-адреса и контрольная сумма
      - Так требует протокол IP, который лежит внутри кадра
      - Отправитель закончит передачу раньше, чем узнает о коллизии
      - Короткие кадры сетевые карты не умеют считать CRC
    answer: 2
    explain: >
      Сигнал о коллизии может дойти до отправителя только через 2τ - время туда и обратно
      по самой длинной сети. Если к этому моменту короткий кадр уже передан, отправитель
      решит, что всё успешно, и не повторит его. Поэтому кадр должен передаваться дольше
      2τ: 512 бит на 10 Мбит/с.

  - q: Почему при переходе от 10 к 100 Мбит/с сеть на хабах пришлось сделать примерно в 10 раз меньше?
    options:
      - Кабели для 100 Мбит/с дороже, и их прокладывают короче
      - Хабы на 100 Мбит/с слабее и не могут усилить сигнал
      - На 100 Мбит/с сигнал в кабеле идёт в 10 раз медленнее
      - Кадр передаётся быстрее, и 2τ должно быть меньше
    answer: 3
    explain: >
      Минимальный кадр остался 64 байта, но на 100 Мбит/с он передаётся в 10 раз быстрее.
      Чтобы отправитель успел узнать о коллизии, время 2τ, а значит и размер сети, тоже
      должны уменьшиться примерно в 10 раз. Скорость сигнала в кабеле от этого не зависит.

  - q: Почему в современном коммутируемом Ethernet в полном дуплексе коллизий нет?
    options:
      - На линии только двое, направления передаются независимо
      - Коммутатор мгновенно исправляет столкнувшиеся кадры
      - Современные сетевые карты передают слишком быстро для коллизий
      - Коллизии есть, но их скрывает драйвер сетевой карты
    answer: 0
    explain: >
      Каждый порт коммутатора соединён с одним устройством, и обе стороны договорились
      о полном дуплексе: направления передаются независимо (в гигабите - по тем же парам
      с подавлением эха). Сталкиваться некому. CSMA/CD в полном дуплексе выключен.

  - q: На одном конце линии полный дуплекс, на другом - полудуплекс. Что будет?
    options:
      - Линия не поднимется вовсе, и ошибка будет сразу видна
      - Скорость просто уменьшится вдвое, но ошибок не будет
      - Связь медленная, со странными и поздними коллизиями
      - Обе стороны автоматически перейдут на полный дуплекс
    answer: 2
    explain: >
      Полнодуплексная сторона передаёт, не слушая линию, а полудуплексная считает это
      коллизиями, в том числе поздними, после первых 64 байт кадра. Связь вроде бы есть,
      но медленная и с ошибками. Это классическая неисправность при ручной настройке
      только одной стороны.

  - q: Что делает неразборчивый (promiscuous) режим сетевой карты?
    options:
      - Карта принимает все кадры, а не только адресованные ей
      - Карта отправляет кадры всем станциям одновременно
      - Карта отключает проверку контрольной суммы кадров
      - Карта шифрует все принятые кадры перед передачей в систему
    answer: 0
    explain: >
      Обычно карта пропускает в систему только свои, широковещательные и нужные групповые
      кадры. В неразборчивом режиме она передаёт в систему все кадры, которые до неё
      дошли. В общей среде это значит - весь чужой трафик.

  - q: Почему в Wi-Fi соседи могут слышать чужие кадры так же, как в сети на хабе?
    options:
      - Wi-Fi использует тот же разъём, что и хабы
      - Точка доступа повторяет каждый кадр по проводу
      - Эфир общий, его слышат все в зоне приёма
      - Wi-Fi не проверяет MAC-адрес получателя
    answer: 2
    explain: >
      Wi-Fi - тоже общая среда: всё, что передаётся, слышат все устройства в
      зоне досягаемости. Отбрасывать чужие кадры - добровольное решение карты, поэтому
      защитить содержимое может только шифрование.

open_questions:
  - q: Опиши по шагам, как станция классического Ethernet передаёт кадр по CSMA/CD и что она делает при коллизии.
    reference: >
      Станция слушает кабель и ждёт, пока он освободится. Затем выжидает межкадровый
      интервал (9,6 мкс на 10 Мбит/с) и начинает передачу, одновременно следя за
      сигналом в кабеле. Если сигнал отличается от передаваемого, произошла коллизия:
      станция прекращает кадр и посылает сигнал jam, чтобы коллизию заметили все. Потом
      ждёт случайное число слотов по 512 бит: после i-й коллизии от 0 до 2^i - 1,
      диапазон растёт до 1023, а после 16 неудач кадр выбрасывается. После ожидания всё
      начинается сначала.
    key_points:
      - слушать среду и ждать освобождения, межкадровый интервал
      - передавать и одновременно слушать, коллизия - прекратить и послать jam
      - двоичная экспоненциальная выдержка, слоты по 512 бит
      - после 16 неудачных попыток кадр выбрасывается

  - q: Объясни, откуда взялся минимальный размер кадра Ethernet в 64 байта и почему из этого следует связь скорости с размером сети.
    reference: >
      В худшем случае отправитель узнаёт о коллизии только через 2τ - время, за которое
      сигнал дойдёт до самой дальней станции и сигнал коллизии вернётся обратно. Если
      кадр короче и передача закончилась раньше, отправитель не узнает о коллизии и не
      повторит кадр. Поэтому кадр должен передаваться дольше 2τ: для сети 10 Мбит/с
      длиной до 2500 м с повторителями приняли 512 бит, то есть 64 байта. При росте
      скорости минимальный кадр передаётся быстрее, значит, 2τ и размер сети должны
      уменьшаться пропорционально: на 100 Мбит/с сеть на хабах примерно в 10 раз меньше.
    key_points:
      - сигнал о коллизии может вернуться через 2τ
      - кадр должен передаваться дольше 2τ, иначе отправитель не узнает о коллизии
      - 512 бит = 64 байта для 10 Мбит/с и 2500 м
      - выше скорость - меньше допустимый размер сети

  - q: Почему сеть на хабах удобна для перехвата трафика и что изменилось с приходом коммутаторов и Wi-Fi?
    reference: >
      В общей среде каждый кадр физически приходит ко всем станциям, а чужие кадры карта
      отбрасывает добровольно. Достаточно включить неразборчивый режим и анализатор
      трафика, чтобы читать всё, что передают соседи, причём это пассивная атака без
      следов в сети. Коммутатор отправляет кадр только на порт получателя, если знает его,
      поэтому чужие кадры до злоумышленника обычно не доходят, хотя широковещательные
      получают все, а коммутатор можно обмануть. Wi-Fi снова
      общая среда: эфир слышат все в зоне приёма. Поэтому содержимое защищает только
      шифрование, а вход карты в неразборчивый режим стоит отслеживать в журналах,
      понимая, что это сигнал, а не гарантия.
    key_points:
      - в общей среде кадры приходят всем, карта отбрасывает чужие добровольно
      - неразборчивый режим и анализатор - пассивный перехват без следов
      - коммутатор отдаёт кадр только на порт получателя, если знает его, но его можно обмануть
      - Wi-Fi - снова общая среда, защита содержимого - шифрование
