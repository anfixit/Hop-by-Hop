<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Почему кадр должен передаваться дольше 2τ</text>

  <!-- четыре момента времени: строки -->
  <g font-size="19" fill="#0E1830">
    <text x="40" y="118">время 0</text>
    <text x="40" y="228">время τ - ε</text>
    <text x="40" y="338">время τ</text>
    <text x="40" y="448">время 2τ</text>
  </g>
  <g stroke="#94A3B8" stroke-width="6">
    <line x1="220" y1="110" x2="980" y2="110"/>
    <line x1="220" y1="220" x2="980" y2="220"/>
    <line x1="220" y1="330" x2="980" y2="330"/>
    <line x1="220" y1="440" x2="980" y2="440"/>
  </g>
  <g font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <circle cx="220" cy="110" r="24" fill="#0F766E"/><text x="220" y="117">A</text>
    <circle cx="980" cy="110" r="24" fill="#4338CA"/><text x="980" y="117">B</text>
    <circle cx="220" cy="220" r="24" fill="#0F766E"/><text x="220" y="227">A</text>
    <circle cx="980" cy="220" r="24" fill="#4338CA"/><text x="980" y="227">B</text>
    <circle cx="220" cy="330" r="24" fill="#0F766E"/><text x="220" y="337">A</text>
    <circle cx="980" cy="330" r="24" fill="#4338CA"/><text x="980" y="337">B</text>
    <circle cx="220" cy="440" r="24" fill="#0F766E"/><text x="220" y="447">A</text>
    <circle cx="980" cy="440" r="24" fill="#4338CA"/><text x="980" y="447">B</text>
  </g>
  <!-- сигнал A -->
  <line x1="250" y1="110" x2="290" y2="110" stroke="#0F766E" stroke-width="12"/>
  <line x1="250" y1="220" x2="950" y2="220" stroke="#0F766E" stroke-width="12"/>
  <line x1="250" y1="330" x2="950" y2="330" stroke="#0F766E" stroke-width="12"/>
  <line x1="250" y1="440" x2="950" y2="440" stroke="#0F766E" stroke-width="12"/>
  <!-- сигнал B и коллизия -->
  <line x1="930" y1="220" x2="950" y2="220" stroke="#4338CA" stroke-width="12"/>
  <line x1="880" y1="330" x2="950" y2="330" stroke="#DC2626" stroke-width="12"/>
  <line x1="250" y1="440" x2="950" y2="440" stroke="#DC2626" stroke-width="6"/>

  <g font-size="17" fill="#475569">
    <text x="1015" y="105">A начинает</text><text x="1015" y="127">передачу</text>
    <text x="1015" y="215">B ещё не слышит A</text><text x="1015" y="237">и тоже начинает</text>
    <text x="1015" y="325">B слышит коллизию,</text><text x="1015" y="347">шлёт jam</text>
    <text x="1015" y="435">только теперь jam</text><text x="1015" y="457">дошёл до A</text>
  </g>

  <rect x="60" y="490" width="1080" height="90" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="600" y="522" text-anchor="middle" font-size="19" fill="#991B1B">Если A закончила передавать короткий кадр раньше 2τ, она решит, что всё прошло успешно,</text>
  <text x="600" y="550" text-anchor="middle" font-size="19" fill="#991B1B">а кадр погиб. Поэтому минимум 512 бит = 64 байта для 10 Мбит/с и 2500 м.</text>
</svg>
