<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Общая среда: все слышат всех</text>

  <!-- коаксиал -->
  <text x="300" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#0E1830">Коаксиальный кабель (10BASE5, 10BASE2)</text>
  <line x1="60" y1="250" x2="540" y2="250" stroke="#A16207" stroke-width="10"/>
  <rect x="40" y="238" width="16" height="24" fill="#0E1830"/>
  <rect x="544" y="238" width="16" height="24" fill="#0E1830"/>
  <g stroke="#64748B" stroke-width="3">
    <line x1="120" y1="250" x2="120" y2="190"/><line x1="240" y1="250" x2="240" y2="310"/>
    <line x1="360" y1="250" x2="360" y2="190"/><line x1="480" y1="250" x2="480" y2="310"/>
  </g>
  <g font-size="18" text-anchor="middle">
    <rect x="80" y="145" width="80" height="45" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="120" y="174" fill="#0E1830">A</text>
    <rect x="200" y="310" width="80" height="45" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="240" y="339" fill="#0E1830">B</text>
    <rect x="320" y="145" width="80" height="45" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="360" y="174" fill="#0E1830">C</text>
    <rect x="440" y="310" width="80" height="45" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="480" y="339" fill="#0E1830">D</text>
  </g>
  <text x="300" y="400" text-anchor="middle" font-size="18" fill="#475569">сигнал A расходится по кабелю в обе стороны,</text>
  <text x="300" y="424" text-anchor="middle" font-size="18" fill="#475569">его получают B, C и D; на концах - терминаторы</text>

  <!-- хаб -->
  <text x="900" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#0E1830">Хаб на витой паре (10BASE-T)</text>
  <rect x="840" y="220" width="120" height="60" rx="10" fill="#0E1830"/>
  <text x="900" y="257" text-anchor="middle" font-size="20" fill="#FFFFFF">хаб</text>
  <g stroke="#64748B" stroke-width="3">
    <line x1="850" y1="225" x2="740" y2="170"/><line x1="950" y1="225" x2="1060" y2="170"/>
    <line x1="850" y1="275" x2="740" y2="330"/><line x1="950" y1="275" x2="1060" y2="330"/>
  </g>
  <g font-size="18" text-anchor="middle">
    <rect x="690" y="130" width="90" height="45" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="735" y="159" fill="#0E1830">A</text>
    <rect x="1015" y="130" width="90" height="45" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="1060" y="159" fill="#0E1830">B</text>
    <rect x="690" y="325" width="90" height="45" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="735" y="354" fill="#0E1830">C</text>
    <rect x="1015" y="325" width="90" height="45" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="1060" y="354" fill="#0E1830">D</text>
  </g>
  <text x="900" y="400" text-anchor="middle" font-size="18" fill="#475569">хаб повторяет сигнал A на все порты:</text>
  <text x="900" y="424" text-anchor="middle" font-size="18" fill="#475569">звезда снаружи, общий кабель внутри</text>

  <rect x="60" y="460" width="1080" height="70" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="600" y="490" text-anchor="middle" font-size="19" fill="#991B1B">В обоих случаях кадр A физически приходит ко всем станциям: чужие кадры карта отбрасывает сама.</text>
  <text x="600" y="516" text-anchor="middle" font-size="19" fill="#991B1B">Говорить одновременно может только одна станция, иначе коллизия.</text>
</svg>
