<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Заголовок UDP: 8 байт</text>
  <text x="600" y="75" text-anchor="middle" font-size="16" fill="#475569">значения - из опыта (дейтаграмма с 12 байтами данных)</text>

  <g font-size="14" fill="#475569" text-anchor="middle">
    <text x="160" y="104">0</text><text x="640" y="104">16</text><text x="1110" y="104">31</text>
  </g>
  <rect x="160" y="112" width="480" height="70" fill="#DBEAFE" stroke="#0E1830" stroke-width="2"/>
  <rect x="640" y="112" width="480" height="70" fill="#DBEAFE" stroke="#0E1830" stroke-width="2"/>
  <rect x="160" y="182" width="480" height="70" fill="#DCFCE7" stroke="#0E1830" stroke-width="2"/>
  <rect x="640" y="182" width="480" height="70" fill="#FEF9C3" stroke="#0E1830" stroke-width="2"/>
  <rect x="160" y="252" width="960" height="70" fill="#F1F5F9" stroke="#0E1830" stroke-width="2"/>
  <g font-size="18" text-anchor="middle" fill="#0E1830">
    <text x="400" y="142">Source Port</text><text x="400" y="166" font-size="15" fill="#475569">e3f3 = 58355 (временный)</text>
    <text x="880" y="142">Destination Port</text><text x="880" y="166" font-size="15" fill="#475569">1388 = 5000</text>
    <text x="400" y="212">Length</text><text x="400" y="236" font-size="15" fill="#475569">0014 = 20: заголовок 8 + данные 12</text>
    <text x="880" y="212">Checksum</text><text x="880" y="236" font-size="15" fill="#475569">b173; 0000 = не считали (только IPv4)</text>
    <text x="640" y="282">Данные</text><text x="640" y="306" font-size="15" fill="#475569">78 78 78 ... - двенадцать букв x</text>
  </g>
  <g font-size="14" fill="#475569" text-anchor="end">
    <text x="148" y="152">байты 0-3</text><text x="148" y="222">4-7</text><text x="148" y="292">8-...</text>
  </g>

  <!-- pseudo header -->
  <text x="160" y="362" font-size="18" font-weight="bold" fill="#0E1830">Контрольная сумма считается ещё и по псевдозаголовку (в сеть он не уходит):</text>
  <g font-size="16" text-anchor="middle" fill="#0E1830">
    <rect x="160" y="378" width="300" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="310" y="409">адрес отправителя (IP)</text>
    <rect x="460" y="378" width="300" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="610" y="409">адрес получателя (IP)</text>
    <rect x="760" y="378" width="180" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="850" y="409">протокол = 17</text>
    <rect x="940" y="378" width="180" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="1030" y="409">длина UDP</text>
  </g>
  <text x="160" y="455" font-size="15" fill="#475569">так получатель замечает дейтаграмму, доставленную не по адресу; тот же приём у TCP</text>

  <rect x="40" y="480" width="1120" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="506" text-anchor="middle" font-size="17" fill="#0E1830">Больше ничего: ни номеров последовательности, ни подтверждений, ни окна.</text>
  <text x="600" y="530" text-anchor="middle" font-size="17" fill="#0E1830">Для сравнения, у TCP заголовок минимум 20 байт (урок 36).</text>
</svg>
