id: 35
title: "UDP: дейтаграммы без гарантий"
status: published
summary: >
  Самый простой транспортный протокол: что UDP делает и чего не делает, заголовок в 8
  байт по полям, контрольная сумма с псевдозаголовком (необязательная в IPv4 и
  обязательная в IPv6), где и почему выбирают UDP, размер дейтаграммы и фрагментация.
  На практике - границы сообщений UDP против потока TCP, заголовок по байтам,
  дейтаграмма без суммы, потери без повторов и большая дейтаграмма во фрагментах.
  Атаки с усилением через UDP - принцип и защита.

quiz:
  - q: Что UDP добавляет к возможностям IP?
    options:
      - Установление соединения и порядок доставки
      - Порты, подтверждения и повторную передачу
      - Номера портов и простую контрольную сумму
      - Шифрование и проверку адреса отправителя
    answer: 2
    explain: >
      UDP добавляет номера портов (чтобы отдать данные нужной программе) и контрольную
      сумму. Соединений, подтверждений, повторов и порядка в нём нет.

  - q: Сколько байт занимает заголовок UDP?
    options:
      - 4 байта
      - 8 байт
      - 20 байт
      - 40 байт
    answer: 1
    explain: >
      Четыре поля по 2 байта: порт отправителя, порт получателя, длина и контрольная
      сумма. У TCP заголовок минимум 20 байт.

  - q: Программа отправила по UDP три сообщения по 100, 200 и 300 байт. Что получит приёмник?
    options:
      - Три сообщения тех же размеров, что ушли
      - Куски произвольного размера на 600 байт
      - Один кусок в 600 байт, как в TCP
      - Шесть кусков по 100 байт в любом порядке
    answer: 0
    explain: >
      UDP сохраняет границы сообщений: каждое уходит отдельной дейтаграммой и приходит
      целиком (если дошло). TCP передаёт поток байтов без границ, как в шаге 1 опыта.

  - q: Что в UDP происходит с потерянной дейтаграммой?
    options:
      - Отправитель получает ICMP и отправляет её снова
      - Получатель просит повтор по номеру дейтаграммы
      - Маршрутизатор хранит копию и досылает её сам
      - Ничего, если программа сама не отправит заново
    answer: 3
    explain: >
      UDP не подтверждает доставку и не повторяет. В опыте при потере 30% пакетов
      примерно треть дейтаграмм не дошла, и никто об этом не узнал.

  - q: Что такое псевдозаголовок в контрольной сумме UDP?
    options:
      - Запасной заголовок на случай потери основного
      - Адреса и протокол из IP, включённые в расчёт суммы
      - Заголовок TCP, который UDP копирует для совместимости
      - Поле, куда программа пишет свой идентификатор
    answer: 1
    explain: >
      Сумма считается по заголовку, данным и псевдозаголовку: адресам отправителя и
      получателя, номеру протокола 17 и длине. В сеть псевдозаголовок не уходит, но
      помогает поймать дейтаграмму, доставленную не по адресу.

  - q: Почему QUIC и WireGuard построены поверх UDP, а не как новые протоколы?
    options:
      - UDP шифрует данные сам, им не приходится это делать
      - UDP быстрее, потому что у него нет заголовка вовсе
      - UDP гарантирует доставку, поэтому надёжность не нужна
      - Почти все сети и NAT пропускают UDP, а новое нет
    answer: 3
    explain: >
      Новый транспортный протокол многие устройства на пути просто не пропустят. UDP
      проходит почти везде. QUIC строит поверх него свою надёжность, шифрование и
      управление перегрузкой, WireGuard - шифрованный туннель без своей надёжности.

  - q: Почему службы на UDP подходят для атак с усилением, а службы на TCP почти нет?
    options:
      - UDP отвечает без рукопожатия, не проверив адрес
      - У UDP нет контрольной суммы, его проще подделать
      - UDP-пакеты крупнее, чем сегменты TCP
      - TCP-серверы не отвечают на запросы из интернета
    answer: 0
    explain: >
      UDP-служба отвечает на первую же дейтаграмму и не проверяет, настоящий ли адрес
      отправителя. У TCP до обмена данными нужно рукопожатие, которое с поддельного
      адреса не завершить.

  - q: Что помогает не дать своему серверу стать усилителем?
    options:
      - Перенести службу на другой номер порта
      - Отвечать на все запросы как можно быстрее
      - Отвечать только своим и ограничивать частоту
      - Включить на сервере большие ответы для всех
    answer: 2
    explain: >
      Служба должна отвечать только своим клиентам (например, рекурсивный DNS - своей
      сети), выключить устаревшие болтливые функции и ограничивать частоту ответов одному
      адресу. Сети-источники при этом не выпускают поддельные адреса (BCP 38).

open_questions:
  - q: Чем UDP отличается от TCP и когда выбирают UDP?
    reference: >
      UDP добавляет к IP только порты и контрольную сумму: нет соединения, подтверждений,
      повторов, порядка и управления перегрузкой, зато сохраняются границы сообщений и
      нет задержки на установку соединения. TCP даёт надёжный упорядоченный поток байтов
      без границ сообщений. UDP выбирают для коротких запросов и ответов (DNS), когда
      соединение установить нельзя (DHCP), когда свежесть важнее полноты (голос, видео,
      игры), и как основу для новых протоколов: QUIC (своя надёжность) и WireGuard (шифрованный
      туннель).
    key_points:
      - только порты и контрольная сумма
      - нет соединения, подтверждений, повторов, порядка
      - границы сообщений против потока байтов
      - DNS, DHCP, медиа, QUIC и WireGuard

  - q: Опиши заголовок UDP и роль контрольной суммы.
    reference: >
      Заголовок - 8 байт: порт отправителя (куда отвечать), порт получателя (какому
      сокету отдать), длина всей дейтаграммы и контрольная сумма. Сумма считается по
      заголовку, данным и псевдозаголовку с адресами и протоколом из IP, чтобы поймать
      искажения и доставку не по адресу. В IPv4 она необязательна (ноль значит "не
      считали"), в IPv6 обязательна. Если сумма не сошлась, дейтаграмма молча
      отбрасывается.
    key_points:
      - четыре поля по 2 байта
      - псевдозаголовок с адресами
      - необязательна в IPv4, обязательна в IPv6
      - при ошибке дейтаграмма отбрасывается

  - q: Как работают атаки с усилением через UDP и как от них защищаются?
    reference: >
      UDP-служба отвечает без рукопожатия и не проверяет адрес отправителя, который
      можно подделать. Если ответ намного больше запроса, маленькие запросы с чужим
      адресом превращаются в большой поток ответов на этот адрес (отражение и усиление).
      Защита: службы отвечают только своим клиентам, выключают болтливые функции и
      старые службы, ограничивают частоту ответов; сети не выпускают поддельные адреса
      (BCP 38); протоколы проектируют так, чтобы не отвечать большим на маленькое до
      проверки адреса (QUIC, DNS cookies); жертвы используют распределённую защиту.
    key_points:
      - нет рукопожатия, подделка адреса
      - коэффициент усиления, отражение
      - отвечать своим, ограничивать частоту, BCP 38
      - протоколы без усиления, распределённая защита
