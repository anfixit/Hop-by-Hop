id: 72
title: "Эллиптические кривые: X25519, Ed25519; прямая секретность"
status: published
summary: >
  Эллиптические кривые: задача дискретного логарифма на кривой и почему ключи
  короче (256 бит ≈ 3072 бита RSA). Кривые P-256 и Curve25519, обмен ключами
  X25519 и подписи Ed25519, опасность повторного случайного числа в ECDSA. Прямая
  секретность: эфемерные ключи против обмена через RSA. На практике - размеры
  ключей, обмен X25519 и подписи в openssl, скорость операций и модель записанного
  сеанса с украденным ключом сервера.

quiz:
  - q: Какой ключ на эллиптической кривой примерно равен по стойкости RSA-3072?
    options:
      - 64 бита
      - 128 бит
      - 1024 бита
      - 256 бит
    answer: 3
    explain: >
      По таблице NIST: 128 бит симметричного ≈ 3072 бита RSA ≈ 256 бит на кривой.
      В опыте открытый ключ X25519 занял 44 байта против 422 у RSA-3072.

  - q: Для чего используется X25519?
    options:
      - Для обмена ключами Диффи-Хеллмана
      - Для цифровой подписи документов
      - Для шифрования данных вместо AES
      - Для хеширования паролей в базе
    answer: 0
    explain: >
      X25519 - обмен ключами на Curve25519 (RFC 7748). Подписи на той же кривой
      делает Ed25519.

  - q: Чем опасен повтор случайного числа в подписях ECDSA?
    options:
      - Подписи становятся длиннее вдвое
      - По двум подписям вычисляется закрытый ключ
      - Подпись перестаёт проверяться открытым ключом
      - Сообщение раскрывается в открытом виде
    answer: 1
    explain: >
      Так был раскрыт ключ подписи программ игровой приставки. Ed25519 выводит
      это число из ключа и сообщения, поэтому такая ошибка исключена самой схемой.

  - q: Что показал опыт с двумя подписями одного документа?
    options:
      - Обе схемы дают одинаковые подписи
      - Обе схемы дают разные подписи
      - Ed25519 одинаковые, ECDSA разные
      - Ed25519 разные, ECDSA одинаковые
    answer: 2
    explain: >
      Ed25519 детерминирована, в ECDSA входит случайное число. Безопасность ECDSA
      зависит от качества этого числа.

  - q: Что такое прямая секретность?
    options:
      - Кража ключа не раскрывает прошлый трафик
      - Каждый пакет шифруется отдельным ключом
      - Данные шифруются сразу двумя ключами
      - Сервер не хранит журналы всех соединений
    answer: 0
    explain: >
      Эфемерные ключи каждого сеанса стираются, а долговременный ключ только
      подписывает, поэтому секрета сеанса из него не получить. В опыте открылась
      только запись с обменом через RSA.

  - q: Почему обмен ключами через RSA не даёт прямой секретности?
    options:
      - RSA слишком медленный для обмена ключами
      - Сеансовый ключ зашифрован ключом сервера
      - RSA не поддерживает ключи длиннее 2048 бит
      - RSA не умеет подписывать сообщения
    answer: 1
    explain: >
      Запись хранит зашифрованный сеансовый ключ, и украденный ключ сервера его
      расшифровывает - в опыте открылось "the password is swordfish".

  - q: Что делает долговременный ключ сервера в схеме с ECDHE?
    options:
      - Шифрует все данные сеанса целиком
      - Хранит эфемерные ключи клиентов
      - Шифрует сеансовый ключ для клиента
      - Подписывает эфемерный ключ сервера
    answer: 3
    explain: >
      Подпись защищает от человека посередине (урок 71), а секрет сеанса выводится
      только из эфемерных ключей.

  - q: Зачем X25519 сочетают с ML-KEM?
    options:
      - Чтобы ускорить обмен ключами вдвое
      - Чтобы сократить длину всех ключей
      - Чтобы защититься от квантовых компьютеров
      - Чтобы обойтись без сертификатов
    answer: 2
    explain: >
      Достаточно мощный квантовый компьютер сможет решать задачу на кривых. Гибридный обмен с
      постквантовой схемой защищает и запись, сделанную сегодня.

open_questions:
  - q: Почему эллиптические кривые вытесняют RSA и классический Диффи-Хеллман?
    reference: >
      Дискретный логарифм на кривой труднее разложения на множители и обычного
      дискретного логарифма, поэтому при той же стойкости ключи намного короче:
      256 бит на кривой ≈ 3072 бита RSA. Операции быстрее (подпись RSA в опыте в
      десятки раз медленнее), рукопожатия меньше. X25519 и Ed25519 к тому же
      спроектированы так, чтобы их было трудно реализовать с ошибкой.
    key_points:
      - короткие ключи при той же стойкости
      - скорость
      - устойчивость реализации

  - q: Объясни прямую секретность и почему её нет при обмене ключами через RSA.
    reference: >
      Прямая секретность - кража долговременного ключа не раскрывает ранее
      записанный трафик. При ECDHE в каждом сеансе создаются новые ключи, из них
      выводится секрет, после сеанса они стираются; долговременный ключ только
      подписывает эфемерный открытый ключ. При обмене через RSA сеансовый ключ
      шифруется ключом сервера и хранится в записи, и украденный ключ открывает её.
      Поэтому TLS 1.3 оставил только эфемерный обмен.
    key_points:
      - определение
      - эфемерные ключи и подпись
      - RSA-обмен раскрывает запись
      - TLS 1.3

  - q: В чём разница между ECDSA и Ed25519 с точки зрения безопасности реализации?
    reference: >
      ECDSA требует для каждой подписи нового секретного случайного числа; его
      повтор или предсказуемость позволяет вычислить закрытый ключ (так был раскрыт
      ключ подписи программ игровой приставки). Ed25519 выводит это число из ключа
      и сообщения, подписи детерминированы, и такая ошибка исключена. Для ECDSA
      есть детерминированный вариант RFC 6979.
    key_points:
      - случайное число в ECDSA
      - повтор раскрывает ключ
      - детерминированная Ed25519
