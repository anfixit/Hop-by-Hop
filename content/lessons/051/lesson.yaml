id: 51
title: "Фильтрация и файерволы: stateless и stateful, типы файерволов"
status: published
summary: >
  Что такое файервол и где он стоит, признаки фильтрации, порядок правил и
  политика по умолчанию, действия accept, drop и reject, фильтры без состояния и с
  отслеживанием соединений, шлюзы уровня приложения и NGFW. На практике - правила
  nftables на маршрутизаторе шаг за шагом: список запретов, белый список без
  состояния и с состоянием, reject и счётчики. Безопасность: политика
  "запрещено всё, что не разрешено".

quiz:
  - q: В каком порядке файервол применяет правила цепочки?
    options:
      - Все сразу, решает большинство совпадений
      - Сначала запрещающие, потом разрешающие
      - По порядку, до первого подошедшего правила
      - Сам сортирует их от частных к общим
    answer: 2
    explain: >
      Правила проверяются сверху вниз, первое подошедшее решает судьбу пакета. Если
      не подошло ни одно, действует политика цепочки по умолчанию. Поэтому частные
      разрешения ставят раньше общих запретов.

  - q: Почему в опыте при policy drop и разрешении "изнутри на порт 80" сайт перестал открываться?
    options:
      - Ответы сервера отбрасывались политикой drop
      - Файервол не пропускал SYN от a к серверу
      - Сервер не отвечал на адрес из внутренней сети
      - Порт 80 нельзя разрешать в цепочке forward
    answer: 0
    explain: >
      Фильтр без состояния оценивает каждый пакет отдельно. SYN от a подходил под
      правило, а SYN+ACK сервера с порта 80 - нет, и его отбросила политика drop.
      Помогла строка ct state established,related accept.

  - q: Что даёт файерволу отслеживание соединений?
    options:
      - Возможность читать содержимое HTTPS
      - Защиту от любых атак на разрешённые порты
      - Шифрование трафика между сетями
      - Пропуск пакетов разрешённых соединений
    answer: 3
    explain: >
      Фильтр с состоянием запоминает соединение по первому разрешённому пакету и
      дальше пропускает пакеты именно этого соединения в обе стороны. Правила
      пишутся только для начала соединений.

  - q: Чем reject отличается от drop?
    options:
      - reject работает только для UDP
      - reject отвечает отправителю отказом
      - reject пропускает пакет, но помечает его
      - reject записывает пакет в журнал
    answer: 1
    explain: >
      drop отбрасывает молча, и клиент ждёт до таймаута (в опыте 1,5 с). reject
      отвечает отказом - TCP RST или ICMP "недоступно", и клиент узнаёт о нём
      сразу (0 мс).

  - q: Почему политика "разрешено всё, что не запрещено" хуже обратной?
    options:
      - Открыто всё, о чём не вспомнили
      - Она медленнее проверяет пакеты
      - Она вообще не работает с IPv6
      - Она запрещает ответы на свои соединения
    answer: 0
    explain: >
      Список запретов защищает только от того, что перечислено заранее. В опыте
      порт 2222 закрыли, а забытый 8080 остался открытым. При политике запрета
      забытое закрыто само.

  - q: Зачем правило ct state established,related пропускает и связанные (related) пакеты?
    options:
      - Чтобы разрешить новые соединения извне
      - Чтобы пропускать соединения с соседних адресов
      - Чтобы проходили ошибки ICMP к соединениям
      - Чтобы ускорить повторные соединения
    answer: 2
    explain: >
      Связанные пакеты - например, сообщения ICMP об ошибках, относящиеся к
      разрешённому соединению. Без них, в частности, сломается поиск MTU пути:
      сообщение "нужна фрагментация" не дойдёт до отправителя.

  - q: Чем шлюз уровня приложения отличается от фильтра пакетов?
    options:
      - Он работает только на канальном уровне
      - Он не умеет отслеживать соединения
      - Он стоит только на самой машине
      - Он разбирает содержимое протокола
    answer: 3
    explain: >
      Шлюз прикладного уровня (прокси) завершает соединение клиента на себе и
      разбирает данные по правилам протокола: может проверить, что это HTTP,
      отфильтровать адреса страниц. Плата - сложность, задержка и расшифровка TLS.

  - q: От чего файервол с политикой запрета НЕ защищает?
    options:
      - От подключений к забытым службам
      - От атак через разрешённые порты и службы
      - От служб, о которых администратор не знал
      - От входящих соединений на закрытые порты
    answer: 1
    explain: >
      Разрешённый порт открыт для всех, кому разрешён: уязвимость в самом
      веб-сервере файервол не закроет. Не защищает он и от угроз изнутри сети и
      трафика в обход. Поэтому нужны обновления, минимум служб и обнаружение
      вторжений.

open_questions:
  - q: Чем фильтр без состояния отличается от фильтра с отслеживанием соединений? Приведи пример из опыта.
    reference: >
      Фильтр без состояния оценивает каждый пакет отдельно по заголовкам. Чтобы
      разрешить соединение, нужно отдельно разрешить и ответы, а правило для них
      приходится писать по адресам и портам, и оно шире, чем нужно. Фильтр с
      состоянием запоминает соединение по первому разрешённому пакету и пропускает
      пакеты этого соединения в обе стороны; правила пишутся для начала
      соединений, остальное - ct state established,related accept. В опыте при
      policy drop и одном разрешении "изнутри на 80" сайт не открывался: ответы
      отбрасывались; одна строка established,related это исправила, а снаружи
      внутрь осталось закрыто.
    key_points:
      - без состояния - каждый пакет отдельно
      - ответы приходится разрешать широко
      - с состоянием - таблица соединений
      - established,related, пример из опыта

  - q: Объясни принцип "запрещено всё, что не разрешено" и как его применять.
    reference: >
      Политика по умолчанию - запрещать, разрешается только нужное. Список запретов
      защищает лишь от перечисленного, и забытая служба остаётся открытой (как
      порт 8080 в опыте); при политике запрета ошибка проявляется как "нужное не
      работает" и сразу заметна. Применение: policy drop на входящих и
      пересылаемых, разрешения для established,related, loopback и конкретных
      служб; ограничивать и исходящий трафик серверов; не запрещать нужный ICMP;
      правила одинаково для IPv4 и IPv6; не отрезать себе SSH при удалённой
      настройке.
    key_points:
      - политика drop, белый список
      - забытое закрыто само
      - нужный ICMP, IPv4 и IPv6
      - осторожно с удалённым доступом

  - q: Какие бывают файерволы и чего файервол не защищает?
    reference: >
      По месту: сетевые (на границе сетей, в облаке - группы безопасности) и
      хостовые (на машине). По глубине анализа: фильтр пакетов без состояния,
      фильтр с отслеживанием соединений, шлюз уровня приложения (прокси), который
      разбирает содержимое протокола; NGFW объединяют их с распознаванием
      приложений и обнаружением вторжений. Файервол не защищает от атак через
      разрешённые порты, от угроз изнутри сети, от трафика в обход него, не видит
      содержимого зашифрованного трафика без расшифровки. Поэтому нужна
      эшелонированная защита.
    key_points:
      - сетевые и хостовые
      - без состояния, с состоянием, прикладные, NGFW
      - разрешённые порты, угрозы изнутри, обход
      - эшелонированная защита
