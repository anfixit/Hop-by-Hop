id: 59
title: "Прозрачное проксирование: REDIRECT и TPROXY"
status: published
summary: >
  Прозрачный прокси и главный вопрос - как узнать исходный адрес назначения.
  REDIRECT как DNAT на саму машину и SO_ORIGINAL_DST; TPROXY: правило tproxy с
  меткой, policy routing с маршрутом local, сокет IP_TRANSPARENT, работа с UDP;
  связь с прозрачными режимами Xray и sing-box. На практике - один и тот же
  запрос напрямую, через REDIRECT и через TPROXY, локальный адрес сокета прокси и
  записи conntrack.

quiz:
  - q: Чем прозрачный прокси отличается от обычного?
    options:
      - Он шифрует весь трафик клиента
      - Клиент не знает о нём и идёт к серверу
      - Он работает только для HTTPS
      - Он не может изменять запросы клиента
    answer: 1
    explain: >
      Обычный прокси указан в настройках клиента. Прозрачный перехватывает на
      маршрутизаторе соединения, которые клиент открывал прямо к серверу, и
      клиент о нём не знает.

  - q: Как прокси за REDIRECT узнаёт исходный адрес назначения?
    options:
      - Из заголовка IP входящего пакета
      - Из локального адреса своего сокета
      - Из conntrack, опцией SO_ORIGINAL_DST
      - Из таблицы маршрутов ip route
    answer: 2
    explain: >
      REDIRECT переписывает адрес назначения (это DNAT), но conntrack помнит
      исходный кортеж. Опция SO_ORIGINAL_DST возвращает исходный адрес и порт. В
      опыте прокси узнал 198.51.100.2:80, хотя сокет был на 192.0.2.254:8888.

  - q: Какой локальный адрес был у сокета прокси при TPROXY в опыте?
    options:
      - Адрес сервера 198.51.100.2:80
      - Адрес маршрутизатора 192.0.2.254:8888
      - Адрес клиента 192.0.2.1
      - Адрес 127.0.0.1:9999
    answer: 0
    explain: >
      TPROXY не меняет пакет, и прозрачный сокет принимает соединение на чужой
      адрес. getsockname() возвращает тот адрес, к которому подключался клиент.

  - q: Зачем для TPROXY нужен маршрут local 0.0.0.0/0 dev lo в отдельной таблице?
    options:
      - Чтобы шифровать все помеченные пакеты
      - Чтобы ускорить пересылку пакетов
      - Чтобы ответы прокси шли через lo
      - Чтобы пакеты с меткой считались своими
    answer: 3
    explain: >
      Пакет адресован чужому серверу, и без этого ядро сочло бы его
      транзитным (FORWARD), где он был бы отброшен. Правило ip rule fwmark отправляет помеченные пакеты в таблицу, где
      любой адрес считается своим, и пакет доставляется локально, сокету прокси.

  - q: Что даёт опция сокета IP_TRANSPARENT?
    options:
      - Разрешает принимать соединения на чужие адреса
      - Шифрует соединение между клиентом и прокси
      - Отключает conntrack для сокета
      - Делает сокет невидимым для ss
    answer: 0
    explain: >
      Обычный сокет принимает только соединения на адреса машины. Прозрачный -
      и на чужие, а также может отправлять пакеты от чужого адреса. Нужны привилегии
      (CAP_NET_ADMIN или CAP_NET_RAW).

  - q: Главное преимущество TPROXY перед REDIRECT?
    options:
      - Он не требует прав root
      - Он работает и для UDP
      - Он не нужен на маршрутизаторе
      - Он быстрее устанавливает TCP
    answer: 1
    explain: >
      Для UDP у REDIRECT нет штатного способа узнать исходный адрес. TPROXY с опцией
      IP_RECVORIGDSTADDR сообщает адрес назначения каждой дейтаграммы, поэтому
      через прокси можно пустить и UDP: DNS, QUIC.

  - q: Что показала запись conntrack при TPROXY в опыте?
    options:
      - Трансляцию на адрес 192.0.2.254:8888
      - Трансляцию на порт 9999
      - Зеркальную запись без трансляции
      - Запись с адресом клиента вместо сервера
    answer: 2
    explain: >
      Ответный кортеж был от 198.51.100.2:80 - зеркало исходного: TPROXY не NAT.
      При REDIRECT ответный кортеж был от 192.0.2.254:8888.

  - q: Кого видит сервер, когда соединение идёт через прозрачный прокси из опыта?
    options:
      - Клиента 192.0.2.1
      - Адрес 127.0.0.1
      - Никого, соединение не доходит
      - Маршрутизатор 198.51.100.254
    answer: 3
    explain: >
      Прокси сам подключается к серверу от своего адреса, и сервер видит
      198.51.100.254 и при REDIRECT, и при TPROXY.

open_questions:
  - q: Как работает REDIRECT и как прокси узнаёт, куда шёл клиент?
    reference: >
      REDIRECT - частный случай DNAT на хуке prerouting: адрес назначения
      заменяется адресом самой машины, порт - портом прокси, и соединение
      попадает на обычный сокет прокси. Исходный адрес в пакете потерян, но
      conntrack помнит исходный кортеж, и прокси получает его опцией сокета
      SO_ORIGINAL_DST. Это NAT, нужен conntrack; для UDP исходный адрес так не
      узнать, поэтому по-нормальному REDIRECT работает только с TCP.
    key_points:
      - DNAT на адрес самой машины
      - SO_ORIGINAL_DST из conntrack
      - нужен conntrack
      - только TCP

  - q: Из каких частей состоит настройка TPROXY и зачем каждая?
    reference: >
      Правило tproxy на prerouting (цепочка filter, приоритет mangle) находит
      сокет прокси на заданном порту и привязывает к нему пакет, а meta mark set в том
      же правиле ставит метку.
      Правило ip rule fwmark метка lookup таблица и маршрут local 0.0.0.0/0 dev lo
      в этой таблице заставляют ядро считать помеченный пакет своим и доставить
      локально, а не переслать. Сокет прокси с IP_TRANSPARENT принимает
      соединения на чужие адреса; исходный адрес - его локальный адрес
      (getsockname), для UDP - IP_RECVORIGDSTADDR. Пакет не меняется, NAT нет.
    key_points:
      - правило tproxy и метка
      - fwmark и маршрут local
      - IP_TRANSPARENT
      - getsockname, UDP

  - q: Сравни REDIRECT и TPROXY и объясни, почему на маршрутизаторе у Xray и sing-box чаще выбирают режим tproxy.
    reference: >
      REDIRECT переписывает адрес назначения (NAT), исходный адрес прокси
      спрашивает у conntrack через SO_ORIGINAL_DST, работает в основном для TCP,
      настраивается одним правилом. TPROXY доставляет пакет без изменений,
      требует метки, policy routing и сокета IP_TRANSPARENT, зато исходный адрес
      - просто локальный адрес сокета, и он работает и для UDP. Прокси на
      маршрутизаторе нужно пропускать и TCP, и UDP (DNS, QUIC), поэтому выбирают
      режим tproxy; режим redirect у них тоже есть, но только для TCP.
    key_points:
      - REDIRECT - NAT и SO_ORIGINAL_DST
      - TPROXY - без изменения пакета
      - UDP только у TPROXY
      - режим tproxy в Xray и sing-box - ради UDP
