id: 77
title: "История: SSL, TLS, место TLS в стеке"
status: published
summary: >
  Что даёт TLS (конфиденциальность, целостность, аутентификация сервера,
  согласование параметров), где он находится в стеке и из каких протоколов
  состоит, что он не скрывает, история от SSL 2.0 до TLS 1.3. На практике - сервер
  openssl s_server в пространстве имён и проверка версий по умолчанию, наборы
  шифров, слой записей и что видит наблюдатель в рукопожатии TLS 1.3.
  Безопасность: почему SSL и ранние TLS запрещены.

quiz:
  - q: Где TLS находится в стеке протоколов?
    options:
      - Между IP и TCP
      - Между транспортом и приложением
      - Внутри Ethernet-кадра
      - Над HTTP, внутри самого браузера
    answer: 1
    explain: >
      TLS работает поверх TCP и под HTTP, SMTP и другими протоколами; HTTPS - это
      HTTP поверх TLS.

  - q: Что TLS не скрывает от наблюдателя на пути?
    options:
      - Содержимое передаваемых страниц сайта
      - Заголовки и cookies запросов HTTP
      - IP-адреса, порты и имя сервера в SNI
      - Пароли из форм на сайте
    answer: 2
    explain: >
      Адреса и порты - это заголовки ниже TLS, а SNI идёт в рукопожатии открыто.
      В опыте имя secret-project.corp.lab нашлось в трафике.

  - q: Какие версии согласовал сервер OpenSSL 3 с настройками по умолчанию?
    options:
      - Только TLS 1.2 и TLS 1.3
      - Все версии от SSL 3.0 до TLS 1.3
      - Только TLS 1.3
      - TLS 1.0 и TLS 1.1, но не новее
    answer: 0
    explain: >
      TLS 1.0 и 1.1 сервер отверг с protocol version, SSL 3.0 в сборке нет вовсе
      (Unknown option).

  - q: Какая версия указана в заголовках записей соединения TLS 1.3?
    options:
      - 03 04, как и положено TLS 1.3
      - 03 00, версия SSL 3.0
      - Версия в записях не указывается
      - 03 03 почти везде, ради совместимости
    answer: 3
    explain: >
      Старые промежуточные устройства ломались на незнакомых версиях, поэтому TLS
      1.3 выдаёт себя за 1.2, а настоящую версию сообщает в расширении.

  - q: Почему имени из сертификата не было в записанном трафике TLS 1.3?
    options:
      - Сервер не отправлял сертификат
      - В TLS 1.3 сертификат передаётся зашифрованным
      - tcpdump не записал рукопожатие
      - Сертификат передаётся отдельно, по другому порту TCP
    answer: 1
    explain: >
      После ServerHello рукопожатие TLS 1.3 шифруется. В TLS 1.2 имя сертификата
      нашлось 3 раза.

  - q: Чем опасна включённая поддержка старой версии протокола?
    options:
      - Она замедляет новые соединения
      - Она занимает больше памяти сервера
      - Она позволяет посреднику навязать откат
      - Она отключает проверку сертификатов сервера
    answer: 2
    explain: >
      Посредник может вмешаться в согласование и заставить стороны выбрать самую
      слабую общую версию; поэтому старые версии выключают совсем.

  - q: Что в TLS 1.3 определяет набор шифров вроде TLS_AES_128_GCM_SHA256?
    options:
      - Обмен ключами, подпись и шифр сразу
      - Только алгоритм подписи сертификата
      - Только способ обмена ключами
      - AEAD-шифр и хеш-функцию
    answer: 3
    explain: >
      В TLS 1.3 обмен ключами и подпись согласуются отдельно, а набор задаёт только
      AEAD-шифр и хеш. В TLS 1.2 имя набора перечисляло всё сразу.

  - q: Что рекомендуется оставить на сервере сегодня?
    options:
      - TLS 1.2 и 1.3, для 1.2 AEAD с ECDHE
      - Все версии ради старых клиентов
      - SSL 3.0 и TLS 1.0 для совместимости
      - Только наборы с RC4 и MD5
    answer: 0
    explain: >
      SSL 2.0, 3.0, TLS 1.0 и 1.1 запрещены (RFC 6176, 7568, 8996), RC4 запрещён
      отдельно (RFC 7465).

open_questions:
  - q: Что даёт TLS и чего он не скрывает?
    reference: >
      TLS даёт конфиденциальность, целостность, аутентификацию сервера (и по
      желанию клиента) и согласование параметров. Он работает между транспортом и
      приложением. Не скрывает IP-адреса и порты, размеры и время передачи, имя
      сервера в SNI (без ECH), а до TLS 1.3 - и сертификат сервера.
    key_points:
      - четыре свойства
      - место в стеке
      - адреса, порты, размеры
      - SNI и сертификат

  - q: Расскажи историю версий SSL и TLS и почему старые запрещены.
    reference: >
      SSL 2.0 и 3.0 (Netscape, 1995-1996), TLS 1.0 (1999), 1.1 (2006), 1.2 (2008,
      AEAD), 1.3 (2018, переделка: быстрее, проще, без устаревшего). SSL 2.0 - слабый
      MAC и экспортные шифры, SSL 3.0 - набивка CBC (POODLE), TLS 1.0 - предсказуемый
      IV (BEAST), 1.0 и 1.1 зависят от MD5 и SHA-1 и не имеют AEAD. Поддержка старой
      версии позволяет откат, поэтому они запрещены (RFC 6176, 7568, 8996).
    key_points:
      - годы версий
      - слабости старых
      - откат
      - RFC-запреты

  - q: Что показал опыт о слое записей TLS 1.3?
    reference: >
      Каждая запись начинается с типа (16 - рукопожатие, 17 - данные, 14 - смена
      шифра) и версии. Почти везде версия 03 03, как у TLS 1.2, в первой записи
      клиента 03 01: TLS 1.3 выдаёт себя за старую версию ради совместимости с
      промежуточными устройствами, а настоящую версию передаёт в расширении. После
      ServerHello почти всё идёт как 17, включая зашифрованную часть рукопожатия.
    key_points:
      - типы записей
      - версия 03 03
      - совместимость
      - всё после - 17
