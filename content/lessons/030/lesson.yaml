id: 30
title: "IPv6: адреса и заголовок"
status: published
summary: >
  Зачем понадобился IPv6 и чем он отличается от IPv4. Запись адресов и единая форма
  по RFC 5952, подсети /64, идентификатор интерфейса (EUI-64, стабильные случайные и
  временные адреса), типы адресов, области действия, групповые адреса и группа
  запрашиваемого узла. Основной заголовок в 40 байт поле за полем и дополнительные
  заголовки; фрагментация только у отправителя. На практике - сеть IPv6 из двух узлов
  и маршрутизатора: адреса, группы, заголовок по байтам, Packet Too Big и фрагменты.

quiz:
  - q: Как правильно сократить адрес 2001:0db8:0000:0000:0001:0000:0000:0001?
    options:
      - "2001:db8::1::1"
      - "2001:db8::1:0:0:1"
      - "2001:db8:0:0:1::"
      - "2001:db8:1:1"
    answer: 1
    explain: >
      Ведущие нули опускают, а одну цепочку нулевых групп заменяют на "::". Две такие
      замены запрещены, иначе адрес не восстановить. По RFC 5952 при двух равных цепочках
      сокращают первую.

  - q: Какая длина префикса у обычной подсети IPv6?
    options:
      - /24, как у типичной сети IPv4
      - /48, как у выделения организации
      - /64, остальное - идентификатор
      - /128, у каждого узла своя подсеть
    answer: 2
    explain: >
      Первые 64 бита - префикс подсети, по ним работает маршрутизация, последние 64 бита -
      идентификатор интерфейса. Длина идентификатора фиксирована, поэтому подсеть почти
      всегда /64.

  - q: Что заменяет в IPv6 широковещательные адреса?
    options:
      - Адреса произвольной рассылки (anycast)
      - Групповые адреса, например ff02::1
      - Адреса канала из блока fe80::/10
      - Широковещательный адрес ffff::/16
    answer: 1
    explain: >
      Широковещания в IPv6 нет совсем. Его роль играют групповые адреса: ff02::1 - все
      узлы канала, а вопрос "чей это адрес" отправляют в группу запрашиваемого узла.

  - q: Какой адрес узел IPv6 назначает себе сам сразу при включении интерфейса?
    options:
      - Адрес канала, из блока fe80::/10
      - Глобальный адрес из блока 2000::/3
      - Уникальный локальный из fd00::/8
      - Неопределённый адрес ::, навсегда
    answer: 0
    explain: >
      Адрес канала (link-local) есть у каждого интерфейса IPv6, даже без глобального
      адреса. Он действует только в своём канале и не маршрутизируется; на нём работают
      служебные протоколы.

  - q: Почему адреса EUI-64 считают плохими для приватности?
    options:
      - Их нельзя использовать для выхода в интернет
      - В них виден MAC, по которому узнают устройство
      - Их легко перехватить, потому что они короче
      - Они меняются слишком часто и ломают соединения
    answer: 1
    explain: >
      Идентификатор EUI-64 получается из MAC-адреса и одинаков в любой сети. По нему
      можно узнать производителя и следить за устройством. Поэтому используют стабильные
      случайные идентификаторы и временные адреса.

  - q: Какого поля IPv4 нет в основном заголовке IPv6?
    options:
      - Адреса отправителя пакета
      - Счётчика шагов (TTL, Hop Limit)
      - Указателя на следующий протокол
      - Контрольной суммы заголовка
    answer: 3
    explain: >
      Контрольную сумму заголовка убрали: целостность проверяют канальный и транспортный
      уровни, а пересчёт на каждом маршрутизаторе дорог. TTL стал Hop Limit, Protocol
      стал Next Header.

  - q: Что делает маршрутизатор IPv6, если пакет не помещается в MTU следующего канала?
    options:
      - Делит пакет на фрагменты и отправляет их дальше
      - Молча отбрасывает пакет без всяких сообщений
      - Отбрасывает и шлёт отправителю Packet Too Big
      - Уменьшает поле Hop Limit и возвращает пакет назад
    answer: 2
    explain: >
      В IPv6 делить пакет может только отправитель. Маршрутизатор отвечает ICMPv6
      "пакет слишком велик" с нужным MTU, отправитель запоминает его и дальше делит
      пакеты сам, добавляя заголовок Fragment.

  - q: Что указывает поле Next Header?
    options:
      - Длину дополнительного заголовка за ним
      - Адрес следующего маршрутизатора в пути
      - Сколько заголовков осталось до данных
      - Какой заголовок или протокол идёт следом
    answer: 3
    explain: >
      Next Header говорит, что идёт следом: дополнительный заголовок (например, 44 -
      Fragment) или протокол верхнего уровня (6 - TCP, 17 - UDP, 58 - ICMPv6). Каждый
      дополнительный заголовок тоже содержит такое поле, и получается цепочка.

open_questions:
  - q: Как записываются адреса IPv6 и из каких частей состоит глобальный адрес?
    reference: >
      Адрес - 128 бит, восемь групп по четыре шестнадцатеричные цифры через двоеточие.
      Ведущие нули в группе опускают, одну цепочку нулевых групп заменяют на "::"
      (только одну). Единая форма по RFC 5952: строчные буквы, "::" на самой длинной
      цепочке, при равных - на первой. Глобальный адрес: префикс от провайдера и
      идентификатор подсети (вместе обычно 64 бита, по ним маршрутизация) и 64-битный
      идентификатор интерфейса.
    key_points:
      - 128 бит, восемь групп по 16 бит
      - ведущие нули и одна замена на ::
      - первые 64 бита - сеть, последние 64 - идентификатор интерфейса
      - подсеть обычно /64

  - q: Какие типы адресов есть в IPv6 и почему у одного интерфейса их несколько?
    reference: >
      Индивидуальные (глобальные 2000::/3, адреса канала fe80::/10, уникальные локальные
      fd00::/8), групповые ff00::/8 и произвольной рассылки (anycast). Широковещательных
      нет. У каждого интерфейса есть адрес канала, обычно один или несколько глобальных,
      он входит в группу всех узлов ff02::1 и в группы запрашиваемого узла для своих
      адресов. Адреса различаются областью действия: канал, организация, весь интернет.
    key_points:
      - unicast, multicast, anycast; нет broadcast
      - адрес канала fe80:: у каждого интерфейса
      - группы ff02::1 и solicited-node
      - область действия адреса

  - q: Чем основной заголовок IPv6 отличается от заголовка IPv4?
    reference: >
      Он всегда 40 байт. Поля: версия, класс трафика, метка потока, длина данных после
      заголовка, Next Header, Hop Limit, адреса по 16 байт. Нет IHL, контрольной суммы
      заголовка, полей фрагментации и параметров. Необязательное вынесено в
      дополнительные заголовки, связанные цепочкой через Next Header. Фрагментирует
      только отправитель, маршрутизатор при нехватке MTU присылает Packet Too Big;
      минимальный MTU - 1280 байт.
    key_points:
      - фиксированные 40 байт
      - нет контрольной суммы, IHL, фрагментации
      - Next Header и дополнительные заголовки
      - фрагментирует только отправитель, MTU 1280
