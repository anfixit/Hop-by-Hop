<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Основной заголовок IPv6: 40 байт</text>
  <text x="600" y="75" text-anchor="middle" font-size="16" fill="#475569">по 32 бита в строке; значения - из опыта (эхо-запрос от a к b, после маршрутизатора r)</text>

  <g font-size="14" fill="#475569" text-anchor="middle">
    <text x="160" y="104">0</text><text x="400" y="104">8</text><text x="640" y="104">16</text><text x="880" y="104">24</text><text x="1110" y="104">31</text>
  </g>

  <!-- row 1 -->
  <rect x="160" y="112" width="120" height="70" fill="#DBEAFE" stroke="#0E1830" stroke-width="2"/>
  <rect x="280" y="112" width="240" height="70" fill="#DBEAFE" stroke="#0E1830" stroke-width="2"/>
  <rect x="520" y="112" width="600" height="70" fill="#FEF9C3" stroke="#0E1830" stroke-width="2"/>
  <!-- row 2 -->
  <rect x="160" y="182" width="480" height="70" fill="#DCFCE7" stroke="#0E1830" stroke-width="2"/>
  <rect x="640" y="182" width="240" height="70" fill="#DCFCE7" stroke="#0E1830" stroke-width="2"/>
  <rect x="880" y="182" width="240" height="70" fill="#FED7AA" stroke="#0E1830" stroke-width="2"/>
  <!-- addresses -->
  <rect x="160" y="252" width="960" height="140" fill="#F1F5F9" stroke="#0E1830" stroke-width="2"/>
  <rect x="160" y="392" width="960" height="140" fill="#F1F5F9" stroke="#0E1830" stroke-width="2"/>

  <g font-size="18" text-anchor="middle" fill="#0E1830">
    <text x="220" y="142">Version</text><text x="220" y="166" font-size="15" fill="#475569">6</text>
    <text x="400" y="142">Traffic Class</text><text x="400" y="166" font-size="15" fill="#475569">00</text>
    <text x="820" y="142">Flow Label (20 бит)</text><text x="820" y="166" font-size="15" fill="#475569">0f584 - метку поставил Linux</text>
    <text x="400" y="212">Payload Length (16 бит)</text><text x="400" y="236" font-size="15" fill="#475569">0018 = 24 байта после заголовка</text>
    <text x="760" y="212">Next Header</text><text x="760" y="236" font-size="15" fill="#475569">3a = 58, ICMPv6</text>
    <text x="1000" y="212">Hop Limit</text><text x="1000" y="236" font-size="15" fill="#475569">3f = 63</text>
    <text x="640" y="315">Source Address (128 бит)</text><text x="640" y="345" font-size="16" fill="#475569">2001:db8:1::1</text>
    <text x="640" y="455">Destination Address (128 бит)</text><text x="640" y="485" font-size="16" fill="#475569">2001:db8:2::2</text>
  </g>

  <g font-size="14" fill="#475569" text-anchor="end">
    <text x="148" y="152">байты 0-3</text><text x="148" y="222">4-7</text><text x="148" y="327">8-23</text><text x="148" y="467">24-39</text>
  </g>

  <rect x="40" y="552" width="1120" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="582" text-anchor="middle" font-size="17" fill="#0E1830">Нет IHL, контрольной суммы, полей фрагментации и параметров: длина всегда 40 байт,</text>
  <text x="600" y="606" text-anchor="middle" font-size="17" fill="#0E1830">всё необязательное - в дополнительных заголовках, на которые указывает Next Header</text>
</svg>
