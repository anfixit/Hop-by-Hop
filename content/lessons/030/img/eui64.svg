<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">EUI-64: из MAC-адреса в идентификатор интерфейса</text>

  <g font-size="22" text-anchor="middle" fill="#0E1830" font-family="monospace">
    <!-- step 0 -->
    <text x="100" y="118" text-anchor="start" font-size="17" font-family="sans-serif" fill="#475569">MAC-адрес a</text>
    <rect x="380" y="90" width="210" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="485" y="119">02:00:00</text>
    <rect x="720" y="90" width="210" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="825" y="119">00:00:0a</text>

    <!-- step 1 -->
    <text x="100" y="208" text-anchor="start" font-size="17" font-family="sans-serif" fill="#475569">1. вставить ff:fe</text>
    <rect x="380" y="180" width="210" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="485" y="209">02:00:00</text>
    <rect x="590" y="180" width="130" height="44" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/><text x="655" y="209">ff:fe</text>
    <rect x="720" y="180" width="210" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="825" y="209">00:00:0a</text>

    <!-- step 2 -->
    <text x="100" y="298" text-anchor="start" font-size="17" font-family="sans-serif" fill="#475569">2. инвертировать бит U/L</text>
    <rect x="380" y="270" width="210" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="485" y="299">00:00:00</text>
    <rect x="590" y="270" width="130" height="44" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/><text x="655" y="299">ff:fe</text>
    <rect x="720" y="270" width="210" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="825" y="299">00:00:0a</text>
  </g>
  <text x="960" y="298" font-size="16" fill="#B91C1C">02 = 0000 0010 → 0000 0000</text>

  <g font-size="17" fill="#0E1830">
    <text x="100" y="375" font-size="17" fill="#475569">3. идентификатор интерфейса</text>
    <text x="380" y="375" font-family="monospace" font-size="22">0000:00ff:fe00:000a  =  ::ff:fe00:a</text>
    <text x="100" y="425" font-size="17" fill="#475569">адрес канала</text>
    <text x="380" y="425" font-family="monospace" font-size="22" fill="#15803D">fe80::ff:fe00:a</text>
    <text x="100" y="465" font-size="17" fill="#475569">глобальный по EUI-64</text>
    <text x="380" y="465" font-family="monospace" font-size="22" fill="#15803D">префикс /64 + 0:ff:fe00:a</text>
  </g>

  <rect x="40" y="490" width="1120" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="523" text-anchor="middle" font-size="17" fill="#0E1830">Минус EUI-64: MAC виден в адресе в любой сети. Поэтому чаще берут стабильные случайные (RFC 7217) и временные адреса</text>
</svg>
