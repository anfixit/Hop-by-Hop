id: 18
title: "VLAN и 802.1Q: несколько сетей на одних коммутаторах"
status: published
summary: >
  Зачем делить сеть и как это делают без новых кабелей: виртуальные локальные сети,
  метка IEEE 802.1Q, порты доступа, транки и естественная VLAN, изучение адресов в
  каждой VLAN отдельно, протоколы распространения VLAN и MSTP. На практике - две VLAN
  на одном коммутаторе в Linux и маршрутизатор на транке. В безопасности - VLAN
  hopping: подмена коммутатора и двойная метка, и настройки, которые от них защищают.

quiz:
  - q: Что ограничивает VLAN?
    options:
      - Область коллизий одного порта коммутатора
      - Скорость передачи кадров на каждом порту
      - Широковещательный домен на канальном уровне
      - Число MAC-адресов, которое помнит коммутатор
    answer: 2
    explain: >
      Каждая VLAN - отдельный широковещательный домен: кадры, включая широковещательные,
      не выходят за её пределы. Области коллизий коммутатор разделяет и без VLAN (урок 16).

  - q: Как компьютеры из разных VLAN могут обмениваться данными?
    options:
      - Только через маршрутизатор между ними
      - Напрямую, если адреса из одной IP-сети
      - Через широковещательные кадры
      - Никак, VLAN изолированы навсегда
    answer: 0
    explain: >
      Коммутатор не выпускает кадры за пределы VLAN, поэтому связь между VLAN идёт через
      маршрутизатор, отдельный или встроенный в коммутатор. В опыте pc1 достучался до
      pc3 через rtr, а напрямую не смог даже с адресом из одной сети.

  - q: Где в кадре Ethernet находится метка 802.1Q?
    options:
      - В самом начале, перед адресом получателя
      - После адреса отправителя, перед EtherType
      - В конце кадра, после контрольной суммы FCS
      - Внутри IP-заголовка, в поле для приоритета
    answer: 1
    explain: >
      Метка из 4 байт вставляется после адреса отправителя: сначала 0x8100 на месте
      EtherType, потом поле TCI с номером VLAN, а за ними настоящий EtherType.

  - q: Сколько бит отведено под номер VLAN в метке 802.1Q?
    options:
      - 8 бит
      - 16 бит
      - 12 бит
      - 3 бита
    answer: 2
    explain: >
      Номер VLAN (VID) занимает 12 бит, это 4096 значений, из которых 0 и 4095
      зарезервированы, поэтому рабочих VLAN 4094. 3 бита - это приоритет.

  - q: Что делает коммутатор с кадром, который пришёл от компьютера на порт доступа VLAN 10?
    options:
      - Отправляет обратно, требуя поставить метку
      - Рассылает во все VLAN, раз метки нет
      - Отбрасывает как кадр без номера VLAN
      - Относит его к VLAN 10, как настроен порт
    answer: 3
    explain: >
      Компьютер на порту доступа отправляет обычные кадры без меток, и коммутатор относит
      их к VLAN этого порта. Метку коммутатор ставит сам, если кадр уходит в транк, как
      в шаге 4 опыта.

  - q: Чем транк отличается от порта доступа?
    options:
      - Транк несёт кадры многих VLAN с метками
      - Транк принимает только кадры без меток
      - Транк соединяет компьютер с коммутатором
      - Транк всегда принадлежит только VLAN 1
    answer: 0
    explain: >
      Транк соединяет коммутаторы между собой или с маршрутизатором и передаёт кадры
      нескольких VLAN, помечая их, чтобы другая сторона знала, чей это кадр. Порт доступа
      принадлежит одной VLAN и работает без меток.

  - q: Почему в опыте адрес маршрутизатора оказался в таблице MAC-адресов дважды?
    options:
      - У маршрутизатора две сетевые карты с одинаковым адресом
      - Коммутатор изучает адреса отдельно в каждой VLAN
      - Коммутатор записывает каждый адрес по два раза
      - Маршрутизатор подменил адрес, и это признак атаки
    answer: 1
    explain: >
      Маршрутизатор отправлял кадры и в VLAN 10, и в VLAN 20 с одного адреса. Коммутатор
      ведёт отдельную таблицу для каждой VLAN, поэтому записей две: для него это два
      разных адресата в двух разных логических коммутаторах.

  - q: Какая ошибка настройки делает возможной атаку двойной меткой?
    options:
      - Естественная VLAN транка - та же, что у пользователей
      - На портах доступа включена фильтрация кадров на входе
      - На транке разрешены только нужные номера VLAN
      - Коммутатор помечает кадры естественной VLAN на транке
    answer: 0
    explain: >
      Первый коммутатор снимает внешнюю метку, потому что это естественная VLAN транка, и
      отправляет кадр дальше с оставшейся внутренней меткой VLAN жертвы. Остальные
      варианты - как раз меры защиты.

  - q: Как защититься от подмены коммутатора (switch spoofing)?
    options:
      - Включить на всех портах автоматическое согласование транка
      - Выключить протокол STP на пользовательских портах
      - Явно настроить порты доступа, запретив согласование транка
      - Сделать естественной VLAN ту, где работают пользователи
    answer: 2
    explain: >
      Атака использует автоматическое согласование транка (например, DTP у Cisco): если
      порт готов стать транком по просьбе соседа, устройство злоумышленника может
      представиться коммутатором. Порты доступа настраивают явно, согласование выключают.

open_questions:
  - q: Объясни, как кадр от компьютера в VLAN 10 доходит до другого компьютера VLAN 10, подключённого к другому коммутатору.
    reference: >
      Компьютер отправляет обычный кадр без метки. Порт доступа коммутатора относит его к
      VLAN 10. Коммутатор ищет получателя в своей таблице для VLAN 10 и, если тот за
      транком, отправляет кадр в транк с меткой 802.1Q: 0x8100 и номер VLAN 10 после
      адреса отправителя. Второй коммутатор по метке понимает, что кадр из VLAN 10,
      ищет получателя в таблице VLAN 10 и отправляет кадр на его порт доступа, сняв
      метку. Получатель видит обычный кадр. В другие VLAN кадр не попадает ни на одном
      этапе.
    key_points:
      - порт доступа относит кадр без метки к своей VLAN
      - на транке кадр идёт с меткой 802.1Q (0x8100, номер VLAN)
      - второй коммутатор по метке определяет VLAN
      - метка снимается перед отправкой получателю

  - q: Почему VLAN называют средством безопасности и почему этого недостаточно?
    reference: >
      VLAN изолирует группы узлов на канальном уровне: кадры, включая широковещательные,
      не выходят за пределы VLAN, и связь между VLAN идёт через маршрутизатор, где её
      можно фильтровать. Но изоляция держится на правильной настройке коммутаторов: при
      автоматическом согласовании транка на пользовательском порту или при естественной
      VLAN, совпадающей с VLAN пользователей, возможен VLAN hopping. Если маршрутизатор
      между VLAN пропускает всё, изоляция ничего не даёт. А внутри VLAN остаются все
      атаки на коммутатор: переполнение таблицы, подмена адресов, атаки на STP. Поэтому
      нужны правила между VLAN и шифрование.
    key_points:
      - изоляция на канальном уровне, связь только через маршрутизатор
      - зависит от настройки, иначе VLAN hopping
      - нужны правила фильтрации между VLAN
      - внутри VLAN атаки на коммутатор остаются, нужно шифрование

  - q: Опиши принцип атаки двойной меткой и меры защиты от неё.
    reference: >
      Злоумышленник находится в VLAN, совпадающей с естественной VLAN транка. Он
      отправляет кадр с двумя метками: внешняя - его VLAN, внутренняя - VLAN жертвы.
      Первый коммутатор снимает внешнюю метку, так как кадры естественной VLAN идут по
      транку без метки, и кадр уходит с внутренней меткой. Второй коммутатор принимает
      его как кадр VLAN жертвы и доставляет. Атака односторонняя: ответы не вернутся.
      Защита: сделать естественной отдельную неиспользуемую VLAN, помечать на транке и
      кадры естественной VLAN, не использовать VLAN 1 для пользователей, ограничить
      список VLAN на транках.
    key_points:
      - злоумышленник в естественной VLAN транка
      - две метки, первый коммутатор снимает внешнюю
      - атака односторонняя
      - отдельная естественная VLAN, метки для неё, списки VLAN на транках
