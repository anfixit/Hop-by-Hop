<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Метка 802.1Q: 4 байта между адресами и типом</text>

  <text x="40" y="115" font-size="18" fill="#475569">обычный кадр</text>
  <g font-size="17" text-anchor="middle" fill="#0E1830">
    <rect x="180" y="90" width="190" height="44" fill="#E2E8F0" stroke="#64748B"/><text x="275" y="118">получатель, 6</text>
    <rect x="370" y="90" width="190" height="44" fill="#E2E8F0" stroke="#64748B"/><text x="465" y="118">отправитель, 6</text>
    <rect x="560" y="90" width="140" height="44" fill="#CCFBF1" stroke="#0F766E"/><text x="630" y="118">EtherType, 2</text>
    <rect x="700" y="90" width="330" height="44" fill="#F8FAFC" stroke="#64748B"/><text x="865" y="118">данные, 46-1500</text>
    <rect x="1030" y="90" width="110" height="44" fill="#E2E8F0" stroke="#64748B"/><text x="1085" y="118">FCS, 4</text>
  </g>

  <text x="40" y="215" font-size="18" fill="#475569">с меткой VLAN</text>
  <g font-size="17" text-anchor="middle" fill="#0E1830">
    <rect x="180" y="190" width="190" height="44" fill="#E2E8F0" stroke="#64748B"/><text x="275" y="218">получатель, 6</text>
    <rect x="370" y="190" width="190" height="44" fill="#E2E8F0" stroke="#64748B"/><text x="465" y="218">отправитель, 6</text>
    <rect x="560" y="190" width="120" height="44" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="620" y="218">0x8100, 2</text>
    <rect x="680" y="190" width="100" height="44" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="730" y="218">TCI, 2</text>
    <rect x="780" y="190" width="140" height="44" fill="#CCFBF1" stroke="#0F766E"/><text x="850" y="218">EtherType, 2</text>
    <rect x="920" y="190" width="110" height="44" fill="#F8FAFC" stroke="#64748B"/><text x="975" y="218">данные</text>
    <rect x="1030" y="190" width="110" height="44" fill="#E2E8F0" stroke="#64748B"/><text x="1085" y="218">FCS, 4</text>
  </g>
  <text x="670" y="160" text-anchor="middle" font-size="16" fill="#B45309">метка VLAN, 4 байта: кадр до 1522 байт вместо 1518</text>
  <line x1="560" y1="170" x2="560" y2="186" stroke="#B45309" stroke-width="2"/>
  <line x1="780" y1="170" x2="780" y2="186" stroke="#B45309" stroke-width="2"/>
  <line x1="560" y1="170" x2="780" y2="170" stroke="#B45309" stroke-width="2"/>

  <!-- TCI -->
  <line x1="680" y1="234" x2="300" y2="330" stroke="#B45309" stroke-width="2"/>
  <line x1="780" y1="234" x2="1080" y2="330" stroke="#B45309" stroke-width="2"/>
  <g font-size="17" text-anchor="middle" fill="#0E1830">
    <rect x="300" y="330" width="220" height="60" fill="#FFEDD5" stroke="#B45309"/><text x="410" y="356">PCP, 3 бита</text><text x="410" y="378" font-size="14" fill="#475569">приоритет 0-7</text>
    <rect x="520" y="330" width="120" height="60" fill="#FFEDD5" stroke="#B45309"/><text x="580" y="356">DEI, 1</text><text x="580" y="378" font-size="14" fill="#475569">бывший CFI</text>
    <rect x="640" y="330" width="440" height="60" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="860" y="356">VID, 12 бит</text><text x="860" y="378" font-size="14" fill="#475569">номер VLAN: 1-4094 (0 и 4095 зарезервированы)</text>
  </g>

  <g font-size="17" fill="#0E1830">
    <text x="60" y="440">0x8100 стоит на месте EtherType: старая карта увидит "неизвестный тип", а не мусор.</text>
    <text x="60" y="468">Настоящий EtherType (IPv4, ARP...) сдвигается на 4 байта дальше.</text>
    <text x="60" y="496">Компьютеры обычно метки не видят: их ставит и снимает коммутатор.</text>
  </g>
</svg>
