id: 47
title: "tcpdump и Wireshark: читаем трафик"
status: published
summary: >
  Анализаторы протоколов: tcpdump, Wireshark и tshark, формат pcap, где анализатор
  видит трафик (неразборчивый режим, зеркалирование порта), основные ключи tcpdump,
  фильтры захвата BPF и как они работают в ядре, фильтры отображения Wireshark. На
  практике - ping в подробностях, программа фильтра, запись и разбор запроса HTTP с
  паролем и куки, тот же запрос по TLS. Безопасность: пассивный перехват и что видно
  в открытом и зашифрованном трафике.

quiz:
  - q: Где выполняется фильтр захвата tcpdump, например tcp port 443?
    options:
      - В tcpdump после копирования каждого пакета
      - В ядре до копирования пакета в tcpdump
      - В сетевой карте до записи в кольцо приёма
      - В Wireshark при открытии файла записи
    answer: 1
    explain: >
      tcpdump переводит фильтр в программу BPF и отдаёт её ядру. Ядро выполняет её
      для каждого пакета и копирует в tcpdump только подходящие, поэтому даже на
      нагруженной машине узкий фильтр обходится дёшево. Программу показывает
      tcpdump -d.

  - q: Чем фильтр отображения Wireshark отличается от фильтра захвата?
    options:
      - Работает только с IPv6
      - Решает, что попадёт в запись
      - Работает с разобранными полями
      - Выполняется в ядре до копирования
    answer: 2
    explain: >
      Фильтр захвата (BPF) решает, что вообще попадёт в запись, и выполняется в
      ядре. Фильтр отображения применяется к уже разобранным пакетам и знает поля
      протоколов: http.request, tls.handshake.type == 1 и т. п.

  - q: Ты запустил tcpdump на своём компьютере в сети на коммутаторе. Чьи кадры он увидит?
    options:
      - Свои, широковещательные и групповые
      - Все кадры всех компьютеров сети
      - Только кадры, идущие к шлюзу по умолчанию
      - Только широковещательные кадры
    answer: 0
    explain: >
      Коммутатор отправляет на порт кадры для этой машины, широковещательные и
      групповые; чужие кадры попадают туда лишь изредка, пока коммутатор не знает
      адрес получателя. Неразборчивый режим этого не меняет. Для диагностики чужого
      трафика настраивают зеркалирование порта.

  - q: 'В открытом HTTP-запросе есть заголовок "Authorization: Basic" и строка в base64. Что это значит?'
    options:
      - Пароль надёжно зашифрован ключом сервера
      - Это хеш пароля, его нельзя обратить
      - Это одноразовый код, он уже бесполезен
      - Пароль читается после раскодирования
    answer: 3
    explain: >
      base64 - кодировка, а не шифрование: в опыте одна команда base64 -d вернула
      student:lab-password-123. Поэтому Basic допустим только поверх TLS.

  - q: Что из этого наблюдатель на пути видит даже в соединении HTTPS?
    options:
      - Адрес страницы и куки
      - Имя сайта в SNI и размеры записей
      - Пароль и содержимое страницы целиком
      - Заголовки запроса HTTP
    answer: 1
    explain: >
      TLS шифрует всё содержимое HTTP: адрес страницы, заголовки, куки, тело. Но
      адреса и порты, имя сайта в расширении SNI сообщения Client Hello, размеры и
      время записей остаются видны (имя скрывает только расширение ECH). В опыте
      tshark показал SNI hbh.test.

  - q: tcpdump при выходе напечатал "120 packets dropped by kernel". Что это значит?
    options:
      - Копии, которые tcpdump не успел забрать
      - Файервол отбросил 120 пакетов
      - 120 пакетов не прошли фильтр захвата
      - Получатель не принял и отбросил 120 пакетов
    answer: 0
    explain: >
      Это пакеты, которые прошли фильтр, но tcpdump не успел их забрать, и ядро
      отбросило их копии: запись неполная. Сами пакеты при этом дошли куда
      следовало. Помогают узкий фильтр, меньший -s и запись в файл вместо печати.

  - q: Зачем при записи на сервере указывать небольшой -s, например -s 96?
    options:
      - Чтобы tcpdump работал без прав root
      - Чтобы ускорить передачу пакетов по сети
      - Чтобы tcpdump видел зашифрованный трафик
      - Чтобы не хранить лишнее содержимое
    answer: 3
    explain: >
      -s задаёт, сколько байт каждого пакета сохранять. Для разбора заголовков
      Ethernet, IP и TCP хватает примерно 100 байт: запись меньше, tcpdump
      успевает, и в файл попадает гораздо меньше содержимого (паролей, куки),
      которое пришлось бы охранять. Уже при -s 200 в опыте в запись попал бы
      заголовок с паролем.

  - q: Что главное защищает от пассивного перехвата в чужой сети Wi-Fi?
    options:
      - Скрытое имя сети (SSID)
      - Шифрование соединений приложений
      - Смена MAC-адреса своего устройства
      - Отключение неразборчивого режима
    answer: 1
    explain: >
      Перехват только читает трафик, поэтому защищает от него шифрование: HTTPS,
      SSH, почта с TLS, зашифрованный DNS, VPN своей организации. Скрытое имя сети
      и смена MAC от чтения трафика не спасают.

open_questions:
  - q: Как устроен фильтр захвата tcpdump и чем он отличается от фильтра отображения Wireshark?
    reference: >
      Фильтр захвата пишется на языке BPF: host, net, port, tcp, udp, связки and,
      or, not, проверки отдельных байтов заголовка. tcpdump переводит его в
      программу и отдаёт ядру, ядро выполняет её для каждого пакета до копирования и
      отдаёт tcpdump только подходящие - это дёшево и решает, что попадёт в запись.
      Фильтр отображения Wireshark применяется к уже захваченным и разобранным
      пакетам, знает поля всех протоколов (http.request, tls.handshake.type,
      tcp.analysis.retransmission), но работает в программе. Поэтому обычно пишут
      широкую запись с простым фильтром захвата и уточняют фильтром отображения.
    key_points:
      - BPF, программа в ядре до копирования
      - решает, что попадёт в запись
      - фильтр отображения работает с разобранными полями
      - широкий захват, узкий разбор

  - q: Что видит наблюдатель на пути в открытом HTTP и что - в HTTPS?
    reference: >
      В открытом HTTP видно всё: адреса и порты, адрес страницы, имя сайта в Host,
      заголовок Authorization (Basic - лишь base64, пароль читается сразу), куки
      сеанса, по которым можно выдать себя за пользователя, содержимое страниц. В
      HTTPS содержимое HTTP зашифровано целиком, но остаются метаданные: адреса и
      порты, имя сайта в SNI, размеры и время записей, а также запросы DNS, если они
      не зашифрованы.
    key_points:
      - HTTP - пароль, куки, адрес страницы, содержимое
      - Basic - кодировка, не шифр
      - HTTPS - адреса, порты, SNI, размеры, время
      - DNS без шифрования

  - q: Как защититься от пассивного перехвата и как безопасно обращаться со своими записями трафика?
    reference: >
      Шифровать всё: HTTPS с HSTS, SSH и SFTP вместо Telnet и FTP, почта с TLS,
      куки с флагом Secure; в чужих сетях пользоваться только
      зашифрованными соединениями, шифровать DNS, для рабочих ресурсов - VPN своей
      организации; ограничивать доступ к зеркалированию портов и к сетевому
      оборудованию. Свои записи pcap могут содержать пароли и куки: записывать
      только нужное (фильтр, -s под размер заголовков), хранить с ограниченным доступом,
      удалять после разбора и записывать только свои сети или с разрешения
      владельца.
    key_points:
      - шифрование всего трафика
      - флаги куки, чужие сети
      - доступ к зеркалированию
      - записи pcap как секрет
