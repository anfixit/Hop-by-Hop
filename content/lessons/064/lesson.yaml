id: 64
title: "Кэш и TTL; как устроен резолвинг в Linux"
status: published
summary: >
  Как работает кэш DNS: TTL и его убывание, почему изменения расходятся не сразу и
  как готовиться к переезду, отрицательное кэширование, кэши на разных уровнях.
  Как Linux превращает имя в адрес: getaddrinfo, nsswitch.conf, /etc/hosts,
  /etc/resolv.conf (nameserver, search, ndots, timeout, attempts) и
  systemd-resolved. На практике - убывающий TTL, старый адрес в кэше после
  изменения зоны, отрицательный кэш, домены поиска и ndots в журнале резолвера,
  /etc/hosts против dig. Безопасность: кто решает, куда ведёт имя.

quiz:
  - q: Почему TTL в ответе резолвера со временем уменьшается?
    options:
      - Авторитетный сервер постепенно снижает TTL записи
      - Резолвер отдаёт время, оставшееся записи в кэше
      - Каждый повторный запрос сокращает TTL вдвое
      - TTL показывает задержку сети до резолвера
    answer: 1
    explain: >
      Резолвер отсчитывает время жизни записи в кэше и сообщает остаток. В опыте
      TTL был 8, а через 3 секунды - 5.

  - q: Что нужно сделать заранее перед переездом сервера на новый адрес?
    options:
      - Удалить запись и сразу создать её заново
      - Увеличить TTL записи до целой недели
      - Отключить кэширование на своём сервере
      - Уменьшить TTL и дождаться конца старого
    answer: 3
    explain: >
      Пока у записи в кэшах не истёк TTL, клиенты получают старый адрес. Короткий
      TTL заранее сокращает это окно, после переезда его возвращают обратно.

  - q: Сколько резолвер помнит, что имени нет?
    options:
      - Меньшее из TTL записи SOA и её последнего поля
      - Всегда ровно 3600 секунд, независимо от зоны
      - Нисколько, отрицательные ответы не кэшируются
      - До перезапуска самого резолвера или ОС
    answer: 0
    explain: >
      Отрицательный ответ сопровождается SOA зоны, по ней резолвер и считает срок
      (RFC 2308). В опыте это было 30 секунд, и сервер зоны получил один вопрос.

  - q: Что произойдёт при ndots:1 и search corp.lab с коротким именем www?
    options:
      - Резолвер получит вопрос только об имени www
      - Сначала будет вопрос о www, потом о www.corp.lab
      - Сразу будет вопрос только о www.corp.lab
      - Имя без точек вообще не разрешается
    answer: 2
    explain: >
      Точек в имени меньше ndots, поэтому stub сначала дописывает домен поиска. А
      для www.dev (одна точка) сначала пробуется имя как есть.

  - q: Почему getent показал адрес из /etc/hosts, а dig - из DNS?
    options:
      - dig не читает /etc/hosts и nsswitch.conf
      - getent берёт адреса из кэша резолвера
      - dig всегда спрашивает корневой сервер
      - /etc/hosts читается только программами root
    answer: 0
    explain: >
      getent идёт через nsswitch.conf, где files стоит перед dns, как любая
      программа. dig спрашивает DNS-сервер напрямую.

  - q: Что обычно записано в /etc/resolv.conf в Ubuntu с systemd-resolved?
    options:
      - Адреса всех корневых серверов DNS
      - Список всех имён и адресов локальной сети
      - Адрес локальной заглушки systemd-resolved
      - Ключи для проверки подписей зон DNSSEC
    answer: 2
    explain: >
      Файл - ссылка на настройки systemd-resolved с адресом его заглушки:
      программы спрашивают её, а она
      кэширует ответы и ходит к серверам каждого интерфейса.

  - q: Зачем после инцидента с DNS очищать кэши?
    options:
      - Чтобы заметно ускорить работу самого резолвера
      - Чтобы сбросить счётчики всех прошлых запросов
      - Чтобы обновить подсказки корневых серверов
      - Чтобы испорченные записи не жили до конца TTL
    answer: 3
    explain: >
      Неверная запись, попавшая в кэш, раздаётся клиентам, пока не истечёт её
      TTL. Очистка кэша убирает её сразу.

  - q: Чем опасен адрес DNS-сервера, полученный по DHCP в чужой сети?
    options:
      - Он всегда работает медленнее своего
      - Он не умеет отвечать на запросы AAAA
      - Он решает, куда поведут ваши имена
      - Он не поддерживает домены поиска
    answer: 2
    explain: >
      Кто выдаёт вам резолвер, тот определяет ответы на ваши вопросы. В
      недоверенной сети лучше пользоваться зашифрованным путём к своему резолверу.

open_questions:
  - q: Объясни, почему изменение записи DNS становится видно не сразу, и как к этому готовиться.
    reference: >
      Резолверы и другие кэши (systemd-resolved, роутер, браузер) хранят запись до
      конца её TTL и всё это время отдают старое значение, сообщая оставшийся TTL.
      Отрицательные ответы тоже кэшируются, на меньшее из TTL записи SOA и её
      последнего поля. Поэтому перед изменением TTL заранее уменьшают, ждут
      истечения старого, меняют запись и потом возвращают TTL. Свои кэши можно
      очистить, чужие - нет.
    key_points:
      - кэш до конца TTL
      - несколько уровней кэшей
      - отрицательный кэш
      - уменьшить TTL заранее

  - q: Опиши, что происходит в Linux от вызова getaddrinfo до запроса к DNS-серверу.
    reference: >
      libc читает строку hosts в /etc/nsswitch.conf и опрашивает источники по
      порядку: обычно files (/etc/hosts), затем dns. Для dns stub читает
      /etc/resolv.conf: nameserver (до трёх), search, ndots, timeout и attempts. Если
      в имени меньше точек, чем ndots, сначала дописываются домены поиска, иначе
      сначала пробуется имя как есть. В Ubuntu nameserver часто 127.0.0.53 -
      заглушка systemd-resolved, которая кэширует и ходит к серверам интерфейсов.
    key_points:
      - nsswitch.conf и порядок источников
      - /etc/hosts раньше DNS
      - resolv.conf, search и ndots
      - systemd-resolved

  - q: Чем отличается проверка имени через dig и через getent и когда что использовать?
    reference: >
      dig спрашивает DNS-сервер напрямую и не учитывает /etc/hosts, nsswitch.conf
      и (без +search) домены поиска; он показывает, что отвечает DNS. getent идёт
      тем же путём, что программы, и показывает, что они получат. Расхождение
      указывает на /etc/hosts, домены поиска или локальный кэш.
    key_points:
      - dig напрямую к DNS
      - getent как программы
      - расхождение как подсказка
