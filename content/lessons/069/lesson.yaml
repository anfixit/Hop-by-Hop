id: 69
title: "Симметричные шифры: AES, ChaCha20, режимы, AEAD"
status: published
summary: >
  Блочные и потоковые симметричные шифры: DES и 3DES (устарели), AES, ChaCha20.
  Режимы ECB, CBC, CTR и почему шифрование без проверки целостности опасно;
  AEAD (AES-GCM, ChaCha20-Poly1305) и правило уникального nonce. На практике -
  одинаковые блоки в ECB, "картинка" в ECB и CTR, подмена суммы в CTR без
  проверки, отказ AEAD на изменённом бите и связанных данных, повтор nonce и
  скорость. Безопасность: почему режим ECB опасен.

quiz:
  - q: Что видно в шифртексте режима ECB?
    options:
      - Длина ключа и номер раунда
      - Ключ шифрования целиком и сразу
      - Повторы блоков открытого текста
      - Ничего, кроме случайных байтов
    answer: 2
    explain: >
      В ECB одинаковые блоки дают одинаковый шифртекст. В опыте восемь одинаковых
      блоков стали одним повторённым блоком, а надпись на "картинке" читалась.

  - q: Зачем в режиме CBC нужен случайный вектор инициализации?
    options:
      - Чтобы одинаковые тексты давали разный шифртекст
      - Чтобы сократить нужную длину ключа шифра
      - Чтобы обойтись без набивки последнего блока
      - Чтобы проверять целостность сообщения
    answer: 0
    explain: >
      Первый блок складывается с IV, каждый следующий - с предыдущим шифртекстом.
      Без случайного IV одинаковые начала сообщений давали бы одинаковый шифртекст.

  - q: Что произошло при изменении бита шифртекста в CTR без проверки целостности?
    options:
      - Расшифровка завершилась с ошибкой проверки
      - Весь текст превратился в мусор
      - Ничего, шифртекст защищён ключом
      - Изменился тот же бит открытого текста
    answer: 3
    explain: >
      CTR складывает данные с ключевым потоком по XOR, поэтому изменение бита
      шифртекста меняет тот же бит текста. В опыте 1000 превратилось в 9000 без
      единого признака подмены.

  - q: Что делает AEAD при изменении одного бита шифртекста?
    options:
      - Исправляет бит по контрольной сумме
      - Отказывает в расшифровке по тегу
      - Пропускает, если ключ верный
      - Расшифровывает с одной ошибкой
    answer: 1
    explain: >
      Тег вычисляется из ключа, nonce, шифртекста и связанных данных. В опыте AES-GCM
      и ChaCha20-Poly1305 ответили InvalidTag и не выдали данных.

  - q: Что такое связанные данные в AEAD?
    options:
      - Открытая часть, защищённая от изменения
      - Второй секретный ключ для проверки тега
      - Набивка последнего блока до целого размера
      - Зашифрованная копия заголовка пакета
    answer: 0
    explain: >
      Связанные данные (например, заголовок) не шифруются, но входят в тег: их
      изменение тоже даёт отказ, как в опыте с header и other.

  - q: Что будет при повторе nonce с тем же ключом в AES-GCM?
    options:
      - Шифрование станет медленнее вдвое
      - Сервер отклонит второе сообщение
      - Шифр автоматически сменит ключ
      - XOR шифртекстов раскроет XOR текстов
    answer: 3
    explain: >
      Ключевой поток повторяется, как у одноразового блокнота, использованного
      дважды; в GCM ещё и становится возможной подделка. В опыте по первому
      сообщению прочиталось второе.

  - q: Почему в TLS 1.3 предлагаются и AES-GCM, и ChaCha20-Poly1305?
    options:
      - ChaCha20 нужен только для IPv6
      - Без аппаратного AES ChaCha20 быстрее
      - AES-GCM запрещён в части стран
      - Один шифрует, другой расшифровывает
    answer: 1
    explain: >
      С аппаратными инструкциями AES очень быстр (в опыте больше 3 ГБ/с), а на
      процессорах без них ChaCha20 обычно быстрее и проще реализуется безопасно.

  - q: Какой шифр выведен из употребления?
    options:
      - AES-256
      - ChaCha20
      - 3DES
      - AES-128
    answer: 2
    explain: >
      3DES медленный и имеет блок 64 бита; он выведен из употребления и не входит
      в TLS 1.3, как DES и RC4.

open_questions:
  - q: Сравни режимы ECB, CBC и CTR.
    reference: >
      ECB шифрует каждый блок отдельно: одинаковые блоки дают одинаковый
      шифртекст, видны повторы, блоки можно переставлять. CBC складывает блок с
      предыдущим шифртекстом, первый - со случайным IV; повторы скрыты, нужна
      набивка. CTR шифрует счётчик и складывает результат с данными по XOR, делая
      шифр потоковым; nonce нельзя повторять. Ни один из них не защищает
      целостность.
    key_points:
      - ECB раскрывает повторы
      - CBC и случайный IV
      - CTR - потоковый, уникальный nonce
      - нет целостности

  - q: Что такое AEAD и почему современные протоколы используют только его?
    reference: >
      AEAD шифрует данные и вычисляет тег по ключу, nonce, шифртексту и связанным
      данным; любое изменение даёт отказ в расшифровке. Шифрование без проверки
      позволяет менять данные незаметно (CTR) или строить атаки по сообщениям об
      ошибках (padding oracle в CBC). Поэтому в TLS 1.3 только AES-GCM,
      ChaCha20-Poly1305 и AES-CCM. Условие - уникальный nonce для каждого ключа.
    key_points:
      - шифрование и тег вместе
      - связанные данные
      - подмена и padding oracle без AEAD
      - уникальный nonce

  - q: Почему режим ECB опасен и как правильно шифровать данные?
    reference: >
      ECB превращает блочный шифр в замену блоков: повторы и структура данных
      видны (картинка остаётся читаемой), блоки можно копировать и переставлять,
      не зная ключа. Правильно - использовать AEAD (AES-GCM, ChaCha20-Poly1305)
      через высокоуровневые интерфейсы библиотек, никогда не повторять nonce с тем
      же ключом и не использовать устаревшие шифры.
    key_points:
      - повторы и структура видны
      - перестановка блоков
      - AEAD из библиотеки
      - уникальный nonce
