id: 78
title: "Рукопожатие TLS 1.2"
status: published
summary: >
  Задачи рукопожатия и его сообщения по порядку: ClientHello, ServerHello,
  Certificate, ServerKeyExchange, ServerHelloDone, ClientKeyExchange,
  ChangeCipherSpec, Finished. Откуда берутся ключи (главный секрет, extended
  master secret), чем обмен через RSA хуже ECDHE. На практике - рукопожатие в
  выводе openssl s_client -trace с ECDHE и с RSA, согласованные параметры,
  журнал ключей и сертификат в открытом трафике. Безопасность: что защищает
  рукопожатие и что его ослабляет.

quiz:
  - q: Какое сообщение доказывает, что сервер владеет ключом сертификата при ECDHE?
    options:
      - ServerHello со случайным числом
      - Certificate с цепочкой
      - ServerKeyExchange с подписью
      - ServerHelloDone в конце
    answer: 2
    explain: >
      Сервер подписывает временный ключ ECDHE и оба случайных числа закрытым
      ключом сертификата. Сам сертификат публичен, его может переслать кто угодно.

  - q: Какого сообщения нет при обмене ключами через RSA?
    options:
      - ServerKeyExchange
      - ClientKeyExchange
      - Certificate
      - Finished
    answer: 0
    explain: >
      Временного ключа нет, подписывать нечего. Клиент шифрует pre-master secret
      ключом из сертификата и отправляет его в ClientKeyExchange.

  - q: Зачем нужно сообщение Finished?
    options:
      - Оно закрывает TCP-соединение
      - Подтверждает, что рукопожатие не подменено
      - Передаёт серверу сертификат клиента и цепочку
      - Сообщает серверу выбранный набор шифров
    answer: 1
    explain: >
      Finished вычисляется из главного секрета и хеша всех сообщений рукопожатия.
      Если посредник что-то изменил или ключи разные, проверка не сойдётся.

  - q: Сколько кругов передачи занимает полное рукопожатие TLS 1.2 до данных?
    options:
      - Ни одного
      - Один
      - Три
      - Два
    answer: 3
    explain: >
      Первый круг - ClientHello и ответ сервера до ServerHelloDone, второй -
      ClientKeyExchange, ChangeCipherSpec, Finished и ответные сообщения сервера.

  - q: Чем опасен обмен через RSA, если ключ сервера утечёт позже?
    options:
      - Ничем, старые сессии всё равно останутся закрыты
      - Сервер перестанет принимать соединения
      - Можно расшифровать записанный ранее трафик
      - Сертификат сразу будет отозван
    answer: 2
    explain: >
      Pre-master secret шифровался ключом сервера, значит, из записи трафика его
      можно восстановить. С ECDHE временные ключи забыты, это прямая секретность.

  - q: Что содержит строка CLIENT_RANDOM в журнале ключей?
    options:
      - Закрытый ключ сертификата сервера
      - Случайное число клиента и главный секрет
      - Пароль пользователя, введённый в форму на сайте
      - Список наборов шифров клиента
    answer: 1
    explain: >
      По client_random находят соединение, а главный секрет (48 байт) позволяет
      расшифровать его трафик. Поэтому журнал ключей - секрет.

  - q: Что даёт расширение extended master secret?
    options:
      - Привязывает секрет к хешу рукопожатия
      - Удлиняет главный секрет до 96 байт
      - Шифрует сертификат сервера даже в TLS 1.2
      - Отключает обмен ключами через RSA
    answer: 0
    explain: >
      По RFC 7627 в главный секрет вместо отдельных случайных чисел входит хеш
      сообщений рукопожатия от ClientHello до ClientKeyExchange включительно. Разные соединения не сведутся к одному секрету.

  - q: Почему в опыте имя из сертификата нашлось в трафике TLS 1.2?
    options:
      - Клиент отправил его в SNI
      - Его записал журнал ключей
      - Сервер повторил его в сообщении Finished
      - Сертификат в TLS 1.2 идёт открыто
    answer: 3
    explain: >
      Клиент подключался без SNI. Всё до ChangeCipherSpec, включая сертификат,
      в TLS 1.2 не шифруется; в TLS 1.3 сертификат зашифрован.

open_questions:
  - q: Перечисли сообщения полного рукопожатия TLS 1.2 с ECDHE и роль каждого.
    reference: >
      ClientHello (версии, client_random, наборы, расширения), ServerHello (выбор,
      server_random), Certificate (цепочка), ServerKeyExchange (временный ключ
      ECDHE, подписанный ключом сертификата), ServerHelloDone, ClientKeyExchange
      (ключ ECDHE клиента), ChangeCipherSpec и Finished клиента, затем
      ChangeCipherSpec и Finished сервера. Finished подтверждает, что рукопожатие
      не подменено. Два круга до данных.
    key_points:
      - порядок сообщений
      - подпись в ServerKeyExchange
      - Finished
      - два круга

  - q: Как получаются ключи шифрования в TLS 1.2?
    reference: >
      Из общего секрета (pre-master secret) ECDHE или присланного клиентом через
      RSA получается главный секрет в 48 байт: с участием client_random и
      server_random или хеша рукопожатия (extended master secret). Из главного
      секрета PRF на основе HMAC выводит блок ключей: отдельные ключи и части nonce
      для каждого направления.
    key_points:
      - pre-master secret
      - главный секрет 48 байт
      - extended master secret
      - ключи по направлениям

  - q: Почему обмен ключами через RSA считают устаревшим?
    reference: >
      Pre-master secret шифруется долговременным ключом сервера. Кто записал
      трафик и позже получил ключ, расшифрует все прошлые сессии. В ECDHE
      временные ключи живут одно рукопожатие, утечка ключа сертификата прошлое не
      раскрывает - это прямая секретность. В TLS 1.3 обмен через RSA убран.
    key_points:
      - долговременный ключ
      - записанный трафик
      - прямая секретность
      - удалён в TLS 1.3
