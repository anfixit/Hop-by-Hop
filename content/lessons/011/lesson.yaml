id: 11
title: "Обнаружение и исправление ошибок, CRC"
status: published
summary: >
  Как получатель узнаёт, что кадр испорчен, и как иногда чинит его сам. Обнаружение и
  исправление ошибок, расстояние Хэмминга, бит чётности, коды Хэмминга, Рида - Соломона
  и LDPC, контрольная сумма интернета и CRC-32 в Ethernet. На практике подделываем
  сообщение так, что CRC ничего не замечает, - и разбираем одну из дыр WEP.

quiz:
  - q: Когда выгоднее исправлять ошибки на месте (FEC), а не переспрашивать испорченный кадр?
    options:
      - В надёжной оптической линии, где ошибки очень редки
      - В шумной линии, где повтор испортится так же часто
      - Когда кадры очень короткие и их легко переслать ещё раз
      - "Никогда: повторная передача всегда обходится дешевле"
    answer: 1
    explain: >
      В шумной, например беспроводной, линии повторная передача испортится с той же
      вероятностью, поэтому выгоднее добавить избыточность и чинить на месте. В надёжной
      линии ошибки редки, и дешевле обнаружить и переспросить.

  - q: Расстояние Хэмминга кода равно 3. Что он умеет?
    options:
      - Обнаруживать 3 ошибки и исправлять 3
      - Обнаруживать 1 ошибку и не исправлять ни одной
      - Обнаруживать 3 ошибки и исправлять 2
      - Обнаруживать 2 ошибки или исправлять 1
    answer: 3
    explain: >
      Код с расстоянием d обнаруживает d - 1 ошибок и исправляет (d - 1) / 2. При d = 3
      это обнаружение двух ошибок или исправление одной. Так устроен код Хэмминга.

  - q: К данным добавлен один бит чётности. Какую ошибку он пропустит?
    options:
      - Любую одиночную ошибку в битах данных
      - Две ошибки в разных битах одного блока
      - Ошибку, случившуюся в самом бите чётности
      - Любую ошибку в нечётном числе битов блока
    answer: 1
    explain: >
      Две ошибки возвращают чётность на место, и получатель ничего не заметит. Одиночную
      ошибку, в том числе в самом бите чётности, и любое нечётное число ошибок бит
      чётности обнаружит.

  - q: Почему коды Рида - Соломона хорошо справляются с пачками ошибок?
    options:
      - Испорченный байт для них считается одной ошибкой
      - Они передают каждый бит по три раза подряд
      - Они шифруют данные, и помеха не может их испортить
      - Они сами просят отправителя повторить испорченный кадр
    answer: 0
    explain: >
      Рид - Соломон работает с символами, обычно байтами. Сколько бы бит ни испортилось
      внутри одного байта, это одна символьная ошибка. Поэтому код любят там, где помехи
      бьют пачками: в DSL, спутниках, на дисках с царапинами.

  - q: Чем интернет-контрольная сумма (IPv4, TCP, UDP) слабее CRC?
    options:
      - Она длиннее CRC и поэтому считается медленнее
      - Её нельзя вычислить программно, только аппаратно
      - Она зависит от порядка слов и поэтому ложно срабатывает
      - Она не замечает, если 16-битные слова переставить
    answer: 3
    explain: >
      Сумма не зависит от порядка слагаемых, поэтому переставленные слова дают ту же
      сумму. CRC учитывает позицию каждого бита и такую ошибку заметит. Зато простую
      сумму легко считать программно.

  - q: Что делает сетевая карта Ethernet, если CRC принятого кадра не сошёлся?
    options:
      - Исправляет испорченные биты с помощью CRC
      - Просит отправителя повторить этот кадр
      - Выбрасывает кадр, растёт счётчик ошибок
      - Передаёт кадр системе с пометкой "испорчен"
    answer: 2
    explain: >
      На уровне кадра Ethernet ошибки только обнаруживает. Кадр молча выбрасывается,
      растёт счётчик ошибок приёма. Повторной передачей, если она нужна, займётся
      протокол выше, например TCP.

  - q: Какие ошибки CRC-32 гарантированно обнаруживает?
    options:
      - Любые ошибки в кадре без исключения
      - Всякую пачку ошибок длиной до 32 бит
      - Любые ошибки в нечётном числе битов
      - Любые ошибки, если кадр короче 1500 байт
    answer: 1
    explain: >
      CRC-32 ловит все одиночные, двойные и тройные ошибки и все пачки до 32 бит, а более
      длинные пропускает с очень малой вероятностью. Гарантии "любых ошибок" не даёт ни
      одна схема, даже для коротких кадров. А все нечётные ошибки ловят только CRC с
      делителем особого вида, и стандартный CRC-32 к ним не относится.

  - q: Атакующий меняет биты в сообщении, которое не может прочитать. Почему CRC это не спасает?
    options:
      - CRC слишком короткий, и его легко угадать перебором
      - CRC линеен, и поправку считают по маске изменений
      - CRC проверяется только у первого кадра соединения
      - CRC считают по заголовку, а данные не проверяются
    answer: 1
    explain: >
      Изменение CRC зависит только от того, какие биты перевернули, а не от самого
      сообщения. Атакующий вычисляет поправку из своей маски изменений и получает верный
      CRC для подделки. Это одна из дыр WEP.

  - q: Что защищает сообщение от намеренной подмены?
    options:
      - CRC-64 вместо CRC-32 для всего сообщения
      - Два CRC, посчитанные разными делителями
      - Код аутентификации (MAC) с секретным ключом
      - Бит чётности на каждый байт сообщения
    answer: 2
    explain: >
      Любой CRC и любую контрольную сумму можно пересчитать: алгоритм открыт. MAC зависит
      от секретного ключа, и без ключа атакующий не вычислит правильный код для
      изменённого сообщения.

open_questions:
  - q: Объясни, чем обнаружение ошибок отличается от исправления, и где какой подход выгоднее. Как с этим связано расстояние Хэмминга?
    reference: >
      Оба подхода добавляют к данным избыточные биты. При обнаружении получатель только
      узнаёт, что данные испорчены, и выбрасывает их, а повторной передачей занимается
      кто-то ещё; лишних битов нужно мало. При исправлении (FEC) избыточности больше, и
      получатель сам вычисляет и чинит испорченные биты без повторной передачи. В
      надёжных линиях выгоднее обнаруживать и переспрашивать, в шумных беспроводных -
      исправлять, потому что повтор испортится так же. Код с расстоянием Хэмминга d
      обнаруживает до d - 1 ошибок и исправляет до (d - 1) / 2: чтобы исправлять, нужно
      большее расстояние, то есть больше избыточных битов.
    key_points:
      - обнаружение - мало лишних битов, испорченное выбрасывают и переспрашивают
      - исправление (FEC) - больше лишних битов, чинят на месте
      - надёжные линии - обнаружение, шумные - исправление
      - расстояние d - обнаружение d - 1, исправление (d - 1) / 2

  - q: Почему CRC-32 в Ethernet защищает от помех, но не защищает от злоумышленника? Что нужно вместо него?
    reference: >
      CRC хорошо ловит случайные ошибки: одиночные, двойные, тройные и пачки до 32 бит.
      Но алгоритм открыт и не использует секретов, поэтому злоумышленник, изменивший кадр,
      просто пересчитает CRC. Более того, CRC линеен относительно XOR: изменение CRC
      зависит только от маски перевёрнутых битов, поэтому его можно поправить, даже не
      зная содержимого. Это одна из дыр WEP, где кадр вместе с CRC шифровался потоковым
      шифром. От намеренной подмены защищает код аутентификации сообщения (MAC, например
      HMAC) с секретным ключом или шифрование с проверкой целостности (AEAD).
    key_points:
      - CRC ловит случайные ошибки, но алгоритм открыт и без секрета
      - злоумышленник пересчитает CRC или поправит его по маске изменений (линейность)
      - пример - WEP
      - нужна криптографическая проверка с ключом - MAC/HMAC или AEAD

  - q: В счётчике RX errors на интерфейсе растут ошибки. Что это значит с точки зрения CRC и что будет с данными?
    reference: >
      Сетевая карта проверяет CRC (поле FCS) каждого принятого кадра. Если CRC не сошёлся,
      кадр испорчен помехами или плохим кабелем; карта его выбрасывает и увеличивает
      счётчик ошибок приёма. Сам Ethernet такой кадр не исправляет и не переспрашивает:
      данные пропадают, и если поверх работает TCP, он заметит потерю и передаст данные
      заново, а UDP-приложение просто недополучит их. Растущий счётчик - повод проверить
      кабель, разъёмы и источники помех.
    key_points:
      - карта проверяет CRC каждого кадра и выбрасывает испорченные
      - кадр с несошедшимся CRC Ethernet не исправляет и не повторяет
      - потерю восполняет TCP, UDP теряет данные
      - причина обычно в кабеле, разъёмах, помехах
