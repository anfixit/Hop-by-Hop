id: 65
title: "Атаки на DNS: спуфинг, отравление кэша, атака Каминского, усиление"
status: published
summary: >
  Какие слабости DNS следуют из того, что исходный протокол не проверяет
  подлинность ответов: подмена ответа и отравление кэша резолвера, идея атаки
  Каминского, атаки на доступность и отражение с усилением, домены-двойники и
  гомографы IDN. Главное - защита: случайные ID и порт, 0x20, cookies, закрытая
  рекурсия, ограничение частоты ответов, BCP 38, punycode и правила браузеров. На
  практике - случайные ID и порты резолвера, cookies, rate-limit в BIND и
  преобразование имён в xn--.

quiz:
  - q: Почему отравление кэша резолвера опаснее подмены ответа одному клиенту?
    options:
      - Ложная запись раздаётся всем клиентам до конца TTL
      - Резолвер после этого перестаёт отвечать совсем
      - Кэш резолвера невозможно очистить никаким способом
      - Отравленный резолвер начинает рассылать спам
    answer: 0
    explain: >
      Резолвер общий для многих клиентов: запись, попавшая в его кэш, достаётся
      каждому, кто спросит, пока не истечёт TTL.

  - q: Что изменила атака Каминского по сравнению с обычной подменой?
    options:
      - Она требовала доступа к авторитетному серверу
      - Она сняла предел попыток и целилась во всю зону
      - Она работала только по протоколу TCP, порт 53
      - Она меняла записи прямо в файле зоны сервера
    answer: 1
    explain: >
      Вопросы о всё новых несуществующих именах обходят кэш, поэтому попыток
      неограниченно много, а подменяется направление - власть над всей зоной.

  - q: Что стало главной срочной защитой резолверов в 2008 году?
    options:
      - Переход всех запросов на протокол TCP, порт 53
      - Шифрование всех запросов между резолверами
      - Случайный порт источника для каждого запроса
      - Запрет на запросы о несуществующих именах
    answer: 2
    explain: >
      Угадывать теперь нужно и ID, и порт - вместе около 32 бит. В опыте у каждого
      из пяти запросов резолвера были свои порт и ID.

  - q: Что даёт cookie в ответе DNS?
    options:
      - Шифрует ответ секретным ключом клиента
      - Подписывает ответ ключом зоны DNSSEC
      - Передаёт ответ по каналу TLS 1.3
      - Позволяет сразу отличить слепую подделку
    answer: 3
    explain: >
      Клиент выбирает случайное значение, сервер вычисляет своё; ответ без нужного cookie
      отбрасывается. Подписи это не заменяет, но слепую подмену отсекает.

  - q: Как устроено отражение с усилением через DNS?
    options:
      - Резолвер пересылает запрос всем корневым серверам
      - Маленький запрос от имени жертвы - большой ответ ей
      - Сервер отвечает жертве на каждый её собственный запрос
      - Атакующий подменяет записи в зоне самой жертвы
    answer: 1
    explain: >
      Ответ уходит на подделанный адрес отправителя - адрес жертвы - и бывает в
      десятки раз больше запроса. Защита - закрытая рекурсия, ограничение частоты
      ответов и фильтрация поддельных адресов (BCP 38).

  - q: Что сервер с rate-limit сделал с запросами сверх лимита в опыте?
    options:
      - Ответил на все запросы, но заметно медленнее
      - Заблокировал адрес клиента навсегда
      - Часть отбросил, на часть ответил с TC
      - Перенаправил их на другой авторитетный сервер
    answer: 2
    explain: >
      5 запросов получили полный ответ, примерно половина остальных - короткий с
      флагом TC, остальные - ничего. Короткий ответ не даёт усиления, а настоящий
      клиент повторит запрос по TCP.

  - q: Почему ограничение частоты не мешает настоящему клиенту?
    options:
      - Получив TC, он повторит запрос уже по TCP
      - Сервер узнаёт настоящих клиентов по ID запроса
      - Лимит действует только для запросов ANY
      - Лимит сбрасывается после каждого ответа
    answer: 0
    explain: >
      Ограничение действует на UDP, где адрес отправителя можно подделать. По TCP
      нужно установить соединение, и ответ в опыте пришёл сразу.

  - q: Что видно в DNS вместо имени с кириллическими буквами?
    options:
      - То же имя в кодировке UTF-8
      - Имя, записанное транслитом латиницей
      - Ошибка, такие имена запрещены
      - Имя в punycode с префиксом xn--
    answer: 3
    explain: >
      Имена хостов в DNS - латиница, цифры и дефис; имя на другом алфавите кодируется
      в punycode. Похожее на example.com имя с кириллицей - другой домен xn--...

open_questions:
  - q: Почему в исходном DNS можно подменить ответ и что мешает этому сегодня?
    reference: >
      Ответ идёт по UDP без проверки отправителя, и клиент принимает первый
      совпавший ответ - с тем же ID, портом и вопросом. Раньше угадывать нужно было
      только 16-битный ID. Сегодня порт источника случаен (вместе около 32 бит),
      добавляются 0x20 и cookies, резолвер не верит записям о чужих зонах. По
      существу проблему решает DNSSEC: подписанный ответ нельзя подделать без ключа зоны, и проверяющий резолвер подделку отбросит.
    key_points:
      - UDP без проверки отправителя
      - ID и случайный порт
      - 0x20, cookies, проверка зоны
      - DNSSEC

  - q: Как защищаются от отражения с усилением через DNS?
    reference: >
      Владельцы резолверов закрывают рекурсию от посторонних. Авторитетные серверы
      ограничивают частоту ответов: сверх лимита часть отбрасывается, часть
      заменяется короткими ответами с TC, после чего настоящий клиент переходит на
      TCP. На ANY отвечают минимально. Провайдеры фильтруют исходящие пакеты с
      чужими адресами отправителя (BCP 38), из таких сетей подделать адрес отправителя нельзя.
    key_points:
      - закрытая рекурсия
      - ограничение частоты и TC
      - минимальный ANY
      - BCP 38

  - q: Что такое домены-двойники и гомографы IDN и как от них защищаться?
    reference: >
      Это имена, похожие на настоящие: опечатки, другой TLD, лишние слова, а у IDN -
      буквы другого алфавита, неотличимые на экране. В DNS гомограф - другой домен
      xn--. Браузеры показывают имя в punycode при смешении алфавитов, регистратуры
      ограничивают символы. Пользователям помогают менеджеры паролей и закладки,
      владельцам брендов - наблюдение за регистрациями и журналами сертификатов.
    key_points:
      - похожие имена
      - punycode и xn--
      - правила браузеров и регистратур
      - менеджер паролей, наблюдение
