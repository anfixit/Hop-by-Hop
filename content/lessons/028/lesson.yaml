id: 28
title: "ICMP: ping, traceroute и служебные сообщения IP"
status: published
summary: >
  Как сеть сообщает об ошибках: протокол ICMP, его формат, типы и коды, почему в
  сообщение об ошибке кладут начало исходного пакета. Как работают ping и traceroute и
  как читать их вывод. На практике - цепочка из двух маршрутизаторов: эхо, "время
  истекло", "порт недоступен" и "сеть недоступна" в tcpdump. Как ICMP используют
  во вред (принципы) и как правильно настроить его пропуск: что обязательно
  пропускать, что ограничивать.

quiz:
  - q: Что делает ICMP, если маршрутизатор не может доставить пакет?
    options:
      - Отправляет пакет заново через другой маршрутизатор
      - Сообщает отправителю о проблеме, не исправляя её
      - Хранит копию пакета до подтверждения получателем
      - Ничего, ICMP используется только утилитой ping
    answer: 1
    explain: >
      ICMP - средство оповещения. Повторной отправкой занимаются TCP или приложение, а
      ICMP лишь сообщает отправителю, что с пакетом что-то случилось.

  - q: Какие поля есть в заголовке любого сообщения ICMP?
    options:
      - Порт отправителя, порт получателя, длина
      - Адрес отправителя, адрес получателя, TTL
      - Номер последовательности, окно и флаги
      - Тип сообщения, код и контрольная сумма
    answer: 3
    explain: >
      Заголовок ICMP - 8 байт: тип, код, контрольная сумма и 4 байта, смысл которых
      зависит от типа. Адреса и TTL - в заголовке IP, в котором едет сообщение.

  - q: Зачем в сообщение ICMP об ошибке кладут заголовок IP и первые 8 байт исходного пакета?
    options:
      - Чтобы понять, к какому соединению относится ошибка
      - Чтобы маршрутизатор смог отправить пакет заново
      - Чтобы получатель потом собрал пакет из фрагментов
      - Чтобы зашифровать это сообщение ключом из пакета
    answer: 0
    explain: >
      В первых 8 байтах лежат порты TCP или UDP. По ним отправитель узнаёт, какой
      программе принадлежал пакет, и может сообщить ей об ошибке.

  - q: Как traceroute узнаёт адрес очередного маршрутизатора на пути?
    options:
      - Получает ICMP Redirect с его адресом
      - Маршрутизатор пишет адрес в опции IP
      - Получает от него ICMP "время истекло"
      - Узнаёт у DNS список маршрутизаторов
    answer: 2
    explain: >
      traceroute отправляет пакеты с TTL 1, 2, 3 и так далее. Каждый маршрутизатор, у
      которого TTL дошёл до нуля, присылает ICMP "время истекло", и адрес берётся из
      поля "адрес отправителя" в заголовке IP-пакета, в котором пришло это сообщение.

  - q: Как traceroute в Linux понимает, что дошёл до цели?
    options:
      - Цель шлёт ICMP "порт недоступен"
      - Цель присылает ICMP "время истекло"
      - Маршрутизаторы перестают отвечать
      - TTL пробы становится равным нулю
    answer: 0
    explain: >
      Классический traceroute шлёт UDP на заведомо закрытый порт. Маршрутизаторы на пути
      отвечают "время истекло", а сама цель - "порт недоступен", как в опыте.

  - q: Что показывает время в строке traceroute?
    options:
      - Задержку между этим и предыдущим узлом
      - Путь туда и обратно до этого маршрутизатора
      - Время обработки пакета внутри маршрутизатора
      - Сколько секунд осталось до конца трассировки
    answer: 1
    explain: >
      Это время от отправки пробы до получения ответа, то есть путь туда и обратно до
      этого маршрутизатора. Поэтому оно не обязано расти от строки к строке.

  - q: Почему нельзя запрещать ICMP на межсетевом экране целиком?
    options:
      - Без ICMP перестанет работать ARP в локальной сети
      - Без ICMP маршрутизаторы не смогут уменьшать TTL
      - Без ICMP ломается поиск MTU пути и отладка
      - Без ICMP нельзя получить адрес по DHCP
    answer: 2
    explain: >
      Без сообщений "нужна фрагментация" не работает Path MTU Discovery, появляются
      чёрные дыры, а без "время истекло" и "адресат недоступен" трудно разбираться с
      проблемами сети.

  - q: Зачем на серверах выключают приём ICMP Redirect?
    options:
      - Чтобы ускорить ответы на ping
      - Чтобы подсказки не меняли маршруты
      - Чтобы сэкономить память ядра
      - Чтобы включить фрагментацию пакетов
    answer: 1
    explain: >
      Redirect меняет маршруты узла. На серверах и маршрутизаторах маршруты должны
      задавать администратор и протоколы маршрутизации, поэтому приём таких подсказок
      выключают (accept_redirects = 0).

open_questions:
  - q: Что такое ICMP, как устроено его сообщение и какие типы сообщений самые важные?
    reference: >
      ICMP - служебный протокол IP для сообщений об ошибках и проверок. Он ничего не
      исправляет, а только сообщает отправителю о проблемах с пакетом. Сообщения едут
      внутри IP-пакетов с Protocol = 1. Заголовок - тип, код, контрольная сумма и 4
      байта по типу. Важные типы: эхо-запрос и эхо-ответ (8 и 0), адресат недоступен
      (3, с кодами сеть, узел, порт, нужна фрагментация), время истекло (11), Redirect
      (5), проблема с параметрами (12). В сообщение об ошибке кладут заголовок IP и
      как минимум первые 8 байт данных исходного пакета.
    key_points:
      - сообщает об ошибках, ничего не исправляет
      - внутри IP, Protocol = 1
      - тип, код, контрольная сумма
      - типы 8/0, 3, 11, 5, начало исходного пакета в ошибке

  - q: Объясни, как работает traceroute и как читать его вывод.
    reference: >
      traceroute отправляет пакеты к цели с TTL 1, 2, 3 и так далее. Маршрутизатор, у
      которого TTL дошёл до нуля, уничтожает пакет и присылает ICMP "время истекло";
      его адрес - это адрес отправителя IP-пакета с этим сообщением. Так строка за строкой находятся все
      маршрутизаторы пути. Цель отвечает иначе: на UDP в закрытый порт - "порт
      недоступен" (в Windows tracert получает эхо-ответ). Время в строке - путь туда и
      обратно до этого узла, поэтому оно может не расти. Звёздочка значит, что ответ не
      пришёл вовремя.
    key_points:
      - TTL 1, 2, 3 и сообщения "время истекло"
      - адрес отправителя IP-пакета с ICMP-сообщением
      - цель отвечает "порт недоступен" или эхо-ответом
      - время - туда и обратно, звёздочка - нет ответа

  - q: Как правильно настроить пропуск ICMP на сервере и межсетевом экране?
    reference: >
      Запрещать ICMP целиком нельзя. Нужно пропускать "адресат недоступен", особенно
      "нужна фрагментация", иначе ломается Path MTU Discovery, а также "время истекло" и
      "проблема с параметрами" как ответы на свой трафик. Эхо-запросы разрешают по
      решению администратора. Не отвечать на эхо на широковещательный адрес, ограничивать
      частоту сообщений (icmp_ratelimit), не принимать Redirect на серверах и
      маршрутизаторах и не отправлять их там, где это не нужно, следить за необычным
      ростом ICMP.
    key_points:
      - не запрещать целиком
      - пропускать нужные ошибки как ответы на свой трафик
      - эхо по решению, не отвечать на широковещательные запросы
      - ограничение частоты, без Redirect, наблюдение
