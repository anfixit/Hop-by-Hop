id: 43
title: "QUIC: транспорт поверх UDP"
status: published
summary: >
  Что не устраивало в TCP - долгое начало, блокировка начала очереди, привязка к
  адресам, окостенение - и как это решает QUIC: транспорт поверх UDP с собственной
  надёжностью, потоками, идентификатором соединения и встроенным TLS 1.3. Рукопожатие
  за один оборот и 0-RTT, защита от усиления, HTTP/3 и запасной путь через TCP. На
  практике - время до первого ответа у TCP с TLS и у QUIC, пакеты QUIC в tcpdump и
  первый пакет глазами наблюдателя. Что видит и чего не видит наблюдатель в QUIC.

quiz:
  - q: Поверх какого протокола работает QUIC?
    options:
      - Поверх TCP, как и TLS
      - Прямо поверх IP, со своим номером протокола
      - Поверх UDP, со своей надёжностью
      - Поверх ICMP
    answer: 2
    explain: >
      QUIC едет в дейтаграммах UDP: их пропускают почти все сети, тогда как новый
      протокол со своим номером в заголовке IP многие устройства отбросили бы.
      Надёжность, порядок и контроль перегрузки QUIC обеспечивает сам.

  - q: Что такое блокировка начала очереди в HTTP/2 поверх TCP?
    options:
      - Потеря сегмента задерживает и другие запросы
      - Сервер отвечает на запросы строго по одному
      - Браузер не открывает больше шести соединений
      - Первый запрос всегда ждёт рукопожатия TLS
    answer: 0
    explain: >
      TCP доставляет байты строго по порядку, поэтому потерянный сегмент задерживает
      всё, что идёт за ним, хотя это данные других, независимых запросов. В QUIC порядок
      соблюдается только внутри потока, и ждёт только тот поток, чьи данные потерялись.

  - q: Телефон перешёл с Wi-Fi на мобильную сеть, его адрес изменился. Почему соединение QUIC может продолжиться?
    options:
      - QUIC заново выполняет рукопожатие TCP
      - Сервер запоминает номер телефона клиента
      - Адрес клиента в QUIC зашифрован
      - Соединение определяется идентификатором
    answer: 3
    explain: >
      Соединение TCP определяется адресами и портами и рвётся при их смене. В QUIC
      пакеты несут идентификатор соединения: клиент продолжает с нового адреса с одним из
      идентификаторов, которые сервер заранее выдал этому соединению, сервер проверяет
      новый путь, и соединение продолжается.

  - q: Сколько оборотов проходит до отправки запроса в новом соединении QUIC?
    options:
      - Ноль, запрос едет в первом пакете
      - Один, рукопожатия совмещены
      - Два, как у TCP с TLS 1.3
      - Три, из-за проверки адреса
    answer: 1
    explain: >
      Транспортное рукопожатие и рукопожатие TLS 1.3 едут в одних пакетах, поэтому
      запрос уходит после одного оборота. У TCP с TLS 1.3 - после двух. Ноль оборотов
      возможен только при возобновлении, с сохранённым билетом сеанса.

  - q: В чём риск отправки данных в режиме 0-RTT?
    options:
      - Такие данные передаются без шифрования
      - Такие данные нельзя отправить по UDP
      - Записанный пакет можно отправить повторно
      - Сервер не может на них ответить
    answer: 2
    explain: >
      Данные 0-RTT зашифрованы, но протокол сам не отличает первую отправку от
      воспроизведённой копии, а меры сервера против повтора не дают полной гарантии. Поэтому в 0-RTT отправляют только запросы, которые
      безопасно выполнить дважды.

  - q: Зачем первый пакет клиента QUIC дополняется до 1200 байт?
    options:
      - Чтобы скрыть имя сервера от наблюдателя
      - Чтобы ускорить расчёт контрольной суммы
      - Чтобы в пакет поместился сертификат
      - Чтобы сервер не стал усилителем атаки
    answer: 3
    explain: >
      До проверки адреса сервер отправляет не больше трёх байт на каждый полученный.
      Большой обязательный запрос и этот предел не дают использовать сервер QUIC для
      атак с усилением, как обычные службы на UDP из урока 35.

  - q: Что наблюдатель на пути может узнать из первого пакета соединения QUIC?
    options:
      - Имя сервера, к которому идёт клиент
      - Текст запроса и ответа
      - Сертификат и закрытый ключ сервера
      - Ничего, пакет полностью зашифрован
    answer: 0
    explain: >
      Ключ для первого пакета вычисляется из идентификатора соединения, который лежит
      в том же пакете, и общеизвестной константы. Наблюдатель может расшифровать его и
      прочитать ClientHello с именем сервера. Всё, что идёт после рукопожатия, ему уже
      недоступно.

  - q: Чем установленное соединение QUIC отличается от TCP с точки зрения постороннего, который хочет его оборвать?
    options:
      - QUIC можно сбросить одним пакетом RST
      - Поддельное закрытие не будет принято
      - QUIC нельзя задержать или отбросить в пути
      - Оборвать QUIC можно только со стороны сервера
    answer: 1
    explain: >
      В TCP сегмент RST с подходящими номерами принимается без всяких ключей. В QUIC
      закрытие установленного соединения зашифровано и удостоверено, поэтому подделать его
      нельзя (во время рукопожатия это ещё возможно).
      Остаётся отбрасывать пакеты: тогда соединение замирает, а браузер переходит на
      TCP.

open_questions:
  - q: Какие проблемы TCP решает QUIC и как именно?
    reference: >
      Долгое начало: у TCP с TLS до запроса два оборота; в QUIC рукопожатие TLS 1.3
      встроено в транспортное, и нужен один оборот, а при возобновлении - ноль (0-RTT).
      Блокировка начала очереди: в TCP потеря сегмента задерживает все данные за ним;
      в QUIC внутри соединения независимые потоки, и ждёт только поток с потерей.
      Привязка к адресам: соединение TCP определяется адресами и портами; в QUIC -
      идентификатором соединения, и оно переживает смену сети. Окостенение: TCP живёт в
      ядре и виден промежуточным устройствам; QUIC работает поверх UDP, реализован в
      программах и шифрует почти все служебные поля, так что его можно развивать.
    key_points:
      - рукопожатие за один оборот, 0-RTT
      - независимые потоки вместо общей очереди
      - идентификатор соединения, смена сети
      - поверх UDP, в программе, служебные поля зашифрованы

  - q: Что такое 0-RTT в QUIC, что он даёт и какой у него недостаток?
    reference: >
      Если клиент уже соединялся с сервером, он сохранил билет сеанса и при следующем
      соединении может зашифровать и отправить запрос сразу, вместе с первым пакетом, не
      дожидаясь ответа сервера. Ответ приходит через один оборот вместо двух у нового
      соединения QUIC и трёх у TCP с TLS 1.3. Недостаток: данные 0-RTT можно
      воспроизвести повторно - записанный пакет, отправленный ещё раз, сервер может снова
      принять и выполнить, если не принял отдельных мер (например, одноразовых билетов),
      а полностью исключить повтор трудно. Поэтому в 0-RTT отправляют только запросы, безопасные при
      повторе.
    key_points:
      - билет сеанса от прошлого соединения
      - запрос в первом пакете
      - ответ через один оборот
      - повторное воспроизведение, только безопасные запросы

  - q: Что видит и чего не видит наблюдатель на пути в соединении QUIC, и что из этого следует?
    reference: >
      Видит: адреса и порты UDP, размеры пакетов и время между ними; при установлении
      соединения - версию и идентификаторы соединения; содержимое первого пакета
      клиента, включая имя сервера, потому что ключ для него вычисляется из данных
      самого пакета. Не видит: номера пакетов, подтверждения, окна, потоки, сертификат
      и данные после рукопожатия - всё это зашифровано (сертификат - уже во время
      рукопожатия). Следствия:
      подделать закрытие установленного соединения или изменить служебные поля нельзя, можно только отбрасывать пакеты;
      анализ по размерам и времени остаётся возможным; инструменты, разбирающие TCP,
      для QUIC показывают только поток дейтаграмм UDP.
    key_points:
      - видны адреса, порты, размеры, время
      - первый пакет читается, в нём имя сервера
      - служебные поля транспорта зашифрованы
      - нельзя подделать сброс, можно только отбросить
