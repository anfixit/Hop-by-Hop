<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Сколько оборотов до первого ответа</text>
  <text x="600" y="75" text-anchor="middle" font-size="16" fill="#475569">времена - из опыта, один оборот - 100 мс</text>
  <text x="210" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#0E1830">TCP + TLS 1.3</text>
  <line x1="90" y1="140" x2="90" y2="470" stroke="#475569" stroke-width="3"/><line x1="330" y1="140" x2="330" y2="470" stroke="#475569" stroke-width="3"/>
  <text x="90" y="490" text-anchor="middle" font-size="13" fill="#475569">клиент</text><text x="330" y="490" text-anchor="middle" font-size="13" fill="#475569">сервер</text>
  <line x1="90" y1="150" x2="330" y2="195" stroke="#94A3B8" stroke-width="3"/>
  <polygon points="330,195 316,186 316,198" fill="#94A3B8"/>
  <rect x="193" y="161.5" width="34" height="20" rx="4" fill="#FFFFFF"/><text x="210" y="176.5" text-anchor="middle" font-size="13" fill="#0E1830">SYN</text>
  <line x1="330" y1="195" x2="90" y2="240" stroke="#94A3B8" stroke-width="3"/>
  <polygon points="90,240 104,231 104,243" fill="#94A3B8"/>
  <rect x="171.5" y="206.5" width="77" height="20" rx="4" fill="#FFFFFF"/><text x="210" y="221.5" text-anchor="middle" font-size="13" fill="#0E1830">SYN + ACK</text>
  <line x1="90" y1="240" x2="330" y2="285" stroke="#A16207" stroke-width="3"/>
  <polygon points="330,285 316,276 316,288" fill="#A16207"/>
  <rect x="146.5" y="251.5" width="127" height="20" rx="4" fill="#FFFFFF"/><text x="210" y="266.5" text-anchor="middle" font-size="13" fill="#0E1830">TLS: ClientHello</text>
  <line x1="330" y1="285" x2="90" y2="330" stroke="#A16207" stroke-width="3"/>
  <polygon points="90,330 104,321 104,333" fill="#A16207"/>
  <rect x="139" y="296.5" width="142" height="20" rx="4" fill="#FFFFFF"/><text x="210" y="311.5" text-anchor="middle" font-size="13" fill="#0E1830">TLS: ответ сервера</text>
  <line x1="90" y1="330" x2="330" y2="375" stroke="#2563EB" stroke-width="3"/>
  <polygon points="330,375 316,366 316,378" fill="#2563EB"/>
  <rect x="182.5" y="341.5" width="55" height="20" rx="4" fill="#FFFFFF"/><text x="210" y="356.5" text-anchor="middle" font-size="13" fill="#0E1830">запрос</text>
  <line x1="330" y1="375" x2="90" y2="420" stroke="#15803D" stroke-width="3"/>
  <polygon points="90,420 104,411 104,423" fill="#15803D"/>
  <rect x="186" y="386.5" width="48" height="20" rx="4" fill="#FFFFFF"/><text x="210" y="401.5" text-anchor="middle" font-size="13" fill="#0E1830">ответ</text>
  <text x="210" y="455" text-anchor="middle" font-size="20" font-weight="bold" fill="#0E1830">3 оборота: 325 мс</text>
  <text x="600" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#0E1830">QUIC, новое соединение</text>
  <line x1="480" y1="140" x2="480" y2="470" stroke="#475569" stroke-width="3"/><line x1="720" y1="140" x2="720" y2="470" stroke="#475569" stroke-width="3"/>
  <text x="480" y="490" text-anchor="middle" font-size="13" fill="#475569">клиент</text><text x="720" y="490" text-anchor="middle" font-size="13" fill="#475569">сервер</text>
  <line x1="480" y1="150" x2="720" y2="195" stroke="#A16207" stroke-width="3"/>
  <polygon points="720,195 706,186 706,198" fill="#A16207"/>
  <rect x="511" y="161.5" width="178" height="20" rx="4" fill="#FFFFFF"/><text x="600" y="176.5" text-anchor="middle" font-size="13" fill="#0E1830">рукопожатие (1200 байт)</text>
  <line x1="720" y1="195" x2="480" y2="240" stroke="#A16207" stroke-width="3"/>
  <polygon points="480,240 494,231 494,243" fill="#A16207"/>
  <rect x="547" y="206.5" width="106" height="20" rx="4" fill="#FFFFFF"/><text x="600" y="221.5" text-anchor="middle" font-size="13" fill="#0E1830">ответ сервера</text>
  <line x1="480" y1="240" x2="720" y2="285" stroke="#2563EB" stroke-width="3"/>
  <polygon points="720,285 706,276 706,288" fill="#2563EB"/>
  <rect x="500.5" y="251.5" width="199" height="20" rx="4" fill="#FFFFFF"/><text x="600" y="266.5" text-anchor="middle" font-size="13" fill="#0E1830">конец рукопожатия + запрос</text>
  <line x1="720" y1="285" x2="480" y2="330" stroke="#15803D" stroke-width="3"/>
  <polygon points="480,330 494,321 494,333" fill="#15803D"/>
  <rect x="576" y="296.5" width="48" height="20" rx="4" fill="#FFFFFF"/><text x="600" y="311.5" text-anchor="middle" font-size="13" fill="#0E1830">ответ</text>
  <text x="600" y="365" text-anchor="middle" font-size="20" font-weight="bold" fill="#0E1830">2 оборота: 232 мс</text>
  <text x="990" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#0E1830">QUIC, 0-RTT</text>
  <line x1="870" y1="140" x2="870" y2="470" stroke="#475569" stroke-width="3"/><line x1="1110" y1="140" x2="1110" y2="470" stroke="#475569" stroke-width="3"/>
  <text x="870" y="490" text-anchor="middle" font-size="13" fill="#475569">клиент</text><text x="1110" y="490" text-anchor="middle" font-size="13" fill="#475569">сервер</text>
  <line x1="870" y1="150" x2="1110" y2="195" stroke="#2563EB" stroke-width="3"/>
  <polygon points="1110,195 1096,186 1096,198" fill="#2563EB"/>
  <rect x="912" y="161.5" width="156" height="20" rx="4" fill="#FFFFFF"/><text x="990" y="176.5" text-anchor="middle" font-size="13" fill="#0E1830">рукопожатие + запрос</text>
  <line x1="1110" y1="195" x2="870" y2="240" stroke="#15803D" stroke-width="3"/>
  <polygon points="870,240 884,231 884,243" fill="#15803D"/>
  <rect x="966" y="206.5" width="48" height="20" rx="4" fill="#FFFFFF"/><text x="990" y="221.5" text-anchor="middle" font-size="13" fill="#0E1830">ответ</text>
  <text x="990" y="275" text-anchor="middle" font-size="20" font-weight="bold" fill="#0E1830">1 оборот: 117 мс</text>
  <rect x="40" y="515" width="1120" height="65" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="542" text-anchor="middle" font-size="17" fill="#0E1830">В QUIC рукопожатие TLS 1.3 едет в тех же пакетах, что и установление соединения.</text>
  <text x="600" y="566" text-anchor="middle" font-size="17" fill="#0E1830">С сохранённым билетом сеанса запрос уходит сразу, не дожидаясь ответа; повтор таких данных не исключён.</text>
</svg>
