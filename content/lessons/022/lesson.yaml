id: 22
title: "Маски, CIDR и VLSM: считаем руками"
status: published
summary: >
  Как считать с масками: связь маски и длины префикса, значения байта маски, число
  адресов в сети, адрес сети через AND и широковещательный адрес через OR, быстрый
  способ с размером блока. Деление на подсети одинакового размера, VLSM с
  выравниванием блоков и агрегация сетей в CIDR. На практике - те же расчёты на bash,
  в Python и самим ядром Linux, план VLSM с проверкой.

quiz:
  - q: Какая маска соответствует префиксу /26?
    options:
      - 255.255.255.192
      - 255.255.255.0
      - 255.255.255.224
      - 255.255.192.0
    answer: 0
    explain: >
      /26 - это 24 единицы в первых трёх байтах и ещё 2 в четвёртом. Два старших бита
      байта дают 128 + 64 = 192, поэтому маска 255.255.255.192.

  - q: Сколько адресов можно отдать узлам в сети /27?
    options:
      - "32"
      - "30"
      - "27"
      - "62"
    answer: 1
    explain: >
      На номер узла остаётся 32 - 27 = 5 бит, это 32 адреса. Два заняты адресом сети и
      широковещательным адресом, узлам достаётся 30.

  - q: Какая сеть у адреса 10.1.2.200/26?
    options:
      - 10.1.2.128/26
      - 10.1.2.200/26
      - 10.1.2.0/26
      - 10.1.2.192/26
    answer: 3
    explain: >
      Блок 256 - 192 = 64, блоки начинаются с 0, 64, 128 и 192. Число 200 попадает в блок
      192-255, значит, сеть 10.1.2.192/26, а широковещательный адрес 10.1.2.255.

  - q: Как получить широковещательный адрес сети?
    options:
      - Адрес AND маска
      - Адрес XOR маска
      - Сеть OR (NOT маска)
      - Маска OR адрес узла
    answer: 2
    explain: >
      Широковещательный адрес - это номер узла из одних единиц. Берём адрес сети и
      заполняем единицами все биты, где в маске нули: сеть OR (NOT маска).

  - q: Почему запись 193.20.0.0/12 не является адресом сети?
    options:
      - Префикс /12 слишком короткий для сети в интернете
      - В номере узла у этого адреса есть единица
      - Адреса, начинающиеся с 193, нельзя делить на подсети
      - Длина префикса должна делиться на восемь
    answer: 1
    explain: >
      У /12 номер узла занимает 20 младших бит, и у адреса сети они должны быть нулями.
      У 193.20.0.0 среди них есть единица: сеть /12 начиналась бы с 193.16.0.0. А вот
      193.20.0.0/14 - правильная сеть.

  - q: Отделу нужно 50 адресов для узлов. Какой блок выбрать?
    options:
      - /26 - 64 адреса
      - /27 - 32 адреса
      - /25 - 128 адресов
      - /24 - 256 адресов
    answer: 0
    explain: >
      Нужно не меньше 50 + 2 = 52 адресов, а ближайшая степень двойки - 64, то есть /26
      (62 узла). /27 мало, а /25 и /24 расточительны.

  - q: С каких адресов может начинаться блок /26 внутри сети 198.51.100.0/24?
    options:
      - С любого адреса, кратного 26
      - Только с .0, других вариантов нет
      - С .0, .64, .128 и .192
      - С любого адреса
    answer: 2
    explain: >
      Блок размером 2^k начинается с адреса, кратного 2^k. У /26 это 64 адреса, поэтому
      допустимы только .0, .64, .128 и .192.

  - q: Что даёт агрегация сетей в CIDR?
    options:
      - Добавляет новые адреса в каждую объединённую сеть
      - Все объединённые сети получают одну маску /24
      - Узлы разных сетей могут общаться без маршрутизатора
      - Несколько соседних сетей описываются одной записью
    answer: 3
    explain: >
      Соседние сети с общим префиксом записываются одной строкой с более коротким
      префиксом, как 194.24.0.0/19 в примере Таненбаума. Это уменьшает таблицы
      маршрутизации.

open_questions:
  - q: Покажи на примере 192.0.2.77/26, как найти сеть, широковещательный адрес и диапазон адресов узлов.
    reference: >
      Маска /26 - 255.255.255.192. Считать нужно четвёртый байт: 77 = 01001101, маска
      11000000. AND даёт 01000000 = 64, сеть 192.0.2.64/26. Заполняем 6 бит номера узла
      единицами: 01111111 = 127, широковещательный адрес 192.0.2.127. Узлы - от
      192.0.2.65 до 192.0.2.126, их 62. Быстрый способ: блок 256 - 192 = 64, число 77
      лежит в блоке 64-127.
    key_points:
      - маска 255.255.255.192
      - сеть = адрес AND маска = 192.0.2.64
      - широковещательный = 192.0.2.127
      - узлы .65-.126, 62 адреса

  - q: Раздели сеть 198.51.100.0/24 на подсети для 100, 50, 20 и 2 узлов и объясни правила.
    reference: >
      Для каждой подсети берём наименьший блок 2^k, в который входят узлы плюс два
      служебных адреса: 100 -> 128 (/25), 50 -> 64 (/26), 20 -> 32 (/27), 2 -> 4 (/30).
      Раздаём от больших к меньшим, чтобы каждый блок начинался с адреса, кратного его
      размеру: 198.51.100.0/25, 198.51.100.128/26, 198.51.100.192/27,
      198.51.100.224/30. Блоки не пересекаются, свободными остаются адреса с .228 по
      .255.
    key_points:
      - блок 2^k не меньше "узлы + 2"
      - выравнивание по кратности размера блока
      - от больших к меньшим
      - /25, /26, /27, /30 без пересечений

  - q: Зачем нужны деление на подсети и агрегация и как они связаны?
    reference: >
      Деление на подсети удлиняет префикс и дробит один блок адресов на части для
      отделов, серверов и связей между маршрутизаторами, причём снаружи сеть по-прежнему
      видна одним блоком. Агрегация делает обратное: соседние сети с общим префиксом
      описываются одной записью с более коротким префиксом, что уменьшает таблицы
      маршрутизации. Для агрегации адреса соседних сетей должны лежать рядом в адресном
      пространстве, поэтому провайдеры получают непрерывные блоки. Из нескольких
      подходящих записей маршрутизатор выбирает самую длинную.
    key_points:
      - деление удлиняет префикс, снаружи сеть видна одним блоком
      - агрегация укорачивает префикс и сокращает таблицы
      - нужна непрерывность адресов
      - самый длинный совпадающий префикс
