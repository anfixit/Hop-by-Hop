id: 9
title: "Линии связи: медь, оптика, радио"
status: published
summary: >
  Что происходит с битом в кабеле и в эфире. Звено и канал, спектр сигнала, затухание
  в децибелах и дБм, энергетический бюджет линии, полоса пропускания, помехи и битовые
  ошибки. Витая пара, коаксиальный кабель, оптоволокно и радио. На практике - виртуальная
  карта без скорости и расчёт бюджета оптической линии, а в безопасности - почему
  подслушать можно любую среду.

quiz:
  - q: Мощность сигнала на выходе линии в 100 раз меньше, чем на входе. Каково затухание?
    options:
      - -2 дБ
      - -10 дБ
      - -20 дБ
      - -100 дБ
    answer: 2
    explain: >
      A = 10 · lg(1/100) = 10 · (-2) = -20 дБ. Каждые 10 дБ - это изменение в 10 раз,
      поэтому в 100 раз - 20 дБ. -10 дБ было бы ослаблением в 10 раз.

  - q: Передатчик выдаёт 0 дБм, затухание линии 12 дБ, чувствительность приёмника -20 дБм. Будет ли линия работать?
    options:
      - Нет, 0 дБм означает, что передатчик выключен
      - Да, до приёмника дойдёт -12 дБм, запас 8 дБ
      - Нет, затухание больше мощности передатчика
      - Да, но только если убрать все разъёмы на линии
    answer: 1
    explain: >
      0 дБм - это 1 мВт, а не ноль. На входе приёмника 0 - 12 = -12 дБм, это выше
      порога -20 дБм, запас 8 дБ. В децибелах бюджет считается простым сложением.

  - q: Чем полоса пропускания линии отличается от её скорости передачи?
    options:
      - Полоса меряется в герцах, скорость - в битах в секунду
      - Это одно и то же, просто разные названия
      - Полоса - это максимальная длина кабеля
      - Полоса показывает только уровень шума в линии
    answer: 0
    explain: >
      Полоса пропускания - диапазон частот, которые линия пропускает без сильного
      ослабления, в герцах. Скорость - сколько бит в секунду передаётся. Они связаны:
      чем шире полоса, тем больше можно передать, но это разные величины.

  - q: Зачем провода в витой паре скручивают?
    options:
      - Чтобы кабель был прочнее на разрыв
      - Чтобы в кабель влезло больше проводов
      - Чтобы уменьшить длину кабеля при той же трассе
      - Чтобы наводки от соседних витков гасились
    answer: 3
    explain: >
      Два параллельных провода работают как антенна. В скрученной паре наводки от
      соседних витков взаимно гасятся, а разностный сигнал почти не чувствует помеху,
      которая одинаково действует на оба провода.

  - q: Гигабитная сетевая карта вдруг подключилась на 100 Мбит/с. Что проверить первым?
    options:
      - "DNS: от него зависит скорость подключения"
      - "Кабель: гигабиту нужны все четыре пары"
      - "Тариф: провайдер урезал скорость интернета"
      - "Wi-Fi: рядом слишком сильный сигнал"
    answer: 1
    explain: >
      100-мегабитный Ethernet использует две пары из четырёх, а гигабитный - все четыре.
      Если повреждена одна из пар, не нужных 100-мегабитному Ethernet, многие карты сами
      понижают скорость до 100 Мбит/с. DNS, тариф и соседний Wi-Fi на скорость, о которой договорились
      карта и порт, не влияют.

  - q: Почему свет не выходит из сердцевины оптоволокна наружу?
    options:
      - Сердцевина покрыта зеркальным металлическим слоем
      - Стекло сердцевины не пропускает свет вбок
      - У оболочки ниже показатель преломления, луч отражается внутрь
      - Волокно заполнено газом, который поглощает рассеянный свет
    answer: 2
    explain: >
      Сердцевину окружает стеклянная оболочка с меньшим коэффициентом преломления.
      Луч, падающий на границу достаточно полого, полностью отражается обратно:
      это полное внутреннее отражение. Зеркал и газа там нет.

  - q: Чем одномодовое волокно отличается от многомодового?
    options:
      - Тонкая сердцевина 8-10 мкм, лазер, дальность в десятки и сотни километров
      - Толстая сердцевина около 50 мкм, дешёвые источники, короткие расстояния
      - Одномодовое передаёт только в одну сторону, многомодовое - в обе
      - Одномодовое работает только в окне 850 нм, многомодовое - во всех
    answer: 0
    explain: >
      В одномодовом волокне сердцевина соизмерима с длиной волны, свет идёт почти по
      оси, импульсы почти не размываются, поэтому оно работает на дальних линиях.
      Второй вариант описывает многомодовое. Передача по волокну однонаправленная
      у обоих видов.

  - q: Ты отошёл от точки доступа Wi-Fi вдвое дальше. Как изменится сигнал в идеальных условиях свободного пространства?
    options:
      - Упадёт вдвое, на 3 дБ
      - Не изменится, радио не затухает
      - Упадёт на 6 дБ, в четыре раза
      - Упадёт в сто раз, на 20 дБ
    answer: 2
    explain: >
      В свободном пространстве мощность падает обратно пропорционально квадрату расстояния.
      Вдвое дальше - в четыре раза слабее, это 6 дБ. Через стены и мебель потери
      будут ещё больше.

  - q: Трафик идёт по оптоволокну. Что надёжнее всего защищает его содержимое, если трафик перехватят?
    options:
      - "Сама оптика: подключиться к волокну невозможно"
      - Экранирование кабеля металлической оплёткой
      - Замена оптики на радиорелейную линию
      - Шифрование на концах, например TLS
    answer: 3
    explain: >
      К волокну можно подключиться через изгиб, при котором часть света выходит
      наружу. Физическая защита повышает цену атаки, но конфиденциальность даёт только
      шифрование на концах: подслушавший получит лишь шифртекст.

open_questions:
  - q: Объясни, что такое энергетический бюджет линии и почему его удобно считать в децибелах. Приведи пример расчёта.
    reference: >
      Энергетический бюджет проверяет, дойдёт ли до приёмника сигнал достаточной
      мощности. Мощность передатчика (в дБм) минус суммарное затухание линии (в дБ)
      должна быть выше порога чувствительности приёмника, то есть минимальной мощности,
      которую он уверенно распознаёт. Разница - запас на старение и грязные разъёмы.
      дБм - абсолютная мощность относительно 1 мВт, а дБ - отношение двух мощностей,
      поэтому из дБм вычитают дБ и снова получают дБм.
      Децибелы удобны, потому что потери отдельных участков (кабель, разъёмы, сварки)
      просто складываются, а не перемножаются. Пример: лазер 0 дБм, 40 км волокна по
      0,25 дБ/км = 10 дБ, два разъёма по 0,75 дБ = 1,5 дБ; на приёмнике -11,5 дБм,
      при чувствительности -20 дБм запас 8,5 дБ.
    key_points:
      - мощность передатчика минус затухание должна быть выше чувствительности приёмника
      - дБм - абсолютная мощность относительно 1 мВт, дБ - отношение мощностей
      - в децибелах потери участков складываются
      - пример с числами и запасом

  - q: Почему при попытке передавать всё быстрее по той же медной линии растёт число ошибок?
    reference: >
      Любой сигнал - сумма синусоид. Чтобы передавать быстрее, сигнал нужно менять
      чаще, а для этого нужны более высокие частоты и более широкий спектр. Медная
      линия ослабляет высокие частоты сильнее и пропускает ограниченную полосу:
      высокие гармоники срезаются, фронты импульсов размываются. К этому добавляются
      помехи и перекрёстные наводки. Отношение сигнал/шум падает, приёмнику всё
      труднее отличать состояния сигнала, и растёт доля битовых ошибок.
    key_points:
      - сигнал раскладывается на гармоники, быстрее значит выше частоты
      - затухание растёт с частотой, полоса линии ограничена
      - срезанные гармоники размывают импульсы
      - помехи и падение сигнал/шум увеличивают число ошибок

  - q: Как можно подслушать радио, медный кабель и оптоволокно, и что из этого следует для защиты?
    reference: >
      Радио слышит любой приёмник в зоне действия, а направленная антенна расширяет
      эту зону. К медному кабелю можно подключить ответвитель, а по побочным
      электромагнитным излучениям проводов и устройств можно восстановить данные на
      расстоянии. Из оптоволокна при сильном изгибе выходит часть света, которую можно
      собрать, не разрезая волокно. Физическая защита (доступ к кабелям, экранирование,
      мониторинг уровня сигнала) повышает цену атаки, но конфиденциальность и целостность
      даёт только криптографическая защита на концах, например TLS или VPN.
    key_points:
      - радио - любой приёмник в зоне действия, направленная антенна дальше
      - медь - ответвитель и побочные излучения
      - оптика - перехват через изгиб, может быть заметен при мониторинге мощности
      - физическому уровню доверять нельзя, нужна шифрованная передача на концах
