<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Три вида кабеля</text>

  <!-- витая пара -->
  <rect x="30" y="80" width="360" height="400" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="210" y="120" text-anchor="middle" font-size="24" font-weight="bold" fill="#0E1830">Витая пара</text>
  <path d="M 60 250 C 85 200, 115 200, 140 250 C 165 300, 195 300, 220 250 C 245 200, 275 200, 300 250 C 325 300, 345 300, 360 270" fill="none" stroke="#EA580C" stroke-width="10"/>
  <path d="M 60 250 C 85 300, 115 300, 140 250 C 165 200, 195 200, 220 250 C 245 300, 275 300, 300 250 C 325 200, 345 200, 360 230" fill="none" stroke="#F8FAFC" stroke-width="16"/>
  <path d="M 60 250 C 85 300, 115 300, 140 250 C 165 200, 195 200, 220 250 C 245 300, 275 300, 300 250 C 325 200, 345 200, 360 230" fill="none" stroke="#2563EB" stroke-width="10"/>
  <text x="210" y="360" text-anchor="middle" font-size="19" fill="#475569">два медных провода скручены,</text>
  <text x="210" y="386" text-anchor="middle" font-size="19" fill="#475569">сигнал - разность напряжений;</text>
  <text x="210" y="412" text-anchor="middle" font-size="19" fill="#475569">наводки от витков гасятся</text>
  <text x="210" y="455" text-anchor="middle" font-size="19" fill="#0F766E">LAN, телефонные линии</text>

  <!-- коаксиальный кабель -->
  <rect x="420" y="80" width="360" height="400" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-size="24" font-weight="bold" fill="#0E1830">Коаксиальный кабель</text>
  <circle cx="545" cy="245" r="90" fill="#334155"/>
  <circle cx="545" cy="245" r="78" fill="#94A3B8"/>
  <circle cx="545" cy="245" r="70" fill="#E2E8F0"/>
  <circle cx="545" cy="245" r="16" fill="#EA580C"/>
  <g font-size="17" fill="#0E1830">
    <line x1="561" y1="245" x2="660" y2="190" stroke="#0E1830" stroke-width="2"/>
    <text x="664" y="195">жила</text>
    <line x1="596" y1="270" x2="660" y2="235" stroke="#0E1830" stroke-width="2"/>
    <text x="664" y="240">изоляция</text>
    <line x1="612" y1="275" x2="660" y2="280" stroke="#0E1830" stroke-width="2"/>
    <text x="664" y="285">оплётка</text>
    <line x1="614" y1="296" x2="660" y2="325" stroke="#0E1830" stroke-width="2"/>
    <text x="664" y="330">оболочка</text>
  </g>
  <text x="600" y="386" text-anchor="middle" font-size="19" fill="#475569">оплётка - второй проводник</text>
  <text x="600" y="412" text-anchor="middle" font-size="19" fill="#475569">и экран одновременно</text>
  <text x="600" y="455" text-anchor="middle" font-size="19" fill="#0F766E">кабельное ТВ и интернет</text>

  <!-- оптоволокно -->
  <rect x="810" y="80" width="360" height="400" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="990" y="120" text-anchor="middle" font-size="24" font-weight="bold" fill="#0E1830">Оптоволокно</text>
  <rect x="830" y="185" width="320" height="120" fill="#CCFBF1"/>
  <rect x="830" y="215" width="320" height="60" fill="#FEF9C3"/>
  <polyline points="835,245 870,217 930,273 990,217 1050,273 1110,217 1145,245" fill="none" stroke="#DC2626" stroke-width="4"/>
  <text x="990" y="178" text-anchor="middle" font-size="17" fill="#0F766E">оболочка</text>
  <text x="990" y="330" text-anchor="middle" font-size="17" fill="#A16207">сердцевина (луч отражается от границы)</text>
  <text x="990" y="386" text-anchor="middle" font-size="19" fill="#475569">свет заперт полным</text>
  <text x="990" y="412" text-anchor="middle" font-size="19" fill="#475569">внутренним отражением</text>
  <text x="990" y="455" text-anchor="middle" font-size="19" fill="#0F766E">магистрали, дата-центры, FTTH</text>

  <text x="600" y="530" text-anchor="middle" font-size="19" fill="#475569">А ещё есть радио: без кабеля, сигнал расходится во все стороны, главная проблема - помехи</text>
</svg>
