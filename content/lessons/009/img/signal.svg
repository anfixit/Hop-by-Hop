<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Что линия делает с сигналом</text>

  <!-- панели 540x220; нулевой уровень внизу панели -->
  <g font-size="22" font-weight="bold" fill="#0E1830">
    <text x="50" y="100">Отправили: биты 1 0 1 1 0 1</text>
    <text x="630" y="100">Затухание: сигнал слабее</text>
    <text x="50" y="360">Узкая полоса: фронты размыты</text>
    <text x="630" y="360">Помехи: к сигналу добавлен шум</text>
  </g>
  <g stroke="#CBD5E1" stroke-width="2">
    <line x1="50" y1="260" x2="570" y2="260"/>
    <line x1="630" y1="260" x2="1150" y2="260"/>
    <line x1="50" y1="520" x2="570" y2="520"/>
    <line x1="630" y1="520" x2="1150" y2="520"/>
  </g>

  <!-- исходный: 6 бит по 80 px, высота 120 -->
  <polyline fill="none" stroke="#4338CA" stroke-width="5"
    points="60,260 60,140 140,140 140,260 220,260 220,140 380,140 380,260 460,260 460,140 540,140 540,260"/>

  <!-- затухание: высота 50 -->
  <polyline fill="none" stroke="#4338CA" stroke-width="5"
    points="640,260 640,210 720,210 720,260 800,260 800,210 960,210 960,260 1040,260 1040,210 1120,210 1120,260"/>
  <polyline fill="none" stroke="#CBD5E1" stroke-width="3"
    points="640,260 640,140 720,140 720,260 800,260 800,140 960,140 960,260 1040,260 1040,140 1120,140 1120,260"/>

  <!-- узкая полоса: сглаженные фронты -->
  <path fill="none" stroke="#4338CA" stroke-width="5"
    d="M 60 520 C 80 520, 80 410, 110 405 C 130 402, 130 520, 170 510 C 200 505, 200 520, 225 470 C 245 420, 250 405, 290 402 C 340 400, 350 405, 375 440 C 400 480, 410 515, 430 500 C 450 480, 455 410, 480 404 C 510 400, 520 440, 545 520"/>
  <polyline fill="none" stroke="#CBD5E1" stroke-width="3"
    points="60,520 60,400 140,400 140,520 220,520 220,400 380,400 380,520 460,520 460,400 540,400 540,520"/>

  <!-- шум -->
  <polyline fill="none" stroke="#4338CA" stroke-width="4"
    points="720,520 728,512 736,527 744,511 752,524 760,515 768,526 776,511 784,523 792,516 800,520"/>
  <polyline fill="none" stroke="#4338CA" stroke-width="4"
    points="640,520 640,405 648,395 656,412 664,398 672,410 680,392 688,407 696,400 704,413 712,396 720,405 720,520"/>
  <polyline fill="none" stroke="#4338CA" stroke-width="4"
    points="800,520 800,402 810,392 820,410 830,397 840,414 850,399 860,408 870,390 880,405 890,412 900,396 910,409 920,398 930,411 940,394 950,405 960,400 960,520 968,512 976,526 984,510 992,523 1000,515 1008,527 1016,513 1024,522 1032,516 1040,520"/>
  <polyline fill="none" stroke="#4338CA" stroke-width="4"
    points="1040,520 1040,401 1048,394 1056,412 1064,397 1072,408 1080,391 1088,406 1096,399 1104,413 1112,395 1120,404 1120,520"/>

  <text x="600" y="580" text-anchor="middle" font-size="19" fill="#475569">серым - исходная форма. Когда искажений слишком много, приёмник путает 0 и 1: это битовая ошибка</text>
</svg>
