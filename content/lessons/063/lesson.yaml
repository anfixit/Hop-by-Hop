id: 63
title: "Сообщения и записи DNS; dig и drill"
status: published
summary: >
  Из чего состоят данные DNS и сообщения протокола: записи ресурсов и их типы (A,
  AAAA, NS, CNAME, SOA, MX, TXT, PTR, SRV, CAA, HTTPS), заголовок с флагами и кодом
  ответа, четыре раздела, NODATA, сжатие имён, EDNS и флаг TC. На практике - зона с
  записями разных типов и обратная зона на BIND, вопросы через dig и drill, разбор
  ответа побайтово и повтор по TCP. Безопасность: что раскрывают записи DNS и какие
  записи защищают домен.

quiz:
  - q: Что содержит запись SOA?
    options:
      - Список всех имён зоны и их IP-адреса
      - Первичный сервер, почту админа и таймеры
      - Адрес почтового сервера домена с приоритетом
      - Подпись зоны и открытый ключ проверки DNSSEC
    answer: 1
    explain: >
      SOA - главная запись зоны: первичный сервер, почта администратора, серийный
      номер и таймеры для вторичных серверов; последнее поле задаёт, сколько
      кэшировать отрицательные ответы.

  - q: Почему CNAME нельзя поставить на вершину зоны?
    options:
      - У имени с CNAME не может быть других записей
      - CNAME разрешён только для имён в обратной зоне
      - CNAME работает только для адресов IPv6
      - Вершина зоны всегда обслуживается корнем
    answer: 0
    explain: >
      CNAME объявляет имя псевдонимом, и других записей у него быть не может
      (кроме служебных записей DNSSEC). А на
      вершине зоны обязательны SOA и NS.

  - q: Как выглядит имя для обратного запроса об адресе 10.0.0.80?
    options:
      - 10.0.0.80.in-addr.arpa.
      - arpa.in-addr.10.0.0.80.
      - 10-0-0-80.reverse.arpa.
      - 80.0.0.10.in-addr.arpa.
    answer: 3
    explain: >
      Октеты записываются в обратном порядке, чтобы старшая часть адреса была
      ближе к корню, и к ним добавляется домен in-addr.arpa. В опыте dig -x
      сделал это сам.

  - q: Что такое ответ NODATA?
    options:
      - Код ответа 4, который означает "нет данных"
      - Ответ NXDOMAIN, но без раздела полномочий
      - NOERROR с пустым ответом и SOA в полномочиях
      - Ответ с флагом TC, обрезанный до пустого
    answer: 2
    explain: >
      Отдельного кода нет: имя существует, а записей нужного типа нет. В опыте
      вопрос об MX для www.corp.lab вернул NOERROR без ответа и SOA зоны.

  - q: Что означают байты c0 0c в начале записи ответа?
    options:
      - Тип записи вместе с классом в одном поле
      - Указатель на имя, начинающееся с байта 12
      - Начало нового сообщения в том же пакете
      - Код ответа сервера и номер этого запроса
    answer: 1
    explain: >
      Два старших бита 11 означают указатель, остальные 14 бит - смещение 12, где
      в вопросе записано www.corp.lab. Так сжатие избавляет от повторения имён.

  - q: Почему в выводе dig в разделе дополнительных записей счётчик 2, а запись одна?
    options:
      - Сервер ошибся при подсчёте записей
      - dig считает и раздел вопроса тоже
      - Вторая запись - копия записи из ответа
      - Вторая запись - псевдозапись OPT из EDNS
    answer: 3
    explain: >
      EDNS добавляет в этот раздел псевдозапись OPT с размером UDP и флагами, dig
      показывает её отдельно. drill без EDNS увидел счётчик 1.

  - q: Что произошло с ответом на 600 байт по UDP без EDNS?
    options:
      - Пришёл с флагом TC, dig повторил по TCP
      - Сервер вернул вместо него ошибку SERVFAIL
      - Сервер разбил его на два пакета UDP
      - Сервер сжал текст до 512 байт
    answer: 0
    explain: >
      Без EDNS по UDP можно передать только 512 байт. Сервер обрезал ответ и
      поставил TC, а dig, как и любой резолвер, повторил запрос по TCP.

  - q: Как не раскрывать лишнего в публичных записях DNS?
    options:
      - Ставить на все записи TTL в одну секунду
      - Публиковать все записи только в виде TXT
      - Держать внутренние имена во внутренней зоне
      - Записывать имена только заглавными буквами
    answer: 2
    explain: >
      Публичная зона видна всем. Внутренние имена держат на внутренних серверах
      (split-horizon), передачу зоны разрешают только вторичным серверам, версию
      сервера не раскрывают.

open_questions:
  - q: Опиши формат сообщения DNS.
    reference: >
      Заголовок 12 байт: ID для сопоставления ответа с вопросом; флаги QR, OPCODE,
      AA, TC, RD, RA, AD, CD; код ответа RCODE (NOERROR, SERVFAIL, NXDOMAIN,
      REFUSED); четыре счётчика. Затем разделы: вопрос (имя, тип, класс), ответ,
      полномочия (NS или SOA), дополнительные (например, адреса серверов и OPT из
      EDNS). Запись: имя, тип, класс, TTL, длина данных, данные. Имена - метки с
      байтом длины и нулём в конце, повторы заменяются указателями. Без EDNS ответ
      по UDP до 512 байт, иначе TC и повтор по TCP.
    key_points:
      - заголовок, ID, флаги, RCODE, счётчики
      - четыре раздела
      - формат записи
      - сжатие имён и предел 512 байт

  - q: Какие типы записей ты знаешь и для чего они нужны?
    reference: >
      A и AAAA - адреса IPv4 и IPv6; NS - серверы зоны; CNAME - псевдоним; SOA -
      главная запись зоны с серийным номером и таймерами; MX - почтовые серверы
      с приоритетом; TXT - текст, сегодня SPF и подтверждения владения; PTR -
      имя по адресу в in-addr.arpa или ip6.arpa; SRV - сервер и порт службы; CAA -
      кто вправе выпускать сертификаты; HTTPS и SVCB - параметры подключения.
    key_points:
      - адресные записи
      - NS, SOA, CNAME
      - MX, TXT, PTR
      - SRV, CAA, HTTPS

  - q: Чем NXDOMAIN отличается от NODATA и зачем в обоих ответах SOA?
    reference: >
      NXDOMAIN - имени нет вовсе, код 3. NODATA - имя есть, но записей нужного типа
      нет: код NOERROR с пустым разделом ответа. В обоих случаях в разделе
      полномочий SOA зоны: по ней резолвер кэширует отрицательный ответ на меньшее
      из TTL записи SOA и её поля minimum. В опыте это было 300 секунд.
    key_points:
      - NXDOMAIN - имени нет
      - NODATA - нет записей типа
      - SOA для отрицательного кэша
