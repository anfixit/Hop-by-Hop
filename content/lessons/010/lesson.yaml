id: 10
title: "Кодирование и модуляция: как биты становятся сигналом"
status: published
summary: >
  Символы и боды, требования к линейным кодам, NRZ и манчестерский код, 4B/5B и
  скремблирование, многоуровневые сигналы, ASK, FSK, PSK и QAM, созвездия и почему
  Wi-Fi замедляется за стеной. Пределы Найквиста и Шеннона, мультиплексирование FDM,
  WDM, TDM и CDMA. В безопасности - кодирование не шифрует, а "пакеты-убийцы" ломали
  синхронизацию целого канала.

quiz:
  - q: Сигнал имеет 16 различимых состояний и меняется 1000 раз в секунду. Какова скорость в битах в секунду?
    options:
      - 1000 бит/с
      - 4000 бит/с
      - 16 000 бит/с
      - 250 бит/с
    answer: 1
    explain: >
      Символ с 16 состояниями несёт log₂16 = 4 бита. 1000 символов (бод) в секунду по
      4 бита - 4000 бит/с. 16 000 получилось бы, если перепутать число состояний с
      числом бит.

  - q: Почему код NRZ плохо подходит для длинных серий одинаковых битов?
    options:
      - Он передаёт единицы вдвое медленнее, чем нули
      - Он требует вдвое большую полосу, чем манчестерский
      - Сигнал не меняется, и приёмник теряет синхронизацию
      - Он не может передавать нули по оптическому волокну
    answer: 2
    explain: >
      Приёмник подстраивает часы по перепадам сигнала. На длинной серии одинаковых
      битов перепадов нет, и приёмник может насчитать лишний или недостающий такт.
      Заодно появляется почти постоянная составляющая. Полоса у NRZ, наоборот, уже,
      чем у манчестерского кода.

  - q: Чем расплачиваются за хорошую синхронизацию в манчестерском коде?
    options:
      - Сигнал меняется чаще, нужна вдвое большая полоса
      - Нужен отдельный провод для тактового сигнала рядом с данными
      - Код не работает на расстояниях больше нескольких метров
      - К каждым 4 битам данных добавляется пятый служебный
    answer: 0
    explain: >
      В манчестерском коде бит кодируется перепадом в середине такта, а между
      одинаковыми битами нужен ещё служебный перепад. Скорость в бодах вдвое выше
      битовой, поэтому код требует вдвое большую полосу. Пятый бит на каждые четыре -
      это про 4B/5B.

  - q: Зачем в коде 4B/5B каждые 4 бита заменяют 5-битной комбинацией?
    options:
      - Чтобы зашифровать данные от прослушивания на линии
      - Чтобы сжать данные и передать их по линии быстрее
      - Чтобы добавить номер кадра для сборки на приёмнике
      - Чтобы не было длинных серий нулей
    answer: 3
    explain: >
      Из 32 пятибитных комбинаций выбраны 16 без длинных серий нулей, поэтому перепады
      идут часто и приёмник держит синхронизацию. Лишние комбинации служат служебными
      сигналами и помогают заметить ошибку. Это не шифрование: таблица общеизвестна.

  - q: Почему Wi-Fi за стеной работает медленнее, даже если связь не рвётся?
    options:
      - За стеной устройство меняет стандарт Wi-Fi на более старый
      - Сигнал/шум ниже, нужно созвездие с меньшим числом точек
      - Стена задерживает пакеты, и TCP из-за этого снижает скорость
      - Точка доступа специально ограничивает скорость дальних клиентов
    answer: 1
    explain: >
      При слабом сигнале облачка шума вокруг точек созвездия шире, и плотные созвездия
      вроде QAM-256 перестают различаться. Устройство переходит на редкие созвездия с
      меньшим числом бит на символ: скорость падает, зато ошибок меньше.

  - q: Отношение сигнал/шум в канале равно 100. По Шеннону, что даст больший прирост предельной скорости?
    options:
      - Удвоить мощность передатчика
      - Удвоить число уровней сигнала
      - Удвоить полосу, сохранив сигнал/шум
      - Удвоить длину кабеля до приёмника
    answer: 2
    explain: >
      C = B · log₂(1 + S/N): при том же сигнал/шум предел растёт пропорционально полосе,
      то есть вдвое. Удвоение мощности при S/N = 100 даёт лишь около 15%. Число уровней
      предел Шеннона не меняет вообще: он не зависит от способа кодирования. Длинный
      кабель только ухудшит сигнал.

  - q: Можно ли хитрой модуляцией передать по каналу больше, чем разрешает формула Шеннона?
    options:
      - Да, если использовать больше уровней сигнала
      - Нет, но только для проводных линий, а не для радио
      - Да, если передавать символы чаще, чем 2B раз в секунду
      - Нет, это предел для любого кодирования
    answer: 3
    explain: >
      Формула Шеннона - теоретический предел для канала с полосой B и отношением
      сигнал/шум S/N при любом кодировании, и для радио тоже. Больше уровней упрётся в
      шум, а символы чаще 2B в секунду линия не пропустит (Найквист).

  - q: По одному волокну идут несколько каналов, каждый на своём "цвете" света. Как называется такое мультиплексирование?
    options:
      - Волновое (WDM)
      - Временное (TDM)
      - Кодовое (CDMA)
      - Статистическое (пакетное)
    answer: 0
    explain: >
      WDM - это частотное разделение в оптике: каждый канал получает свою длину волны,
      свой "цвет". Плотный WDM передаёт по одной паре волокон десятки и сотни каналов.

  - q: Что общего у скремблирования и шифрования?
    options:
      - Оба защищают данные от прослушивания на линии
      - Оба требуют секретного ключа у получателя данных
      - Оба обратимы, но скремблер не секретен
      - "Ничего: скремблирование не меняет биты"
    answer: 2
    explain: >
      Скремблер перемешивает биты операцией XOR с псевдослучайной последовательностью,
      и приёмник выполняет обратное преобразование. Но алгоритм открыт и описан в
      стандартах, его цель - частые перепады сигнала, а не секретность.

open_questions:
  - q: Объясни разницу между пределом Найквиста и пределом Шеннона. Почему нельзя бесконечно увеличивать число уровней сигнала?
    reference: >
      Найквист говорит, что по каналу с полосой B нельзя передать больше 2B символов в
      секунду, поэтому без шума скорость не больше 2B · log₂V, где V - число уровней.
      Формально её можно наращивать, добавляя уровни. Но в реальном канале есть шум:
      чем больше уровней, тем ближе они друг к другу, и шум начинает сдвигать сигнал к
      соседнему уровню, растёт число ошибок. Шеннон учёл шум: предел C = B · log₂(1 +
      S/N) не зависит от способа кодирования. Поэтому число уровней ограничено
      отношением сигнал/шум, а при том же сигнал/шум скорость растёт пропорционально
      полосе и лишь логарифмически от мощности.
    key_points:
      - Найквист - канал без шума, 2B символов в секунду, 2B · log₂V
      - шум сближает уровни и вызывает ошибки
      - Шеннон - предел с учётом шума, не зависит от кодирования
      - при том же сигнал/шум скорость пропорциональна полосе, от мощности растёт логарифмически

  - q: Зачем линейному коду частые перепады сигнала и какими способами их добиваются?
    reference: >
      Приёмник подстраивает свои часы под передатчик по перепадам сигнала. Если
      перепадов долго нет, как в NRZ на длинной серии одинаковых битов, часы расходятся
      и приёмник ошибается в числе тактов; кроме того, появляется постоянная
      составляющая, которую многие линии не пропускают. Способы: манчестерский код
      (перепад в каждом такте, но вдвое большая полоса), избыточные коды вроде 4B/5B,
      8B/10B, 64B/66B (таблица без длинных серий нулей, накладные расходы от 25% у
      4B/5B и 8B/10B до 3% у 64B/66B) и
      скремблирование (XOR с псевдослучайной последовательностью без лишних битов).
    key_points:
      - синхронизация приёмника по перепадам, без них теряется счёт тактов
      - длинные серии дают постоянную составляющую
      - манчестерский код - перепад в каждом такте ценой полосы
      - избыточные коды и скремблирование - дешевле по полосе

  - q: Чему учит история с "пакетами-убийцами" в каналах SONET?
    reference: >
      Скремблер в ранних стандартах передачи IP по SONET использовал короткую
      предсказуемую последовательность. Пользователь мог подобрать содержимое пакета
      так, чтобы после скремблирования получилась длинная серия нулей, приёмник терял
      синхронизацию и канал сбоил для всех. Вывод: нельзя рассчитывать, что данные
      будут "обычными" - данные, которые контролирует пользователь, могут быть
      подобраны специально, чтобы сломать систему. Стандарт исправили (RFC 2615),
      добавив второй скремблер, состояние которого зависит от переданных данных. Заодно видно, что скремблирование
      не шифрует и не защищает, а лишь решает инженерную задачу.
    key_points:
      - предсказуемый скремблер позволял подобрать данные с длинной серией нулей
      - приёмник терял синхронизацию, страдал весь канал
      - нельзя рассчитывать на "обычные" данные от пользователя
      - исправление - второй скремблер, зависящий от данных; скремблирование не шифрование
