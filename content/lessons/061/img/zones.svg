<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Дерево имён, домены и зоны</text>
  <!-- зоны -->
  <rect x="510" y="68" width="180" height="70" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="700" y="90" font-size="14" fill="#B91C1C" font-weight="bold">зона "."</text>
  <rect x="595" y="178" width="200" height="290" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="605" y="200" font-size="14" fill="#2563EB" font-weight="bold">зона lab.</text>
  <rect x="805" y="290" width="370" height="290" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1165" y="312" text-anchor="end" font-size="14" fill="#15803D" font-weight="bold">зона corp.lab.</text>
  <!-- рёбра -->
  <g stroke="#94A3B8" stroke-width="2"><line x1="600" y1="120" x2="300" y2="210"/><line x1="600" y1="120" x2="450" y2="210"/></g>
  <g stroke="#475569" stroke-width="2.5">
    <line x1="750" y1="230" x2="650" y2="300"/><line x1="650" y1="340" x2="650" y2="410"/>
    <line x1="985" y1="340" x2="855" y2="410"/><line x1="985" y1="340" x2="945" y2="410"/><line x1="985" y1="340" x2="1035" y2="410"/><line x1="985" y1="340" x2="1125" y2="410"/>
    <line x1="1125" y1="450" x2="1125" y2="510"/>
  </g>
  <g stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="6 4">
    <line x1="600" y1="120" x2="750" y2="190"/><line x1="750" y1="230" x2="985" y2="300"/>
  </g>
  <g font-size="13" fill="#B91C1C">
    <text x="690" y="134" transform="rotate(25 690 134)">NS + адрес</text>
    <text x="850" y="244" transform="rotate(17 850 244)">NS + адрес</text>
  </g>
  <!-- узлы -->
  <g font-size="17" font-family="monospace" text-anchor="middle" fill="#0E1830">
    <rect x="555" y="80" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="600" y="106">.</text>
    <rect x="255" y="190" width="90" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="300" y="216" fill="#64748B">com</text>
    <rect x="405" y="190" width="90" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="450" y="216" fill="#64748B">ru</text>
    <rect x="705" y="190" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="750" y="216">lab</text>
    <rect x="610" y="300" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="650" y="326">nic</text>
    <rect x="610" y="410" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="650" y="436">ns</text>
    <rect x="940" y="300" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="985" y="326">corp</text>
    <rect x="815" y="410" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="855" y="436">ns</text>
    <rect x="905" y="410" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="945" y="436">www</text>
    <rect x="995" y="410" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="1035" y="436">mail</text>
    <rect x="1085" y="410" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="1125" y="436">dev</text>
    <rect x="1085" y="510" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0E1830" stroke-width="2"/><text x="1125" y="536">www</text>
  </g>
  <text x="375" y="260" text-anchor="middle" font-size="14" fill="#64748B">... больше 1400 TLD</text>
  <text x="990" y="510" text-anchor="middle" font-size="13" fill="#15803D">домен dev.corp.lab</text>
  <text x="990" y="527" text-anchor="middle" font-size="13" fill="#15803D">без своей зоны</text>
  <!-- пояснения -->
  <rect x="30" y="330" width="545" height="250" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-size="15" fill="#0E1830">
    <text x="50" y="362"><tspan font-weight="bold">Имя</tspan> - метки от узла до корня:</text>
    <text x="50" y="386" font-family="monospace">www.dev.corp.lab.</text>
    <text x="50" y="418"><tspan font-weight="bold">Домен</tspan> corp.lab - узел corp и всё под ним.</text>
    <text x="50" y="450"><tspan font-weight="bold">Зона</tspan> - часть дерева, которую обслуживает</text>
    <text x="50" y="472">один набор авторитетных серверов.</text>
    <text x="50" y="504"><tspan font-weight="bold" fill="#B91C1C">Делегирование</tspan>: родитель хранит только NS</text>
    <text x="50" y="526">дочерней зоны и при нужде адрес сервера (glue).</text>
    <text x="50" y="558">Метка до 63 байт, имя до 255, регистр не важен.</text>
  </g>
</svg>
