id: 61
title: "Зачем DNS: пространство имён, зоны"
status: published
summary: >
  Почему от общего файла hosts.txt перешли к DNS, как устроено дерево имён (метки,
  полные имена с точкой, домены верхнего уровня, ограничения длины и регистр), чем
  домен отличается от зоны и как работает делегирование. На практике - свои корень,
  домен верхнего уровня и зона на трёх серверах BIND, вопросы к каждому серверу по
  отдельности, направления и авторитетные ответы, забытая точка в файле зоны.
  Безопасность: кто управляет делегированием, тот управляет именем.

quiz:
  - q: Почему от файла hosts.txt перешли к DNS?
    options:
      - Файл нельзя было передавать по сети целиком
      - Файл не поддерживал адреса IPv4 и маски
      - Файл умел хранить не больше сотни имён
      - Файл рос, и управлять им стало невозможно
    answer: 3
    explain: >
      Пока хостов было немного, общий файл работал. С ростом сети он стал
      слишком большим, а следить централизованно за уникальностью имён и частыми
      изменениями стало невозможно. DNS распределила управление между владельцами.

  - q: Что такое зона DNS?
    options:
      - Часть домена без делегированных поддоменов
      - Часть домена, лежащая в одной IP-подсети
      - Набор доменов с одинаковой длиной имени
      - Список всех IP-адресов одного сервера
    answer: 0
    explain: >
      Домен - всё поддерево под узлом. Зона - часть, которую обслуживает один
      набор авторитетных серверов: домен минус делегированные поддомены. В опыте
      dev.corp.lab - домен без своей зоны.

  - q: Что хранит родительская зона о делегированном поддомене?
    options:
      - Полную копию всех записей поддомена
      - Записи NS и при нужде адреса серверов
      - Только адрес главного сайта поддомена
      - Список всех пользователей поддомена
    answer: 1
    explain: >
      Родитель хранит указатель: записи NS с именами серверов дочерней зоны, а
      если серверы названы именами внутри неё самой - ещё и их адреса (glue). В
      опыте корень вернул NS для lab. и адрес ns.nic.lab.

  - q: Что ответил корневой сервер в опыте на вопрос о www.corp.lab?
    options:
      - Адрес www.corp.lab с флагом aa
      - Ошибку NXDOMAIN о несуществующем имени
      - Направление к серверу зоны lab.
      - Ошибку о запрете рекурсивных запросов
    answer: 2
    explain: >
      Корень знает только домены верхнего уровня. Он вернул направление: в разделе
      AUTHORITY - NS для lab., в ADDITIONAL - адрес сервера, без флага aa.

  - q: Что означает флаг aa в ответе DNS?
    options:
      - Ответ взят из кэша резолвера
      - Ответ дал сервер самой зоны
      - Ответ проверен подписью DNSSEC
      - Ответ пришёл по протоколу TCP
    answer: 1
    explain: >
      aa - authoritative answer: ответ дал сервер, который обслуживает зону этого
      имени. В опыте его поставил сервер corp.lab., а корень и сервер lab. давали
      направления без этого флага.

  - q: Что получилось из записи "mail CNAME www.corp.lab" без точки в конце?
    options:
      - Имя www.corp.lab.corp.lab.
      - Ошибка загрузки всей зоны
      - Имя www.corp.lab. без изменений
      - Имя mail.www.corp.lab.
    answer: 0
    explain: >
      Без точки имя относительное, и сервер дописал к нему имя зоны. Пишут либо
      полное имя с точкой, либо только относительную часть; named-checkzone такую
      ошибку не ловит, потому что синтаксически запись правильная.

  - q: Какое ограничение на длину метки в имени DNS?
    options:
      - Не длиннее 16 байт
      - Не длиннее 128 байт
      - Длина метки не ограничена
      - Не длиннее 63 байт
    answer: 3
    explain: >
      Метка - до 63 байт, имя целиком - до 255 байт в формате пакета. В опыте
      метку из 64 символов dig отказался даже отправлять.

  - q: Почему захват учётной записи у регистратора опасен для всего домена?
    options:
      - Регистратор хранит все пароли пользователей сайта
      - Регистратор обслуживает корневые серверы DNS
      - Через неё можно сменить NS домена у родителя
      - Через неё можно менять адреса в сети провайдера
    answer: 2
    explain: >
      Доверие в DNS идёт сверху вниз. Сменив NS у родителя, злоумышленник
      направит все запросы к домену на свои серверы. Защита - двухфакторная
      аутентификация, блокировка изменений, своевременное продление.

open_questions:
  - q: Как устроено пространство имён DNS и чем домен отличается от зоны?
    reference: >
      Имена образуют дерево с безымянным корнем; имя узла - метки от него до
      корня через точку, полное имя оканчивается точкой. Метка до 63 байт, имя до
      255, регистр не важен. Ниже корня - домены верхнего уровня (общие и
      национальные). Домен - узел со всем поддеревом. Зона - часть дерева, которую
      обслуживает один набор авторитетных серверов; граница зоны проходит там, где
      родитель делегировал поддомен записями NS. Поддомен без делегирования
      остаётся в зоне родителя.
    key_points:
      - дерево меток и полное имя с точкой
      - ограничения длины и регистр
      - домен - поддерево
      - зона - часть с одним набором серверов, граница - делегирование

  - q: Что такое делегирование и связующие записи (glue)? Как это было видно в опыте?
    reference: >
      Делегирование - передача поддомена другому владельцу: в родительской зоне
      появляются записи NS с именами серверов дочерней зоны. Если имя сервера
      лежит внутри дочерней зоны, родитель хранит и его адрес (glue), иначе узнать
      адрес было бы нельзя. В опыте корень на вопрос о www.corp.lab вернул NS для
      lab. и адрес ns.nic.lab, сервер lab. - NS для corp.lab. и адрес ns.corp.lab,
      и только сервер corp.lab. дал ответ с флагом aa.
    key_points:
      - NS в родительской зоне
      - glue для серверов внутри дочерней зоны
      - направления без aa, ответ с aa
      - путь корень, lab., corp.lab.

  - q: Как защитить свой домен от захвата и висячих записей?
    reference: >
      Кто управляет делегированием выше по дереву, управляет и именем, поэтому
      учётную запись у регистратора защищают двухфакторной аутентификацией и
      отдельной почтой, включают блокировку изменений и продлевают домен заранее.
      Регулярно сверяют NS у родителя с ожидаемыми и удаляют записи NS и CNAME,
      указывающие на ресурсы, которыми больше не пользуются. Файлы зон пишут
      внимательно и проверяют перед загрузкой; авторитетный сервер не выполняет
      рекурсию для всех.
    key_points:
      - защита учётной записи регистратора
      - продление домена
      - проверка NS и удаление висячих записей
      - аккуратные файлы зон
