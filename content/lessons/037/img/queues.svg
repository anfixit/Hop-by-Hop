<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Две очереди слушающего сокета в Linux</text>

  <g font-size="16" text-anchor="middle" fill="#0E1830">
    <rect x="40" y="150" width="170" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="125" y="200" font-size="18" font-weight="bold">Клиенты</text><text x="125" y="226">шлют SYN</text>

    <rect x="290" y="110" width="300" height="200" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
    <text x="440" y="142" font-size="18" font-weight="bold">Очередь незавершённых</text>
    <text x="440" y="168">SYN получен, SYN + ACK отправлен,</text><text x="440" y="190">ждём последний ACK</text>
    <text x="440" y="222" fill="#475569">состояние SYN-RECV</text>
    <text x="440" y="258" fill="#475569">предел: тот же backlog; без cookies -</text><text x="440" y="280" fill="#475569">ещё и порог tcp_max_syn_backlog</text>

    <rect x="670" y="110" width="300" height="200" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="820" y="142" font-size="18" font-weight="bold">Очередь готовых</text>
    <text x="820" y="168">рукопожатие завершено,</text><text x="820" y="190">программа ещё не забрала</text>
    <text x="820" y="222" fill="#475569">состояние ESTAB</text>
    <text x="820" y="258" fill="#475569">предел: backlog из listen(),</text><text x="820" y="280" fill="#475569">но не больше somaxconn</text>

    <rect x="1030" y="150" width="140" height="120" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <text x="1100" y="200" font-size="18" font-weight="bold">Программа</text><text x="1100" y="226">accept()</text>
  </g>

  <g stroke="#475569" stroke-width="3">
    <line x1="210" y1="210" x2="274" y2="210"/><line x1="590" y1="210" x2="654" y2="210"/><line x1="970" y1="210" x2="1014" y2="210"/>
  </g>
  <g fill="#475569">
    <polygon points="290,210 272,202 272,218"/><polygon points="670,210 652,202 652,218"/><polygon points="1030,210 1012,202 1012,218"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#475569">
    <text x="250" y="196">SYN</text><text x="630" y="196">ACK</text>
  </g>

  <rect x="40" y="345" width="550" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="315" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#0E1830">Переполнена очередь незавершённых</text>
  <text x="315" y="404" text-anchor="middle" font-size="15" fill="#0E1830">так действует SYN flood: третий шаг не приходит.</text>
  <text x="315" y="428" text-anchor="middle" font-size="15" fill="#0E1830">Защита - SYN cookies: запись не хранится,</text>
  <text x="315" y="450" text-anchor="middle" font-size="15" fill="#0E1830">всё нужное зашито в начальный номер сервера.</text>

  <rect x="610" y="345" width="550" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="885" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#0E1830">Переполнена очередь готовых</text>
  <text x="885" y="404" text-anchor="middle" font-size="15" fill="#0E1830">программа не успевает вызывать accept().</text>
  <text x="885" y="428" text-anchor="middle" font-size="15" fill="#0E1830">Новые SYN отбрасываются, клиенты повторяют;</text>
  <text x="885" y="450" text-anchor="middle" font-size="15" fill="#0E1830">растут счётчики ListenOverflows и ListenDrops.</text>

  <rect x="40" y="485" width="1120" height="55" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="519" text-anchor="middle" font-size="17" fill="#0E1830">Рукопожатие выполняет ядро: клиент видит соединение установленным ещё до вызова accept().</text>
</svg>