id: 37
title: "Установление TCP-соединения: тройное рукопожатие и состояния"
status: published
summary: >
  Почему для начала разговора нужно три шага: задержавшиеся дубликаты, начальные
  порядковые номера и их подтверждение. Сегменты рукопожатия, одновременное открытие,
  отказ через RST. Состояния клиента и сервера, две очереди слушающего сокета, повторы
  потерянных SYN. На практике - рукопожатия с настоящими номерами, состояния в ss,
  потерянный ответ сервера, переполненная очередь. SYN flood и SYN cookies - принцип
  и защита.

quiz:
  - q: Какие сегменты составляют тройное рукопожатие TCP?
    options:
      - SYN, затем ACK, затем SYN с данными
      - SYN, затем SYN и ACK, затем ACK
      - SYN, затем ACK, затем FIN и ACK
      - ACK, затем SYN и ACK, затем SYN
    answer: 1
    explain: >
      Клиент отправляет SYN со своим начальным номером, сервер отвечает SYN и ACK со
      своим номером и подтверждением, клиент подтверждает номер сервера сегментом ACK.

  - q: Клиент отправил SYN с порядковым номером 5000. Какой номер подтверждения будет в ответе сервера?
    options:
      - 5000, номер полученного SYN
      - 4999, последний байт до SYN
      - Любой, сервер выбирает сам
      - 5001, SYN занял один номер
    answer: 3
    explain: >
      Номер подтверждения - это следующий ожидаемый номер, а SYN занимает один номер.
      Поэтому сервер подтверждает x + 1. Свой собственный начальный номер сервер
      выбирает сам, и он идёт в поле порядкового номера.

  - q: От чего в первую очередь защищает обмен начальными номерами в три шага?
    options:
      - От задержавшихся дубликатов
      - От искажения битов при передаче
      - От перегрузки сети пакетами
      - От подслушивания данных в сети
    answer: 0
    explain: >
      Сеть может доставить старую копию запроса на соединение, когда о нём все забыли.
      Сервер сам не отличит её от нового запроса, поэтому называет свой номер и ждёт
      подтверждения: на старый дубликат клиент подтверждения не даст.

  - q: Почему начальные порядковые номера сегодня выбирают непредсказуемыми?
    options:
      - Чтобы соединения устанавливались быстрее
      - Чтобы заголовок сегмента был короче
      - Чтобы посторонний не подделал сегменты
      - Чтобы номера никогда не шли по кругу
    answer: 2
    explain: >
      Зная номера, посторонний мог бы вставить в чужое соединение свои сегменты. По
      RFC 6528 начальный номер складывается из показаний часов и хеша от адресов,
      портов и секрета узла.

  - q: В каком состоянии находится запись соединения на сервере, который ответил на запрос клиента и ждёт завершающее подтверждение?
    options:
      - LISTEN
      - SYN-RECEIVED
      - SYN-SENT
      - ESTABLISHED
    answer: 1
    explain: >
      SYN-RECEIVED (в выводе ss - SYN-RECV): запись о соединении уже заведена, но
      рукопожатие не завершено. SYN-SENT - состояние клиента после отправки SYN.

  - q: Программа получила "Connection timed out", а не "Connection refused". Что это значит?
    options:
      - Порт закрыт, узел ответил сегментом RST
      - Сервер принял соединение и сразу закрыл
      - Клиент отправил неверный номер порта
      - Ответа на SYN не было, повторы не помогли
    answer: 3
    explain: >
      Refused - быстрый отказ: узел ответил RST, порт закрыт. Timed out - на SYN не
      пришло ничего, клиент повторял его и сдался: узел выключен, пакеты отбрасывает
      фильтр или теряет сеть, либо сервер не успевает принимать соединения.

  - q: На чём основана атака SYN flood?
    options:
      - Сервер хранит запись о каждом незавершённом запросе
      - Сервер отвечает на SYN слишком большими сегментами
      - Сервер не проверяет контрольную сумму в сегментах SYN
      - Сервер выбирает начальные номера по порядку с нуля
    answer: 0
    explain: >
      На втором шаге сервер заводит запись и держит её до третьего шага или до
      истечения времени. Поток SYN без третьего шага заполняет очередь незавершённых
      соединений, и настоящие клиенты не могут подключиться.

  - q: Как SYN cookies позволяют серверу не хранить незавершённые соединения?
    options:
      - Сервер просит клиента прислать SYN ещё раз позже
      - Сервер отвечает RST на каждый второй SYN
      - Нужные сведения зашиты в начальный номер сервера
      - Клиент повторяет свой SYN с особым параметром
    answer: 2
    explain: >
      Сервер вычисляет свой начальный номер из счётчика времени, кода MSS и хеша с
      секретом и забывает о запросе. Настоящий клиент вернёт этот номер плюс один в
      третьем шаге, и сервер проверит его, пересчитав хеш.

open_questions:
  - q: Почему для установления соединения нужно именно три шага, а не два?
    reference: >
      Сеть может задержать и продублировать пакеты, и сервер не помнит номера прошлых
      соединений, поэтому не может сам отличить свежий запрос от старого дубликата.
      В три шага каждая сторона называет свой начальный номер и получает его
      подтверждение: SYN с номером x, SYN и ACK с номером y и подтверждением x + 1, ACK
      с подтверждением y + 1. На старый дубликат SYN клиент не подтвердит номер сервера,
      и соединение не установится. При двух шагах сервер считал бы соединение открытым
      по любому старому SYN.
    key_points:
      - задержавшиеся дубликаты
      - каждая сторона подтверждает начальный номер другой
      - SYN, SYN и ACK, ACK с номерами x + 1 и y + 1
      - при двух шагах старый SYN открыл бы соединение

  - q: Через какие состояния проходят клиент и сервер при установлении соединения и что происходит, если сегмент рукопожатия потерялся?
    reference: >
      Клиент: CLOSED, после connect и отправки SYN - SYN-SENT, после получения SYN и
      ACK - ESTABLISHED. Сервер: LISTEN, после получения SYN и ответа - SYN-RECEIVED,
      после получения ACK - ESTABLISHED. Потерянные SYN и SYN с ACK отправляются заново
      по таймеру с удвоением ожидания; число повторов ограничено, после чего клиент
      получает ошибку "timed out", а сервер удаляет запись незавершённого соединения.
      Если порт закрыт, приходит RST и клиент сразу получает "refused".
    key_points:
      - клиент - SYN-SENT, затем ESTABLISHED
      - сервер - LISTEN, SYN-RECEIVED, ESTABLISHED
      - повторы с удвоением ожидания, ограниченное число
      - timed out против refused

  - q: Как устроена атака SYN flood и как от неё защищаются?
    reference: >
      Сервер на втором шаге рукопожатия заводит запись о соединении и хранит её, пока
      не придёт ACK или не истечёт время. Поток SYN, обычно с поддельными адресами, без
      завершающего ACK заполняет очередь незавершённых соединений, и настоящие клиенты
      не могут подключиться. Защита: SYN cookies - сервер не хранит запись, а кодирует нужное
      в своём начальном номере (счётчик времени, код MSS, хеш с секретом) и проверяет
      его по пришедшему ACK; увеличение очереди и сокращение числа повторов; фильтрация
      пакетов с поддельными адресами в сетях-источниках; защита на входе в сеть. Цена
      cookies - теряются параметры из SYN, поэтому их включают при переполнении очереди.
    key_points:
      - запись на каждый SYN, очередь незавершённых соединений
      - поддельные адреса, третий шаг не приходит
      - SYN cookies - состояние в начальном номере
      - настройка очереди, фильтрация поддельных адресов
