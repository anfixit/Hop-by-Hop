id: 58
title: "Типы NAT, hairpin, CGNAT, обход NAT"
status: published
summary: >
  Поведение NAT по RFC 4787: сопоставление и фильтрация, старые "конусы" и
  симметричный NAT, поведение Linux. Hairpin и зачем ему SNAT, провайдерский NAT
  (CGNAT, 100.64.0.0/10) и его последствия, обход NAT: STUN, пробивка, TURN, ICE,
  UPnP, NAT-PMP и PCP. На практике - два NAT подряд, отражатель в духе STUN,
  фильтрация и пробивка, домашний проброс за CGNAT и настройка hairpin.

quiz:
  - q: Что значит "независимое сопоставление" (endpoint-independent mapping) в NAT?
    options:
      - NAT пропускает пакеты от любых отправителей
      - Внешняя пара одна для всех получателей
      - Для каждого получателя новый внешний порт
      - NAT не меняет адрес отправителя
    answer: 1
    explain: >
      Один внутренний адрес и порт получает одну внешнюю пару, куда бы ни шли
      пакеты. В опыте оба адреса отражателя видели a как 203.0.113.1:5000. Пропуск
      пакетов от любых отправителей - это про фильтрацию, а не сопоставление.

  - q: В опыте пакет от 203.0.113.101:3478 дошёл до a, а от 203.0.113.101:3479 нет. Почему?
    options:
      - Порт 3479 не входит в диапазон NAT
      - Пакет с порта 3479 был больше MTU
      - a сам писал на 203.0.113.101:3478
      - Провайдерский NAT пропускает только порт 3478
    answer: 2
    explain: >
      Внутрь проходят только пакеты, совпадающие с записью conntrack, вплоть до
      порта. Запись появилась, когда a сам отправил пакет на 203.0.113.101:3478, а
      на порт 3479 он не писал. На этом основана пробивка NAT.

  - q: Почему hairpin не работает только с правилом DNAT для внутренней сети?
    options:
      - Сервер отвечает напрямую, мимо маршрутизатора
      - DNAT нельзя применять к внутренним адресам
      - Маршрутизатор отбрасывает пакеты на свой адрес
      - Клиент не знает публичный адрес маршрутизатора
    answer: 0
    explain: >
      Сервер видит внутренний адрес клиента и отвечает ему по локальной сети.
      Клиент ждал ответа от публичного адреса и такой ответ не принимает. SNAT
      заставляет ответ вернуться через маршрутизатор.

  - q: Какой диапазон RFC 6598 отвёл для адресов абонентов за провайдерским NAT?
    options:
      - 192.168.0.0/16
      - 169.254.0.0/16
      - 127.0.0.0/8
      - 100.64.0.0/10
    answer: 3
    explain: >
      RFC 6598 отвёл 100.64.0.0/10 для сети между провайдерским NAT и маршрутизаторами абонентов. Если такой адрес на
      внешнем интерфейсе домашнего маршрутизатора, а сайты показывают другой
      адрес, вы за провайдерским NAT.

  - q: Почему за CGNAT не работает проброс порта, настроенный дома?
    options:
      - Домашний маршрутизатор не поддерживает DNAT
      - Провайдерский NAT не знает проброса
      - CGNAT блокирует все порты выше 1024
      - Проброс работает только по протоколу IPv6
    answer: 1
    explain: >
      Снаружи виден адрес провайдерского NAT, и пакет до дома не доходит. В опыте
      из интернета был Connection refused, а из сети провайдера на 100.64.0.2
      проброс работал.

  - q: Что делает сервер STUN?
    options:
      - Ретранслирует весь трафик между устройствами
      - Открывает порт на маршрутизаторе
      - Сообщает внешний адрес и порт клиента
      - Выдаёт устройствам частные адреса
    answer: 2
    explain: >
      STUN отвечает, с какого внешнего адреса и порта он видит запрос. Сам NAT он
      не обходит, а даёт сведения для пробивки и ICE. Ретранслирует трафик TURN,
      открывает порт UPnP или PCP.

  - q: Когда пробивка обычно не удаётся и нужен TURN?
    options:
      - Когда NAT даёт свой порт каждому получателю
      - Когда оба устройства в одной локальной сети
      - Когда NAT сохраняет порт клиента
      - Когда фильтрация независимая
    answer: 0
    explain: >
      Если внешний порт для каждого получателя свой, отражённый адрес от STUN не
      подходит для партнёра, и пробивка обычно не удаётся. Тогда трафик идёт через
      ретранслятор TURN.

  - q: Что делает ICE?
    options:
      - Шифрует соединение между устройствами
      - Заменяет NAT на адреса IPv6
      - Назначает внешние порты на NAT
      - Выбирает лучший путь из кандидатов
    answer: 3
    explain: >
      ICE собирает кандидатов - свои адреса, отражённые через STUN и
      ретранслируемые через TURN, - проверяет пары по приоритету и выбирает
      лучший рабочий путь. Так соединяются браузеры в WebRTC.

open_questions:
  - q: Опиши, чем отличаются сопоставление и фильтрация в NAT и как ведёт себя Linux.
    reference: >
      Сопоставление определяет, какую внешнюю пару адрес и порт NAT даёт
      внутреннему сокету: независимое - одну для всех получателей, зависимое от
      адреса или от адреса и порта - свою для каждого (последнее - "симметричный
      NAT"). Фильтрация определяет, чьи пакеты пропускать внутрь на внешнюю пару:
      от всех, только от адресов или только от адресов и портов, куда уже
      отправляли. RFC 4787 требует независимого сопоставления. Linux с masquerade
      сохраняет порт (независимое сопоставление, пока порт свободен) и фильтрует по
      адресу и порту через записи conntrack.
    key_points:
      - сопоставление - какая внешняя пара
      - фильтрация - кого пускать
      - RFC 4787 требует независимого сопоставления
      - Linux - сохранение порта, фильтрация по адресу и порту

  - q: Что такое hairpin и как его настроить на Linux-маршрутизаторе?
    reference: >
      Hairpin - обращение компьютера изнутри сети к службе по публичному адресу
      маршрутизатора, где настроен проброс. Без правил DNAT, привязанный к
      внешнему интерфейсу, к такому пакету не применяется. С DNAT для внутренней
      сети сервер получает пакет с внутренним адресом клиента и отвечает напрямую,
      клиент такой ответ отвергает. Нужно ещё SNAT для этого трафика: тогда сервер
      видит адрес маршрутизатора и ответ возвращается через него. Альтернатива -
      split DNS с внутренним адресом сервера.
    key_points:
      - обращение изнутри к своему публичному адресу
      - DNAT и для внутренней сети
      - SNAT, чтобы ответ шёл через маршрутизатор
      - split DNS как альтернатива

  - q: Как два устройства за NAT устанавливают прямое соединение?
    reference: >
      Каждое узнаёт у сервера STUN свой отражённый адрес - как его видят снаружи.
      Через сервер-посредник (сигнальный канал) они обмениваются этими адресами и
      почти одновременно отправляют пакеты друг другу: пакет каждой стороны
      создаёт запись в её NAT, и встречный проходит как ответ - это пробивка NAT.
      Она работает при независимом сопоставлении. Если сопоставление зависит от
      получателя, трафик идёт через ретранслятор TURN. ICE собирает все варианты и
      выбирает лучший рабочий путь (WebRTC).
    key_points:
      - STUN и отражённый адрес
      - пробивка, встречные пакеты
      - TURN при зависимом сопоставлении
      - ICE выбирает путь
