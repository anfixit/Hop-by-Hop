id: 68
title: "Основы: шифр, ключ, принцип Керкгоффса"
status: published
summary: >
  Язык криптографии: открытый текст, шифртекст, ключ, цели (конфиденциальность,
  целостность, аутентичность), пассивный и активный противник, атаки по
  шифртексту, известному и выбранному тексту. Принцип Керкгоффса и почему
  безопасность через неясность не работает, классические шифры и частотный
  анализ, одноразовый блокнот, два принципа Таненбаума, длина ключа. На практике
  - перебор шифра Цезаря, частоты в шифре замены, повторный одноразовый блокнот,
  AES в openssl и время перебора ключей.

quiz:
  - q: Что по принципу Керкгоффса должно оставаться секретом?
    options:
      - Только ключ шифрования данных
      - Устройство алгоритма шифрования
      - Длина шифртекста сообщения
      - Имя программы для шифрования
    answer: 0
    explain: >
      Алгоритм всё равно утечёт, а ключ можно быстро сменить. Открытые алгоритмы
      годами проверяют тысячи специалистов, поэтому стандарты вроде AES публичны.

  - q: Почему шифр замены с 2^118 ключами всё равно ломается?
    options:
      - Компьютеры перебирают 2^118 ключей за минуты
      - Частоты букв сохраняются в шифртексте
      - Ключ всегда передаётся вместе с текстом
      - Шифр работает только с латиницей
    answer: 1
    explain: >
      Замена прячет буквы, но не их частоты. В опыте самая частая буква
      шифртекста встретилась 61 раз, и простое сопоставление частот уже дало 30%
      правильных букв.

  - q: Чем опасно повторное использование ключа одноразового блокнота?
    options:
      - Шифртекст становится вдвое длиннее
      - Ключ перестаёт быть по-настоящему случайным
      - XOR шифртекстов равен XOR открытых текстов
      - Расшифровать сообщение станет невозможно
    answer: 2
    explain: >
      Ключ сокращается: c1 xor c2 = m1 xor m2. Зная или угадав одно сообщение,
      противник получает второе, как в опыте.

  - q: Что такое атака с выбранным открытым текстом?
    options:
      - Противник видит лишь перехваченные шифртексты
      - Противник перебирает все ключи подряд
      - Противник крадёт ключ с сервера
      - Противник получает шифровки своих текстов
    answer: 3
    explain: >
      Противник заставляет систему зашифровать подобранные им тексты и изучает
      результат. Современный шифр обязан выдерживать и это.

  - q: Какая длина ключа считается минимальной для симметричного шифра сегодня?
    options:
      - 56 бит
      - 128 бит
      - 64 бита
      - 40 бит
    answer: 1
    explain: >
      При 10^12 ключей в секунду 56 бит перебираются меньше чем за сутки, а 128 бит
      - за 10^19 лет. Для долгосрочной защиты берут 256 бит.

  - q: Зачем по Таненбауму нужна свежесть сообщений?
    options:
      - Чтобы защититься от повтора старых сообщений
      - Чтобы шифровать быстрее, чем приходят пакеты
      - Чтобы ключи менялись каждую секунду
      - Чтобы сообщения не устаревали в кэше
    answer: 0
    explain: >
      Противник может записать настоящее зашифрованное сообщение и отправить его
      снова. Метки времени, номера и одноразовые числа это выявляют.

  - q: Что показал опыт с AES и ключом, изменённым в одном бите?
    options:
      - Текст расшифровался с одной ошибкой
      - openssl отказался запускаться
      - Получилась бессмыслица вместо текста
      - Шифртекст оказался тем же самым
    answer: 2
    explain: >
      Без точного ключа расшифровать нельзя, даже зная алгоритм: результат -
      случайные байты.

  - q: Как правильно получать ключи шифрования?
    options:
      - Из пароля администратора и даты
      - Из обычного генератора random
      - Из имени сервера и его адреса
      - Из криптостойкого генератора случайности
    answer: 3
    explain: >
      Ключ, который можно угадать, равносилен короткому. Нужны /dev/urandom,
      openssl rand или аналогичные источники.

open_questions:
  - q: Сформулируй принцип Керкгоффса и объясни, почему безопасность через неясность не работает.
    reference: >
      Алгоритм шифрования должен быть открытым, секретом остаётся только ключ.
      Алгоритм всё равно приходится распространять, и он утечёт, а заменить его
      трудно; ключ меняется быстро. Стойкость алгоритма проверяется только годами
      публичного анализа. Если тайный алгоритм уже раскрыт, а все считают его
      секретным, вред больше. Поэтому стандартные шифры публичны, а защищают ключи.
    key_points:
      - алгоритм открыт, ключ секретен
      - алгоритм утечёт, ключ меняется
      - публичный анализ
      - ложное чувство защиты

  - q: Почему большое число ключей не гарантирует стойкости? Приведи пример из опыта.
    reference: >
      Шифр может протекать структурой открытого текста. У моноалфавитной замены
      32! ≈ 2^118 ключей, перебор невозможен, но частоты букв сохраняются, и
      сопоставление частот уже дало 30% правильных букв, а угадывание слов
      раскрывает остальное. Хороший шифр не оставляет противнику ничего, кроме
      полного перебора.
    key_points:
      - структура протекает
      - частотный анализ
      - хороший шифр - только перебор

  - q: В чём сила и слабость одноразового блокнота?
    reference: >
      Если ключ действительно случайный, длиной с сообщение и используется один
      раз, шифр абсолютно стоек: шифртекст может соответствовать любому тексту
      той же длины. Слабость - ключей нужно столько же, сколько данных, и их надо
      тайно доставить. При повторном использовании ключа XOR шифртекстов равен
      XOR открытых текстов, и по одному сообщению восстанавливается другое.
    key_points:
      - абсолютная стойкость при условиях
      - ключ длиной с данные
      - повтор ключа разрушает защиту
