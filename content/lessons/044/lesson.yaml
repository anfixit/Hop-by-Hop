id: 44
title: "Путь пакета от сетевой карты до сокета: sk_buff и NAPI"
status: published
summary: >
  Что делает Linux с пакетом от сетевой карты до программы и обратно: кольца приёма и
  передачи, несколько очередей и RSS, прерывания и NAPI с бюджетом, структура sk_buff
  и сдвиг указателей вместо копирования, порядок обработки на приёме и отправке, место
  tcpdump, tc и netfilter на этом пути, места потерь и их счётчики. На практике -
  настоящая карта сервера, пакеты, отброшенные файерволом на входе и выходе,
  переполненная очередь сокета и порт без программы.

quiz:
  - q: Как пакет попадает из сетевой карты в память компьютера?
    options:
      - Процессор читает каждый байт из карты по одному
      - Карта сама пишет его в буфер из кольца приёма
      - Драйвер копирует пакет из карты в сокет программы
      - Карта передаёт пакет прямо в программу
    answer: 1
    explain: >
      Драйвер заранее даёт карте буферы через кольцо дескрипторов, и карта сама
      записывает в них кадры прямым доступом к памяти (DMA), без участия процессора.
      Дальше пакет обрабатывает ядро.

  - q: Зачем Linux использует NAPI вместо прерывания на каждый пакет?
    options:
      - Чтобы шифровать пакеты на сетевой карте
      - Чтобы отбрасывать пакеты без адреса получателя
      - Чтобы под нагрузкой забирать пакеты пачками
      - Чтобы tcpdump получал копию каждого пакета
    answer: 2
    explain: >
      Прерывание на каждый пакет при миллионах пакетов в секунду отнимало бы всё время
      процессора. NAPI после первого прерывания выключает их и опрашивает очередь,
      забирая пакеты пачками в пределах бюджета, пока очередь не опустеет.

  - q: Как sk_buff позволяет не копировать данные при переходе между уровнями?
    options:
      - Уровень сдвигает указатель начала данных
      - Каждый уровень получает свою копию пакета
      - Заголовки хранятся отдельно от данных в сокете
      - Данные сжимаются перед передачей выше
    answer: 0
    explain: >
      При приёме уровень разбирает свой заголовок и сдвигает указатель начала данных
      вперёд, при отправке - назад, дописывая заголовок в заранее оставленное место.
      Сами байты пакета остаются на месте.

  - q: tcpdump показывает входящие пакеты, а программа их не получает. Что из этого может быть причиной?
    options:
      - tcpdump удаляет пакеты после того, как их записал
      - Пакеты отбросил файервол, который стоит после tcpdump
      - tcpdump перехватывает пакет и не отдаёт его ядру
      - Ядро передаёт пакеты программам только при выключенном tcpdump
    answer: 1
    explain: >
      На приёме tcpdump получает копию до tc ingress и netfilter. Пакет, который
      потом отбросит правило файервола, в записи будет, а до сокета не дойдёт. В
      опыте tcpdump увидел 5 дейтаграмм, программа - ни одной.

  - q: Правило файервола в точке OUTPUT отбрасывает исходящие дейтаграммы. Что увидит программа и tcpdump на этой машине?
    options:
      - Программа - успех, tcpdump - все дейтаграммы
      - Программа - успех, tcpdump - ничего
      - Программа - ошибку, tcpdump - все дейтаграммы
      - Программа - ошибку, tcpdump - ничего
    answer: 3
    explain: >
      На отправке tcpdump стоит после netfilter и дисциплины очереди, поэтому
      отброшенного не видит. А ядро сразу сообщает программе: в опыте каждый sendto
      вернул "Operation not permitted".

  - q: Программа на UDP не успевает читать, и её очередь приёма заполнилась. Что происходит с новыми дейтаграммами?
    options:
      - Ядро просит отправителя замедлиться
      - Ядро сохраняет их на диск до прочтения
      - Ядро отбрасывает их и увеличивает счётчик
      - Ядро возвращает их отправителю
    answer: 2
    explain: >
      У UDP нет управления потоком: лишние дейтаграммы отбрасываются, растёт счётчик
      UdpRcvbufErrors, отправитель ничего не узнаёт. В опыте из 1000 дейтаграмм
      программе досталось 10. У TCP окно обычно останавливает отправителя раньше.

  - q: Почему исходящие пакеты в опытах с netem появлялись в записи tcpdump позже, чем их отправляли?
    options:
      - tcpdump на отправке стоит после дисциплины очереди
      - tcpdump записывает пакеты только по подтверждению
      - Ядро задерживает копии для tcpdump на 50 мс
      - Часы tcpdump идут медленнее системных
    answer: 0
    explain: >
      netem - это дисциплина очереди интерфейса. tcpdump получает копию исходящего
      пакета уже после неё, то есть после того, как пакет отстоял заданную задержку.

  - q: Где посмотреть, сколько раз отложенной обработке приёма не хватило бюджета?
    options:
      - В выводе команды ss -tni для сокетов
      - В счётчиках nstat UdpNoPorts
      - В выводе ethtool -g для карты
      - В файле /proc/net/softnet_stat
    answer: 3
    explain: >
      В softnet_stat для каждого процессора есть число обработанных пакетов,
      отброшенных во входной очереди и "сжатий" - проходов, которые закончились
      раньше, чем очередь опустела. ethtool -g показывает размеры колец, ss и nstat - сокеты и протоколы.

open_questions:
  - q: Как устроен приём пакетов в Linux от сетевой карты до программы?
    reference: >
      Драйвер даёт карте буферы через кольцо приёма, карта записывает в них кадры по
      DMA. На первый пакет приходит прерывание, драйвер выключает прерывания очереди и
      планирует отложенную обработку NAPI, которая опрашивает очередь и забирает пакеты
      пачками в пределах бюджета. Каждый пакет оформляется в sk_buff. Дальше: копия для
      наблюдателей вроде tcpdump, tc ingress, netfilter PREROUTING, решение о маршруте,
      netfilter INPUT, протокол TCP или UDP находит сокет по адресам и портам, данные
      ставятся в очередь приёма сокета, и программа забирает их вызовом recv.
    key_points:
      - кольцо приёма и DMA
      - прерывание, затем опрос NAPI с бюджетом
      - sk_buff
      - tcpdump, tc, netfilter, маршрут, сокет, очередь, recv

  - q: Что такое sk_buff и почему ядро не копирует пакет на каждом уровне?
    reference: >
      sk_buff - структура ядра, описывающая пакет: где лежат данные, через какой
      интерфейс он пришёл или уйдёт, какому сокету принадлежит, метки времени и
      файервола. У неё есть указатели на выделенную память и на начало и конец
      полезных данных. При приёме каждый уровень разбирает свой заголовок и сдвигает
      начало данных вперёд, при отправке - назад, дописывая заголовок в оставленное
      заранее место. Копирования не нужно. Наблюдателям вроде tcpdump ядро передаёт
      ссылку на тот же sk_buff или его клон, а сокет tcpdump копирует себе только
      нужные байты.
    key_points:
      - описание пакета, а не сами байты
      - указатели на данные
      - сдвиг указателя вместо копирования
      - tcpdump получает ссылку или клон

  - q: Где на пути через ядро пакет может пропасть и как это обнаружить?
    reference: >
      В кольце приёма карты, если процессор не успевает его разбирать (ethtool -S); во
      входной очереди процессора (вторая колонка /proc/net/softnet_stat); в
      дисциплине очереди на отправке (tc -s qdisc); в файерволе (счётчики правил nft);
      при отсутствии сокета и при переполненной очереди сокета (nstat: UdpNoPorts,
      UdpRcvbufErrors и др.). Важно помнить порядок: на приёме tcpdump видит пакет
      раньше файервола, на отправке - позже, поэтому по одной записи tcpdump нельзя
      сказать, дошёл ли пакет до программы или ушёл ли в сеть.
    key_points:
      - кольцо карты, входная очередь процессора
      - дисциплина очереди, файервол
      - сокет - нет сокета или полна очередь
      - место tcpdump на приёме и отправке
