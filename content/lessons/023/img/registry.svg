<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Кто раздаёт адреса</text>

  <g font-size="18" text-anchor="middle" fill="#0E1830">
    <rect x="450" y="75" width="300" height="70" rx="10" fill="#0E1830"/>
    <text x="600" y="106" fill="#FFFFFF">IANA</text><text x="600" y="130" font-size="14" fill="#CBD5E1">весь адресный пул, раздавала блоками /8</text>

    <rect x="30" y="200" width="210" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="135" y="230">ARIN</text><text x="135" y="254" font-size="14" fill="#475569">Северная Америка</text>
    <rect x="260" y="200" width="210" height="92" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="365" y="230">RIPE NCC</text><text x="365" y="254" font-size="14" fill="#475569">Европа, Ближний Восток,</text>
    <text x="365" y="276" font-size="14" fill="#475569">Центральная Азия, Россия</text>
    <rect x="490" y="200" width="210" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="595" y="230">APNIC</text><text x="595" y="254" font-size="14" fill="#475569">Азия и Океания</text>
    <rect x="720" y="200" width="210" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="825" y="230">LACNIC</text><text x="825" y="254" font-size="14" fill="#475569">Латинская Америка и Карибы</text>
    <rect x="950" y="200" width="210" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="1055" y="230">AFRINIC</text><text x="1055" y="254" font-size="14" fill="#475569">Африка</text>

    <rect x="200" y="340" width="440" height="70" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="420" y="370">провайдеры и организации (LIR), например у RIPE NCC</text><text x="420" y="394" font-size="14" fill="#475569">получают блоки у своего регистратора</text>

    <rect x="200" y="470" width="440" height="70" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="420" y="500">клиенты</text><text x="420" y="524" font-size="14" fill="#475569">части блока провайдера: адрес или подсеть</text>

    <rect x="760" y="360" width="400" height="180" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="960" y="392" font-weight="bold">частные адреса (RFC 1918)</text>
    <text x="960" y="424" font-family="monospace">10.0.0.0/8</text>
    <text x="960" y="452" font-family="monospace">172.16.0.0/12</text>
    <text x="960" y="480" font-family="monospace">192.168.0.0/16</text>
    <text x="960" y="512" font-size="14" fill="#475569">никто не раздаёт: бери сам, но в интернет</text>
    <text x="960" y="530" font-size="14" fill="#475569">с ними не выйти без NAT</text>
  </g>
  <g stroke="#475569" stroke-width="2.5">
    <line x1="600" y1="145" x2="135" y2="200"/><line x1="600" y1="145" x2="365" y2="200"/><line x1="600" y1="145" x2="595" y2="200"/>
    <line x1="600" y1="145" x2="825" y2="200"/><line x1="600" y1="145" x2="1055" y2="200"/>
    <line x1="365" y1="292" x2="420" y2="340"/>
    <line x1="420" y1="410" x2="420" y2="470"/>
  </g>
</svg>
