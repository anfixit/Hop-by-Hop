id: 5
title: Уровни, протоколы и интерфейсы
status: published
summary: >
  Главный инструмент, которым инженеры справляются со сложностью сетей, -
  многоуровневый подход. Разбираем, чем интерфейс отличается от протокола,
  что такое стек и пиры, почему горизонтальный разговор уровней виртуальный,
  зачем каждый уровень добавляет свой заголовок, чем служба отличается от протокола
  и почему у каждого уровня свои угрозы.

quiz:
  - q: Какое правило действует между уровнями в многоуровневой архитектуре?
    options:
      - Каждый уровень может обращаться к любому другому уровню
      - Каждый уровень обращается только к уровню непосредственно под собой
      - Верхний уровень управляет всеми нижними напрямую
      - Уровни общаются только через приложение
    answer: 1
    explain: >
      Уровень обращается с запросами только к соседнему нижнему уровню и отдаёт результат
      только соседнему верхнему. Именно это позволяет заменять уровни независимо.

  - q: Что такое протокол в многоуровневой модели?
    options:
      - Правила общения соседних уровней внутри одного компьютера
      - Программа, которая управляет сетевой картой
      - Правила общения одинаковых уровней на разных компьютерах
      - Список всех уровней компьютера
    answer: 2
    explain: >
      Протокол описывает разговор пиров - одинаковых уровней на разных компьютерах.
      Правила общения соседних уровней внутри компьютера - это интерфейс, программа
      управления картой - драйвер, а набор протоколов всех уровней - стек.

  - q: Уровень 3 на компьютере A "общается" с уровнем 3 на компьютере B. Как на самом деле идут данные?
    options:
      - Напрямую от уровня 3 к уровню 3 по отдельному каналу
      - Вниз по уровням A, по физической среде, вверх по уровням B
      - Через приложения на обоих компьютерах
      - Через уровень 4 обоих компьютеров
    answer: 1
    explain: >
      Горизонтальный разговор пиров виртуальный. Реально каждый уровень отдаёт данные
      вниз, по физической среде идут только биты, а на приёмной стороне данные
      поднимаются вверх до уровня 3.

  - q: Зачем каждый уровень при отправке добавляет к данным свой заголовок?
    options:
      - Чтобы передать служебную информацию своему пиру на другой стороне
      - Чтобы зашифровать данные
      - Чтобы сжать данные перед отправкой
      - Чтобы уровень выше знал, как устроены нижние уровни
    answer: 0
    explain: >
      Заголовок - это служебная пометка для пира того же уровня: адрес, номер,
      контрольная информация. На приёме пир её читает и снимает, а выше не передаёт.
      Заголовки не шифруют и не сжимают данные, и верхние уровни их как раз не видят.

  - q: Один и тот же браузер без всяких изменений работает и через Wi-Fi, и через кабель, и через мобильную сеть. Какое свойство многоуровневой архитектуры это показывает?
    options:
      - Надёжность физического уровня
      - Шифрование на уровне приложения
      - "Независимость уровней: нижний заменили, служба для верхних осталась прежней"
      - Браузер сам управляет сетевыми картами
    answer: 2
    explain: >
      Нижние уровни совершенно разные, но предоставляют верхним одну и ту же службу,
      поэтому браузеру не нужно ничего менять. Браузер как раз не управляет картами
      и не знает, какая среда используется.

  - q: Чем служба отличается от протокола?
    options:
      - Служба - что уровень делает для верхнего, протокол - как
      - Служба работает только в интернете, а протокол - в локальной сети
      - Служба - это программа, а протокол - сетевое устройство
      - Это синонимы, так говорят в разных странах
    answer: 0
    explain: >
      Служба - набор операций, которые уровень предоставляет верхнему уровню через
      интерфейс, без подробностей реализации. Протокол - формат и правила сообщений
      между пирами, которыми эта служба реализована. Протокол можно поменять, не меняя
      службу.

  - q: Для голосового звонка по интернету обычно выбирают ненадёжную передачу. Почему?
    options:
      - Надёжная передача не работает для звука
      - Ожидание повторной передачи потерянных данных хуже, чем небольшая потеря звука
      - Ненадёжная передача всегда быстрее по пропускной способности
      - Звонки не требуют доставки данных
    answer: 1
    explain: >
      Надёжная передача ждёт подтверждений и повторяет потерянное, из-за чего разговор
      замирал бы. Потеря маленького кусочка звука почти незаметна, а пауза раздражает.
      Надёжная передача звук передать может, просто задержка для звонка важнее.

  - q: В выводе strace ты видишь connect(5, ... port 80 ...). Что это такое?
    options:
      - TCP-заголовок, который curl сам формирует
      - "Системный вызов: программа просит ядро подключиться к серверу"
      - Ответ сервера на запрос
      - Ошибка подключения
    answer: 1
    explain: >
      connect - системный вызов, примитив CONNECT службы надёжного потока. Программа
      лишь просит ядро установить соединение, а TCP- и IP-заголовки формируют нижние
      уровни в ядре и сетевой карте. EINPROGRESS в выводе - не ошибка, а знак, что соединение
      устанавливается в фоне.

  - q: Злоумышленник подделал адреса в локальной сети и незаметно перенаправил трафик через себя. Почему это опасно для всех верхних уровней?
    options:
      - Верхние уровни доверяют нижнему и ничего не замечают
      - Верхние уровни сразу перестают работать и выдают ошибку
      - Атака касается только канального уровня и выше не идёт
      - Верхние уровни сами перепроверяют все адреса и защищены
    answer: 0
    explain: >
      Каждый уровень считает, что нижний делает свою работу честно. Захватив нижний
      уровень, злоумышленник влияет на все верхние, а они этого не замечают. Поэтому
      важные проверки подлинности делают выше, на концах, как в TLS.

open_questions:
  - q: Объясни своими словами разницу между интерфейсом и протоколом. Приведи пример из жизни, похожий на аналогию с директорами, переводчиками и секретарями.
    reference: >
      Интерфейс - правила, по которым соседние уровни внутри одной системы просят друг
      друга об услугах. Протокол - правила, по которым общаются одинаковые уровни
      (пиры) на разных системах. Разговор пиров виртуальный: реально каждый отдаёт
      данные вниз своему нижнему уровню. Пример: директор диктует письмо переводчику
      (интерфейс), переводчики двух сторон общаются на согласованном языке (протокол),
      секретари пересылают текст выбранным способом (протокол нижнего уровня).
      Переводчики могут сменить язык, а секретари - способ пересылки, и директора
      этого не заметят.
    key_points:
      - интерфейс - по вертикали, между соседними уровнями одной системы
      - протокол - по горизонтали, между одинаковыми уровнями разных систем
      - разговор пиров виртуальный, реально данные идут вниз и вверх
      - уместная аналогия, в которой уровень можно заменить незаметно для других

  - q: Почему многоуровневая архитектура позволяет браузеру одинаково работать через Wi-Fi, кабель и мобильную сеть? Какую цену мы платим за эту гибкость?
    reference: >
      Каждый уровень пользуется только службой нижнего уровня и не знает, как она
      реализована. Wi-Fi, кабель и мобильная сеть - разные нижние уровни, но они
      предоставляют верхним одну и ту же службу доставки данных, поэтому браузер и
      сервер работают одинаково. Цена - накладные расходы: каждый уровень добавляет
      свой заголовок, и часть пропускной способности уходит на служебную информацию;
      кроме того, есть затраты на обработку на каждом уровне.
    key_points:
      - уровни независимы, верхний пользуется только службой нижнего
      - разные среды предоставляют верхним уровням одинаковую службу
      - цена - заголовки каждого уровня и затраты на обработку

  - q: Почему безопасность нельзя обеспечить на одном уровне? Приведи пример, где защита на одном уровне не спасает от атаки на другом.
    reference: >
      У каждого уровня свои угрозы: кабель подслушивают, адреса подделывают, соединения
      атакуют, приложения обманывают. Верхние уровни доверяют нижним, поэтому захват
      нижнего уровня влияет на все верхние. Защита на одном уровне закрывает только его
      угрозы. Пример: шифрование на прикладном уровне прячет содержимое, но адреса в
      заголовках нижних уровней остаются видны, и по ним видно, с кем ты общаешься.
      Или файрвол, фильтрующий по адресам и портам, не видит, что происходит внутри
      разрешённого соединения.
    key_points:
      - у каждого уровня свои угрозы
      - верхние уровни доверяют нижним, захват нижнего влияет на верхние
      - защита на одном уровне не закрывает угрозы другого
      - конкретный пример (шифрование не прячет адреса, файрвол не видит содержимое и т.п.)
