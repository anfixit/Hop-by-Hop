id: 40
title: "Таймеры и повторная передача"
status: published
summary: >
  Как TCP доставляет всё поверх сети, которая теряет пакеты: копия, таймер, повтор.
  Сколько ждать подтверждения: время оборота, сглаженная оценка и разброс, формула RTO
  Джейкобсона, алгоритм Карна, удвоение ожидания при тишине. Как узнать о потере раньше
  таймера: повторные подтверждения, SACK, быстрая повторная передача, RACK и проба
  хвоста. На практике - RTO в ss, один потерянный сегмент в потоке и повторы по таймеру
  с удвоением.

quiz:
  - q: Что означает RTO в TCP?
    options:
      - Сколько ждать подтверждения перед повтором
      - Сколько сегмент может жить в сети
      - Сколько длится состояние TIME-WAIT
      - Сколько данных можно отправить без подтверждения
    answer: 0
    explain: >
      RTO (Retransmission TimeOut) - время ожидания подтверждения. Если оно истекло, а
      подтверждения на самый старый неподтверждённый сегмент нет, сегмент отправляется
      повторно.

  - q: Из чего вычисляется RTO по схеме Джейкобсона?
    options:
      - Из размера окна и MSS соединения
      - Из удвоенного последнего замера времени оборота
      - Из сглаженного времени оборота и его разброса
      - Из числа маршрутизаторов на пути
    answer: 2
    explain: >
      RTO = SRTT + 4 * RTTVAR: сглаженное время оборота плюс запас, который растёт
      вместе с разбросом замеров. Удвоенное время оборота использовали ранние
      реализации, и под нагрузкой это давало лишние повторы.

  - q: Время оборота стабильно 50 мс, разброс почти нулевой. Каким будет RTO в Linux?
    options:
      - Около 50 мс, равен времени оборота
      - Ровно 1 секунда, как требует стандарт
      - Около 100 мс, вдвое больше оборота
      - Около 250 мс, оборот плюс запас 200 мс
    answer: 3
    explain: >
      В Linux запас в RTO не бывает меньше 200 мс, поэтому при обороте 50 мс получается
      около 250: в опыте было rto:252. Стандарт советует не опускать RTO ниже секунды,
      но реальные системы границу снижают.

  - q: Что предписывает алгоритм Карна?
    options:
      - Отправлять каждый сегмент дважды для надёжности
      - Не учитывать замеры по повторённым сегментам
      - Подтверждать каждый второй сегмент
      - Закрывать соединение после трёх повторов
    answer: 1
    explain: >
      По подтверждению на повторённый сегмент нельзя понять, к какой отправке оно
      относится, и оценка времени оборота испортилась бы. Поэтому такие замеры не
      учитывают, а ожидание при каждом повторе удваивают.

  - q: Собеседник перестал отвечать. Как идут повторы одного и того же сегмента по таймеру?
    options:
      - Через равные промежутки, пока не ответит
      - Всё чаще, чтобы пробиться быстрее
      - С удвоением ожидания, до предела повторов
      - Один повтор, потом сразу ошибка
    answer: 2
    explain: >
      Каждое срабатывание таймера удваивает RTO: сеть, возможно, перегружена, и частые
      повторы только навредят. Когда число повторов исчерпано (в Linux tcp_retries2),
      соединение закрывается с ошибкой.

  - q: Идёт передача файла. Получатель прислал подряд несколько подтверждений с одним номером и прежним окном. Что это значит?
    options:
      - Получатель закрывает соединение
      - Окно получателя стало нулевым
      - Отправитель шлёт слишком медленно
      - В потоке дыра, дальше всё дошло
    answer: 3
    explain: >
      Подтверждение накопительное: пока не пришёл недостающий сегмент, получатель на
      каждый следующий отвечает прежним номером. Для отправителя это знак, что сегмент
      с этим номером, скорее всего, потерян.

  - q: Что такое быстрая повторная передача?
    options:
      - Повтор потерянного сегмента раньше таймера
      - Повтор каждого сегмента сразу после отправки
      - Передача без ожидания установления соединения
      - Уменьшение RTO до нуля на быстрых линиях
    answer: 0
    explain: >
      Получив повторные подтверждения (классическое правило - три подряд), отправитель
      считает сегмент потерянным и отправляет его заново, не дожидаясь RTO. В опыте
      повтор ушёл через 55 мс при RTO 252 мс.

  - q: Чем выборочные подтверждения SACK помогают при потерях?
    options:
      - Получатель сам запрашивает скорость передачи
      - Отправитель узнаёт, какие куски уже дошли
      - Сегменты перестают теряться в сети
      - Таймер повторной передачи отключается
    answer: 1
    explain: >
      В блоках SACK получатель перечисляет данные, принятые после дыры. Отправитель
      видит, чего именно не хватает, и повторяет только это, даже если потеряно
      несколько сегментов.

open_questions:
  - q: Как TCP выбирает время ожидания подтверждения и почему оно не может быть постоянным?
    reference: >
      Время оборота зависит от пути и загрузки сети и меняется по ходу соединения:
      слишком короткое ожидание даёт лишние повторы, слишком длинное - простои после
      потерь. TCP измеряет время оборота по подтверждениям и ведёт две сглаженные
      величины: среднее (SRTT) и разброс (RTTVAR), в которых новые замеры весят больше
      старых. RTO = SRTT + 4 * RTTVAR: среднее плюс запас, растущий с разбросом. Есть
      нижняя граница (по стандарту RTO не меньше 1 секунды, в Linux запас не меньше 200 мс). Замеры по повторённым
      сегментам не учитываются (алгоритм Карна), а при каждом повторе RTO удваивается.
    key_points:
      - время оборота меняется, постоянный таймер не годится
      - сглаженное среднее и разброс
      - RTO = SRTT + 4 * RTTVAR, нижняя граница
      - алгоритм Карна, удвоение при повторе

  - q: Чем повторная передача по таймеру отличается от быстрой повторной передачи?
    reference: >
      По таймеру: подтверждения нет в течение RTO, отправитель повторяет самый старый
      неподтверждённый сегмент и удваивает RTO; так обнаруживаются потери, когда от
      получателя ничего не приходит (тишина; потерю в хвосте передачи Linux сначала
      проверяет пробой TLP). Быстрая
      повторная передача: потеря в середине потока, следующие сегменты доходят, и
      получатель на каждый отвечает повторным подтверждением с прежним номером (и
      блоками SACK); по ним отправитель понимает, что сегмент потерян, и повторяет его
      сразу, не дожидаясь таймера. Это гораздо быстрее: в опыте 55 мс против RTO 252 мс.
    key_points:
      - по таймеру - нет подтверждений, RTO удваивается
      - быстрая - повторные подтверждения с одним номером
      - SACK показывает, что дошло
      - быстрая срабатывает раньше таймера

  - q: Что ты увидишь в tcpdump и ss, если в середине передачи собеседник перестал отвечать?
    reference: >
      В tcpdump один и тот же сегмент (тот же seq) отправляется снова и снова, и
      промежутки между повторами удваиваются. В ss у отправителя растёт rto и
      появляется backoff с числом удвоений; оценка rtt не обновляется, потому что замеров
      нет. Когда число повторов
      исчерпано (tcp_retries2), соединение закрывается, и программа получает ошибку,
      обычно "Connection timed out". По умолчанию в Linux это занимает около 15 минут.
    key_points:
      - повторы одного seq с удвоением промежутков
      - rto растёт, backoff в ss
      - предел tcp_retries2
      - ошибка Connection timed out
