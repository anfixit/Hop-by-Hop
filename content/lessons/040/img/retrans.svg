<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Два способа узнать о потере</text>
  <text x="600" y="75" text-anchor="middle" font-size="16" fill="#475569">времена - из опыта: время оборота 51 мс, RTO 252 мс</text>

  <rect x="40" y="100" width="1120" height="220" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="132" font-size="19" font-weight="bold" fill="#0E1830">1. Потеря в середине потока: подсказывает получатель</text>
  <g font-size="15" text-anchor="middle" fill="#0E1830">
    <rect x="60" y="150" width="120" height="50" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="120" y="180">сегмент 1</text>
    <rect x="190" y="150" width="120" height="50" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="250" y="174">сегмент 2</text><text x="250" y="192" fill="#B91C1C">потерян</text>
    <rect x="320" y="150" width="120" height="50" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="380" y="180">сегмент 3</text>
    <rect x="450" y="150" width="120" height="50" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="510" y="180">сегмент 4</text>
    <rect x="580" y="150" width="120" height="50" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="640" y="180">сегмент 5</text>
    <rect x="860" y="150" width="280" height="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1000" y="174">сегмент 2 повторён</text><text x="1000" y="192" fill="#475569">через 55 мс, без таймера</text>
  </g>
  <text x="60" y="222" font-size="15" fill="#475569">ответы получателя на дошедшие сегменты:</text>
  <g font-size="15" fill="#0E1830">
    <text x="60" y="246">"жду 2"</text>
    <text x="320" y="246">"жду 2, есть 3"</text>
    <text x="450" y="246">"жду 2, есть 3-4"</text>
    <text x="580" y="246">"жду 2, есть 3-5"</text>
    <text x="860" y="246">"получено всё по 5"</text>
  </g>
  <text x="60" y="278" font-size="15" fill="#475569">Повторные подтверждения с одним номером и блоками SACK идут, пока за дырой что-то доходит.</text>
  <text x="60" y="300" font-size="15" fill="#475569">Отправитель повторяет только потерянное: это быстрая повторная передача.</text>
  <rect x="40" y="340" width="1120" height="200" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="372" font-size="19" font-weight="bold" fill="#0E1830">2. Тишина: остаётся только таймер, ожидание удваивается</text>
  <line x1="80" y1="440" x2="1120" y2="440" stroke="#475569" stroke-width="3"/>
  <g fill="#B91C1C">
    <circle cx="80" cy="440" r="8" fill="#0E1830"/>
    <circle cx="112" cy="440" r="8"/><circle cx="144" cy="440" r="8"/><circle cx="207" cy="440" r="8"/><circle cx="335" cy="440" r="8"/><circle cx="590" cy="440" r="8"/><circle cx="1100" cy="440" r="8"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#0E1830">
    <text x="80" y="418">0</text><text x="112" y="474">0,26</text><text x="146" y="418">0,51</text><text x="207" y="474">1,1</text><text x="335" y="418">2,1</text><text x="590" y="418">4,2</text><text x="1100" y="418">8,6 с</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#475569">
    <text x="175" y="504">+0,5</text><text x="271" y="504">+1</text><text x="462" y="504">+2</text><text x="845" y="504">+4</text>
  </g>
  <text x="60" y="528" font-size="15" fill="#475569">Чёрная точка - отправка, красные - повторы. Первый повтор - проба хвоста, дальше таймер: 0,25 - 0,5 - 1 - 2 - 4 секунды.</text>

  <rect x="40" y="560" width="1120" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="586" text-anchor="middle" font-size="17" fill="#0E1830">RTO = сглаженное время оборота + 4 × разброс; в Linux запас не меньше 200 мс.</text>
  <text x="600" y="608" text-anchor="middle" font-size="17" fill="#0E1830">Повторы по таймеру не бесконечны: после tcp_retries2 попыток соединение закрывается с ошибкой.</text>
</svg>