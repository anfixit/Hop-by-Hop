id: 50
title: "Виртуальные устройства: veth, bridge, tun/tap"
status: published
summary: >
  Интерфейсы Linux без железа: пара veth как виртуальный кабель между
  пространствами имён, мост bridge как коммутатор в ядре и шлюз для контейнеров,
  tun и tap как интерфейсы, на другом конце которых программа. На практике - пара
  veth, коммутатор из моста на три порта с таблицей FDB, программа, отвечающая на
  ping через tun, и кадр Ethernet через tap.

quiz:
  - q: Что такое пара veth?
    options:
      - Два интерфейса, связанных друг с другом
      - Один интерфейс с двумя IP-адресами
      - Сетевая карта с двумя разъёмами
      - Туннель между двумя удалёнными серверами
    answer: 0
    explain: >
      Всё, что отправлено в один конец пары, выходит из другого. Концы разносят по
      пространствам имён, и пара работает как кабель. Удаление одного конца удаляет
      оба.

  - q: Как подключить интерфейс pa к мосту br0 как порт?
    options:
      - ip addr add pa dev br0
      - ip link set pa master br0
      - bridge fdb add pa dev br0
      - ip route add pa via br0
    answer: 1
    explain: >
      ip link set ИМЯ master МОСТ делает интерфейс портом моста. Порты видны в
      bridge link, выученные адреса - в bridge fdb.

  - q: После ping от a к b что увидел c, подключённый к тому же мосту?
    options:
      - Все запросы и ответы ping
      - Только ответы ping от b
      - Широковещательный запрос ARP, без ICMP
      - Ничего, мост не пропускает широковещательные кадры
    answer: 2
    explain: >
      Мост, как коммутатор, рассылает во все порты только широковещательные кадры
      и кадры для неизвестных адресов. Выучив адреса a и b, он отправлял их
      разговор только в их порты: c увидел лишь запрос ARP.

  - q: Зачем мосту docker0 IP-адрес?
    options:
      - Чтобы мост мог учить MAC-адреса
      - Без адреса мост вообще не пересылает кадры
      - Чтобы шифровать трафик контейнеров
      - Чтобы хост был шлюзом для контейнеров
    answer: 3
    explain: >
      Мост сам является интерфейсом в стеке хоста. С адресом хост становится
      участником сети контейнеров и шлюзом для неё, а дальше маршрутизация и NAT.
      Учить адреса и пересылать кадры мост может и без IP.

  - q: Чем tun отличается от tap?
    options:
      - tun - пакеты IP, tap - кадры Ethernet
      - tun работает только с TCP, tap - с UDP
      - tun шифрует трафик, tap нет
      - tun нужен для IPv4, tap - для IPv6
    answer: 0
    explain: >
      tun - интерфейс сетевого уровня: программа читает и пишет пакеты IP, MAC и
      ARP нет. tap - канальный уровень: кадры Ethernet с MAC-адресами, его можно
      подключить к мосту. Шифрует не интерфейс, а программа на его другом конце.

  - q: В опыте ping на 10.9.0.2 через tun0 получил ответы. Кто их отправил?
    options:
      - Ядро, само знающее адрес 10.9.0.2
      - Соседнее пространство имён через veth
      - Программа на другом конце tun0
      - Мост br0 из второго шага
    answer: 2
    explain: >
      Ядро отправило запросы в tun0, программа прочитала их из /dev/net/tun,
      превратила в ответы и записала обратно. Ядро приняло их как пришедшие по сети.
      Узла 10.9.0.2 не существует.

  - q: Почему у tun0 в опыте сначала был флаг NO-CARRIER?
    options:
      - У tun0 не было IP-адреса
      - К нему ещё не привязалась программа
      - Ядро не поддерживает tun
      - Интерфейс не был включён командой up
    answer: 1
    explain: >
      У tun и tap "несущая" появляется, когда программа открывает /dev/net/tun и
      привязывается к интерфейсу. До этого пакеты, отправленные в интерфейс,
      уходят в никуда. Флаг UP при этом уже стоял.

  - q: Как VPN-клиент на tun получает трафик всей системы, не меняя программ?
    options:
      - Встраивается в каждую программу как модуль
      - Перехватывает кадры сетевой карты
      - Слушает все порты машины
      - Маршрут ведёт пакеты в его tun-интерфейс
    answer: 3
    explain: >
      Маршрут (часто маршрут по умолчанию или правила policy routing) отправляет
      пакеты в tun. VPN-клиент читает их, шифрует и отправляет по обычному сокету
      на сервер, а расшифрованные ответы пишет обратно в tun.

open_questions:
  - q: Как устроен bridge в Linux и как он используется для контейнеров?
    reference: >
      bridge - коммутатор в ядре. Его порты - другие интерфейсы (концы veth,
      сетевые карты, tap), подключённые через ip link set ИМЯ master МОСТ. Мост
      учит, за каким портом какой MAC-адрес (bridge fdb), пересылает кадр только в
      нужный порт, а широковещательные и кадры для неизвестных адресов рассылает
      во все. Сам мост - интерфейс в стеке хоста: с IP-адресом он становится
      шлюзом для подключённой сети. Так устроен docker0: по умолчанию
      контейнер подключён к нему парой veth, а дальше маршрутизация и NAT на хосте.
    key_points:
      - порты через master
      - обучение и таблица FDB
      - широковещательные кадры во все порты
      - мост с IP как шлюз, docker0 и veth

  - q: Как работают tun и tap и для чего их используют?
    reference: >
      Это интерфейсы, на другом конце которых программа: она открывает
      /dev/net/tun и привязывается к интерфейсу. Всё, что ядро отправляет в
      интерфейс, программа читает; всё, что программа пишет, ядро получает как
      пришедшее по сети. tun передаёт пакеты IP (нет MAC и ARP), tap - кадры
      Ethernet (есть MAC, можно подключить к мосту). tun используют VPN (OpenVPN,
      WireGuard в пространстве пользователя) и прокси в режиме TUN, tap - сети
      виртуальных машин через мост.
    key_points:
      - программа на другом конце, /dev/net/tun
      - чтение и запись пакетов
      - tun - IP, tap - Ethernet
      - VPN, прокси, виртуальные машины

  - q: Опиши, что произошло в опыте с tun0, от команды ping до ответа.
    reference: >
      ping отправил ICMP echo request на 10.9.0.2. По маршруту 10.9.0.0/24 dev
      tun0 ядро отправило пакет в tun0. Программа на другом конце прочитала его из
      /dev/net/tun - 84 байта, IPv4, ICMP, без заголовка Ethernet, - поменяла
      местами адреса, сделала из запроса ответ (тип 0), пересчитала контрольную
      сумму ICMP и записала пакет обратно. Ядро приняло его как пришедший через
      tun0 и доставило ping. Узла 10.9.0.2 не существует, отвечала программа.
    key_points:
      - маршрут в tun0
      - программа читает пакет IP
      - делает ответ и пишет обратно
      - ядро принимает как пришедший по сети
