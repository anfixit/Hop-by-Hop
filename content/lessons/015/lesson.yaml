id: 15
title: "Кадр Ethernet и MAC-адреса"
status: published
summary: >
  Кадр Ethernet II поле за полем: адреса, EtherType, данные от 46 до 1500 байт и CRC,
  откуда взялся MTU 1500 и чем тип отличается от длины. MAC-адрес: OUI производителя,
  биты I/G и U/L, широковещательные и групповые адреса. На практике - разбор битов,
  поиск производителя и смена MAC-адреса одной командой, а в безопасности - почему
  фильтр по MAC не защищает и как MAC-адрес выдаёт владельца.

quiz:
  - q: В кадре поле EtherType равно 0x86DD. Что лежит в поле данных?
    options:
      - Пакет IPv4
      - Пакет IPv6
      - Сообщение ARP
      - Метка VLAN
    answer: 1
    explain: >
      0x86DD - IPv6. Для IPv4 это 0x0800, для ARP - 0x0806, а 0x8100 означает метку VLAN.
      По этому полю система решает, какому протоколу отдать содержимое кадра.

  - q: Почему в заголовке кадра адрес получателя стоит раньше адреса отправителя?
    options:
      - Так проще посчитать контрольную сумму кадра
      - Приёмник по первым байтам сразу понимает, ему ли кадр
      - Адрес отправителя необязателен и его можно не передавать
      - Так требует протокол IP, лежащий внутри кадра
    answer: 1
    explain: >
      Получив первые 6 байт, приёмник уже знает, ему ли кадр, а коммутатор может начать
      выбирать порт. Адрес отправителя тоже передаётся всегда: он нужен, чтобы знать,
      кому отвечать.

  - q: IP-пакет занимает 28 байт. Что будет с кадром Ethernet?
    options:
      - Кадр отправят как есть, длиной 46 байт вместе с заголовком
      - Пакет склеят со следующим, чтобы набрать минимум
      - Данные дополнят заполнителем до 46 байт
      - Сетевая карта откажется отправлять такой короткий кадр
    answer: 2
    explain: >
      Поле данных не может быть меньше 46 байт, иначе кадр будет короче 64 байт (урок 14).
      Карта добавит заполнитель, а настоящую длину пакета получатель узнает из заголовка IP.

  - q: Откуда взялось ограничение в 1500 байт данных в кадре Ethernet?
    options:
      - Из максимальной длины кабеля в классическом Ethernet
      - Так решили, чтобы кадр укладывался в один IP-пакет
      - Из размера минимального кадра, умноженного на число станций
      - Из-за дорогой памяти в 1970-х, почти произвольно
    answer: 3
    explain: >
      Приёмник должен был хранить кадр целиком, а память в 1978 году стоила дорого. Число
      выбрали во многом произвольно, и оно пережило все последующие поколения Ethernet.

  - q: У MAC-адреса первый байт равен 0x01. Что это значит?
    options:
      - Адрес групповой (multicast)
      - Адрес назначен производителем Cisco
      - Адрес назначен локально администратором
      - Адрес принадлежит маршрутизатору
    answer: 0
    explain: >
      Младший бит первого байта (I/G) равен 1, значит, адрес групповой. Например, адреса
      01:00:5e:... используются для группового вещания IPv4. Бит U/L у 0x01 равен 0.

  - q: Ты видишь MAC-адрес 52:54:00:12:34:56. Что можно сказать о нём по битам?
    options:
      - Групповой адрес, назначен производителем
      - Индивидуальный адрес, назначен производителем
      - Широковещательный адрес всех станций
      - Индивидуальный адрес, назначен локально
    answer: 3
    explain: >
      0x52 = 01010010: младший бит 0 - индивидуальный, следующий 1 - назначен локально.
      Такой префикс традиционно использует гипервизор QEMU/KVM для виртуальных карт.

  - q: Чей MAC-адрес отправителя будет в кадре, который дойдёт до сервера в интернете?
    options:
      - "Твоего ноутбука: он сохраняется в кадре до самого конца"
      - Последнего маршрутизатора перед сервером
      - Твоего домашнего роутера, если соединение не зашифровано
      - Сервера DNS, который нашёл адрес сайта
    answer: 1
    explain: >
      MAC-адрес живёт только на одном звене. Маршрутизатор вынимает пакет из кадра и
      упаковывает в новый: отправитель - сам маршрутизатор, получатель - следующий узел.
      Поэтому в кадре у сервера будет MAC-адрес последнего маршрутизатора, а не твой.

  - q: Почему фильтр "пускать в Wi-Fi только эти MAC-адреса" плохо защищает сеть?
    options:
      - Разрешённые адреса видны в эфире, их легко подставить
      - Фильтр работает только для проводных сетей, не для Wi-Fi
      - Разрешённых адресов может быть не больше десяти
      - Фильтр отключается сам после перезагрузки роутера
    answer: 0
    explain: >
      Заголовки кадров Wi-Fi не шифруются, и адреса разрешённых устройств видит любой в
      зоне приёма. MAC-адрес меняется одной командой, так что злоумышленник подставит
      разрешённый и пройдёт фильтр. MAC-адрес - идентификация, а не аутентификация.

  - q: Зачем телефоны используют случайный MAC-адрес для каждой сети Wi-Fi?
    options:
      - Чтобы работать быстрее в загруженном эфире
      - Чтобы по адресу нельзя было следить за владельцем
      - Чтобы обойти ограничение числа устройств в сети
      - Чтобы шифровать кадры без пароля от сети
    answer: 1
    explain: >
      Если у телефона один адрес во всех сетях, по нему можно связать посещения разных
      сетей: кафе, гостиница, работа. Отдельный случайный адрес для каждой сети это
      затрудняет. А от слежки по запросам при поиске сетей защищает другой механизм -
      случайные адреса при сканировании.

open_questions:
  - q: Перечисли поля кадра Ethernet II и объясни, зачем нужно каждое.
    reference: >
      Преамбула и разделитель (8 байт) синхронизируют приёмник и отмечают начало кадра, их
      добавляет и снимает карта. Адрес получателя (6 байт) стоит первым, чтобы приёмник и
      коммутатор сразу знали, кому кадр. Адрес отправителя (6 байт) нужен, чтобы знать,
      кому отвечать, а коммутатору - где находится отправитель. EtherType (2 байта)
      говорит, какому протоколу отдать данные: IPv4, IPv6, ARP. Данные - от 46 до 1500
      байт, короткие дополняются до минимума ради правила 64 байт. FCS (4 байта) - CRC-32
      для обнаружения ошибок.
    key_points:
      - адрес получателя - кому кадр
      - адрес отправителя - кому отвечать, коммутатору - где отправитель
      - EtherType - какой протокол внутри
      - данные 46-1500 байт, FCS - CRC-32

  - q: Что означают биты I/G и U/L в MAC-адресе? Приведи примеры адресов каждого вида.
    reference: >
      Оба бита находятся в первом байте. I/G - младший бит: 0 означает индивидуальный
      адрес одного интерфейса, 1 - групповой. Групповой адрес из всех единиц,
      ff:ff:ff:ff:ff:ff, широковещательный, его принимают все. U/L - следующий бит: 0 -
      адрес назначен производителем по правилам IEEE (первые три байта - OUI), 1 -
      назначен локально программой или администратором. Примеры: 00:00:0c:... -
      индивидуальный адрес Cisco; 01:00:5e:... - групповой для IPv4; 52:54:00:... и
      02:... - индивидуальные локальные, например у виртуальных карт.
    key_points:
      - I/G - младший бит первого байта, 1 - группа, все единицы - широковещание
      - U/L - следующий бит, 1 - адрес назначен локально
      - первые три байта глобального адреса - OUI производителя
      - примеры каждого вида

  - q: Почему MAC-адрес нельзя использовать как пропуск в сеть и что использовать вместо этого?
    reference: >
      MAC-адрес ничего не доказывает: операционная система сообщает тот адрес, который ей
      скажут, и сменить его можно одной командой. К тому же в Wi-Fi заголовки кадров не
      шифруются, и адреса разрешённых устройств видит любой в зоне приёма. Поэтому
      фильтры по MAC, привязка оплаты в гостиничном Wi-Fi и списки доступа по MAC
      обходятся подменой адреса. Это идентификация без аутентификации. Вместо этого нужна
      настоящая проверка устройства или пользователя: 802.1X перед открытием порта или
      доступом к Wi-Fi (в Wi-Fi - режимы WPA2/WPA3-Enterprise с отдельными учётными
      данными для каждого пользователя или устройства).
    key_points:
      - MAC-адрес меняется одной командой, проверки нет
      - в Wi-Fi адреса видны в эфире открыто
      - фильтры и привязки по MAC обходятся подменой
      - вместо этого - аутентификация, например 802.1X
