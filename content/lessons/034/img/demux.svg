<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Демультиплексирование на сервере 192.0.2.2</text>

  <!-- TCP sockets row -->
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="90" width="150" height="90" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <text x="115" y="118" fill="#0E1830">слушающий</text>
    <text x="115" y="140" fill="#0E1830">0.0.0.0:5000</text>
    <text x="115" y="162" fill="#475569">ждёт клиентов</text>

    <rect x="205" y="90" width="150" height="90" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="280" y="118" fill="#0E1830">соединение 1</text>
    <text x="280" y="140" fill="#0E1830">клиент</text>
    <text x="280" y="162" fill="#0E1830">192.0.2.1:60720</text>

    <rect x="370" y="90" width="150" height="90" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="445" y="118" fill="#0E1830">соединение 2</text>
    <text x="445" y="140" fill="#0E1830">клиент</text>
    <text x="445" y="162" fill="#0E1830">192.0.2.1:60730</text>

    <rect x="535" y="90" width="150" height="90" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="610" y="118" fill="#0E1830">соединение 3</text>
    <text x="610" y="140" fill="#0E1830">клиент</text>
    <text x="610" y="162" fill="#0E1830">192.0.2.1:60738</text>

    <rect x="700" y="90" width="150" height="90" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <text x="775" y="118" fill="#0E1830">только свои</text>
    <text x="775" y="140" fill="#0E1830">127.0.0.1:6000</text>
    <text x="775" y="162" fill="#475569">снаружи закрыт</text>

    <rect x="900" y="90" width="260" height="90" rx="8" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
    <text x="1030" y="118" fill="#0E1830">UDP-сокет</text>
    <text x="1030" y="140" fill="#0E1830">0.0.0.0:5000</text>
    <text x="1030" y="162" fill="#475569">тот же номер 5000</text>
  </g>
  <text x="445" y="203" text-anchor="middle" font-size="14" fill="#475569">у всех трёх соединений один и тот же свой адрес 192.0.2.2:5000, различаются клиенты</text>

  <!-- lines -->
  <g stroke="#94A3B8" stroke-width="2">
    <line x1="115" y1="212" x2="445" y2="290"/><line x1="280" y1="212" x2="445" y2="290"/>
    <line x1="445" y1="212" x2="445" y2="290"/><line x1="610" y1="212" x2="445" y2="290"/>
    <line x1="775" y1="212" x2="445" y2="290"/><line x1="1030" y1="180" x2="1030" y2="290"/>
  </g>

  <!-- TCP / UDP modules -->
  <rect x="40" y="290" width="810" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="445" y="320" text-anchor="middle" font-size="19" fill="#0E1830">TCP: ищет соединение по четвёрке</text>
  <text x="445" y="344" text-anchor="middle" font-size="15" fill="#475569">свой адрес и порт + адрес и порт клиента; новый клиент - к слушающему сокету</text>
  <rect x="900" y="290" width="260" height="70" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
  <text x="1030" y="320" text-anchor="middle" font-size="19" fill="#0E1830">UDP: ищет сокет</text>
  <text x="1030" y="344" text-anchor="middle" font-size="15" fill="#475569">по своему адресу и порту</text>

  <g stroke="#94A3B8" stroke-width="3">
    <line x1="445" y1="410" x2="445" y2="360"/><line x1="1030" y1="410" x2="1030" y2="360"/>
  </g>

  <!-- IP layer -->
  <rect x="40" y="410" width="1120" height="60" rx="10" fill="#0E1830"/>
  <text x="600" y="436" text-anchor="middle" font-size="19" fill="#FFFFFF">IP: пакет для 192.0.2.2, поле Protocol говорит, TCP (6) или UDP (17)</text>
  <text x="600" y="458" text-anchor="middle" font-size="15" fill="#CBD5E1">транспортному уровню передаются данные и адреса из заголовка IP</text>

  <rect x="40" y="490" width="1120" height="50" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="521" text-anchor="middle" font-size="16" fill="#0E1830">Нет подходящего сокета: TCP отвечает RST, UDP - ICMP "порт недоступен"</text>
</svg>
