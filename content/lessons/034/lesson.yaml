id: 34
title: "Порты, сокеты и мультиплексирование"
status: published
summary: >
  Как транспортный уровень раздаёт данные программам: мультиплексирование и
  демультиплексирование, номера портов и их диапазоны, временные порты клиентов,
  сокеты и четвёрка адресов и портов у TCP, сокеты Беркли. На практике - сервер с TCP
  и UDP на одном номере, служба только для localhost, три соединения к одному порту,
  ответы закрытых портов (RST и ICMP) и привилегированные порты. Сканирование портов -
  принцип и защита.

quiz:
  - q: Что такое демультиплексирование на транспортном уровне?
    options:
      - Разделение пакета на фрагменты под MTU канала
      - Выбор маршрутизатором следующего шага для пакета
      - Раздача данных нужным программам по номеру порта
      - Объединение нескольких каналов в один быстрый
    answer: 2
    explain: >
      TCP и UDP передают данные, пришедшие от IP, той программе, чей порт указан в
      сегменте. Обратная задача - собрать данные многих программ для IP -
      мультиплексирование.

  - q: Могут ли TCP-порт 5000 и UDP-порт 5000 занимать разные программы?
    options:
      - Да, номера портов TCP и UDP независимы
      - Нет, номер порта общий для всех протоколов
      - Только если программы запущены от root
      - Только на разных сетевых интерфейсах
    answer: 0
    explain: >
      Порты TCP и UDP - разные пространства номеров. В опыте один процесс держал и TCP
      5000, и UDP 5000; могли бы и два разных.

  - q: Какой порт получает клиент при подключении к серверу?
    options:
      - Всегда тот же, что у сервера
      - Порт 0, потому что он клиент
      - Первый свободный порт ниже 1024
      - Временный порт, выбранный ОС
    answer: 3
    explain: >
      Клиенту номер не важен, поэтому ОС выдаёт временный (эфемерный) порт. В Linux из
      диапазона 32768-60999, и выбирается он так, чтобы его трудно было угадать.

  - q: Почему к одному порту сервера может подключиться много клиентов сразу?
    options:
      - Сервер открывает для каждого клиента новый порт
      - Соединение определяется четвёркой адресов и портов
      - Клиенты договариваются, кто подключится первым
      - Ядро отвечает клиентам по очереди на одном порту
    answer: 1
    explain: >
      У каждого соединения свой адрес или порт клиента, поэтому четвёрки разные, хотя
      серверный адрес и порт одни. В опыте три соединения шли к 192.0.2.2:5000.

  - q: Что вернёт сервер на попытку TCP-подключения к порту, где никто не слушает?
    options:
      - Сегмент с флагом RST
      - ICMP "время истекло"
      - Пустой сегмент данных
      - Ответ DNS с ошибкой
    answer: 0
    explain: >
      Ядро отвечает RST, и у клиента подключение сразу заканчивается ошибкой
      "Connection refused". Закрытый UDP-порт отвечает ICMP "порт недоступен".

  - q: Чем отличается служба, привязанная к 127.0.0.1, от привязанной к 0.0.0.0?
    options:
      - Она работает быстрее благодаря петле
      - Она автоматически шифрует соединения
      - Она доступна только по протоколу UDP
      - Она доступна только с этого компьютера
    answer: 3
    explain: >
      Адрес 127.0.0.1 - петля: подключиться может только программа на этом же
      компьютере. Снаружи порт выглядит закрытым, как порт 6000 в опыте.

  - q: Что делает вызов accept на сервере?
    options:
      - Привязывает сокет к нужному адресу и порту
      - Отдаёт новый сокет для пришедшего клиента
      - Объявляет, что сокет готов слушать клиентов
      - Отправляет клиенту первый сегмент данных
    answer: 1
    explain: >
      bind привязывает, listen объявляет готовность, а accept ждёт клиента и возвращает
      новый сокет для этого соединения; исходный продолжает слушать.

  - q: Помогает ли перенос службы на нестандартный порт от сканирования?
    options:
      - Да, службу на таком порту невозможно найти
      - Да, сканеры проверяют только порты ниже 1024
      - Нет, это лишь снижает шум в журналах сервера
      - Нет, порт найдут, зато ОС заблокирует сканер
    answer: 2
    explain: >
      Службу на нестандартном порту находят без особого труда. Защищают меньшее число
      открытых портов, правильный адрес привязки, межсетевой экран, обновления и
      наблюдение.

open_questions:
  - q: Как транспортный уровень доставляет данные нужной программе?
    reference: >
      В каждом сегменте TCP и дейтаграмме UDP есть порт отправителя и порт получателя
      (16 бит). Получив данные от IP, транспортный протокол по порту получателя (а у TCP
      по четвёрке своих и чужих адреса и порта) находит сокет программы и отдаёт данные
      ей - это демультиплексирование. Обратная задача - собрать данные от многих
      программ и передать IP - мультиплексирование. Порты TCP и UDP независимы.
    key_points:
      - порты отправителя и получателя
      - демультиплексирование и мультиплексирование
      - у TCP четвёрка адресов и портов
      - TCP и UDP порты независимы

  - q: Какие бывают номера портов и кто их выбирает?
    reference: >
      Номер 16-битный, 0-65535. IANA делит диапазон на системные (0-1023) для
      стандартных служб, зарегистрированные (1024-49151) и динамические (49152-65535).
      Серверы слушают известные номера, чтобы клиенты знали, куда подключаться. Клиенты
      получают временные порты из диапазона своей ОС (в Linux 32768-60999; он не совпадает с
      динамическим диапазоном IANA), выбранные так, чтобы их трудно было угадать. Номера
      ниже 1024 в Unix требуют привилегий.
    key_points:
      - 16 бит, три диапазона IANA
      - серверы на известных портах
      - временные порты клиентов
      - привилегированные порты ниже 1024

  - q: Что такое сканирование портов и как снизить риск от него?
    reference: >
      Открытый и закрытый порт отвечают по-разному (соединение против RST или ICMP),
      поэтому по ответам можно составить список открытых портов и узнать работающие
      службы и версии. Это первый шаг разведки, и сканируют интернет постоянно. Защита:
      держать открытыми только нужные порты, привязывать служебное к 127.0.0.1 или
      внутренним адресам, межсетевой экран с политикой запрета по умолчанию, обновлять
      службы, наблюдать за массовыми попытками и ограничивать их. Нестандартный порт не
      защищает.
    key_points:
      - разные ответы открытого и закрытого порта
      - первый шаг разведки
      - меньше портов, привязка, межсетевой экран
      - обновления и наблюдение, нестандартный порт не защита
