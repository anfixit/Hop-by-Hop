id: 66
title: "DNSSEC"
status: published
summary: >
  Как DNSSEC защищает подлинность и целостность данных DNS: подписи наборов
  записей (RRSIG), ключи зоны (DNSKEY, KSK и ZSK), записи DS у родителя и цепочка
  доверия от якоря - ключа корня, флаги AD, CD и бит DO, доказательство
  отсутствия имён (NSEC и NSEC3), цена DNSSEC. На практике - подписанные снизу
  вверх корень, TLD и зона, валидирующий резолвер BIND, delv, NSEC в ответе
  NXDOMAIN и SERVFAIL на изменённой без ключа записи. Безопасность: DNSSEC в
  эксплуатации.

quiz:
  - q: Что DNSSEC не обеспечивает?
    options:
      - Подлинность источника данных
      - Целостность записей в пути
      - Конфиденциальность запросов
      - Подписанный ответ "имени нет"
    answer: 2
    explain: >
      DNSSEC заверяет данные, но не шифрует их: какие имена ищет пользователь,
      видно на пути. Шифрование - задача DoT и DoH (урок 67).

  - q: Что хранится в записи DS у родительской зоны?
    options:
      - Хеш ключа KSK дочерней зоны
      - Копия всех записей дочерней зоны
      - Закрытый ключ дочерней зоны
      - Подпись каждой записи дочерней зоны
    answer: 0
    explain: >
      DS - хеш ключа KSK ребёнка, подписанный ключом родителя. Так связываются
      зоны: в опыте dsset-corp.lab. добавили в зону lab. перед её подписанием.

  - q: Зачем у зоны два ключа, KSK и ZSK?
    options:
      - KSK шифрует данные, ZSK их подписывает
      - Смена ZSK не требует обновлять DS у родителя
      - Один ключ для IPv4, другой для IPv6
      - Два ключа нужны для отказоустойчивости серверов
    answer: 1
    explain: >
      KSK подписывает только ключи, и его хеш лежит у родителя, поэтому его меняют
      редко. ZSK подписывает данные и меняется свободно, не затрагивая родителя.

  - q: Что такое якорь доверия валидирующего резолвера?
    options:
      - Адрес ближайшего корневого сервера DNS
      - Список всех подписанных доменов мира
      - Сертификат удостоверяющего центра X.509
      - Заранее известный ключ, обычно ключ корня
    answer: 3
    explain: >
      С него начинается проверка цепочки: ключ корня - DS - ключ TLD - DS - ключ
      зоны - подпись. В опыте якорем был ключ KSK нашего корня.

  - q: Что вернул валидирующий резолвер на изменённую без ключа запись?
    options:
      - Изменённый адрес с флагом AD
      - Ошибку SERVFAIL вместо адреса
      - Прежний адрес из своего кэша
      - Ответ NXDOMAIN, имени нет
    answer: 1
    explain: >
      Подпись не сошлась, ответ признан поддельным, и резолвер вернул SERVFAIL:
      лучше никакого ответа, чем ложный. С флагом CD он отдал данные без проверки.

  - q: Как DNSSEC доказывает, что имени нет?
    options:
      - Подписанной NSEC о промежутке между именами
      - Отдельной подписью для каждого возможного имени
      - Шифрованием ответа ключом корневой зоны
      - Отказом отвечать на вопрос без флага DO
    answer: 0
    explain: >
      NSEC говорит, какое имя следует за данным: если искомое попадает в
      промежуток, его нет. В опыте nosuch оказалось между mail и ns.

  - q: Почему истёкшие подписи опасны для владельца зоны?
    options:
      - Они позволяют любому изменить записи зоны
      - Они раскрывают закрытый ключ зоны
      - Из-за них резолверы вернут SERVFAIL
      - Они автоматически отключают DNSSEC
    answer: 2
    explain: >
      Истёкшая подпись так же недействительна, как поддельная: зона перестанет
      открываться у всех, кто проверяет подписи. Поэтому зоны переподписывают
      автоматически и следят за сроками.

  - q: Что раскрывает цепочка записей NSEC?
    options:
      - Закрытые ключи зоны и её родителя
      - Все имена зоны одно за другим
      - Адреса клиентов, спрашивавших зону
      - Пароли администраторов зоны
    answer: 1
    explain: >
      Каждая NSEC указывает на следующее имя, и по ним можно перебрать зону.
      NSEC3 использует хеши имён и затрудняет такой перебор.

open_questions:
  - q: Опиши цепочку доверия DNSSEC от корня до записи www.corp.lab.
    reference: >
      У резолвера есть якорь - ключ KSK корня. Корень публикует DNSKEY и подписи,
      а для lab. - запись DS (хеш KSK зоны lab.), подписанную ключом корня. Зона
      lab. так же хранит DS для corp.lab. Зона corp.lab. подписывает свои данные
      ключом ZSK, а набор DNSKEY - ключом KSK. Резолвер проверяет звенья сверху
      вниз; если всё сошлось, ставит AD, если нет - возвращает SERVFAIL; если у
      родителя нет DS, ответ непроверенный и отдаётся без AD.
    key_points:
      - якорь - ключ корня
      - DS у родителя - хеш KSK ребёнка
      - KSK подписывает ключи, ZSK данные
      - AD, SERVFAIL, без AD

  - q: Что DNSSEC даёт и чего не даёт?
    reference: >
      Даёт подлинность источника, целостность записей и подписанное доказательство
      отсутствия имён (NSEC, NSEC3). Не даёт конфиденциальности: запросы и ответы
      видны на пути, для этого нужны DoT или DoH. Не защищает от атак на
      доступность и сам увеличивает ответы. Последний шаг от резолвера к клиенту
      защищается отдельно, если клиент не проверяет подписи сам.
    key_points:
      - подлинность и целостность
      - доказательство отсутствия
      - нет шифрования
      - последний шаг

  - q: Как правильно эксплуатировать DNSSEC, чтобы он не сломал зону?
    reference: >
      Подписывать автоматически (dnssec-policy в BIND, Knot, PowerDNS) и следить
      за сроками подписей внешним мониторингом. Менять ключи по правилам: новый
      публикуется заранее, старый убирается после TTL; при смене KSK обновлять DS
      у регистратора. Беречь закрытый ключ KSK. На резолверах держать проверку
      включённой и не отключать её ради "починки" доменов.
    key_points:
      - автоматическое подписание
      - мониторинг сроков и DS
      - правила смены ключей
      - защита KSK
