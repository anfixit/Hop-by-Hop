<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Как клиент подключается к точке доступа</text>

  <rect x="140" y="75" width="200" height="56" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="240" y="110" text-anchor="middle" font-size="20" fill="#0E1830">клиент</text>
  <rect x="860" y="75" width="200" height="56" rx="10" fill="#0E1830"/>
  <text x="960" y="110" text-anchor="middle" font-size="20" fill="#FFFFFF">точка доступа</text>
  <line x1="240" y1="131" x2="240" y2="660" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="960" y1="131" x2="960" y2="660" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>

  <defs>
    <marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0E1830"/></marker>
  </defs>
  <g font-size="18" fill="#0E1830" stroke-width="2.5">
    <!-- поиск -->
    <text x="60" y="175" font-size="16" fill="#7C3AED" font-weight="bold">поиск</text>
    <line x1="960" y1="185" x2="256" y2="185" stroke="#7C3AED"/><path d="M240 185 L256 177 L256 193 z" fill="#7C3AED"/>
    <text x="600" y="175" text-anchor="middle" fill="#7C3AED">Beacon: "я hbh-lab", каждые 102,4 мс, всем</text>
    <line x1="240" y1="235" x2="944" y2="235" stroke="#7C3AED"/><path d="M960 235 L944 227 L944 243 z" fill="#7C3AED"/>
    <text x="600" y="225" text-anchor="middle" fill="#7C3AED">Probe Request: "кто здесь?" (по разрешённым каналам)</text>
    <line x1="960" y1="280" x2="256" y2="280" stroke="#7C3AED"/><path d="M240 280 L256 272 L256 288 z" fill="#7C3AED"/>
    <text x="600" y="270" text-anchor="middle" fill="#7C3AED">Probe Response: "я hbh-lab, канал 6"</text>

    <!-- аутентификация и ассоциация -->
    <text x="60" y="335" font-size="16" fill="#0F766E" font-weight="bold">вход</text>
    <line x1="240" y1="345" x2="944" y2="345" stroke="#0F766E"/><path d="M960 345 L944 337 L944 353 z" fill="#0F766E"/>
    <text x="600" y="335" text-anchor="middle" fill="#0F766E">Authentication (Open System) 1</text>
    <line x1="960" y1="390" x2="256" y2="390" stroke="#0F766E"/><path d="M240 390 L256 382 L256 398 z" fill="#0F766E"/>
    <text x="600" y="380" text-anchor="middle" fill="#0F766E">Authentication 2: успешно</text>
    <line x1="240" y1="435" x2="944" y2="435" stroke="#0F766E"/><path d="M960 435 L944 427 L944 443 z" fill="#0F766E"/>
    <text x="600" y="425" text-anchor="middle" fill="#0F766E">Association Request: "хочу в hbh-lab"</text>
    <line x1="960" y1="480" x2="256" y2="480" stroke="#0F766E"/><path d="M240 480 L256 472 L256 488 z" fill="#0F766E"/>
    <text x="600" y="470" text-anchor="middle" fill="#0F766E">Association Response: успешно, AID 1</text>

    <!-- WPA -->
    <rect x="250" y="500" width="700" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="600" y="525" text-anchor="middle" font-size="16" fill="#0E1830">в защищённой сети здесь обмен ключами (урок 20);</text><text x="600" y="548" text-anchor="middle" font-size="16" fill="#0E1830">в WPA3 пароль проверяется ещё на шаге Authentication</text>

    <!-- данные -->
    <text x="60" y="605" font-size="16" fill="#0E1830" font-weight="bold">данные</text>
    <line x1="256" y1="615" x2="944" y2="615" stroke="#0E1830"/><path d="M240 615 L256 607 L256 623 z" fill="#0E1830"/><path d="M960 615 L944 607 L944 623 z" fill="#0E1830"/>
    <text x="600" y="605" text-anchor="middle">кадры данных (ARP, IP...), адресные подтверждаются ACK</text>
  </g>
  <text x="600" y="685" text-anchor="middle" font-size="16" fill="#475569">Все служебные кадры выше идут открыто и ничем не подписаны - на этом держатся атаки из этого урока</text>
</svg>
