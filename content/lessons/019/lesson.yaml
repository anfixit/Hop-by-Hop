id: 19
title: "Wi-Fi: как устроена сеть 802.11 и как к ней подключаются"
status: published
summary: >
  Как устроена сеть Wi-Fi: точка доступа, BSS и ESS, SSID и BSSID, поколения стандарта
  от 802.11b до Wi-Fi 7, доступ к эфиру по CSMA/CA с ACK и NAV, кадр 802.11 с тремя
  адресами, поиск сети, аутентификация, ассоциация и экономия энергии. На практике -
  виртуальные радио в Linux: точка доступа, клиент и запись всего эфира. В
  безопасности - поддельная точка доступа и принудительное отключение, защита
  служебных кадров 802.11w.

quiz:
  - q: Два телефона подключены к одной точке доступа. Как идёт кадр от одного к другому?
    options:
      - Напрямую по радио, раз телефоны рядом
      - Сначала к точке доступа, потом от неё
      - Через ближайший маршрутизатор в интернете
      - Каждый телефон пересылает его соседям
    answer: 1
    explain: >
      В инфраструктурной сети клиенты общаются только с точкой доступа, и весь трафик
      идёт через неё. В опыте даже широковещательный запрос ARP сначала ушёл к точке, а
      потом она разослала его сама.

  - q: Чем SSID отличается от BSSID?
    options:
      - SSID - имя сети, BSSID - MAC-адрес точки доступа
      - SSID - пароль сети, BSSID - её имя в списке
      - SSID - номер канала, BSSID - частота в мегагерцах
      - SSID - адрес клиента, BSSID - адрес маршрутизатора
    answer: 0
    explain: >
      SSID - имя сети, которое видит человек, его выбирает владелец точки. BSSID - MAC-адрес
      радиоинтерфейса точки доступа. У нескольких точек одной сети SSID общий, а BSSID
      разные.

  - q: Как станция Wi-Fi узнаёт, что её кадр не дошёл?
    options:
      - Слышит коллизию во время своей передачи
      - Получает от точки доступа кадр с ошибкой
      - Не получает подтверждения ACK вовремя
      - Видит, что следующий маяк не пришёл
    answer: 2
    explain: >
      Радиостанция не может слушать эфир во время своей передачи, поэтому коллизию не
      обнаружить. Каждый адресный кадр подтверждается ACK, и если его нет, станция
      считает кадр потерянным и повторяет его после отсрочки.

  - q: Зачем в каждом кадре Wi-Fi поле Duration?
    options:
      - Чтобы получатель знал, сколько данных в кадре
      - Чтобы другие станции знали, сколько молчать
      - Чтобы точка доступа ограничивала время сеанса
      - Чтобы измерять задержку до точки доступа
    answer: 1
    explain: >
      По полю Duration станции, услышавшие кадр, заводят таймер NAV и молчат до конца
      обмена, включая подтверждение, даже если сигнала не слышат. Это виртуальное
      прослушивание эфира.

  - q: Почему одна медленная станция может замедлить всю сеть Wi-Fi?
    options:
      - Точка доступа ждёт медленную станцию перед каждым маяком
      - Все станции обязаны работать на скорости самой медленной
      - Медленная станция создаёт помехи на соседних каналах
      - Её кадры занимают эфир дольше, а кадры делят поровну
    answer: 3
    explain: >
      Это аномалия скорости: если станции передают по очереди по кадру, медленный кадр
      держит эфир во много раз дольше, и быстрая станция опускается почти до скорости
      медленной. Поэтому лучше делить между станциями время в эфире, а не число кадров:
      это умеют планировщики многих точек доступа.

  - q: Зачем в кадре Wi-Fi три адреса, а не два, как в Ethernet?
    options:
      - Третий адрес хранит резервную копию адреса отправителя
      - Кадр принимает точка доступа, а нужен он другому
      - Третий адрес нужен только для шифрования кадра
      - В третьем адресе записан номер канала сети
    answer: 1
    explain: >
      В инфраструктурной сети между отправителем и получателем стоит точка доступа. Кадр
      в эфире принимает она, но конечный получатель - другой узел. Как читать адреса,
      подсказывают биты To DS и From DS.

  - q: Что делает точка доступа примерно каждые 102 мс?
    options:
      - Рассылает кадр-маяк с именем и настройками сети
      - Меняет канал, чтобы уйти от помех соседних сетей
      - Спрашивает у каждого клиента, подключён ли он
      - Обновляет ключи шифрования для всех клиентов
    answer: 0
    explain: >
      Маяк (beacon) идёт каждые 100 TU по 1024 мкс, то есть 102,4 мс. В опыте за 11,16 с
      точка отправила 110 маяков. Маяки сообщают имя сети, BSSID, скорости и параметры
      безопасности, а ещё перечисляют, для каких спящих клиентов накоплены кадры.

  - q: На чём основана атака поддельной точкой доступа (evil twin)?
    options:
      - На взломе пароля точки доступа перебором
      - На том, что имя сети может взять кто угодно
      - На перегрузке точки доступа ложными запросами клиентов
      - На подмене прошивки настоящей точки доступа
    answer: 1
    explain: >
      Клиенты узнают знакомую сеть по имени (и типу защиты), а не по подлинности точки,
      и выбрать такое же имя может любой, как в шаге 7 опыта.
      В открытой сети клиент не может отличить двойника от настоящей точки, и его трафик
      пойдёт через злоумышленника.

  - q: Что защищает от поддельных кадров отключения (деаутентификации)?
    options:
      - Скрытое имя сети, которое не передаётся в маяках
      - Смена канала точки доступа на менее занятый
      - Защита служебных кадров по стандарту 802.11w
      - Фильтрация клиентов по их MAC-адресам
    answer: 2
    explain: >
      802.11w (Protected Management Frames) защищает кадры отключения кодом целостности
      на ключах, выработанных при подключении, и поддельные кадры отбрасываются. В WPA3 эта защита
      обязательна. Скрытое имя и фильтр по MAC не помогают: кадры в эфире видны всем, а
      MAC-адрес легко подставить.

open_questions:
  - q: Опиши, что происходит в эфире, когда телефон подключается к открытой сети Wi-Fi.
    reference: >
      Сначала телефон ищет сеть: слушает маяки, которые точка доступа рассылает каждые
      102,4 мс, или сам рассылает Probe Request по разрешённым каналам, и точки отвечают Probe
      Response. Затем он отправляет кадр Authentication; в открытой сети точка
      отвечает "успешно" любому. Потом Association Request, на который точка отвечает
      Association Response с номером ассоциации. Каждый адресный кадр подтверждается
      ACK. В защищённой сети после ассоциации идёт обмен ключами (а в WPA3 пароль
      проверяется ещё на шаге Authentication). После этого идут кадры данных, например
      ARP и получение адреса по DHCP. Все эти служебные кадры
      передаются открыто и не подписаны.
    key_points:
      - поиск - маяки или Probe Request/Response
      - Authentication (открытая система - формальность)
      - Association Request/Response
      - подтверждения ACK, служебные кадры открыты

  - q: Как работает CSMA/CA в Wi-Fi и чем он отличается от CSMA/CD в классическом Ethernet?
    reference: >
      Станция слушает эфир и ждёт, пока он будет свободен в течение паузы DIFS, затем
      отсчитывает случайное число слотов из окна конкуренции, замораживая счёт, пока
      эфир занят, и передаёт кадр, когда счётчик дошёл до нуля. Получатель подтверждает
      кадр ACK через короткую паузу SIFS. Нет подтверждения - кадр считается потерянным,
      окно удваивается и попытка повторяется. Дополнительно станции слушают эфир
      виртуально: по полю Duration заводят NAV и молчат. В отличие от CSMA/CD коллизии
      не обнаруживаются во время передачи (радио не может слушать себя и других
      одновременно), их стараются избежать заранее случайной отсрочкой и узнают о
      неудаче по отсутствию ACK.
    key_points:
      - пауза DIFS и случайная отсрочка с заморозкой
      - ACK через SIFS, удвоение окна при неудаче
      - виртуальное прослушивание - Duration и NAV
      - коллизии не обнаруживают, а избегают

  - q: Почему в Wi-Fi возможны поддельная точка доступа и принудительное отключение и как от них защищаются?
    reference: >
      Служебные кадры классического 802.11 - маяки, поиск, аутентификация, ассоциация и
      отключение - передаются открыто и не подписаны. Имя сети может взять кто угодно,
      поэтому злоумышленник поднимает двойника с тем же SSID, и в открытой сети клиент не
      отличит его от настоящей точки; трафик пойдёт через злоумышленника. Поддельные кадры
      отключения от имени точки заставляют клиентов отключаться (атака на доступность,
      а также повод заманить их к двойнику). Защита: 802.11w, защищающий служебные
      кадры кодом целостности (обязателен в WPA3); сети, доказывающие подлинность (сертификат сервера в
      Enterprise, пароль в Personal, если он не общий); в открытых сетях - HTTPS и VPN;
      отказ от автоподключения к открытым сетям; наблюдение за посторонними точками.
    key_points:
      - служебные кадры открыты и не подписаны, SSID может взять любой
      - двойник в открытой сети - человек посередине
      - поддельные кадры отключения - атака на доступность
      - 802.11w, проверка подлинности сети, HTTPS и VPN, без автоподключения
