<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Рукопожатие TLS 1.3: один круг</text>
  <g font-size="20" font-weight="bold" fill="#0E1830" text-anchor="middle">
    <rect x="130" y="70" width="200" height="44" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/><text x="230" y="99">Клиент</text>
    <rect x="870" y="70" width="200" height="44" rx="8" fill="#DCFCE7" stroke="#15803D"/><text x="970" y="99">Сервер</text>
  </g>
  <rect x="236" y="235" width="728" height="300" fill="#FEF3C7" opacity="0.6"/>
  <text x="600" y="258" text-anchor="middle" font-size="16" fill="#92400E">зашифровано ключами рукопожатия</text>
  <line x1="230" y1="114" x2="230" y2="680" stroke="#94A3B8" stroke-width="3"/>
  <line x1="970" y1="114" x2="970" y2="680" stroke="#94A3B8" stroke-width="3"/>
  <g font-size="18" fill="#0E1830" text-anchor="middle">
    <line x1="232" y1="160" x2="966" y2="175" stroke="#1D4ED8" stroke-width="3" marker-end="url(#r)"/>
    <text x="600" y="155" font-weight="bold">ClientHello + key_share (ключ клиента)</text>
    <line x1="968" y1="210" x2="234" y2="225" stroke="#15803D" stroke-width="3" marker-end="url(#l)"/>
    <text x="600" y="205" font-weight="bold">ServerHello + key_share (ключ сервера)</text>
    <line x1="968" y1="290" x2="234" y2="305" stroke="#15803D" stroke-width="3" marker-end="url(#l)"/>
    <text x="600" y="285">EncryptedExtensions</text>
    <line x1="968" y1="340" x2="234" y2="355" stroke="#15803D" stroke-width="3" marker-end="url(#l)"/>
    <text x="600" y="335">Certificate</text>
    <line x1="968" y1="390" x2="234" y2="405" stroke="#15803D" stroke-width="3" marker-end="url(#l)"/>
    <text x="600" y="385">CertificateVerify: подпись хеша рукопожатия</text>
    <line x1="968" y1="440" x2="234" y2="455" stroke="#15803D" stroke-width="3" marker-end="url(#l)"/>
    <text x="600" y="435">Finished</text>
    <line x1="232" y1="500" x2="966" y2="515" stroke="#1D4ED8" stroke-width="3" marker-end="url(#r)"/>
    <text x="600" y="495">Finished</text>
    <line x1="232" y1="580" x2="966" y2="595" stroke="#64748B" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="600" y="575" fill="#475569">данные приложения (ключи трафика)</text>
    <line x1="968" y1="635" x2="234" y2="650" stroke="#64748B" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="600" y="630" fill="#475569">NewSessionTicket, данные</text>
  </g>
  <g font-size="17" fill="#B91C1C" text-anchor="middle">
    <text x="52" y="305">1 круг</text>
    <line x1="110" y1="150" x2="110" y2="460" stroke="#B91C1C" stroke-width="2"/>
  </g>
  <g font-size="16" fill="#475569" text-anchor="start">
    <text x="985" y="215">общий секрет</text>
    <text x="985" y="235">(EC)DHE готов</text>
  </g>
</svg>
