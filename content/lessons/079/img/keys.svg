<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Расписание ключей TLS 1.3 (HKDF)</text>
  <g font-size="18" fill="#0E1830" text-anchor="middle">
    <rect x="40" y="110" width="220" height="50" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="150" y="141">PSK или нули</text>
    <rect x="40" y="280" width="220" height="50" rx="8" fill="#F1F5F9" stroke="#475569"/><text x="150" y="311">секрет (EC)DHE</text>

    <rect x="340" y="110" width="240" height="50" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/><text x="460" y="141" font-weight="bold">Early Secret</text>
    <rect x="340" y="280" width="240" height="50" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/><text x="460" y="311" font-weight="bold">Handshake Secret</text>
    <rect x="340" y="450" width="240" height="50" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/><text x="460" y="481" font-weight="bold">Master Secret</text>

    <line x1="260" y1="135" x2="336" y2="135" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <line x1="260" y1="305" x2="336" y2="305" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <line x1="460" y1="160" x2="460" y2="276" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <line x1="460" y1="330" x2="460" y2="446" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <text x="300" y="125" font-size="15" fill="#475569">Extract</text>
    <text x="300" y="295" font-size="15" fill="#475569">Extract</text>
    <text x="520" y="425" font-size="15" fill="#475569">Extract</text>

    <line x1="580" y1="135" x2="676" y2="135" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <line x1="580" y1="305" x2="676" y2="305" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <line x1="580" y1="475" x2="676" y2="475" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
    <text x="628" y="125" font-size="15" fill="#475569">Expand</text>
    <text x="628" y="295" font-size="15" fill="#475569">Expand</text>
    <text x="628" y="465" font-size="15" fill="#475569">Expand</text>
  </g>
  <g font-size="17" fill="#0E1830" text-anchor="start">
    <rect x="680" y="100" width="480" height="70" rx="8" fill="#FEF3C7" stroke="#B45309"/>
    <text x="700" y="128">ранние данные клиента (0-RTT)</text>
    <text x="700" y="153" fill="#475569" font-size="15">только из PSK, без (EC)DHE</text>

    <rect x="680" y="270" width="480" height="70" rx="8" fill="#DCFCE7" stroke="#15803D"/>
    <text x="700" y="298">рукопожатие: клиент и сервер</text>
    <text x="700" y="323" fill="#475569" font-size="15">EncryptedExtensions ... Finished</text>

    <rect x="680" y="420" width="480" height="140" rx="8" fill="#DCFCE7" stroke="#15803D"/>
    <text x="700" y="450">трафик приложения: клиент и сервер (_0, _1...)</text>
    <text x="700" y="480">экспорт ключей</text>
    <text x="700" y="510">возобновление сессии (билеты)</text>
    <text x="700" y="540" fill="#475569" font-size="15">каждый секрет трафика -> свой ключ и IV</text>
  </g>
</svg>
