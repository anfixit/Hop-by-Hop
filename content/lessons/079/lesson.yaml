id: 79
title: "TLS 1.3: рукопожатие, расписание ключей, 0-RTT"
status: published
summary: >
  Что TLS 1.3 изменил по сравнению с TLS 1.2, рукопожатие за один круг по
  сообщениям (key_share, EncryptedExtensions, CertificateVerify, Finished),
  HelloRetryRequest, расписание ключей на HKDF и ранние данные 0-RTT. На практике -
  рукопожатие в выводе openssl s_client -trace, гибридная постквантовая группа в
  OpenSSL 3.5, секреты в журнале ключей, 0-RTT и защита от повтора. Безопасность:
  повтор ранних данных.

quiz:
  - q: Что позволяет TLS 1.3 уложить полное рукопожатие в один круг?
    options:
      - Сервер вообще не присылает свой сертификат
      - Клиент сразу отправляет ключ в key_share
      - Обмен ключами идёт через RSA
      - Рукопожатие совсем не шифруется
    answer: 1
    explain: >
      Клиент угадывает группу и сразу прикладывает свой открытый ключ (EC)DHE, так
      что после ServerHello обе стороны уже знают общий секрет.

  - q: Когда сервер отвечает HelloRetryRequest?
    options:
      - Когда сертификат клиента не прошёл проверку
      - Когда билет сессии уже использован
      - Когда в key_share нет подходящей группы
      - Когда клиент не указал SNI
    answer: 2
    explain: >
      Сервер называет группу, которую поддерживает, и клиент повторяет ClientHello
      с ключом для неё. В опыте клиент прислал X25519, а сервер знал только P-256.

  - q: Что подписывает сервер в CertificateVerify?
    options:
      - Хеш всех сообщений рукопожатия
      - Только свой временный ключ (EC)DHE
      - Только случайное число клиента
      - Билет для возобновления сессии
    answer: 0
    explain: >
      В TLS 1.3 подпись покрывает весь ход рукопожатия (transcript hash), а не
      только параметры обмена ключами, как в TLS 1.2.

  - q: Какие сообщения TLS 1.3 видит наблюдатель на пути открытыми?
    options:
      - Все сообщения, как и в TLS 1.2
      - Только Finished
      - Ни одного
      - ClientHello и ServerHello
    answer: 3
    explain: >
      Всё после ServerHello, включая сертификат, шифруется ключами рукопожатия.
      ChangeCipherSpec для совместимости тоже идёт открыто, но ничего не несёт.

  - q: Почему все секреты в журнале ключей в опыте были по 48 байт?
    options:
      - Так задано в OpenSSL для любых наборов шифров
      - Набор использует SHA-384, его выход 48 байт
      - Длина ключа сертификата равна 48 байтам
      - Это длина билета сессии
    answer: 1
    explain: >
      Длина секретов расписания ключей равна выходу хеша набора. Согласован
      TLS_AES_256_GCM_SHA384; с SHA-256 было бы 32 байта.

  - q: Чем ранние данные 0-RTT отличаются от остальных данных соединения?
    options:
      - Они передаются открытым текстом, без шифрования
      - Они всегда сжаты
      - Их можно повторить, нет прямой секретности
      - Они доступны только в TLS 1.2
    answer: 2
    explain: >
      Ранние данные шифруются ключом из PSK билета. Их ключ не зависит от ответа
      сервера, поэтому их можно принять повторно в другом соединении, и (EC)DHE в
      их ключ не входит.

  - q: Что показал повтор того же билета с ранними данными в опыте?
    options:
      - Билет не принят, ранние данные отклонены
      - Сервер принял тот же запрос второй раз подряд
      - Соединение оборвалось с ошибкой
      - Сервер выдал тот же билет снова
    answer: 0
    explain: >
      Сервер OpenSSL с включёнными ранними данными по умолчанию делает билеты
      одноразовыми: второе соединение пошло полным рукопожатием (New), ранние данные отклонены.

  - q: Какие запросы разумно разрешать в ранних данных?
    options:
      - Платежи, чтобы они проходили быстрее
      - Любые, TLS 1.3 защищает от повтора
      - Только запросы с паролями
      - Только безопасные, идемпотентные
    answer: 3
    explain: >
      Повтор чтения страницы безвреден, повтор платежа - нет. Для HTTP есть RFC
      8470: заголовок Early-Data и ответ 425 Too Early.

open_questions:
  - q: Опиши рукопожатие TLS 1.3 и чем оно отличается от TLS 1.2.
    reference: >
      ClientHello с key_share (клиент сразу отправляет ключ (EC)DHE), ServerHello с
      ключом сервера, затем зашифрованные EncryptedExtensions, Certificate,
      CertificateVerify (подпись хеша рукопожатия), Finished, и Finished клиента.
      Один круг вместо двух, всё после ServerHello зашифровано, нет обмена через
      RSA и шифров не-AEAD. При неверной догадке о группе - HelloRetryRequest.
    key_points:
      - key_share
      - шифрование после ServerHello
      - CertificateVerify и Finished
      - один круг и HelloRetryRequest

  - q: Как устроено расписание ключей TLS 1.3?
    reference: >
      Цепочка HKDF: Early Secret из PSK или нулей, Handshake Secret с добавлением
      общего секрета (EC)DHE, затем Master Secret. Из каждого шага Expand с метками
      и хешем рукопожатия выводит отдельные секреты: ранних данных, рукопожатия
      клиента и сервера, трафика приложения, экспорта и возобновления. Из секретов
      трафика - ключ и IV. Длина равна выходу хеша набора.
    key_points:
      - Extract и Expand
      - три ступени
      - секреты по целям и направлениям
      - длина по хешу

  - q: В чём риск 0-RTT и как от него защищаются?
    reference: >
      Ранние данные можно повторить, и они защищены только ключом билета, без
      прямой секретности. Защита - не включать 0-RTT без нужды, разрешать только
      идемпотентные запросы, в HTTP использовать Early-Data и 425 Too Early,
      включать защиту от повтора на сервере (одноразовые билеты, учёт ClientHello,
      проверка свежести) и менять ключи билетов.
    key_points:
      - повтор
      - без прямой секретности
      - идемпотентные запросы
      - защита на сервере
