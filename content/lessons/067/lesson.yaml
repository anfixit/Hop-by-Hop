id: 67
title: "Приватность DNS: Do53, DoT, DoH, DoQ"
status: published
summary: >
  Что раскрывают запросы DNS и кому: наблюдателям на пути, резолверу,
  авторитетным серверам (QNAME-минимизация и EDNS Client Subnet). Шифрование пути
  до резолвера: DoT, DoH, DoQ, строгий и оппортунистический режимы, обнаружение
  шифрованных резолверов. Что шифрование не скрывает и Oblivious DoH. На практике -
  резолвер BIND с Do53, DoT и DoH, поиск имени в записанном трафике и журнал
  резолвера. Безопасность: утечки DNS и как их предотвращать.

quiz:
  - q: Кто видит имена в обычном DNS (Do53)?
    options:
      - Только сам резолвер, больше никто
      - Только авторитетный сервер зоны
      - Все на пути до резолвера и резолвер
      - Никто, имена передаются хешами
    answer: 2
    explain: >
      Do53 идёт открытым текстом: имя видят сосед по Wi-Fi, провайдер и резолвер.
      В опыте одна строка tcpdump показала A? secret-project.corp.lab.

  - q: Чем DoH отличается от DoT?
    options:
      - DoH шифрует ответы, а DoT только вопросы
      - DoH идёт внутри HTTPS на порт 443
      - DoH скрывает запросы и от резолвера
      - DoH работает только поверх UDP
    answer: 1
    explain: >
      DoT - DNS внутри TLS на отдельном порту 853, DoH - внутри HTTPS на 443, и
      снаружи его трудно отличить от веб-трафика. Резолвер видит всё в обоих
      случаях.

  - q: Что увидел резолвер в опыте при запросах по DoT и DoH?
    options:
      - Зашифрованные данные без имени
      - Адрес клиента, но не имя
      - Хеш искомого имени
      - Полное имя и адрес клиента
    answer: 3
    explain: >
      Шифрование защищает путь, а не данные от того, кому их отправили: в журнале
      резолвера все три запроса с полным именем и адресом клиента.

  - q: Чем строгий режим DoT отличается от оппортунистического?
    options:
      - При сбое не откатывается на открытый DNS
      - Шифрует все запросы более длинным ключом
      - Скрывает от резолвера адрес клиента
      - Работает без сертификата резолвера
    answer: 0
    explain: >
      Строгий режим требует правильного сертификата резолвера и при сбое выдаёт
      ошибку. Оппортунистический откатывается на открытый DNS, и запросы утекают.

  - q: Что остаётся видно на пути даже при DoH?
    options:
      - Имена из запросов к резолверу
      - Адрес резолвера, время и объём
      - Содержимое ответов резолвера
      - Пароли и cookie браузера
    answer: 1
    explain: >
      Содержимое зашифровано, но адреса, порты, время и объём видны. Адрес сайта,
      к которому затем подключится устройство, и SNI без ECH тоже видны.

  - q: Что даёт Oblivious DoH?
    options:
      - Шифрует запрос дважды одним ключом
      - Ускоряет ответ за счёт кэша у посредника
      - Делит знание между посредником и резолвером
      - Скрывает от провайдера адреса всех сайтов
    answer: 2
    explain: >
      Посредник видит адрес клиента, но не вопрос, резолвер - вопрос, но не адрес:
      ни одна сторона не знает и того и другого, если они не сговорились.

  - q: Что такое утечка DNS?
    options:
      - Взлом базы данных регистратора доменов
      - Часть запросов идёт мимо защищённого пути
      - Резолвер публикует свои журналы в сети
      - Ответ DNS не помещается в один пакет
    answer: 1
    explain: >
      Например, откат на открытый DNS, приложения со своим резолвером или резолвер
      из IPv6, оставшийся прежним.

  - q: Как проверить на своей машине, что открытых запросов DNS нет?
    options:
      - Посмотреть tcpdump на порту 53 во время работы
      - Посмотреть, открывается ли сайт в браузере
      - Проверить, есть ли запись A у своего домена
      - Сравнить TTL в двух разных ответах резолвера
    answer: 0
    explain: >
      Если шифрование работает в строгом режиме, tcpdump -ni any port 53 не должен
      показывать запросов к чужим серверам; режим и серверы покажет resolvectl
      status.

open_questions:
  - q: Кто и что узнаёт из запросов DNS при Do53 и при DoT или DoH?
    reference: >
      При Do53 имена видят все на пути (Wi-Fi, провайдер), резолвер и частично
      авторитетные серверы (QNAME-минимизация скрывает полные имена от корня и TLD,
      ECS может раскрыть подсеть клиента). DoT и DoH шифруют путь до резолвера:
      наблюдатель видит только адреса, порт, время и объём; резолвер по-прежнему
      видит всё. Адрес назначения и SNI без ECH остаются видны.
    key_points:
      - путь, резолвер, авторитетные серверы
      - шифрование пути
      - резолвер видит всё
      - что остаётся видно

  - q: Что такое утечка DNS, откуда она берётся и как её предотвратить?
    reference: >
      Утечка - часть запросов идёт мимо выбранного защищённого пути. Причины:
      оппортунистический режим и откат на открытый DNS, второй резолвер из DHCP,
      приложения со своим резолвером, IPv6-резолвер, разделённые настройки.
      Защита: строгий режим (DNSOverTLS=yes), один резолвер для всех интерфейсов и
      IPv6, разрешение исходящего DNS только своему резолверу, проверка tcpdump и
      resolvectl.
    key_points:
      - определение
      - откат и свои резолверы приложений
      - строгий режим, один резолвер
      - проверка tcpdump

  - q: Почему шифрование DNS вызывает споры?
    reference: >
      Шифрование почти все считают благом, но при DoH в браузере резолвер может
      выбирать разработчик браузера, а не пользователь или сеть. Организации теряют
      видимость DNS, на которой строились поиск заражённых машин и фильтры, а
      запросы сосредотачиваются у немногих операторов. Шифрование переносит доверие
      на оператора резолвера; для управляемых сетей есть политики и сигналы,
      позволяющие пользоваться своим резолвером.
    key_points:
      - кто выбирает резолвер
      - видимость для организаций
      - централизация
      - доверие переносится
