<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Кто что видит в запросах DNS</text>
  <g font-size="16" fill="#0E1830" text-anchor="middle">
    <rect x="40" y="80" width="200" height="80" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="140" y="115" font-weight="bold">клиент</text><text x="140" y="140" font-size="13">ищет secret-project</text>
    <rect x="420" y="80" width="320" height="80" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="580" y="115" font-weight="bold">путь: Wi-Fi, провайдер</text><text x="580" y="140" font-size="13">наблюдатель</text>
    <rect x="920" y="80" width="240" height="80" rx="12" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/><text x="1040" y="115" font-weight="bold">резолвер</text><text x="1040" y="140" font-size="13">видит вопросы и адрес клиента</text>
  </g>
  <g stroke="#475569" stroke-width="2.5"><line x1="240" y1="120" x2="420" y2="120"/><line x1="740" y1="120" x2="920" y2="120"/></g>
  <g font-size="14" fill="#64748B" font-weight="bold"><text x="60" y="198">протокол</text><text x="180" y="198">транспорт</text><text x="400" y="198">что видит путь</text><text x="920" y="198">резолвер</text></g>
  <rect x="40" y="210" width="1120" height="58" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <g font-size="15" fill="#0E1830"><text x="60" y="245" font-weight="bold">Do53</text><text x="180" y="245">UDP/TCP 53</text><text x="400" y="245">имя, адрес клиента, время</text><text x="920" y="245">вопросы и адрес клиента</text></g>
  <rect x="40" y="278" width="1120" height="58" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <g font-size="15" fill="#0E1830"><text x="60" y="313" font-weight="bold">DoT</text><text x="180" y="313">TCP 853, TLS</text><text x="400" y="313">что это DNS, адреса, время</text><text x="920" y="313">вопросы и адрес клиента</text></g>
  <rect x="40" y="346" width="1120" height="58" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <g font-size="15" fill="#0E1830"><text x="60" y="381" font-weight="bold">DoH</text><text x="180" y="381">обычно 443, HTTPS</text><text x="400" y="381">похоже на веб, адреса, время</text><text x="920" y="381">вопросы и адрес клиента</text></g>
  <rect x="40" y="414" width="1120" height="58" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <g font-size="15" fill="#0E1830"><text x="60" y="449" font-weight="bold">DoQ</text><text x="180" y="449">UDP 853, QUIC</text><text x="400" y="449">что это DNS, адреса, время</text><text x="920" y="449">вопросы и адрес клиента</text></g>
  <text x="600" y="520" text-anchor="middle" font-size="16" fill="#B45309">Шифрование защищает путь, а не данные от резолвера; адрес сайта и SNI без ECH остаются видны.</text>
  <text x="600" y="552" text-anchor="middle" font-size="15" fill="#64748B">Утечка DNS - часть запросов идёт мимо защищённого пути: открытым текстом или к другому резолверу.</text>
</svg>
