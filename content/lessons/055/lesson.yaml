id: 55
title: "conntrack: что хранится, состояния, таймауты"
status: published
summary: >
  Подсистема ядра conntrack: запись потока с исходным и ответным кортежами,
  состоянием, таймаутом и флагами, отслеживание TCP, UDP и ICMP, состояния для
  правил, таймауты, размер таблицы и инструменты conntrack. На практике - запись
  открытого соединения, события жизни короткого соединения, записи UDP с ответом и
  без, таймауты, статистика и notrack. Безопасность: переполнение таблицы
  conntrack и защита от него.

quiz:
  - q: Зачем в записи conntrack два кортежа - исходный и ответный?
    options:
      - Для соединений IPv4 и для IPv6 отдельно
      - Чтобы узнавать ответы, в том числе после NAT
      - Для двух сетевых интерфейсов маршрутизатора
      - Чтобы хранить старое и новое состояние
    answer: 1
    explain: >
      Исходный кортеж описывает первый пакет, ответный - каким должен быть ответ.
      Без NAT он зеркальный, с NAT в нём уже новые адреса, и по нему conntrack
      узнаёт ответ и делает обратную замену.

  - q: Отслеживает ли conntrack UDP, у которого нет соединений?
    options:
      - Нет, он следит только за TCP
      - Только DNS-запросы на порту 53
      - Да, как поток запросов и ответов
      - Только при включённом notrack
    answer: 2
    explain: >
      conntrack заводит запись для любого потока: TCP, UDP, ICMP. В опыте UDP на
      порт 5300 без ответа дал запись [UNREPLIED], а на порт 53 с ответом - запись
      без этого флага.

  - q: Что означает флаг [UNREPLIED] в записи?
    options:
      - Ответа на этот поток ещё не было
      - Соединение закрыто сервером
      - Пакет признан недопустимым
      - Запись создана правилом вручную
    answer: 0
    explain: >
      [UNREPLIED] - conntrack видел пакеты только в одну сторону. Так выглядели
      запись SYN_SENT в начале рукопожатия и UDP на молчащий порт 5300.

  - q: Сколько по умолчанию живёт запись установленного соединения TCP без новых пакетов?
    options:
      - 30 секунд
      - 120 секунд
      - 1 час
      - 5 суток
    answer: 3
    explain: >
      nf_conntrack_tcp_timeout_established = 432000 секунд, 5 суток: соединение
      может долго молчать. После каждого пакета таймер взводится заново.

  - q: Запись conntrack долгого молчащего соединения истекла, и следующий пакет пришёл снаружи на маршрутизатор с файерволом с состоянием. Что будет?
    options:
      - Ядро автоматически продлит запись
      - Пакет окажется new и будет отброшен
      - Соединение закроется сразу у обеих сторон
      - Ничего, conntrack вспомнит его по порту
    answer: 1
    explain: >
      Без записи пакет снаружи окажется new или invalid, и файервол с
      состоянием его отбросит. Поэтому долгим соединениям нужны периодические
      проверки (keepalive).

  - q: Что делает правило notrack в цепочке с приоритетом raw?
    options:
      - Отбрасывает пакеты без записи
      - Удаляет все записи conntrack
      - Выключает отслеживание этих пакетов
      - Запрещает пакетам проходить через NAT
    answer: 2
    explain: >
      Цепочка с приоритетом raw работает до conntrack (-300), и notrack выключает отслеживание
      для своих пакетов: записи не создаются, состояние - untracked. Пропускать
      такие пакеты, в том числе ответы, нужно отдельными правилами.

  - q: Что происходит при переполнении таблицы conntrack?
    options:
      - Ядро отбрасывает пакеты новых потоков
      - Старые соединения разрываются все сразу
      - Таблица автоматически растёт без предела
      - Файервол отключается и пропускает всё
    answer: 0
    explain: >
      Ядро пытается вытеснить записи без [ASSURED], а если не выходит -
      отбрасывает новые пакеты с сообщением table full, dropping packet.
      Установленные соединения при этом работают.

  - q: Какая мера НЕ помогает против переполнения таблицы conntrack?
    options:
      - Увеличить nf_conntrack_max под нагрузку
      - Выключить отслеживание лишнего (notrack)
      - Укоротить ненужно длинные таймауты
      - Отключить флаг ASSURED у записей
    answer: 3
    explain: >
      Флаг ASSURED выставляет само ядро, отключить его нельзя и бессмысленно. А
      мониторинг, размер таблицы, таймауты, notrack и отсечение мусора раньше
      conntrack - действенные меры.

open_questions:
  - q: Что хранит запись conntrack и как она помогает файерволу и NAT?
    reference: >
      Запись описывает поток: исходный кортеж (адреса, протокол, порты первого
      пакета) и ответный (каким будет ответ; при NAT - с новыми адресами),
      состояние протокола, таймаут, флаги UNREPLIED и ASSURED, метку и сведения о
      NAT. Файервол по ней определяет состояние пакета (new, established, related,
      invalid) и пропускает ответы только на разрешённые потоки. NAT по ответному
      кортежу узнаёт ответ и делает обратную замену адресов.
    key_points:
      - исходный и ответный кортежи
      - состояние, таймаут, флаги
      - состояния для правил файервола
      - обратная замена при NAT

  - q: Опиши жизнь записи conntrack для короткого соединения TCP.
    reference: >
      Первый SYN создаёт запись NEW в состоянии SYN_SENT с флагом UNREPLIED и
      таймаутом 120 с. SYN+ACK переводит её в SYN_RECV (таймаут 60 с), завершение рукопожатия - в
      ESTABLISHED с флагом ASSURED и таймаутом 5 суток. При закрытии запись
      проходит FIN_WAIT, иногда CLOSE_WAIT, LAST_ACK и TIME_WAIT (120 с), после
      чего удаляется по таймауту. Промежуточные состояния закрытия зависят от
      порядка FIN и подтверждений.
    key_points:
      - SYN_SENT, UNREPLIED
      - SYN_RECV, ESTABLISHED, ASSURED
      - FIN_WAIT, LAST_ACK, TIME_WAIT
      - удаление по таймауту

  - q: Почему переполнение таблицы conntrack опасно и как от него защититься?
    reference: >
      Запись занимает каждый пропущенный файерволом поток, а таблица ограничена nf_conntrack_max. При
      переполнении ядро вытесняет записи без ASSURED, а если не может - отбрасывает
      новые пакеты (table full, dropping packet): новые соединения не
      открываются, это отказ в обслуживании. Защита: мониторинг count/max и
      счётчиков drop, early_drop, insert_failed; размер таблицы и корзин под
      нагрузку; более короткие ненужные таймауты; notrack для высоконагруженного
      трафика без NAT; ограничение частоты новых соединений, SYNPROXY,
      фильтрация до conntrack.
    key_points:
      - каждый пропущенный поток занимает запись
      - новые соединения отбрасываются
      - мониторинг и размер
      - таймауты, notrack, отсечение мусора
