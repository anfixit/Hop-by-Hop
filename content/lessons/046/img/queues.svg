<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Две очереди слушающего сокета</text>
  <text x="600" y="75" text-anchor="middle" font-size="16" fill="#475569">рукопожатие проводит ядро; программа забирает готовые соединения вызовом accept</text>
  <g font-size="16" fill="#0E1830" text-anchor="middle">
    <rect x="40" y="150" width="170" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="125" y="182">клиенты</text><text x="125" y="204" font-size="13" fill="#475569">SYN</text>
    <rect x="290" y="120" width="260" height="130" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
    <text x="420" y="148">незавершённые рукопожатия</text><text x="420" y="170" font-size="13" fill="#475569">SYN-RECV: ждём последний ACK</text>
    <g fill="#FDE68A" stroke="#A16207"><rect x="320" y="190" width="40" height="36"/><rect x="370" y="190" width="40" height="36"/><rect x="420" y="190" width="40" height="36"/></g>
    <rect x="630" y="120" width="300" height="130" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="780" y="148">готовые соединения (accept queue)</text><text x="780" y="170" font-size="13" fill="#475569">ESTAB, длина задана в listen(backlog)</text>
    <g fill="#BBF7D0" stroke="#15803D"><rect x="660" y="190" width="40" height="36"/><rect x="710" y="190" width="40" height="36"/><rect x="760" y="190" width="40" height="36"/><rect x="810" y="190" width="40" height="36"/></g>
    <rect x="1010" y="150" width="160" height="70" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="1090" y="182">программа</text><text x="1090" y="204" font-size="13" fill="#475569">accept()</text>
  </g>
  <g stroke="#475569" stroke-width="2.5"><line x1="210" y1="185" x2="276" y2="185"/><line x1="550" y1="185" x2="616" y2="185"/><line x1="930" y1="185" x2="996" y2="185"/></g>
  <g fill="#475569"><polygon points="290,185 276,178 276,192"/><polygon points="630,185 616,178 616,192"/><polygon points="1010,185 996,178 996,192"/></g>
  <g font-size="13" fill="#0E1830" text-anchor="middle"><text x="250" y="175">SYN</text><text x="590" y="175">ACK</text><text x="970" y="175">забрать</text></g>
  <g font-size="15" fill="#0E1830">
    <text x="290" y="290">Её переполняет атака SYN flood;</text><text x="290" y="312">защита - SYN cookies (урок 37).</text>
    <text x="630" y="290">У слушающего сокета в ss: Recv-Q - сколько ждут accept,</text>
    <text x="630" y="312">Send-Q - длина очереди.</text>
  </g>
  <rect x="40" y="350" width="1120" height="140" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
  <text x="600" y="382" text-anchor="middle" font-size="18" font-weight="bold" fill="#B91C1C">Программа не успевает вызывать accept</text>
  <text x="600" y="412" text-anchor="middle" font-size="16" fill="#0E1830">Очередь готовых соединений заполняется; новые SYN ядро отбрасывает без ответа,</text>
  <text x="600" y="436" text-anchor="middle" font-size="16" fill="#0E1830">клиенты повторяют их по таймеру. Счётчики nstat: ListenOverflows, ListenDrops.</text>
  <text x="600" y="466" text-anchor="middle" font-size="16" fill="#0E1830">В опыте: listen(3), 8 клиентов - 4 соединения в очереди (ESTAB у клиента), 4 клиента в SYN-SENT.</text>
</svg>