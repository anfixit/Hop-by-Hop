id: 46
title: "Сокеты в Linux и ss"
status: published
summary: >
  Сокеты со стороны администратора Linux: сокет как файловый дескриптор, вызовы
  сокетов Беркли, две очереди слушающего сокета и что происходит при их
  переполнении, ключи и фильтры ss, состояния TCP как признак ошибки в программе.
  На практике - переполненная очередь accept, зависший CLOSE-WAIT, одно соединение
  под ключами ss и проверка неожиданно открытых портов с защитой файерволом.

quiz:
  - q: Что показывают столбцы Recv-Q и Send-Q у сокета в состоянии LISTEN?
    options:
      - Байты, принятые и отправленные сокетом
      - Сколько ждут accept и предел очереди
      - Число принятых и отправленных SYN
      - Полуоткрытые соединения и их предел
    answer: 1
    explain: >
      У слушающего сокета Recv-Q - сколько готовых соединений ждут вызова accept
      прямо сейчас, Send-Q - длина этой очереди, заданная в listen. У обычного
      соединения те же столбцы значат непрочитанные и неподтверждённые байты.

  - q: Сервер вызвал listen(3) и не вызывает accept. Что увидит клиент, чьё соединение попало в очередь?
    options:
      - Соединение в состоянии ESTAB
      - Соединение в состоянии SYN-SENT
      - Немедленный отказ соединения (RST)
      - Сообщение ICMP "порт недоступен"
    answer: 0
    explain: >
      Рукопожатие проводит ядро, а не программа. Как только оно завершено,
      клиент считает соединение установленным, хотя программа-сервер о нём ещё не
      знает. В опыте у четырёх клиентов было ESTAB, у остальных - SYN-SENT.

  - q: Что делает Linux с новыми SYN, когда очередь готовых соединений слушающего сокета заполнена?
    options:
      - Отвечает на них RST
      - Ставит их в очередь программы
      - Увеличивает очередь автоматически
      - Отбрасывает их без ответа
    answer: 3
    explain: >
      Ядро молча отбрасывает новые SYN, растут счётчики ListenOverflows и
      ListenDrops, а клиенты повторяют SYN по таймеру. Параметр
      tcp_abort_on_overflow влияет только на соединения, чьё рукопожатие
      завершается при уже полной очереди.

  - q: На сервере накопились тысячи соединений в состоянии CLOSE-WAIT. Что это обычно значит?
    options:
      - Сервер под атакой SYN flood
      - Сеть теряет пакеты FIN
      - Программа не закрывает соединения
      - Клиенты не завершают рукопожатие
    answer: 2
    explain: >
      CLOSE-WAIT - другая сторона прислала FIN, а программа ещё не вызвала close.
      Сами такие сокеты не исчезнут, пока жива программа, поэтому их рост почти
      всегда указывает на ошибку в коде.

  - q: Какая команда покажет все слушающие сокеты TCP и UDP с номерами портов и программами?
    options:
      - ss -tn state established
      - ss -tulpn
      - ss -s
      - ss -tnoi
    answer: 1
    explain: >
      -t и -u - TCP и UDP, -l - только слушающие, -p - процесс, -n - числа вместо
      имён. -s выводит сводку, -o и -i - таймеры и внутренние сведения TCP.

  - q: В выводе ss служба слушает *:9000. Кто может к ней подключиться?
    options:
      - Только программы на этой же машине
      - Только клиенты по IPv6
      - Только клиенты из локальной сети
      - Клиенты по IPv4 и по IPv6
    answer: 3
    explain: >
      Звёздочка - сокет IPv6, привязанный к "::", который принимает и IPv4 (так в
      Linux по умолчанию); сокет только для IPv6 был бы показан как [::]. В опыте с a подключение на 9000 прошло по IPv4.

  - q: Файервол закрыл снаружи порт забытого отладочного сервера. Почему этого недостаточно?
    options:
      - Сервер продолжает слушать порт
      - Файервол не действует на TCP
      - Правила пропадают через час
      - Порт остаётся открытым по UDP
    answer: 0
    explain: >
      Файервол прячет службу, но не убирает её: в опыте ss по-прежнему показывал
      LISTEN на 8000. Изменят правила - служба снова доступна. Ненужное надо
      останавливать, внутреннее - привязывать к 127.0.0.1.

  - q: Почему ss не заменяет проверку сервера с другой машины?
    options:
      - ss показывает только сокеты UDP
      - ss не видит файервол и NAT
      - ss работает только от имени root
      - ss показывает только чужие процессы
    answer: 1
    explain: >
      ss показывает, что слушает на машине, но не что доступно снаружи: правила
      файервола, NAT, облачные группы безопасности меняют картину. Поэтому свой
      сервер полезно проверять и со своей же другой машины.

open_questions:
  - q: Опиши две очереди слушающего сокета TCP и что происходит, когда программа не успевает принимать соединения.
    reference: >
      Первая очередь - незавершённые рукопожатия: пришёл SYN, ядро ответило SYN+ACK и
      ждёт ACK, сокеты в состоянии SYN-RECV; её переполняет SYN flood, защищают SYN
      cookies. Вторая - готовые соединения, ждущие accept; её длину задаёт backlog в
      listen, ограниченный net.core.somaxconn (в современных ядрах он ограничивает и
      первую очередь). Клиент считает соединение
      установленным уже после рукопожатия. Если программа не успевает вызывать
      accept, очередь заполняется, Linux отбрасывает новые SYN без ответа, клиенты
      повторяют их по таймеру, растут ListenOverflows и ListenDrops. В ss у
      слушающего сокета Recv-Q близок к Send-Q.
    key_points:
      - незавершённые рукопожатия, SYN-RECV
      - готовые соединения, backlog в listen
      - при переполнении SYN отбрасываются, клиенты повторяют
      - Recv-Q и Send-Q у LISTEN, ListenOverflows

  - q: Как с помощью ss понять, что программа работает неправильно? Приведи примеры.
    reference: >
      Много CLOSE-WAIT - программа не закрывает соединения, которые закрыла другая
      сторона. Recv-Q у слушающего сокета близок к Send-Q - программа не успевает
      вызывать accept. Растущий Recv-Q у соединения - программа не успевает читать
      данные; растущий Send-Q - получатель или сеть не успевают принимать. Много
      SYN-RECV - незавершённые рукопожатия (атака или потеря ответов). Ключи -p
      показывают процесс, -o таймеры, -i время оборота, окно и повторы, -m память.
    key_points:
      - CLOSE-WAIT - программа не закрывает
      - Recv-Q у LISTEN - не успевает accept
      - Recv-Q и Send-Q у соединения
      - ключи -p, -o, -i, -m

  - q: Как найти и закрыть неожиданно открытые порты на своём сервере?
    reference: >
      Держать список ожидаемых портов и регулярно сравнивать с ss -tulpn; обращать
      внимание на 0.0.0.0, "::" и *, которые значат все адреса. Ненужные службы
      останавливать, внутренние привязывать к 127.0.0.1 или локальному сокету,
      порты контейнеров публиковать только на 127.0.0.1, если они нужны лишь
      локально (публикация Docker обходит правила INPUT). Файервол - второй рубеж
      с политикой "запрещено всё, что не разрешено", одинаково для IPv4 и IPv6.
      Проверять доступность снаружи со своей другой машины, потому что ss не видит
      файервол и NAT.
    key_points:
      - список ожидаемых и ss -tulpn
      - останавливать или привязывать к 127.0.0.1
      - файервол для IPv4 и IPv6 как второй рубеж
      - проверка снаружи
