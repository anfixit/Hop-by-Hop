id: 71
title: "Асимметричная криптография: RSA, Диффи-Хеллман"
status: published
summary: >
  Как асимметричная криптография решает проблему распределения ключей: открытый
  и закрытый ключ, односторонние функции с секретом, обмен ключами и подписи. RSA
  (разложение на множители, набивка OAEP и PSS, длины ключей, гибридная схема) и
  протокол Диффи-Хеллмана (дискретный логарифм, стандартные группы, прямая
  секретность). На практике - учебные RSA и DH на маленьких числах, рост работы
  разложения, RSA-2048 и ffdhe2048 в openssl, схема человека посередине.
  Безопасность: человек посередине при обмене ключами.

quiz:
  - q: Сколько ключей нужно n участникам при симметричном шифровании каждый с каждым?
    options:
      - n(n+1)
      - n + 1
      - n(n-1)/2
      - n^2/4
    answer: 2
    explain: >
      Каждой паре нужен свой ключ: для 1000 человек почти полмиллиона. С открытыми
      ключами достаточно одной пары на участника, всего 2n.

  - q: На трудности какой задачи основана стойкость RSA?
    options:
      - Разложения большого n на множители
      - Нахождения коллизий хеш-функции
      - Дискретного логарифма по модулю p
      - Перебора 128-битного ключа AES
    answer: 0
    explain: >
      Зная p и q, закрытый показатель вычислить легко, зная только n - нужно
      разложить его. В опыте каждые 2 бита n удваивали работу перебора.

  - q: Почему RSA используют только с набивкой вроде OAEP?
    options:
      - Без неё нельзя расшифровать сообщение
      - Набивка сокращает длину ключа вдвое
      - Набивка нужна только для цифровой подписи
      - Иначе одинаковые тексты шифруются одинаково
    answer: 3
    explain: >
      Учебный RSA детерминирован, как ECB, и имеет математические слабости. В опыте
      с OAEP два шифрования одного текста дали разные шифртексты.

  - q: Что видит наблюдатель при обмене Диффи-Хеллмана?
    options:
      - Секретные числа a и b обеих сторон
      - Значения p, g, A и B, но не секрет
      - Только p и g, но не A и B
      - Общий секрет g^(ab) mod p
    answer: 1
    explain: >
      Чтобы получить секрет, нужно найти a по g^a mod p - задача дискретного
      логарифма, для больших p неразрешимая на практике.

  - q: Что произошло в опыте с человеком посередине?
    options:
      - У Алисы и Боба разные ключи, оба известны Мэллори
      - Обмен прервался с ошибкой проверки
      - Алиса и Боб получили один ключ, его не знает никто
      - Мэллори узнала только открытые значения
    answer: 0
    explain: >
      Мэллори подменила оба открытых значения и провела два обмена. Протокол сам
      не может этого обнаружить.

  - q: Как защищают обмен ключами от человека посередине?
    options:
      - Увеличивают длину группы до 4096 бит
      - Выбирают секретные числа a и b длиннее
      - Повторяют весь обмен два раза подряд
      - Подписывают значения проверенным ключом
    answer: 3
    explain: >
      Долговременный ключ стороны, подтверждённый сертификатом или известным
      отпечатком, подписывает её открытые значения, и подмену видно.

  - q: Что даёт эфемерный Диффи-Хеллман?
    options:
      - Ускоряет установку соединения вдвое
      - Позволяет обойтись без сертификатов
      - Кража ключа не раскроет прошлый трафик
      - Шифрует данные без симметричного шифра
    answer: 2
    explain: >
      Прямая секретность: секреты обмена каждый раз новые и не хранятся, поэтому
      записанный трафик нельзя расшифровать даже с украденным ключом сервера.

  - q: Зачем на практике нужна гибридная схема?
    options:
      - Чтобы обойтись без закрытых ключей
      - Чтобы асимметрией передать лишь ключ
      - Чтобы подписи стали короче хеша
      - Чтобы ключи были одинаковой длины
    answer: 1
    explain: >
      RSA и Диффи-Хеллман медленны и работают с длинными числами. Ими согласуют
      короткий симметричный ключ, а данные шифруют AES или ChaCha20.

open_questions:
  - q: Как устроен RSA и почему его нельзя использовать "в учебном виде"?
    reference: >
      Берутся простые p и q, n = p × q, φ = (p-1)(q-1), открытый показатель e
      (обычно 65537) и закрытый d, обратный к e по модулю φ. Шифрование m^e mod n,
      расшифрование c^d mod n, подпись m^d mod n. Стойкость - трудность разложения
      n. Учебный RSA детерминирован и имеет математические слабости, поэтому
      используют набивку OAEP (шифрование) и PSS (подпись) и ключи от 2048 бит.
    key_points:
      - n, φ, e, d
      - разложение на множители
      - детерминизм учебного RSA
      - OAEP, PSS, 2048 бит

  - q: Опиши протокол Диффи-Хеллмана и атаку человека посередине на него.
    reference: >
      Стороны открыто выбирают p и g, Алиса отправляет g^a, Боб g^b, каждый
      вычисляет g^(ab) mod p. Наблюдатель не найдёт секрет без дискретного
      логарифма. Но активный посредник подменяет открытые значения своими и
      проводит два обмена; каждая сторона получает ключ с ним. Защита -
      аутентификация: подпись открытых значений долговременным ключом,
      подтверждённым сертификатом или отпечатком.
    key_points:
      - g^a, g^b, g^(ab)
      - дискретный логарифм
      - два обмена через посредника
      - подпись и сертификат

  - q: Что такое прямая секретность и почему TLS 1.3 отказался от обмена ключами через RSA?
    reference: >
      Прямая секретность - свойство, при котором кража долговременного ключа не
      раскрывает ранее записанный трафик. Эфемерный Диффи-Хеллман создаёт новые
      секреты для каждого соединения и не хранит их. При обмене через RSA
      сеансовый ключ шифруется ключом сервера, и с украденным закрытым ключом
      можно расшифровать весь записанный трафик. Поэтому из обменов на открытых ключах в TLS 1.3 остались только
      эфемерные: (EC)DHE, а теперь и гибриды с постквантовым ML-KEM.
    key_points:
      - определение прямой секретности
      - эфемерные секреты
      - RSA-обмен раскрывает прошлое
