<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">ALOHA: чем настойчивее станции, тем хуже при перегрузке</text>

  <!-- оси: X = 100 + G*260, Y = 460 - S*900 -->
  <line x1="100" y1="460" x2="920" y2="460" stroke="#0E1830" stroke-width="3"/>
  <line x1="100" y1="460" x2="100" y2="80" stroke="#0E1830" stroke-width="3"/>
  <g stroke="#E2E8F0" stroke-width="2">
    <line x1="102" y1="370" x2="900" y2="370"/>
    <line x1="102" y1="280" x2="900" y2="280"/>
    <line x1="102" y1="190" x2="900" y2="190"/>
    <line x1="102" y1="100" x2="900" y2="100"/>
  </g>
  <g font-size="18" fill="#0E1830" text-anchor="end">
    <text x="90" y="466">0</text><text x="90" y="376">0,1</text><text x="90" y="286">0,2</text>
    <text x="90" y="196">0,3</text><text x="90" y="106">0,4</text>
  </g>
  <g font-size="18" fill="#0E1830" text-anchor="middle">
    <text x="100" y="490">0</text><text x="230" y="490">0,5</text><text x="360" y="490">1</text>
    <text x="490" y="490">1,5</text><text x="620" y="490">2</text><text x="750" y="490">2,5</text><text x="880" y="490">3</text>
  </g>
  <text x="510" y="530" text-anchor="middle" font-size="20" fill="#0E1830">G - попыток передачи за время одного кадра</text>
  <text x="40" y="280" text-anchor="middle" font-size="20" fill="#0E1830" transform="rotate(-90 40 280)">полезная загрузка канала S</text>

  <polyline fill="none" stroke="#DC2626" stroke-width="5"
    points="100,460.0 126,386.3 152,339.3 178,311.8 204,298.2 230,294.5 256,297.4 282,304.6 308,314.6 334,326.1 360,338.2 386,350.3 412,362.0 438,373.1 464,383.4 490,392.8 516,401.3 542,408.9 568,415.7 594,421.7 620,427.0 646,431.7 672,435.7 698,439.2 724,442.2 750,444.8 776,447.1 802,449.0 828,450.7 854,452.1 880,453.3"/>
  <polyline fill="none" stroke="#4338CA" stroke-width="5"
    points="100,460.0 126,378.6 152,312.6 178,260.0 204,218.7 230,187.1 256,163.6 282,147.2 308,136.5 334,130.7 360,128.9 386,130.5 412,134.7 438,141.1 464,149.3 490,158.8 516,169.3 542,180.5 568,192.2 594,204.2 620,216.4 646,228.6 672,240.6 698,252.5 724,264.0 750,275.3 776,286.2 802,296.7 828,306.8 854,316.4 880,325.6"/>

  <!-- точки модели -->
  <g fill="#0F766E">
    <circle cx="230" cy="187.3" r="8"/><circle cx="360" cy="124.3" r="8"/><circle cx="750" cy="278.2" r="8"/>
  </g>

  <g font-size="19">
    <text x="372" y="112" fill="#4338CA">дискретная ALOHA: максимум 37% при G = 1</text>
    <text x="600" y="400" fill="#DC2626">чистая ALOHA: максимум 18% при G = 0,5</text>
  </g>
  <rect x="940" y="200" width="18" height="18" fill="#0F766E"/>
  <text x="966" y="215" font-size="18" fill="#0E1830">модель из урока</text>
  <text x="940" y="245" font-size="16" fill="#475569">(50 станций,</text>
  <text x="940" y="267" font-size="16" fill="#475569">100 000 слотов)</text>
</svg>
