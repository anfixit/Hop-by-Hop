<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Как приёмник находит границы кадров</text>

  <g font-size="20" font-weight="bold" fill="#0E1830">
    <text x="40" y="100">1. Счётчик байтов</text>
    <text x="40" y="240">2. Флаговые байты и байт-стаффинг (PPP)</text>
    <text x="40" y="380">3. Флаговые биты и бит-стаффинг (HDLC)</text>
    <text x="40" y="520">4. Запрещённые сигналы физического уровня</text>
  </g>

  <!-- 1 -->
  <g font-family="monospace" font-size="20">
    <rect x="40" y="115" width="50" height="44" fill="#FDE68A" stroke="#B45309"/><text x="65" y="144" text-anchor="middle">5</text>
    <rect x="90" y="115" width="200" height="44" fill="#F1F5F9" stroke="#94A3B8"/><text x="190" y="144" text-anchor="middle">4 байта данных</text>
    <rect x="290" y="115" width="50" height="44" fill="#FEE2E2" stroke="#DC2626"/><text x="315" y="144" text-anchor="middle">7</text>
    <rect x="340" y="115" width="200" height="44" fill="#F1F5F9" stroke="#94A3B8"/><text x="440" y="144" text-anchor="middle">4 байта данных</text>
  </g>
  <text x="570" y="136" font-size="18" fill="#DC2626">счётчик испортился (5 стал 7): приёмник примет</text>
  <text x="570" y="160" font-size="18" fill="#DC2626">середину следующего кадра за начало и собьётся навсегда</text>

  <!-- 2 -->
  <g font-family="monospace" font-size="20">
    <rect x="40" y="255" width="60" height="44" fill="#C7D2FE" stroke="#4338CA"/><text x="70" y="284" text-anchor="middle">7e</text>
    <rect x="100" y="255" width="60" height="44" fill="#F1F5F9" stroke="#94A3B8"/><text x="130" y="284" text-anchor="middle">41</text>
    <rect x="160" y="255" width="60" height="44" fill="#FDE68A" stroke="#B45309"/><text x="190" y="284" text-anchor="middle">7d</text>
    <rect x="220" y="255" width="60" height="44" fill="#FDE68A" stroke="#B45309"/><text x="250" y="284" text-anchor="middle">5e</text>
    <rect x="280" y="255" width="60" height="44" fill="#F1F5F9" stroke="#94A3B8"/><text x="310" y="284" text-anchor="middle">42</text>
    <rect x="340" y="255" width="60" height="44" fill="#C7D2FE" stroke="#4338CA"/><text x="370" y="284" text-anchor="middle">7e</text>
  </g>
  <text x="430" y="276" font-size="18" fill="#0E1830">флаг 7e обрамляет кадр; байт 7e внутри данных</text>
  <text x="430" y="300" font-size="18" fill="#0E1830">передаётся как пара 7d 5e, и флаг внутри не встретится</text>

  <!-- 3 -->
  <g font-family="monospace" font-size="20">
    <text x="40" y="420" fill="#475569">данные:</text>
    <text x="160" y="420" fill="#0E1830">0 1 1 1 1 1 1 1 0</text>
    <text x="40" y="455" fill="#475569">в линии:</text>
    <text x="160" y="455" fill="#0E1830">0 1 1 1 1 1</text>
    <text x="304" y="455" fill="#DC2626" font-weight="bold">0</text>
    <text x="328" y="455" fill="#0E1830">1 1 0</text>
  </g>
  <text x="520" y="425" font-size="18" fill="#0E1830">флаг 01111110; после пяти единиц в данных</text>
  <text x="520" y="449" font-size="18" fill="#0E1830">передатчик вставляет 0, приёмник его убирает</text>

  <!-- 4 -->
  <g font-family="monospace" font-size="20">
    <rect x="40" y="535" width="110" height="44" fill="#CCFBF1" stroke="#0F766E"/><text x="95" y="564" text-anchor="middle">начало</text>
    <rect x="150" y="535" width="240" height="44" fill="#F1F5F9" stroke="#94A3B8"/><text x="270" y="564" text-anchor="middle">данные (4B/5B)</text>
    <rect x="390" y="535" width="110" height="44" fill="#CCFBF1" stroke="#0F766E"/><text x="445" y="564" text-anchor="middle">конец</text>
  </g>
  <text x="530" y="556" font-size="18" fill="#0E1830">метки - кодовые комбинации, которые данные</text>
  <text x="530" y="580" font-size="18" fill="#0E1830">не используют: экранировать ничего не нужно</text>
</svg>
