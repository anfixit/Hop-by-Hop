id: 13
title: "Задачи канального уровня: кадры и доступ к среде"
status: published
summary: >
  Что делает канальный уровень: кадры, ошибки, управление потоком и доступ к общей
  среде. Три вида службы, четыре способа найти границы кадра, от ALOHA до CSMA/CD и
  маркера, скрытые и засвеченные станции в радио, RTS и CTS. На практике - заголовок
  кадра в tcpdump, байт-стаффинг и модель ALOHA, а в безопасности - атака "пакет в
  пакете" и захват эфира ложными CTS.

quiz:
  - q: Почему Wi-Fi подтверждает каждый кадр, а Ethernet - нет?
    options:
      - Ethernet медленнее, и ему некогда ждать подтверждений
      - В радио потерь много, и переспросить на месте быстрее
      - Ethernet передаёт кадры только внутри одного здания
      - Wi-Fi не умеет считать контрольную сумму кадра
    answer: 1
    explain: >
      В проводе ошибок мало, и подтверждения только тратили бы время. В радиоэфире
      потери обычное дело, и быстрее исправить их повтором на канальном уровне, чем
      ждать, пока заметит TCP. Контрольную сумму считают оба.

  - q: Почему способ "в начале кадра пишем его длину" в чистом виде почти не используют?
    options:
      - Длина кадра всегда одинаковая, и её незачем писать
      - Поле длины занимает слишком много места в кадре
      - Ошибка в счётчике сбивает все следующие границы
      - Счётчик байтов нельзя передать в двоичном виде
    answer: 2
    explain: >
      Искажённый счётчик заставит приёмник отсчитать неправильное число байтов и принять
      середину данных за начало следующего кадра. После этого правильную границу уже не
      найти, и даже повторная передача не поможет: неясно, сколько байтов пропустить.

  - q: В данных кадра PPP встретился байт 0x7E, совпадающий с флагом. Что делает передатчик?
    options:
      - Заменяет его на escape-байт 0x7D и изменённый байт
      - Отбрасывает его и дописывает 0x7E в конец кадра ещё раз
      - Разбивает кадр на два в месте, где стоит этот байт
      - "Ничего: получатель сам поймёт, что это данные"
    answer: 0
    explain: >
      Это байт-стаффинг: перед байтом, похожим на флаг, ставится escape 0x7D, а сам байт
      передаётся изменённым (в PPP - XOR с 0x20). Внутри кадра флаг больше не
      встречается, и граница однозначна.

  - q: Почему разделить 100-мегабитный канал на десять 10-мегабитных для пульсирующего трафика плохо?
    options:
      - Узкие каналы чаще ломаются и дороже в обслуживании
      - Десять каналов нельзя проложить в одном кабеле
      - Коллизий в узких каналах в десять раз больше
      - Чужие доли простаивают, а в своей копится очередь
    answer: 3
    explain: >
      Компьютерный трафик идёт пачками: у одних станций канал простаивает, у других
      выстраивается очередь. По расчёту Таненбаума средняя задержка вырастает в десять
      раз. Одна общая очередь эффективнее десяти отдельных.

  - q: Почему в ALOHA после коллизии станции ждут случайное время?
    options:
      - Чтобы не столкнуться снова, начав одновременно
      - Чтобы экономить энергию батареи устройства
      - Чтобы дать центральному компьютеру время на ответ
      - Так проще реализовать таймер в оборудовании
    answer: 0
    explain: >
      Если бы все ждали одинаково, столкнувшиеся станции снова начали бы одновременно и
      сталкивались бесконечно. Случайная задержка разводит их во времени.

  - q: Чем CSMA/CD лучше простого CSMA?
    options:
      - Он совсем исключает коллизии в любой сети
      - Станция прерывает передачу, услышав коллизию
      - Он передаёт маркер по кругу между станциями
      - Он заранее резервирует тайм-слоты для каждой станции
    answer: 1
    explain: >
      CSMA слушает канал перед передачей, но коллизии всё равно возможны из-за задержки
      распространения. CSMA/CD замечает коллизию во время передачи и сразу её
      прекращает, не тратя время на испорченный кадр.

  - q: Станции A и C передают станции B и друг друга не слышат. Как называется эта проблема?
    options:
      - Засвеченная станция
      - Скрытая станция
      - Эффект маркерного кольца
      - Широковещательный шторм
    answer: 1
    explain: >
      Скрытая станция: C слышит тишину, потому что A далеко, и начинает передачу, а у B
      сигналы смешиваются. Засвеченная - обратный случай: станция молчит, хотя могла бы
      передавать.

  - q: Зачем в Wi-Fi получатель отвечает на RTS кадром CTS?
    options:
      - Чтобы подтвердить, что данные дошли без ошибок
      - Чтобы сообщить отправителю свой MAC-адрес
      - Чтобы замолчали все станции рядом с получателем
      - Чтобы зашифровать следующий кадр с данными
    answer: 2
    explain: >
      CTS слышат все станции рядом с получателем, даже те, кто не слышит отправителя.
      Они молчат указанное в CTS время, и проблема скрытой станции в основном решается:
      сталкиваются в основном короткие RTS.

  - q: Что общего у атаки "пакет в пакете" и "пакетов-убийц" из урока 10?
    options:
      - Обе требуют физического доступа к кабелю жертвы
      - Обе ломают шифрование канального уровня
      - Обе используют ошибки в контрольной сумме CRC
      - Данные выдают себя за служебную разметку
    answer: 3
    explain: >
      В обоих случаях атакующий отправляет обычные данные, подобранные так, что приёмник
      принимает их за разметку: вложенный кадр или длинную серию нулей. Безопасность не
      должна зависеть от того, что данные "не похожи" на служебную информацию.

open_questions:
  - q: Опиши способы, которыми приёмник находит границы кадров, и их недостатки.
    reference: >
      Счётчик байтов: в начале кадра пишут длину, но если он исказится, приёмник теряет
      все следующие границы. Флаговые байты с байт-стаффингом: кадр обрамлён флагом,
      похожие на флаг байты в данных экранируются escape-байтом; после сбоя достаточно
      найти следующий флаг, но длина кадра зависит от содержимого. Бит-стаффинг: флаг
      01111110, после пяти единиц в данных вставляется ноль; тоже увеличивает длину.
      Запрещённые сигналы физического уровня (например, неиспользуемые комбинации 4B/5B)
      отмечают границы без вставок, но способ зависит от конкретного кода физического
      уровня. Ethernet начинает кадр с преамбулы и разделителя, а конец отмечает
      средствами физического уровня.
    key_points:
      - счётчик байтов - ошибка в счётчике ломает все следующие границы
      - флаговые байты и байт-стаффинг (PPP)
      - флаговые биты и бит-стаффинг (HDLC)
      - запрещённые сигналы физического уровня (4B/5B)
      - в Ethernet начало - преамбула и разделитель, конец - средствами физического уровня

  - q: Почему статическое деление канала плохо подходит для компьютерного трафика и какие динамические методы доступа к общей среде ты знаешь?
    reference: >
      Компьютерный трафик пульсирует: станции то молчат, то передают пачками. При
      статическом делении частот или слотов чужая доля простаивает, пока своей не
      хватает, и задержка растёт. Динамические методы: ALOHA - передавай сразу, после
      коллизии жди случайное время (до 18%, дискретная до 37% загрузки); CSMA -
      сначала слушай канал; CSMA/CD - слушай и во время передачи, прекращай при
      коллизии; протоколы без коллизий - маркер или тайм-слоты от центрального узла; в
      радио - CSMA/CA и RTS/CTS.
    key_points:
      - пульсирующий трафик - статические доли простаивают, задержка растёт
      - ALOHA и дискретная ALOHA, случайная задержка после коллизии
      - CSMA и CSMA/CD
      - бесконфликтные протоколы - маркер, тайм-слоты
      - в радио - CSMA/CA и RTS/CTS

  - q: Почему в беспроводной сети нельзя просто использовать CSMA/CD, как в классическом Ethernet?
    reference: >
      Во-первых, радиостанция не может слушать эфир во время своей передачи: её
      собственный сигнал намного сильнее чужих, поэтому коллизию не обнаружить. Во-вторых,
      у станций разные зоны досягаемости: важна обстановка у получателя, а отправитель её
      не слышит. Отсюда проблема скрытой станции (два отправителя не слышат друг друга и
      сталкиваются у получателя) и засвеченной станции (станция зря молчит). Поэтому в
      радио коллизий избегают (CSMA/CA), используют RTS/CTS, чтобы замолчали соседи
      получателя, и узнают о неудаче по отсутствию подтверждения.
    key_points:
      - во время передачи коллизию в радио не услышать
      - важна обстановка у получателя, а не у отправителя
      - скрытая и засвеченная станции
      - CSMA/CA, RTS/CTS и подтверждения
