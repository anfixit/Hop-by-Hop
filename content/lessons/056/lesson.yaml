id: 56
title: "NAT: зачем появился, NAT и NAPT"
status: published
summary: >
  Почему появился NAT: нехватка адресов IPv4 и частные адреса RFC 1918. Базовый NAT
  и NAPT, таблица трансляции и пересчёт контрольных сумм, что NAT ломает,
  провайдерский NAT и IPv6 без NAT. На практике - выход наружу без NAT и через
  masquerade, два компьютера с одного порта, таблица трансляции в conntrack и
  фильтр с состоянием. Безопасность: почему NAT не средство защиты.

quiz:
  - q: Главная причина, по которой появился NAT?
    options:
      - Защитить домашние сети от вирусов
      - Нехватка адресов IPv4 в интернете
      - Ускорить маршрутизацию в интернете
      - Шифровать трафик между сетями
    answer: 1
    explain: >
      Адресов IPv4 около 4,3 миллиарда, и их не хватило на все устройства. NAT
      позволяет целой сети с частными адресами выходить наружу через один или
      несколько публичных. Долгосрочное решение - IPv6.

  - q: Чем NAPT отличается от базового NAT?
    options:
      - NAPT работает только с адресами IPv6
      - NAPT меняет только адреса, без портов
      - NAPT меняет и адрес, и порт
      - NAPT нужен только для входящих соединений
    answer: 2
    explain: >
      Базовый NAT сопоставляет каждому узлу свой публичный адрес. NAPT меняет пару
      адрес и порт, и все узлы выходят через один публичный адрес, различаясь по
      портам. Так работает каждый домашний маршрутизатор.

  - q: Два компьютера за NAT подключились к одному серверу с одного и того же порта. Что сделал маршрутизатор в опыте?
    options:
      - Второму компьютеру назначил другой порт
      - Отказал второму компьютеру в соединении
      - Пропустил оба с одинаковым портом
      - Выдал второму отдельный публичный адрес
    answer: 0
    explain: >
      Порт 40000 уже был занят соединением a1 с тем же сервером, и ответы иначе
      было бы не различить. a1 сохранил порт 40000, a2 получил другой (в опыте
      13533).

  - q: Где в Linux хранится таблица трансляции NAT?
    options:
      - В основной таблице маршрутов main
      - В таблице соседей ip neigh
      - В файле /etc/nat.conf
      - В таблице соединений conntrack
    answer: 3
    explain: >
      Запись conntrack хранит исходный кортеж с частным адресом и портом и ответный
      с публичным. По ответному кортежу ядро узнаёт ответ и делает обратную замену.

  - q: Почему сервер в опыте не смог ответить клиенту с адресом 10.0.0.1 без NAT?
    options:
      - Порт 80 был закрыт на сервере
      - Сервер не знает маршрута к частной сети
      - Клиент не отправил SYN серверу
      - Частные адреса нельзя писать в заголовок
    answer: 1
    explain: >
      SYN дошёл (tcpdump на s его видел), но маршрута в 10.0.0.0/24 у сервера нет,
      как и у любого маршрутизатора в интернете: частные адреса там не
      маршрутизируются.

  - q: Почему NAT сам по себе не считается защитой?
    options:
      - Он работает только для пакетов UDP
      - Он заметно замедляет входящие пакеты
      - Он закрывает входящие лишь побочно
      - Он не умеет менять адреса отправителя
    answer: 2
    explain: >
      NAT не проверяет, разрешён ли пакет, он просто не знает, кому отдать
      входящий без записи. Проброс порта, UPnP и исходящие соединения вредоносных
      программ проходят без проверки. Защищает файервол с состоянием.

  - q: Какой диапазон адресов отведён для провайдерского NAT (CGNAT)?
    options:
      - 10.0.0.0/8
      - 192.168.0.0/16
      - 169.254.0.0/16
      - 100.64.0.0/10
    answer: 3
    explain: >
      RFC 6598 отвёл 100.64.0.0/10 для адресов абонентов за провайдерским NAT, чтобы
      они не пересекались с частными адресами домашних сетей. 169.254.0.0/16 -
      локальные адреса канала.

  - q: Что из этого действительно защищает сеть за домашним маршрутизатором?
    options:
      - Фильтр с состоянием для IPv4 и IPv6
      - Включённый UPnP для удобства
      - Частные адреса внутри сети
      - Смена публичного адреса провайдером
    answer: 0
    explain: >
      Защищает файервол с политикой "запрещено всё, что не разрешено" для новых
      входящих соединений, и для IPv4, и для IPv6. UPnP, наоборот, позволяет
      программам самим открывать порты снаружи.

open_questions:
  - q: Как работает NAPT? Опиши путь исходящего пакета и ответа.
    reference: >
      Внутренний узел с частным адресом отправляет пакет наружу. Маршрутизатор
      запоминает в таблице трансляции исходные адрес и порт, ставит вместо них свой
      публичный адрес и порт (сохраняя порт, если он свободен, или выбирая другой)
      и пересчитывает контрольные суммы IP и TCP или UDP. Ответ приходит на
      публичный адрес и этот порт; по таблице маршрутизатор находит запись,
      возвращает частный адрес и порт и отправляет пакет внутрь. В Linux таблица
      трансляции - записи conntrack.
    key_points:
      - замена адреса и порта, таблица трансляции
      - пересчёт контрольных сумм
      - обратная замена для ответа
      - conntrack в Linux

  - q: Какие проблемы создаёт NAT?
    reference: >
      Нет сквозной связности: снаружи нельзя подключиться к устройству за NAT без
      проброса порта или обходных приёмов. NAT хранит состояние: его сбой обрывает
      все соединения. Он нарушает независимость уровней и не пропускает протоколы,
      которых не понимает. Протоколы с адресами внутри данных (FTP, SIP) ломаются
      без помощников ALG. Портов на публичный адрес конечное число. У провайдеров
      часто второй уровень NAT (CGNAT). В IPv6 NAT обычно не используют.
    key_points:
      - нет сквозной связности
      - состояние и обрыв соединений
      - протоколы с адресами в данных
      - ограничение портов, CGNAT

  - q: Почему NAT - не средство защиты и что защищает на самом деле?
    reference: >
      Входящие соединения закрыты лишь потому, что для них нет записи в таблице, -
      это побочный эффект, а не политика. Проброс порта, UPnP, DNAT открывают путь
      внутрь без фильтрации; исходящие соединения вредоносных программ проходят;
      сокрытие адресов мало что скрывает; в IPv6 NAT обычно нет. Защищают файервол с
      состоянием и политикой запрета новых входящих для IPv4 и IPv6, отключённый
      UPnP, контроль пробросов портов и защищённые сами по себе устройства.
    key_points:
      - закрытость входящих - побочный эффект
      - пробросы, UPnP, исходящие соединения
      - IPv6 обычно без NAT
      - файервол с состоянием, UPnP выключен
