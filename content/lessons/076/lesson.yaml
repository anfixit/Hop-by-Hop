id: 76
title: "HTTP/2 и HTTP/3"
status: published
summary: >
  Почему HTTP/1.1 стал узким местом и как его ограничения сняли HTTP/2 (двоичные
  кадры, потоки в одном соединении, сжатие заголовков HPACK, согласование через
  ALPN) и HTTP/3 поверх QUIC (независимые потоки, встроенный TLS 1.3, быстрое
  установление и миграция соединения, QPACK, Alt-Svc). На практике - сервер
  nghttpd в пространстве имён, ALPN в openssl s_client, кадры и потоки в nghttp,
  три файла в одном соединении и экономия HPACK в h2load.

quiz:
  - q: Что такое блокировка очереди в HTTP/1.1?
    options:
      - Сервер отклоняет запросы сверх лимита
      - Медленный ответ задерживает все следующие
      - Браузер ждёт закрытия старого соединения
      - Заголовки не помещаются в один пакет
    answer: 1
    explain: >
      По одному соединению ответы идут строго в порядке запросов, поэтому браузеры
      открывали по шесть соединений к сайту.

  - q: Как HTTP/2 передаёт несколько запросов одновременно?
    options:
      - Открывает отдельное TCP-соединение на каждый
      - Отправляет все запросы по UDP параллельно
      - Объединяет запросы в один большой текстовый запрос
      - Перемежает кадры потоков в одном соединении
    answer: 3
    explain: >
      Каждый запрос - поток со своим номером. В опыте три файла ушли потоками 1, 3
      и 5 в одном соединении.

  - q: Как клиент и сервер договариваются использовать HTTP/2 поверх TLS?
    options:
      - По заголовку Server в первом ответе
      - Отдельным DNS-запросом к серверу
      - Расширением TLS ALPN в рукопожатии
      - По номеру порта 8443 у сервера
    answer: 2
    explain: >
      Клиент перечисляет протоколы, сервер выбирает один. В опыте на предложение
      h2,http/1.1 сервер ответил ALPN protocol h2.

  - q: Чем HPACK уменьшает объём заголовков?
    options:
      - Повторы шлёт ссылками на общую таблицу
      - Сжимает тело ответа вместе с ними
      - Переносит заголовки в конец тела ответа
      - Удаляет все необязательные заголовки
    answer: 0
    explain: >
      Обе стороны помнят переданные заголовки и ссылаются на них. В опыте 100
      ответов дали экономию 93% на заголовках ответов.

  - q: Какая проблема осталась в HTTP/2?
    options:
      - Потеря сегмента TCP тормозит все потоки
      - Ответы идут строго в порядке запросов
      - На каждый файл нужно своё соединение
      - Заголовки повторяются целиком в каждом запросе
    answer: 0
    explain: >
      TCP доставляет байты по порядку, поэтому ожидание одного потерянного
      сегмента тормозит и потоки, чьи данные уже пришли. HTTP/3 решает это в QUIC.

  - q: Поверх чего работает HTTP/3?
    options:
      - Поверх TCP с TLS 1.2
      - Поверх SCTP с шифрованием
      - Поверх QUIC на основе UDP
      - Поверх голого IP без транспорта
    answer: 2
    explain: >
      QUIC даёт независимые потоки, встроенный TLS 1.3 и миграцию соединения по
      идентификатору.

  - q: Как браузер узнаёт, что сайт поддерживает HTTP/3?
    options:
      - Пробует QUIC на все порты сайта
      - Спрашивает об этом корневой DNS-сервер
      - По версии в сертификате сервера
      - Из Alt-Svc или записи HTTPS в DNS
    answer: 3
    explain: >
      Сервер объявляет h3 заголовком Alt-Svc в ответе по HTTP/1.1 или HTTP/2 или записью HTTPS;
      если UDP заблокирован, браузер остаётся на TCP.

  - q: Что даёт миграция соединения в QUIC?
    options:
      - Перенос сайта на другой сервер
      - Соединение живёт при смене сети
      - Перенос соединения с UDP на TCP
      - Смену версии HTTP без разрыва связи
    answer: 1
    explain: >
      Соединение опознаётся по идентификатору, а не по адресу и порту, поэтому
      переход телефона с Wi-Fi на мобильную сеть его не обрывает.

open_questions:
  - q: Чем HTTP/2 отличается от HTTP/1.1 и что в нём осталось нерешённым?
    reference: >
      HTTP/2 передаёт те же запросы и ответы двоичными кадрами; каждый запрос -
      поток, кадры потоков перемежаются в одном TCP-соединении, поэтому нет
      блокировки очереди на уровне HTTP и не нужно много соединений. Заголовки
      сжимаются HPACK, версия согласуется ALPN. Но TCP доставляет байты по
      порядку, и потеря одного сегмента задерживает все потоки.
    key_points:
      - кадры и потоки
      - одно соединение
      - HPACK и ALPN
      - блокировка в TCP

  - q: Что даёт HTTP/3 и как он связан с QUIC?
    reference: >
      HTTP/3 работает поверх QUIC на UDP. Потоки независимы на уровне транспорта,
      потеря задерживает только свой поток. TLS 1.3 встроен в QUIC: новое
      соединение за один круг передачи, повторное - за ноль. Соединение
      переживает смену сети благодаря идентификатору соединения. Заголовки сжимает
      QPACK. О поддержке сообщают Alt-Svc или записи HTTPS, при блокировке UDP
      браузер остаётся на TCP.
    key_points:
      - QUIC на UDP
      - независимые потоки
      - встроенный TLS 1.3
      - миграция и Alt-Svc

  - q: Что видно в опыте с nghttp об устройстве соединения HTTP/2?
    reference: >
      Соединение начинается с кадров SETTINGS в потоке 0, каждая сторона
      подтверждает чужие; клиент может не ждать этого: запрос идёт кадром HEADERS в нечётном потоке, ответ - HEADERS и DATA в
      том же потоке, флаг конца потока завершает его, соединение закрывается
      кадром GOAWAY. Несколько файлов идут потоками 1, 3, 5 в одном соединении, а
      повторяющиеся заголовки почти не занимают места благодаря HPACK.
    key_points:
      - SETTINGS в потоке 0
      - HEADERS и DATA в потоке
      - нечётные номера
      - GOAWAY
