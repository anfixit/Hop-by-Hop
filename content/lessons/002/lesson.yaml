id: 2
title: Биты, байты и шестнадцатеричная запись
status: published
summary: >
  Учимся читать то, из чего состоят все данные в сети: биты, байты, двоичную
  и шестнадцатеричную запись. Разбираем, почему адреса выглядят именно так,
  чем бит в секунду отличается от байта, как текст превращается в байты и почему
  hex и base64 - это не шифрование.

quiz:
  - q: Сколько разных значений может хранить один байт?
    options:
      - 8
      - 128
      - 256
      - 1024
    answer: 2
    explain: >
      Байт - это 8 бит, каждый 0 или 1, всего 2 в степени 8 = 256 комбинаций.
      Поэтому в байт помещаются числа от 0 до 255. Число 8 - это количество бит,
      128 - вес старшего бита, 1024 - 2 в степени 10.

  - q: Чему равно двоичное число 11000000 в десятичной записи?
    options:
      - 96
      - 192
      - 200
      - 224
    answer: 1
    explain: >
      Единицы стоят в позициях с весами 128 и 64: 128 + 64 = 192. Число 224 было бы
      11100000, а 96 - это 01100000.

  - q: Почему одному байту соответствуют ровно две шестнадцатеричные цифры?
    options:
      - Одна hex-цифра кодирует ровно 4 бита, а в байте 8 бит
      - Так договорились создатели Unix
      - Одна hex-цифра кодирует ровно 2 бита, а в байте 4 пары
      - Так удобнее печатать MAC-адреса
    answer: 0
    explain: >
      В hex 16 цифр, а 4 бита дают как раз 16 комбинаций. Значит, каждая hex-цифра -
      это ровно четыре бита, и байт из восьми бит записывается двумя цифрами.
      Это математическое свойство, а не договорённость.

  - q: Какое десятичное значение у байта 0xff?
    options:
      - 15
      - 16
      - 255
      - 256
    answer: 2
    explain: >
      0xff - это 1111 1111, все восемь бит единицы: 128+64+32+16+8+4+2+1 = 255.
      Значения 256 в байте не бывает, а 15 - это 0x0f.

  - q: IPv4-адрес 192.168.1.300 - корректный?
    options:
      - Да, если это адрес в локальной сети
      - Да, последнее число может быть любым, это номер компьютера
      - Нет, потому что в IPv4-адресе может быть только три числа
      - Нет, потому что каждое число в IPv4-адресе - один байт
    answer: 3
    explain: >
      IPv4-адрес - это 4 байта, и каждое из четырёх чисел через точку - значение одного
      байта от 0 до 255. Число 300 в байт не помещается, поэтому такого адреса нет
      ни в локальной сети, ни в интернете.

  - q: Сколько байтов в MAC-адресе, например 52:54:00:12:34:56?
    options:
      - 4
      - 6
      - 12
      - 16
    answer: 1
    explain: >
      Шесть групп по две hex-цифры, а две hex-цифры - это один байт. Всего 6 байтов.
      12 - это количество hex-цифр, 4 байта у IPv4-адреса, 16 - у IPv6.

  - q: У тебя тариф 100 Мбит/с. С какой скоростью в лучшем случае скачается файл?
    options:
      - Около 12,5 мегабайта в секунду
      - Около 100 мегабайт в секунду
      - Около 800 мегабайт в секунду
      - Около 1 мегабайта в секунду
    answer: 0
    explain: >
      Скорость связи меряют в битах, а файлы - в байтах. В байте 8 бит, поэтому
      100 Мбит/с - это примерно 100 / 8 = 12,5 МБ/с, а на практике чуть меньше
      из-за служебных заголовков пакетов.

  - q: Сколько байтов займёт слово "Привет" в кодировке UTF-8?
    options:
      - 6
      - 12
      - 18
      - 24
    answer: 1
    explain: >
      В UTF-8 каждая кириллическая буква занимает 2 байта: 6 букв дают 12 байтов.
      6 байтов было бы у латинского слова той же длины.

  - q: В конфиге приложения пароль записан как cGFzc3dvcmQ= (base64). Насколько он защищён?
    options:
      - "Хорошо защищён: без ключа base64 не расшифровать"
      - "Защищён частично: base64 взламывается перебором за несколько часов"
      - "Не защищён: base64 - это запись байтов, её обращает одна команда"
      - Защищён, если конфиг лежит на сервере с паролем
    answer: 2
    explain: >
      Base64, как и hex, только меняет запись байтов и обратим без всякого ключа:
      echo cGFzc3dvcmQ= | base64 -d сразу покажет исходный пароль. Это кодирование,
      а не шифрование, и никакого перебора здесь не нужно.

open_questions:
  - q: Объясни своими словами, почему инженеры записывают байты в шестнадцатеричном виде, а не в двоичном или десятичном. Покажи на примере байта 192.
    reference: >
      Двоичная запись точно показывает биты, но она длинная: байт - восемь цифр.
      Десятичная короткая, но по ней не видно отдельных битов. Hex совмещает плюсы:
      одна hex-цифра - ровно 4 бита, поэтому байт - ровно две цифры, и перевод
      между hex и двоичной записью делается по четвёркам бит без арифметики.
      192 = 1100 0000: старшая четвёрка 1100 = c, младшая 0000 = 0, итого 0xc0.
    key_points:
      - двоичная запись длинная, десятичная не показывает биты
      - одна hex-цифра - ровно 4 бита, байт - две hex-цифры
      - перевод hex и двоичной записи по четвёркам бит
      - правильный пример - 192 = 11000000 = 0xc0

  - q: Коллега говорит - пароль к базе закодирован в base64, значит, в репозитории его хранить можно. Что ты ему ответишь и почему?
    reference: >
      Хранить нельзя: base64 - это не шифрование, а способ записать байты печатными
      символами. Он обращается одной командой без всякого ключа, например
      base64 -d, и любой, кто видит репозиторий, получит пароль. Кодирование меняет
      только форму записи, шифрование требует ключа для обратного преобразования.
      Секреты нужно хранить вне репозитория, например в переменных окружения или
      хранилище секретов.
    key_points:
      - base64 - кодирование, а не шифрование
      - обращается без ключа одной командой
      - кодирование меняет запись, шифрование требует ключа
      - секреты хранить вне репозитория

  - q: Почему ссылка, которая выглядит как адрес знакомого сайта, может вести на чужой сайт, даже если в ней "те же" буквы? Объясни через байты.
    reference: >
      Некоторые буквы разных алфавитов выглядят одинаково, но кодируются разными
      байтами: латинская a - это 0x61, а кириллическая а - d0 b0 в UTF-8. Для
      компьютера и для DNS домен с подменённой буквой - другое имя, которое может
      зарегистрировать злоумышленник; в реальных атаках чаще подбирают имя целиком
      из похожих букв чужого алфавита. Человек видит знакомое слово, а браузер
      идёт по другому адресу. Такие имена в DNS записываются в форме,
      начинающейся с xn--, и браузеры в подозрительных случаях показывают её.
    key_points:
      - похожие буквы разных алфавитов - разные байты
      - домен с подменённой буквой - другое имя для компьютера и DNS
      - такой домен может зарегистрировать злоумышленник, на этом построен фишинг
