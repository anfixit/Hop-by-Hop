id: 20
title: "Безопасность Wi-Fi: WEP, WPA2, WPA3 и 802.1X"
status: published
summary: >
  Как защищают Wi-Fi: почему WEP сломан и не годится, как WPA2 (802.11i) шифрует
  кадры протоколом CCMP и вырабатывает ключи четырёхэтапным рукопожатием, чем
  опасен общий пароль, что изменил WPA3 с протоколом SAE и как устроен корпоративный
  режим с 802.1X и EAP. На практике - рукопожатия WPA2 и WPA3, неверный пароль и
  защищённые кадры отключения в эфире виртуальных радио. В конце - список настроек
  для своей сети.

quiz:
  - q: Почему WEP нельзя использовать?
    options:
      - Он слишком медленный для современных сетей Wi-Fi
      - По его трафику можно восстановить ключ
      - Он не поддерживается ни одной современной ОС
      - Он работает только в диапазоне 5 ГГц
    answer: 1
    explain: >
      У WEP один общий ключ без управления ключами, повторяющийся ключевой поток,
      линейный CRC вместо криптографической проверки и слабость в использовании RC4,
      позволившая восстанавливать ключ по перехваченному трафику. Он даёт только
      видимость защиты.

  - q: Что даёт протокол CCMP в WPA2?
    options:
      - Выбор канала с наименьшим числом помех
      - Проверку пароля на сервере RADIUS
      - Шифрование и проверку целостности
      - Сжатие кадров перед отправкой в эфир
    answer: 2
    explain: >
      CCMP шифрует данные AES в режиме счётчика и считает код целостности (MIC), так что
      без ключа кадр нельзя ни прочитать, ни подделать.

  - q: Передаётся ли пароль Wi-Fi по эфиру в четырёхэтапном рукопожатии?
    options:
      - Да, но в зашифрованном виде в третьем сообщении
      - Да, в открытом виде в первом сообщении
      - Нет, стороны доказывают знание ключа кодом MIC
      - Нет, пароль передаётся заранее по кабелю
    answer: 2
    explain: >
      Из пароля и имени сети обе стороны сами вычисляют PMK, из него с помощью случайных
      чисел ANonce и SNonce - ключи сеанса. По эфиру идут только эти числа, коды MIC,
      которыми стороны доказывают, что получили одинаковые ключи, и (в третьем
      сообщении) зашифрованный групповой ключ.

  - q: Почему для WPA2-Personal так важен длинный случайный пароль?
    options:
      - Чтобы точка доступа работала на более высокой скорости
      - Записав рукопожатие, пароль можно подбирать у себя
      - Длинный пароль нужен для работы на канале 5 ГГц
      - Короткий пароль отключает шифрование данных CCMP
    answer: 1
    explain: >
      Сообщения рукопожатия не зашифрованы. Записав первые два, можно проверять
      догадки о пароле на своём компьютере, и точка доступа об этом не узнает. Короткий
      или словарный пароль такой перебор не выдержит.

  - q: Что главное изменил WPA3-Personal по сравнению с WPA2?
    options:
      - Заменил шифрование AES на более быстрый шифр RC4
      - Отказался от паролей в пользу сертификатов
      - Отменил четырёхэтапное рукопожатие насовсем
      - Ввёл проверку пароля SAE без подбора по записи
    answer: 3
    explain: >
      SAE вплетает пароль в обмен ключами Диффи-Хеллмана: по подслушанному обмену
      догадки не проверить, каждая попытка требует живого обмена с точкой, а каждый
      сеанс получает новый ключ (прямая секретность). Рукопожатие после SAE осталось.

  - q: В опыте клиент ввёл неверный пароль WPA2. На каком шаге всё остановилось?
    options:
      - Точка не ответила на запрос ассоциации
      - Точка не прислала третье сообщение
      - Клиент не смог найти сеть при поиске
      - Точка не выдала клиенту IP-адрес
    answer: 1
    explain: >
      Ассоциация прошла, но MIC во втором сообщении не сошёлся с ключами точки. Поэтому
      в эфире были только сообщения 1 и 2, четыре попытки подряд, а точка записала в
      журнал, что пароль, похоже, не совпадает.

  - q: Что в корпоративном режиме (802.1X) важнее всего настроить на клиенте?
    options:
      - Проверку сертификата сервера RADIUS
      - Одинаковый пароль для всех сотрудников
      - Отключение шифрования для ускорения работы
      - Скрытие имени сети в кадрах-маяках
    answer: 0
    explain: >
      Если клиент не проверяет сертификат сервера, двойник подставит свой сервер и
      получит данные для входа. Правильно настроенный клиент доверяет только своему
      удостоверяющему центру и знает имя своего сервера.

  - q: Что показал опыт с кадром отключения в WPA2 и WPA3?
    options:
      - В обоих режимах кадр отключения был зашифрован
      - В обоих режимах кадр был открыт и читаем
      - В WPA2 кадр шёл открыто, в WPA3 был защищён
      - В WPA3 кадр отключения вообще не отправлялся
    answer: 2
    explain: >
      В сети WPA2 без защиты служебных кадров причина отключения была видна, и такой кадр
      можно подделать. В WPA3 защита служебных кадров обязательна, и кадр ушёл
      зашифрованным и защищённым кодом целостности.

open_questions:
  - q: Опиши четырёхэтапное рукопожатие WPA2 и объясни, что в нём защищает пароль.
    reference: >
      Из пароля и имени сети обе стороны заранее вычисляют главный ключ PMK (медленной
      функцией PBKDF2). Точка доступа присылает случайное число ANonce. Клиент выбирает
      SNonce, вычисляет из PMK, обоих чисел и MAC-адресов ключи сеанса PTK и отправляет
      SNonce с кодом MIC. Точка вычисляет те же ключи и проверяет MIC, затем присылает
      групповой ключ GTK, зашифрованный ключом из PTK; клиент подтверждает. Пароль по
      эфиру не идёт: стороны лишь доказывают, что получили одинаковые ключи. Но
      сообщения рукопожатия не зашифрованы, и по ним можно проверять догадки о пароле без точки
      доступа, поэтому пароль должен быть длинным и случайным.
    key_points:
      - PMK из пароля и SSID, медленная функция
      - ANonce, SNonce, MAC-адреса дают PTK
      - MIC доказывает знание ключа, GTK в третьем сообщении
      - пароль не передаётся, но по записи сообщений 1-2 его можно подбирать

  - q: Сравни WPA2-Personal, WPA3-Personal и Enterprise с точки зрения безопасности.
    reference: >
      WPA2-Personal шифрует надёжно (CCMP на AES), но пароль общий для всех: его можно
      подбирать по записанному рукопожатию, знающий пароль может вычислить ключи соседа,
      прямой секретности нет. WPA3-Personal проверяет пароль по SAE: подбор по записи
      невозможен, каждый сеанс получает новый ключ, защита служебных кадров обязательна;
      но общеизвестный пароль не защищает от двойника. Enterprise использует 802.1X,
      EAP и сервер RADIUS: у каждого пользователя свои учётные данные (их
      можно отозвать по отдельности), а у каждого подключения свой PMK; безопасность зависит от проверки сертификата
      сервера на клиенте.
    key_points:
      - WPA2-Personal - общий пароль, подбор по записи, нет прямой секретности
      - WPA3 - SAE, прямая секретность, обязательная защита служебных кадров
      - Enterprise - свои учётные данные и PMK у каждого
      - в Enterprise обязательна проверка сертификата сервера

  - q: Какие настройки стоит выбрать для домашней сети Wi-Fi и почему?
    reference: >
      WPA3-Personal, а при старых устройствах смешанный режим WPA2/WPA3; в WPA2 только
      AES (CCMP), без WEP и TKIP, потому что они сломаны. Длинный случайный пароль,
      потому что WPA2 допускает подбор по записанному рукопожатию. Выключенный WPS,
      потому что PIN-код подбирается. Включённая защита служебных кадров. Отдельная
      гостевая сеть, лучше в своей VLAN, чтобы гости и умные устройства не видели
      основные компьютеры. Обновлённая прошивка точки доступа и устройств. И понимание,
      что Wi-Fi защищает только участок до точки доступа, поэтому HTTPS и VPN остаются
      нужны.
    key_points:
      - WPA3 или WPA2 с AES, без WEP и TKIP
      - длинный случайный пароль, WPS выключен
      - защита служебных кадров, гостевая сеть отдельно
      - обновления; Wi-Fi защищает только участок до точки доступа
