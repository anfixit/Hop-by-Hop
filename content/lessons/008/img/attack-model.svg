<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Что может нарушитель, зависит от того, где он</text>

  <!-- путь -->
  <line x1="170" y1="200" x2="1030" y2="200" stroke="#94A3B8" stroke-width="6"/>
  <rect x="40" y="160" width="130" height="80" rx="12" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
  <text x="105" y="207" text-anchor="middle" font-size="22" fill="#0E1830">Ты</text>
  <rect x="270" y="165" width="130" height="70" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="335" y="207" text-anchor="middle" font-size="20" fill="#0E1830">Роутер</text>
  <rect x="520" y="165" width="160" height="70" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="600" y="198" text-anchor="middle" font-size="19" fill="#0E1830">Провайдер,</text>
  <text x="600" y="221" text-anchor="middle" font-size="19" fill="#0E1830">транзит</text>
  <rect x="1030" y="160" width="130" height="80" rx="12" fill="#0E1830"/>
  <text x="1095" y="207" text-anchor="middle" font-size="22" fill="#FFFFFF">Сервер</text>

  <!-- зона локальной сети -->
  <rect x="25" y="120" width="400" height="140" rx="16" fill="none" stroke="#0F766E" stroke-width="2"/>
  <text x="225" y="112" text-anchor="middle" font-size="18" fill="#0F766E">локальная сеть</text>

  <!-- нарушители -->
  <g>
    <circle cx="225" cy="330" r="34" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
    <text x="225" y="338" text-anchor="middle" font-size="24" font-weight="bold" fill="#991B1B">1</text>
    <line x1="225" y1="296" x2="225" y2="262" stroke="#DC2626" stroke-width="3"/>

    <circle cx="600" cy="330" r="34" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
    <text x="600" y="338" text-anchor="middle" font-size="24" font-weight="bold" fill="#991B1B">2</text>
    <line x1="600" y1="296" x2="600" y2="237" stroke="#DC2626" stroke-width="3"/>

    <circle cx="880" cy="330" r="34" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
    <text x="880" y="338" text-anchor="middle" font-size="24" font-weight="bold" fill="#991B1B">3</text>
    <line x1="905" y1="306" x2="1040" y2="240" stroke="#DC2626" stroke-width="3"/>
  </g>

  <!-- подписи -->
  <g font-size="19">
    <rect x="40" y="395" width="360" height="200" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="60" y="428" font-weight="bold" fill="#0E1830">1. В твоей локальной сети</text>
    <text x="60" y="460" fill="#475569">может обмануть протоколы,</text>
    <text x="60" y="486" fill="#475569">рассчитанные на доверие</text>
    <text x="60" y="512" fill="#475569">между соседями (ARP),</text>
    <text x="60" y="538" fill="#475569">и встать посередине</text>

    <rect x="420" y="395" width="360" height="200" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="440" y="428" font-weight="bold" fill="#0E1830">2. На пути трафика</text>
    <text x="440" y="460" fill="#475569">видит все твои пакеты:</text>
    <text x="440" y="486" fill="#475569">адреса, порты, объём, время,</text>
    <text x="440" y="512" fill="#475569">открытое содержимое;</text>
    <text x="440" y="538" fill="#475569">может менять и выбрасывать</text>

    <rect x="800" y="395" width="360" height="200" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="820" y="428" font-weight="bold" fill="#0E1830">3. Где-то в интернете</text>
    <text x="820" y="460" fill="#475569">видит только то, что сервер</text>
    <text x="820" y="486" fill="#475569">выставил наружу: сканирует,</text>
    <text x="820" y="512" fill="#475569">подбирает пароли, ищет</text>
    <text x="820" y="538" fill="#475569">уязвимые службы, DoS</text>
  </g>
  <text x="600" y="625" text-anchor="middle" font-size="19" fill="#475569">Модель нарушителя: кто он, зачем, где находится и какие у него ресурсы</text>
</svg>
