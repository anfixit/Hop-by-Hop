id: 8
title: Основы информационной безопасности
status: published
summary: >
  Словарь и способ мышления для всех разделов "Атаки и защита": идентификация,
  аутентификация и авторизация, уязвимость, угроза, атака и риск, модель нарушителя,
  компоненты атак, уровни и принципы защиты. На практике - настоящие атаки на
  учебный сервер этого курса в первые часы его жизни, журнал, который считает не всё,
  и правдоподобная гипотеза, которую опровергла проверка.

quiz:
  - q: Пользователь ввёл логин, затем пароль, после чего система разрешила ему читать, но не удалять файлы. Какой шаг соответствует вводу пароля?
    options:
      - Идентификация
      - Аутентификация
      - Авторизация
      - Аудит
    answer: 1
    explain: >
      Ввод логина - идентификация (назвать себя), ввод пароля - аутентификация (доказать),
      а решение "читать можно, удалять нельзя" - авторизация. Аудит - запись событий.

  - q: Клиент банка отправил распоряжение, а потом заявил, что не отправлял его. Какое свойство безопасности здесь нужно?
    options:
      - Доступность
      - Конфиденциальность
      - Неотказуемость
      - Владение
    answer: 2
    explain: >
      Неотказуемость - невозможность отрицать, что ты отправил или получил сообщение. Её
      обеспечивает электронная подпись. Конфиденциальность, целостность и доступность здесь
      не нарушены - поэтому триаду КЦД и расширяют.

  - q: Когда возможна атака?
    options:
      - Когда одновременно есть уязвимость и направленная на неё угроза
      - Когда в системе есть уязвимость, даже если о ней никто не знает
      - Когда у злоумышленника есть достаточно мощный компьютер
      - Когда система подключена к интернету хотя бы одним портом
    answer: 0
    explain: >
      Атака - реализованная угроза, и она возможна только при одновременном наличии
      уязвимости и угрозы, направленной на неё. Неизвестная никому уязвимость пока не
      опасна, а угроза против уязвимости, которой у тебя нет, тоже.

  - q: Компания не может полностью исключить подбор паролей, поэтому ввела длинные пароли и ограничение числа попыток. Как называется такое действие с риском?
    options:
      - Принятие риска
      - Устранение риска
      - Передача риска
      - Снижение риска
    answer: 3
    explain: >
      Риск не исчез, но стал значительно меньше - это снижение. Устранение убрало бы саму
      уязвимость или угрозу, передача - это страховка, принятие - согласие жить с риском
      как есть.

  - q: Какая атака обычно не оставляет следов и поэтому труднее всего обнаруживается?
    options:
      - DoS-атака
      - Прослушивание трафика
      - Подмена страниц сайта
      - Заражение вирусом
    answer: 1
    explain: >
      Прослушивание - пассивная атака: система работает как обычно, следов почти нет.
      DoS, подмена страниц и вирусы - активные атаки, они меняют состояние системы и
      обычно оставляют следы.

  - q: Злоумышленник сидит на узле провайдера на пути твоего трафика. Что из этого он может, а нарушитель где-то в интернете - нет?
    options:
      - Сканировать открытые порты твоего сервера
      - Подбирать пароль к SSH на твоём сервере
      - Устраивать DoS-атаку на твой сервер
      - Видеть и менять все твои пакеты
    answer: 3
    explain: >
      Нарушитель на пути видит все пакеты, которые через него идут, и может их менять
      и выбрасывать. Сканировать порты, подбирать пароли и устраивать DoS может и тот,
      кто находится где угодно в интернете.

  - q: Зачем нужна эшелонированная защита, если каждый рубеж можно преодолеть?
    options:
      - Чтобы атакующий потратил больше времени и его успели заметить
      - Чтобы каждый рубеж по очереди проверял настройки остальных
      - Чтобы защита стоила дороже и выглядела солиднее для проверяющих
      - Чтобы можно было не ставить обновления на отдельные компьютеры
    answer: 0
    explain: >
      Несколько рубежей подряд не только страхуют друг друга, но и замедляют атаку, а
      чем дольше атакующий возится, тем выше шанс его обнаружить и принять меры.

  - q: В сети все сообщения зашифрованы, но ключи лежат на общем сетевом диске. Какой принцип нарушен?
    options:
      - Простота механизма
      - Открытая архитектура
      - Слабое звено
      - Психологическая приемлемость
    answer: 2
    explain: >
      Защищённость системы равна защищённости её самого слабого места. Мощное шифрование
      бесполезно, если ключ может взять любой.

  - q: Бот в контейнере работает не от root, с файловой системой только для чтения и без особых прав ядра. Какой принцип это реализует?
    options:
      - Открытая архитектура
      - Полная проверка
      - Передача риска
      - Минимальные привилегии
    answer: 3
    explain: >
      Каждый компонент получает только те права, которые ему нужны. Если бот взломают,
      злоумышленник получит минимум возможностей.

open_questions:
  - q: Объясни на своём примере разницу между уязвимостью, угрозой, атакой и риском.
    reference: >
      Уязвимость - слабое место системы, например простой пароль у администратора.
      Угроза - возможность, что кто-то этим воспользуется, например боты, которые
      постоянно перебирают пароли на серверах в интернете. Атака - реализованная угроза:
      бот действительно подобрал пароль и вошёл. Атака возможна только при одновременном
      наличии уязвимости и угрозы. Риск - оценка возможного ущерба с учётом вероятности
      атаки: насколько вероятен подбор и сколько мы потеряем, если он случится. С риском
      можно поступить по-разному: принять, устранить (например, запретить вход по паролю),
      снизить или передать.
    key_points:
      - уязвимость - слабое место системы
      - угроза - возможность нарушения безопасности
      - атака - реализованная угроза, нужна и уязвимость, и угроза
      - риск - ущерб с учётом вероятности; его можно принять, устранить, снизить, передать

  - q: Составь модель нарушителя для небольшого сервера в интернете, на котором работает Telegram-бот. Кто может атаковать, зачем, откуда и с какими ресурсами?
    reference: >
      Самый вероятный нарушитель - автоматические программы и ботнеты, которые сканируют
      весь интернет в поисках открытых служб и слабых паролей: им нужны ресурсы сервера
      (для рассылок, майнинга, атак на других) или данные. Они находятся в интернете и
      видят только то, что сервер выставил наружу, но их много и они работают постоянно.
      Возможен и целенаправленный атакующий, которому интересен именно этот бот или его
      пользователи, а также нарушитель на пути трафика (например, у провайдера), который
      видит пакеты сервера. Отдельно стоит учитывать ошибки своих же администраторов.
      Отсюда меры: минимум открытых портов, вход только по ключам, обновления, изоляция
      бота, шифрование на концах.
    key_points:
      - кто - в первую очередь автоматические сканеры и ботнеты, возможен целенаправленный атакующий
      - зачем - ресурсы сервера, данные, пользователи бота
      - откуда - из интернета видно только выставленное наружу; возможен нарушитель на пути
      - меры исходя из модели - мало открытых портов, ключи, обновления, изоляция

  - q: Почему защиту нужно не только включить, но и проверить, и почему проверять нужно ещё и собственные выводы? Приведи примеры из урока.
    reference: >
      Непроверенная защита опасна тем, что на неё рассчитывают, а она может молча не
      работать. Поэтому после настройки её проверяют на практике: в уроке fail2ban
      проверили пробной неудачной попыткой входа и увидели, что счётчик вырос. Но
      проверять нужно и выводы. Сначала показалось, что fail2ban видит не все попытки
      из-за другого имени службы SSH в Ubuntu 24.04. Проверка показала, что фильтр
      ловит записи и по имени процесса sshd, а разница в счётчиках объясняется тем, что
      первые попытки случились до запуска fail2ban. Ещё пример: журнал ufw записывает
      не больше 3 блокировок в минуту, поэтому по числу записей нельзя судить о числе
      атак - настоящее число отброшенных пакетов в разы больше.
    key_points:
      - непроверенная защита может молча не работать, а на неё рассчитывают
      - проверка на практике - пробная неудачная попытка, счётчик fail2ban вырос
      - гипотеза про имя службы оказалась неверной - выводы тоже сверяют с данными
      - нужно знать, как инструмент собирает данные (лимит записей в журнале ufw)
