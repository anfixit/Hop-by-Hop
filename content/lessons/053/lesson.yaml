id: 53
title: "iptables: таблицы, цепочки, правила"
status: published
summary: >
  Устройство iptables: таблицы filter, nat, mangle, raw, security и их цепочки на
  хуках netfilter, политики, свои цепочки, условия и действия правил, команды,
  сохранение правил, ip6tables, iptables-nft и iptables-legacy. На практике -
  правила на маршрутизаторе для IPv4 и IPv6, порядок правил, счётчики,
  iptables-save и те же правила в nftables. Безопасность: типичные дыры в
  правилах и защита от них.

quiz:
  - q: В какую таблицу попадает правило, если ключ -t не указан?
    options:
      - nat
      - filter
      - mangle
      - raw
    answer: 1
    explain: >
      filter - таблица по умолчанию. В ней цепочки INPUT, FORWARD и OUTPUT, и
      именно туда пишутся обычные правила фильтрации.

  - q: На маршрутизаторе настроены правила iptables с политикой DROP. Что с IPv6?
    options:
      - Тоже закрыт, правила общие
      - Закрыт, если правила сохранены
      - Не затронут, нужен ip6tables
      - Закрыт для TCP, открыт для UDP
    answer: 2
    explain: >
      iptables управляет только IPv4. Для IPv6 есть отдельная программа ip6tables
      со своим набором правил. В опыте после правил iptables службы a оставались
      открыты по IPv6.

  - q: В конце цепочки стоит правило -j DROP. Что будет с правилом, добавленным после него через -A?
    options:
      - Оно не сработает, пакет до него не дойдёт
      - Оно сработает раньше правила DROP
      - Оно заменит собой правило DROP
      - Оно сработает только для IPv6-трафика
    answer: 0
    explain: >
      -A добавляет в конец, а правила проверяются сверху вниз. В опыте разрешение
      для 8080 после DROP не работало, а вставленное через -I FORWARD 2 - заработало.

  - q: Какая команда покажет правила цепочки с номерами и счётчиками пакетов?
    options:
      - iptables -L FORWARD -n
      - iptables -L FORWARD --line-numbers
      - iptables -S FORWARD
      - iptables -L FORWARD -n -v --line-numbers
    answer: 3
    explain: >
      -L показывает правила, -n отключает имена, -v добавляет счётчики, а
      --line-numbers - номера, по которым удобно удалять и вставлять правила. Без -v
      счётчиков нет, без --line-numbers нет номеров; -S показывает правила в виде
      команд, без номеров.

  - q: Как сохранить правила iptables, чтобы восстановить их после перезагрузки?
    options:
      - iptables -P INPUT SAVE
      - iptables-save в файл и iptables-restore
      - Они сохраняются сами при выключении машины
      - iptables -Z перед перезагрузкой
    answer: 1
    explain: >
      Правила из команд живут до перезагрузки. iptables-save выводит набор в
      текстовом виде, iptables-restore загружает его целиком. В Debian и Ubuntu
      это автоматизирует iptables-persistent.

  - q: Что показывает "(nf_tables)" в выводе iptables -V?
    options:
      - Что правила хранятся в файле nf_tables
      - Что iptables работает только с IPv6
      - Что правила идут в ядро через nftables
      - Что nftables на машине выключен
    answer: 2
    explain: >
      Это iptables-nft: прежние команды, но правила попадают в ядро через
      nftables. В опыте nft list chain ip filter FORWARD показал те же правила с
      предупреждением, что таблицей управляет iptables-nft.

  - q: Чем действие LOG отличается от DROP и ACCEPT?
    options:
      - LOG отбрасывает пакет и пишет об этом в журнал
      - LOG пропускает пакет без дальнейших проверок
      - LOG отправляет копию пакета на другой сервер
      - LOG пишет в журнал, проверка идёт дальше
    answer: 3
    explain: >
      LOG не выносит решения: записывает пакет в журнал ядра, и пакет идёт к
      следующему правилу. Поэтому за LOG обычно ставят правило с DROP или REJECT.

  - q: Почему правила в цепочке INPUT не ограничивают доступ к опубликованным портам контейнеров Docker?
    options:
      - Этот трафик идёт через FORWARD после DNAT
      - Docker отключает INPUT на время своей работы
      - Контейнеры работают только по IPv6
      - Правила INPUT действуют только на UDP
    answer: 0
    explain: >
      Трафик к опубликованному порту Docker перенаправляет (DNAT) к контейнеру, и
      пакеты идут через FORWARD, а не INPUT. Свои ограничения для контейнеров
      ставят в цепочку DOCKER-USER.

open_questions:
  - q: Как устроены правила iptables - таблицы, цепочки, правила?
    reference: >
      Таблица собирает правила одного назначения: filter (фильтрация, по
      умолчанию), nat (замена адресов, только первый пакет соединения), mangle
      (метки и служебные поля), raw (до отслеживания соединений), security. В
      таблице - цепочки: встроенные привязаны к хукам netfilter (у filter -
      INPUT, FORWARD, OUTPUT) и имеют политику ACCEPT или DROP; свои цепочки
      создаются через -N и вызываются переходом -j. Правило - условия (-p, -s,
      -d, -i, -o, --dport, расширения -m) и действие (ACCEPT, DROP, REJECT, LOG,
      RETURN, переход в цепочку, NAT). Правила проверяются по порядку.
    key_points:
      - таблицы и их назначение
      - встроенные цепочки на хуках, политика
      - свои цепочки
      - условия и действия, порядок

  - q: Какие типичные ошибки делают в правилах iptables и как их избежать?
    reference: >
      Забывают IPv6 - нужны такие же правила в ip6tables или nftables inet.
      Ошибаются в порядке - разрешение после общего запрета не работает, широкое
      разрешение в начале открывает всё; смотреть --line-numbers, вставлять -I N,
      загружать набор целиком. Оставляют политику ACCEPT - нужна DROP и явные
      разрешения. Разрешают ответы широко по портам - нужно ESTABLISHED,RELATED.
      Не сохраняют правила - iptables-persistent. Не учитывают правила Docker -
      трафик к контейнерам идёт через FORWARD, ограничения в DOCKER-USER.
      Смешивают legacy и nft. Отрезают себе SSH - сначала разрешения,
      iptables-apply с откатом.
    key_points:
      - IPv6 и ip6tables
      - порядок, политика DROP, ESTABLISHED
      - сохранение, Docker, legacy и nft
      - не отрезать себе доступ

  - q: Что такое iptables-nft и чем он отличается от iptables-legacy?
    reference: >
      iptables-nft - современный вариант iptables: те же команды и синтаксис, но
      правила записываются в ядро через nftables в таблицы с теми же именами (их
      видно в nft list ruleset с предупреждением не трогать руками).
      iptables-legacy работает со старым интерфейсом ядра. Вариант показывает
      iptables -V: (nf_tables) или (legacy). Смешивать их нельзя: получатся два
      набора правил, каждый виден только своей программе, а действуют оба.
    key_points:
      - те же команды, правила в nftables
      - iptables -V
      - legacy - старый интерфейс
      - не смешивать, два невидимых друг другу набора
