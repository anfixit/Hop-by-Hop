<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <rect width="1200" height="480" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Таблицы iptables и их цепочки</text>
  <text x="600" y="75" text-anchor="middle" font-size="16" fill="#475569">строки - таблицы, столбцы - хуки netfilter; порядок на одном хуке задают приоритеты (внизу)</text>
  <g font-size="16" font-weight="bold" fill="#0E1830" text-anchor="middle">
    <text x="330" y="120">PREROUTING</text><text x="530" y="120">INPUT</text><text x="730" y="120">FORWARD</text><text x="930" y="120">OUTPUT</text><text x="1110" y="120">POSTROUTING</text>
  </g>
  <g font-size="17" fill="#0E1830">
    <text x="40" y="170" font-weight="bold">raw</text><text x="40" y="190" font-size="13" fill="#475569">до conntrack</text>
    <text x="40" y="240" font-weight="bold">mangle</text><text x="40" y="260" font-size="13" fill="#475569">метки, служебные поля</text>
    <text x="40" y="310" font-weight="bold">nat</text><text x="40" y="330" font-size="13" fill="#475569">замена адресов</text>
    <text x="40" y="380" font-weight="bold">filter</text><text x="40" y="400" font-size="13" fill="#475569">фильтрация (по умолчанию)</text>
  </g>
  <g fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5">
    <rect x="270" y="155" width="120" height="40" rx="8"/><rect x="870" y="155" width="120" height="40" rx="8"/>
    <rect x="270" y="225" width="120" height="40" rx="8"/><rect x="470" y="225" width="120" height="40" rx="8"/><rect x="670" y="225" width="120" height="40" rx="8"/><rect x="870" y="225" width="120" height="40" rx="8"/><rect x="1050" y="225" width="120" height="40" rx="8"/>
  </g>
  <g fill="#FEF9C3" stroke="#A16207" stroke-width="1.5">
    <rect x="270" y="295" width="120" height="40" rx="8"/><rect x="470" y="295" width="120" height="40" rx="8"/><rect x="870" y="295" width="120" height="40" rx="8"/><rect x="1050" y="295" width="120" height="40" rx="8"/>
  </g>
  <g fill="#DCFCE7" stroke="#15803D" stroke-width="1.5">
    <rect x="470" y="365" width="120" height="40" rx="8"/><rect x="670" y="365" width="120" height="40" rx="8"/><rect x="870" y="365" width="120" height="40" rx="8"/>
  </g>
  <g font-size="14" fill="#0E1830" text-anchor="middle">
    <text x="330" y="180">raw</text><text x="930" y="180">raw</text>
    <text x="330" y="250">mangle</text><text x="530" y="250">mangle</text><text x="730" y="250">mangle</text><text x="930" y="250">mangle</text><text x="1110" y="250">mangle</text>
    <text x="330" y="320">DNAT</text><text x="530" y="314">SNAT</text><text x="530" y="330" font-size="11" fill="#475569">после filter</text><text x="930" y="320">DNAT</text><text x="1110" y="320">SNAT</text>
    <text x="530" y="390">filter</text><text x="730" y="390">filter</text><text x="930" y="390">filter</text>
  </g>
  <text x="600" y="455" text-anchor="middle" font-size="15" fill="#475569">Порядок на хуке: raw, conntrack, mangle, nat (DNAT), filter, security, nat (SNAT); таблица security не показана. IPv6 - отдельные таблицы ip6tables.</text>
</svg>