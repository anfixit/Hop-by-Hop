<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">ClientHello: что видно наблюдателю</text>
  <rect x="60" y="80" width="640" height="530" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  <text x="80" y="115" font-size="20" font-weight="bold" fill="#0E1830">ClientHello (открытым текстом)</text>
  <g font-size="18" fill="#0E1830">
    <rect x="80" y="135" width="600" height="40" rx="6" fill="#E2E8F0"/><text x="95" y="162">версия 03 03, client_random</text>
    <rect x="80" y="185" width="600" height="40" rx="6" fill="#E2E8F0"/><text x="95" y="212">наборы шифров (в порядке клиента)</text>
    <text x="95" y="255" font-weight="bold">расширения:</text>
    <rect x="80" y="268" width="600" height="40" rx="6" fill="#FEE2E2" stroke="#B91C1C"/><text x="95" y="295">server_name (SNI): mail.corp.lab</text>
    <rect x="80" y="318" width="600" height="40" rx="6" fill="#FEE2E2" stroke="#B91C1C"/><text x="95" y="345">ALPN: h2, http/1.1</text>
    <rect x="80" y="368" width="600" height="40" rx="6" fill="#E2E8F0"/><text x="95" y="395">supported_versions, supported_groups</text>
    <rect x="80" y="418" width="600" height="40" rx="6" fill="#E2E8F0"/><text x="95" y="445">key_share, signature_algorithms</text>
    <rect x="80" y="468" width="600" height="40" rx="6" fill="#E2E8F0"/><text x="95" y="495">psk_key_exchange_modes, ...</text>
    <text x="95" y="545" fill="#475569" font-size="16">состав полей (у JA3 и порядок) = отпечаток клиента</text>
    <text x="95" y="575" fill="#475569" font-size="16">схемы: JA3, JA4</text>
  </g>
  <g font-size="18" fill="#0E1830">
    <rect x="760" y="250" width="400" height="76" rx="10" fill="#FEE2E2" stroke="#B91C1C"/>
    <text x="780" y="282" font-weight="bold">имя сайта</text>
    <text x="780" y="308" font-size="16" fill="#475569">скрыть может только ECH</text>
    <rect x="760" y="340" width="400" height="76" rx="10" fill="#FEE2E2" stroke="#B91C1C"/>
    <text x="780" y="372" font-weight="bold">протокол приложения</text>
    <text x="780" y="398" font-size="16" fill="#475569">ответ сервера в TLS 1.3 зашифрован</text>
    <rect x="760" y="480" width="400" height="76" rx="10" fill="#E0E7FF" stroke="#4338CA"/>
    <text x="780" y="512" font-weight="bold">какая программа</text>
    <text x="780" y="538" font-size="16" fill="#475569">браузер, curl, библиотека, вредонос</text>
  </g>
  <g stroke="#B91C1C" stroke-width="2">
    <line x1="680" y1="288" x2="760" y2="288"/>
    <line x1="680" y1="338" x2="760" y2="378"/>
  </g>
  <line x1="700" y1="540" x2="760" y2="518" stroke="#4338CA" stroke-width="2"/>
</svg>
