id: 80
title: "SNI, ALPN, расширения, наборы шифров"
status: published
summary: >
  Расширения TLS и зачем нужен GREASE, SNI и выбор сертификата для нескольких
  сайтов на одном адресе, ALPN и согласование протокола приложения, чей порядок
  наборов шифров побеждает. На практике - сервер openssl s_server с двумя
  сертификатами и ALPN, список расширений ClientHello, SNI и ALPN в записанном
  трафике, -serverpref. Безопасность: что видит DPI в ClientHello.

quiz:
  - q: Зачем нужно расширение SNI?
    options:
      - Чтобы зашифровать имя сайта от наблюдателя
      - Чтобы сервер выбрал нужный сертификат
      - Чтобы согласовать версию HTTP
      - Чтобы проверить сертификат клиента
    answer: 1
    explain: >
      На одном адресе живёт много сайтов, а заголовок Host приходит уже внутри TLS.
      Имя в SNI позволяет выбрать сертификат до этого.

  - q: Что сервер из опыта отдал на незнакомое имя other.corp.lab?
    options:
      - Сертификат www.corp.lab
      - Сертификат mail.corp.lab
      - Оповещение unrecognized_name
      - Новый сертификат, выпущенный для other.corp.lab
    answer: 0
    explain: >
      Без совпадения сервер отдал сертификат по умолчанию. Так произвольным SNI
      можно узнать главный сайт сервера, поэтому лучше обрывать рукопожатие.

  - q: Как согласуется протокол приложения по ALPN?
    options:
      - Сервер навязывает протокол без учёта клиента
      - Протокол выбирается по номеру порта
      - Клиент предлагает, сервер выбирает
      - Клиент выбирает протокол после рукопожатия
    answer: 2
    explain: >
      Клиент перечисляет h2, http/1.1 и другие в порядке предпочтения, сервер
      выбирает один из них. В опыте при h2,http/1.1 выбран h2.

  - q: Что видно наблюдателю в ClientHello TLS 1.3 без ECH?
    options:
      - Только IP-адрес и порт
      - Заголовок Host и cookies
      - Сертификат сервера
      - Имя из SNI и список ALPN
    answer: 3
    explain: >
      В опыте имя mail.corp.lab и оба протокола нашлись в записанном трафике.
      Сертификат в TLS 1.3 зашифрован, Host и cookies идут внутри TLS.

  - q: Зачем браузеры добавляют в ClientHello значения GREASE?
    options:
      - Чтобы ускорить рукопожатие
      - Чтобы ловить реализации, не готовые к новым
      - Чтобы скрыть имя сайта от наблюдателя на пути
      - Чтобы зашифровать список расширений
    answer: 1
    explain: >
      Случайные значения из зарезервированного диапазона сразу выявляют серверы,
      которые не умеют пропускать незнакомые значения (RFC 8701).

  - q: Что изменила настройка -serverpref в опыте?
    options:
      - Набор выбран по порядку сервера
      - Сервер перешёл на TLS 1.3
      - Сервер отказал в соединении
      - Клиент сам сменил свой список наборов
    answer: 0
    explain: >
      Клиент поставил первым ChaCha20; сервер по умолчанию согласился, а с
      -serverpref выбрал AES-256-GCM, первый из общих в своём списке.

  - q: Что такое отпечаток ClientHello (JA3, JA4)?
    options:
      - Подпись сервера над ClientHello
      - Хеш сертификата клиента из рукопожатия
      - Сводка полей ClientHello
      - Случайное число клиента
    answer: 2
    explain: >
      Набор версий, шифров, групп и расширений у разных программ разный (JA3
      учитывает и порядок, JA4 сортирует списки: Chrome перемешивает расширения). По ним классифицируют соединения и находят необычные клиенты.

  - q: Как не выдавать главный сайт сервера на незнакомый SNI?
    options:
      - Убрать SNI из ClientHello
      - Перейти на TLS 1.2
      - Отключить ALPN на самом сервере
      - Обрывать рукопожатие
    answer: 3
    explain: >
      Отдельный сервер по умолчанию обрывает рукопожатие (в nginx
      ssl_reject_handshake on) или отдаёт нейтральный сертификат.

open_questions:
  - q: Что такое SNI, зачем оно нужно и почему его видно?
    reference: >
      SNI - расширение ClientHello с именем сервера. На одном адресе много сайтов,
      а Host приходит только внутри TLS, поэтому сертификат выбирают по SNI. Оно
      идёт открытым текстом во всех версиях, включая TLS 1.3; скрыть его может
      только ECH. На незнакомое имя сервер отдаёт сертификат по умолчанию или
      обрывает рукопожатие.
    key_points:
      - выбор сертификата
      - Host внутри TLS
      - открыто, кроме ECH
      - сервер по умолчанию

  - q: Как работает ALPN и где виден его результат?
    reference: >
      Клиент перечисляет протоколы в ClientHello в порядке предпочтения, сервер
      выбирает один. В TLS 1.2 ответ идёт в ServerHello открыто, в TLS 1.3 - в
      зашифрованном EncryptedExtensions. Если общего протокола нет, RFC 7301
      предписывает оповещение no_application_protocol; s_server в опыте просто
      продолжил без ALPN.
    key_points:
      - список клиента
      - выбор сервера
      - где ответ
      - нет общего протокола

  - q: Что узнаёт DPI из ClientHello и как защищаться?
    reference: >
      Имя сайта из SNI, протокол из ALPN и отпечаток программы по составу (и часто порядку)
      версий, шифров, групп и расширений. Защита приватности - шифрованный DNS и
      ECH; серверам - не выдавать главный сайт на незнакомый SNI и не считать SNI
      доказательством; защитникам сети - собирать SNI и отпечатки в журналы.
    key_points:
      - SNI и ALPN
      - отпечаток
      - DNS и ECH
      - настройки сервера
