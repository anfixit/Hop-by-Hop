id: 48
title: "Policy routing: ip rule, несколько таблиц, fwmark"
status: published
summary: >
  Маршрутизация по правилам в Linux: таблицы local, main, default и свои, список
  правил ip rule с приоритетами, условиями и действиями, проверка через ip route get,
  две сети провайдеров и проверка обратного пути, метка fwmark от файервола или
  сокета. На практике - узел с двумя провайдерами, сломанный и починенный ответ с
  адреса второго провайдера, маршрут по метке и по пользователю.

quiz:
  - q: Какие правила ip rule есть в Linux по умолчанию?
    options:
      - Только main с приоритетом 0
      - Правила для каждого интерфейса
      - local, затем main, затем default
      - Никаких, их добавляет администратор
    answer: 2
    explain: >
      По умолчанию три правила: 0 - lookup local, 32766 - lookup main, 32767 -
      lookup default. Свои правила обычно ставят между local и main.

  - q: Правило совпало, но в его таблице нет маршрута к адресу назначения. Что сделает ядро?
    options:
      - Перейдёт к следующему правилу
      - Отбросит пакет как недоставляемый
      - Повторит поиск в этой таблице по адресу отправителя
      - Отправит пакет через первый интерфейс
    answer: 0
    explain: >
      Если в таблице маршрут не нашёлся, ядро продолжает перебор правил. Поэтому
      в своей таблице может быть хоть один маршрут: остальное найдётся дальше, в
      main.

  - q: Зачем нужна таблица local?
    options:
      - Маршруты только к соседям по сети
      - Адреса самой машины и широковещательные
      - Маршруты, добавленные вручную
      - Маршруты для loopback и больше ничего
    answer: 1
    explain: >
      Ядро само заполняет local при добавлении адресов. Её правило стоит первым, и
      по ней ядро понимает, что пакет адресован самой машине.

  - q: У машины два провайдера и один маршрут по умолчанию через первого. Почему не работают входящие соединения на адрес второго?
    options:
      - Второй провайдер не знает адрес машины
      - Ядро не отвечает с адреса второго интерфейса
      - Адрес второго провайдера не попал в local
      - Ответ идёт через первого с адресом второго
    answer: 3
    explain: >
      Ответ ищет маршрут в main и уходит через первого провайдера с адресом
      второго. Первый провайдер отбрасывает пакет с чужим адресом отправителя
      (проверка обратного пути, BCP 38). Лечится своей таблицей и правилом from.

  - q: Что такое fwmark?
    options:
      - Число, которое ядро хранит при пакете
      - Поле в заголовке IP для приоритета пакета
      - Номер таблицы маршрутов в пакете
      - Метка VLAN в кадре Ethernet
    answer: 0
    explain: >
      fwmark - число в sk_buff, в сеть оно не уходит. Его ставят файервол (nftables
      meta mark set, iptables MARK) или программа опцией сокета SO_MARK, а правило
      fwmark направляет такие пакеты в свою таблицу.

  - q: Как проверить, какой маршрут ядро выберет для пакета с адресом отправителя 203.0.113.2?
    options:
      - ip rule show from 203.0.113.2
      - ip route show table all
      - ip route get 192.0.2.10 from 203.0.113.2
      - ip neigh get 203.0.113.2 dev eth2
    answer: 2
    explain: >
      ip route get выполняет поиск с учётом правил и показывает результат, а если
      маршрут взят не из main - и таблицу. Так же можно проверять mark, uid и iif.

  - q: Как в опыте пустить через второго провайдера все соединения программ одного пользователя?
    options:
      - Правилом iif с интерфейсом пользователя
      - Отдельным маршрутом в main для пользователя
      - Меткой VLAN для процессов пользователя
      - Правилом uidrange с номером пользователя
    answer: 3
    explain: >
      Правило uidrange 65534-65534 lookup 102 отправило в таблицу второго
      провайдера всё, что отправляют программы пользователя nobody. Условие uidrange
      действует на пакеты, которые создаёт сама машина.

  - q: Что будет с правилами ip rule после перезагрузки?
    options:
      - Восстановятся из последнего ip rule save
      - Пропадут, их задают в настройках системы
      - Сохранятся, если есть таблица с маршрутами
      - Сохранятся до обновления ядра
    answer: 1
    explain: >
      Как и маршруты, правила - состояние ядра. Постоянно их задают в netplan
      (routing-policy) или systemd-networkd ([RoutingPolicyRule]). Файл rt_tables
      хранит только имена таблиц.

open_questions:
  - q: Как ядро Linux выбирает маршрут при policy routing?
    reference: >
      Ядро перебирает правила ip rule по возрастанию приоритета. У каждого правила
      есть условие (from, to, iif, oif, fwmark, uidrange, ipproto, порты, tos) и
      действие, обычно lookup ТАБЛИЦА. Если условие совпало, ядро ищет маршрут в
      таблице по самому длинному совпадению префикса; нашёлся - поиск окончен, нет -
      переходит к следующему правилу. По умолчанию правила три: local (адреса
      машины), main (обычная таблица), default. Проверить результат можно через
      ip route get с from, mark, uid или iif.
    key_points:
      - правила по приоритету, условие и действие
      - поиск в таблице, при неудаче следующее правило
      - local, main, default
      - ip route get

  - q: Объясни проблему машины с двумя провайдерами и её решение.
    reference: >
      У машины два адреса, но один маршрут по умолчанию через первого провайдера.
      Ответы на соединения, пришедшие на адрес второго, ищут маршрут в main и
      уходят через первого провайдера с адресом второго; первый провайдер
      отбрасывает пакеты с чужим адресом отправителя (BCP 38, проверка обратного
      пути rp_filter). Решение: отдельная таблица с маршрутом по умолчанию через
      второго провайдера и правило from АДРЕС_ВТОРОГО lookup ЭТА_ТАБЛИЦА. Тогда всё,
      что отправлено с адреса второго провайдера, уходит через него.
    key_points:
      - ответ уходит через первого с адресом второго
      - провайдер отбрасывает чужой адрес отправителя
      - своя таблица с маршрутом по умолчанию
      - правило from

  - q: Что такое fwmark, кто его ставит и как его используют в маршрутизации?
    reference: >
      fwmark - число, которое ядро хранит рядом с пакетом и не отправляет в сеть.
      Его ставит файервол (nftables meta mark set, iptables MARK) по любому
      признаку, который видит файервол, или сама программа опцией сокета SO_MARK
      (нужно CAP_NET_ADMIN или CAP_NET_RAW). Правило ip rule fwmark МЕТКА lookup ТАБЛИЦА отправляет
      помеченные пакеты в свою таблицу. Если метку ставит файервол на исходящий
      пакет, адрес отправителя уже выбран, поэтому часто нужен ещё и NAT; метка на
      сокете действует до соединения, и адрес выбирается сразу с её учётом. Так
      устроены многие VPN-клиенты.
    key_points:
      - метка в ядре, в сеть не уходит
      - ставят файервол или SO_MARK
      - правило fwmark и своя таблица
      - адрес отправителя и NAT
