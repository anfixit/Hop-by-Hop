id: 41
title: "Контроль перегрузки: Reno, CUBIC, BBR"
status: published
summary: >
  Как отправитель находит скорость, которую выдержит сеть: перегрузка и коллапс,
  эффективность и справедливость, сигналы перегрузки, правило AIMD. Окно перегрузки,
  медленный старт, порог, предотвращение перегрузки, Tahoe и Reno, пила. CUBIC и его
  кубический рост. Излишняя буферизация и BBR с моделью пути. На практике - окно
  перегрузки трёх алгоритмов на одном узком месте и два потока, делящие канал.

quiz:
  - q: Кто в TCP ограничивает скорость, чтобы сети хватило на всех?
    options:
      - Маршрутизаторы назначают скорость потокам
      - Получатель через поле Window в заголовке
      - Отправитель сам, через окно перегрузки
      - Провайдер по договору с абонентом
    answer: 2
    explain: >
      Окно перегрузки ведёт отправитель; получатель о нём не знает, и в заголовке его
      нет. Поле Window - это окно получателя, оно защищает получателя, а не сеть.
      Действует меньшее из двух окон.

  - q: Что предписывает правило AIMD?
    options:
      - Прибавлять понемногу, убавлять в разы
      - Прибавлять в разы, убавлять понемногу
      - Прибавлять и убавлять на одну величину
      - Прибавлять и убавлять в одно число раз
    answer: 0
    explain: >
      Аддитивное увеличение и мультипликативное уменьшение: пока сигнала перегрузки
      нет, окно растёт на постоянную величину, при сигнале уменьшается в разы. Только
      такая комбинация сближает доли соединений и сходится к справедливому делению.

  - q: Как растёт окно перегрузки во время медленного старта?
    options:
      - На один сегмент за время оборота
      - На десять сегментов за время оборота
      - По кубической функции времени
      - Удваивается за каждое время оборота
    answer: 3
    explain: >
      На каждое подтверждение окно увеличивается на сегмент, поэтому за оборот оно
      удваивается. В опыте окно на старте росло в два с лишним раза от замера к замеру. Рост на
      один сегмент за оборот начинается
      выше порога, в режиме предотвращения перегрузки.

  - q: Reno узнал о потере по повторным подтверждениям при окне в 64 сегмента. Каким станет окно?
    options:
      - Один сегмент и медленный старт
      - Около 32 сегментов, половина
      - Около 45 сегментов, 0,7 окна
      - Останется 64, окно не меняется
    answer: 1
    explain: >
      Быстрое восстановление: окно и порог ставятся в половину прежнего окна, и линейный
      рост продолжается. В опыте после 64 следующий замер показал 40: окно упало вдвое и
      уже немного подросло. До одного сегмента окно сбрасывается
      при потере, обнаруженной по таймеру.

  - q: Чем рост окна у CUBIC отличается от Reno?
    options:
      - Окно растёт на сегмент за время оборота
      - Окно при потере не уменьшается совсем
      - Окно зависит от времени с последней потери
      - Окно удваивается каждое время оборота
    answer: 2
    explain: >
      У CUBIC окно - кубическая функция времени, прошедшего с последней потери: быстрый
      рост, плато возле прежнего предела, потом снова ускорение. После потери окно
      уменьшается до 0,7 прежнего, а не вдвое.

  - q: Почему алгоритмы, судящие по потерям, увеличивают задержку в сети?
    options:
      - Им нужно переполнить очередь узкого места
      - Они слишком резко уменьшают окно
      - Они судят о сети по времени оборота
      - Они растят окно слишком медленно
    answer: 0
    explain: >
      Потеря случается, когда очередь на узком месте уже полна, поэтому такой алгоритм
      то и дело заполняет очередь. В опыте время оборота у Reno и CUBIC доходило до 80 мс
      при чистых 40 мс; чем больше буфер, тем хуже.

  - q: На чём основано решение BBR о скорости отправки?
    options:
      - На доле потерянных пакетов
      - На окне, которое объявил получатель
      - На числе маршрутизаторов на пути
      - На скорости доставки и времени оборота
    answer: 3
    explain: >
      BBR строит модель пути: наибольшая замеченная скорость доставки и наименьшее
      время оборота. Он отправляет в темпе узкого места и не заполняет очередь: в опыте
      время оборота у него было ближе всех к чистым 40 мс.

  - q: Сервер перешёл с CUBIC на BBR. Что нужно изменить на клиентах, которые скачивают с него файлы?
    options:
      - Клиентам тоже нужен модуль BBR
      - Ничего, алгоритм выбирает отправитель
      - Клиентам нужно включить ECN и SACK
      - Клиентам нужен больший буфер приёма
    answer: 1
    explain: >
      Контроль перегрузки - поведение отправителя данных. Получателю и сети ничего
      менять не нужно; клиент и сервер могут использовать разные алгоритмы.

open_questions:
  - q: Зачем TCP нужен контроль перегрузки и чем окно перегрузки отличается от окна получателя?
    reference: >
      Пропускная способность пути заранее неизвестна и делится между многими
      соединениями. Если отправлять больше, чем сеть может передать, очереди
      маршрутизаторов переполняются, пакеты теряются, повторы добавляют нагрузку, и
      полезная пропускная способность падает вплоть до коллапса. Поэтому отправитель
      сам ограничивает себя окном перегрузки: оно отражает его оценку возможностей
      сети, ведётся только на его стороне и в заголовке не передаётся. Окно получателя
      объявляется в поле Window и защищает буфер получателя. Отправитель может держать
      в пути не больше меньшего из двух окон.
    key_points:
      - сеть общая, пропускная способность неизвестна
      - коллапс перегрузки
      - окно перегрузки ведёт отправитель, в заголовке его нет
      - действует меньшее из двух окон

  - q: Опиши, как меняется окно перегрузки у TCP Reno от начала соединения, включая реакцию на потери.
    reference: >
      Соединение начинается с медленного старта: окно (в Linux с 10 сегментов)
      удваивается каждое время оборота, пока не достигнет порога или не случится
      потеря. Выше порога - предотвращение перегрузки: окно растёт примерно на сегмент
      за оборот. Если потеря обнаружена по повторным подтверждениям, сегмент
      повторяется сразу, порог и окно ставятся в половину прежнего окна, и линейный
      рост продолжается (быстрое восстановление). Если потеря обнаружена по таймеру,
      порог ставится в половину, окно сбрасывается до одного сегмента, и снова идёт
      медленный старт. График окна - пила: это правило AIMD.
    key_points:
      - медленный старт - удвоение за оборот
      - порог, затем рост на сегмент за оборот
      - повторные подтверждения - окно вдвое, без медленного старта
      - таймер - окно до одного сегмента, медленный старт

  - q: Чем BBR отличается от алгоритмов, которые судят о перегрузке по потерям, и какова его цена?
    reference: >
      Reno и CUBIC увеличивают окно, пока не случится потеря, то есть пока очередь
      узкого места не переполнится; поэтому они работают с заполненной очередью и
      добавляют задержку, особенно при больших буферах. BBR потери главным сигналом не
      считает: он измеряет пропускную способность узкого места (наибольшую скорость
      доставки) и время оборота без очереди (наименьшее замеченное), отправляет в темпе
      узкого места и держит в пути чуть больше, чем вмещает сама труба, так что очередь
      почти пуста и задержка мала. Цена - справедливость: с алгоритмами на потерях BBR
      делит канал неровно и может забирать непропорционально большую долю.
    key_points:
      - алгоритмы на потерях заполняют очередь
      - BBR - модель из пропускной способности и минимального времени оборота
      - отправка в темпе узкого места, малая задержка
      - неровное деление с другими алгоритмами
