<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Пять хуков netfilter</text>
  <g font-size="17" fill="#0E1830" text-anchor="middle">
    <rect x="30" y="230" width="140" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="100" y="257">интерфейс</text><text x="100" y="279" font-size="13" fill="#475569">пакет пришёл</text>
    <rect x="210" y="230" width="170" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="295" y="266" font-weight="bold">PREROUTING</text>
    <polygon points="430,215 500,260 430,305 360,260" fill="#FEF9C3" stroke="#A16207" stroke-width="2" transform="translate(70,0)"/><text x="500" y="256" font-size="14">маршрут:</text><text x="500" y="274" font-size="14">кому?</text>
    <rect x="600" y="230" width="170" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="685" y="266" font-weight="bold">FORWARD</text>
    <rect x="830" y="230" width="190" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="925" y="266" font-weight="bold">POSTROUTING</text>
    <rect x="1060" y="230" width="120" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="1120" y="257">интерфейс</text><text x="1120" y="279" font-size="13" fill="#475569">пакет ушёл</text>
    <rect x="420" y="90" width="160" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="500" y="126" font-weight="bold">INPUT</text>
    <rect x="420" y="400" width="160" height="60" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/><text x="500" y="427" font-size="14">маршрут:</text><text x="500" y="447" font-size="14">куда отправить</text>
    <rect x="640" y="90" width="230" height="60" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="755" y="117">программы машины</text><text x="755" y="139" font-size="13" fill="#475569">сокеты</text>
    <rect x="640" y="400" width="160" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="720" y="436" font-weight="bold">OUTPUT</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="170" y1="260" x2="198" y2="260"/><line x1="380" y1="260" x2="418" y2="260"/>
    <line x1="570" y1="260" x2="588" y2="260"/><line x1="770" y1="260" x2="818" y2="260"/><line x1="1020" y1="260" x2="1048" y2="260"/>
    <line x1="500" y1="215" x2="500" y2="162"/><line x1="580" y1="120" x2="628" y2="120"/>
    <path d="M800 150 L800 380 L500 380 L500 392"/>
    <line x1="580" y1="430" x2="628" y2="430"/><path d="M800 430 L925 430 L925 302"/>
  </g>
  <rect x="792" y="253" width="16" height="14" fill="#FFFFFF"/>
  <path d="M800 252 A8 8 0 0 1 800 268" stroke="#475569" stroke-width="2.5" fill="none"/>
  <g fill="#475569">
    <polygon points="210,260 198,254 198,266"/><polygon points="430,260 418,254 418,266"/><polygon points="600,260 588,254 588,266"/>
    <polygon points="830,260 818,254 818,266"/><polygon points="1060,260 1048,254 1048,266"/><polygon points="500,150 494,162 506,162"/>
    <polygon points="640,120 628,114 628,126"/><polygon points="500,400 494,388 506,388"/><polygon points="640,430 628,424 628,436"/><polygon points="925,290 919,302 931,302"/>
  </g>
  <g font-size="13" fill="#475569"><text x="510" y="200">нам</text><text x="572" y="300" font-size="12">не нам</text><text x="808" y="200">отправка</text></g>
  <g font-size="15" fill="#0E1830">
    <text x="40" y="505">для машины: PREROUTING → INPUT</text>
    <text x="420" y="505">пересылка: PREROUTING → FORWARD → POSTROUTING</text>
    <text x="40" y="535">от машины: OUTPUT → POSTROUTING</text>
    <text x="420" y="535">DNAT - в PREROUTING (до маршрута), SNAT - в POSTROUTING</text>
  </g>
</svg>