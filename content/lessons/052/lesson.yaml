id: 52
title: "netfilter: пять хуков и путь пакета через ядро"
status: published
summary: >
  Подсистема ядра netfilter, на которой построены iptables, nftables, conntrack и
  NAT: хуки и вердикты, пять хуков IPv4 и IPv6 и три пути пакета через них,
  приоритеты нескольких участников на одном хуке, смысл accept и drop, семейства
  nftables. На практике - счётчики на всех пяти хуках маршрутизатора для трёх видов
  ping, трассировка nft monitor trace и независимость INPUT от FORWARD.

quiz:
  - q: Через какие хуки проходит пакет, который маршрутизатор пересылает дальше?
    options:
      - INPUT, затем OUTPUT и POSTROUTING
      - PREROUTING, FORWARD, POSTROUTING
      - PREROUTING, INPUT, затем FORWARD
      - Только FORWARD, без других хуков
    answer: 1
    explain: >
      Пересылаемый пакет приходит (PREROUTING), после решения о маршруте идёт в
      FORWARD и перед отправкой - в POSTROUTING. В INPUT и OUTPUT он не попадает: в
      опыте там было ноль.

  - q: На маршрутизаторе в цепочке INPUT стоит политика drop. Что будет с трафиком, который он пересылает?
    options:
      - Он будет отброшен так же, как входящий
      - Он пройдёт только по TCP
      - Он пройдёт, INPUT его не касается
      - Он пройдёт только в одну сторону
    answer: 2
    explain: >
      INPUT видит только пакеты, адресованные самой машине. Пересылаемые идут
      через FORWARD. В опыте ping до r не проходил, а ping через r до s проходил.

  - q: Почему замена адреса получателя (DNAT) делается на хуке PREROUTING?
    options:
      - Чтобы маршрут выбирался для нового адреса
      - Чтобы пакет не попал в счётчики правил
      - Потому что на POSTROUTING адресов уже нет
      - Потому что FORWARD не видит адресов
    answer: 0
    explain: >
      PREROUTING стоит до решения о маршруте. Если заменить адрес получателя
      позже, ядро уже выбрало бы маршрут для старого адреса.

  - q: Через какие хуки проходит пакет, созданный программой на этой машине и уходящий в сеть?
    options:
      - PREROUTING и INPUT
      - FORWARD и POSTROUTING
      - INPUT и OUTPUT
      - OUTPUT и POSTROUTING
    answer: 3
    explain: >
      Пакет от самой машины проходит OUTPUT после выбора маршрута и POSTROUTING
      перед отправкой. В опыте ping от r к s дал запрос в OUTPUT и POSTROUTING, а
      ответ - в PREROUTING и INPUT.

  - q: Что определяет порядок двух цепочек nftables на одном хуке?
    options:
      - Порядок их создания в таблице
      - Имена цепочек по алфавиту
      - Их приоритет, меньший - раньше
      - Число правил в цепочке
    answer: 2
    explain: >
      В опыте цепочка late объявлена первой, но с приоритетом 10 она
      сработала после early с приоритетом -10.

  - q: Цепочка с приоритетом -10 вынесла accept. Увидит ли пакет цепочка с приоритетом 10 на том же хуке?
    options:
      - Да, accept действует лишь в своей базовой цепочке
      - Нет, accept окончателен для всего хука
      - Нет, после accept хук сразу передаёт пакет дальше
      - Да, но только если её приоритет отрицательный
    answer: 0
    explain: >
      accept значит лишь "эта цепочка не возражает", и пакет идёт дальше. В опыте
      после accept в early пакет прошёл и late. А drop окончателен.

  - q: Какое семейство nftables позволяет написать одни правила сразу для IPv4 и IPv6?
    options:
      - netdev
      - bridge
      - arp
      - inet
    answer: 3
    explain: >
      inet обрабатывает и IPv4, и IPv6 одними правилами на тех же хуках, что ip и ip6. netdev даёт хуки
      ingress и egress у самого интерфейса, bridge - для кадров через мост, arp -
      для ARP.

  - q: Как посмотреть, через какие цепочки и с какими вердиктами прошёл конкретный пакет?
    options:
      - Включить meta nftrace и nft monitor trace
      - Посмотреть ip route get для адреса пакета
      - Запустить tcpdump на входном интерфейсе
      - Посмотреть ss -tan на машине
    answer: 0
    explain: >
      Правило с meta nftrace set 1 включает трассировку пакета, а nft monitor
      trace печатает каждую цепочку, правило и вердикт на его пути. tcpdump видит
      пакет на интерфейсе, но не решения netfilter.

open_questions:
  - q: Опиши пять хуков netfilter и три пути пакета через них.
    reference: >
      PREROUTING - пакет пришёл, маршрут ещё не выбран; INPUT - пакет для самой
      машины; FORWARD - пакет пересылается; OUTPUT - пакет создан на машине
      (программой или ядром); POSTROUTING - пакет уходит в интерфейс. Пути: для машины -
      PREROUTING, решение о маршруте, INPUT, сокет; пересылка - PREROUTING,
      FORWARD, POSTROUTING; от машины - OUTPUT, POSTROUTING. Поэтому правила INPUT
      не защищают сеть за маршрутизатором, DNAT делают в PREROUTING, SNAT - в
      POSTROUTING.
    key_points:
      - пять хуков и где они стоят
      - три пути пакета
      - INPUT не видит пересылку
      - DNAT до маршрута, SNAT в конце

  - q: Как сосуществуют несколько цепочек и программ на одном хуке?
    reference: >
      На хуке может висеть много функций: conntrack, NAT, свои цепочки, цепочки
      Docker. Порядок задаёт приоритет, меньше - раньше: conntrack -200, mangle
      -150, dstnat -100, filter 0, security 50, srcnat 100. accept в одной цепочке
      лишь пропускает пакет к следующей на том же хуке, drop окончателен. Поэтому
      пакет должен быть разрешён во всех цепочках на своём пути; путь удобно
      проверять трассировкой nft monitor trace.
    key_points:
      - приоритет, меньше - раньше
      - стандартные приоритеты
      - accept не окончателен, drop окончателен
      - разрешить во всех цепочках, трассировка

  - q: Что такое netfilter и кто им пользуется?
    reference: >
      netfilter - подсистема ядра Linux, которая задаёт точки-хуки на пути пакета
      и вызывает в них зарегистрированные функции; каждая выносит вердикт:
      пропустить, отбросить, передать в очередь и т. п. На нём построены iptables,
      nftables, отслеживание соединений conntrack, NAT, а также фильтрация на мостах.
      В nftables хуки сгруппированы по семействам: ip, ip6, inet, arp, bridge,
      netdev (хуки ingress и egress у самого интерфейса).
    key_points:
      - хуки и вердикты
      - iptables, nftables, conntrack, NAT
      - семейства nftables
      - netdev ingress и egress
