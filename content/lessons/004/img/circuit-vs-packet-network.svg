<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#FFFFFF"/>

  <!-- Коммутация каналов -->
  <text x="40" y="50" font-size="28" font-weight="bold" fill="#0E1830">Коммутация каналов: труба зарезервирована на весь разговор</text>
  <rect x="40" y="120" width="120" height="70" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="100" y="163" text-anchor="middle" font-size="24" fill="#0E1830">A</text>
  <rect x="1040" y="120" width="120" height="70" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="1100" y="163" text-anchor="middle" font-size="24" fill="#0E1830">B</text>
  <!-- линии с элементарными каналами -->
  <g fill="#E2E8F0" stroke="#94A3B8" stroke-width="2">
    <rect x="160" y="125" width="180" height="60"/><rect x="420" y="125" width="180" height="60"/>
    <rect x="680" y="125" width="180" height="60"/><rect x="940" y="125" width="100" height="60"/>
  </g>
  <!-- выделенный канал A-B -->
  <rect x="160" y="140" width="880" height="30" fill="#14B8A6"/>
  <g fill="#0E1830">
    <rect x="340" y="110" width="80" height="90" rx="10"/><rect x="600" y="110" width="80" height="90" rx="10"/><rect x="860" y="110" width="80" height="90" rx="10"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#FFFFFF"><text x="380" y="161">S1</text><text x="640" y="161">S2</text><text x="900" y="161">S3</text></g>
  <text x="600" y="235" text-anchor="middle" font-size="21" fill="#0F766E">1. Набор номера: резервируем долю каждой линии на всём пути</text>
  <text x="600" y="265" text-anchor="middle" font-size="21" fill="#0F766E">2. Данные идут без адресов, с постоянной скоростью, без очередей</text>
  <text x="600" y="295" text-anchor="middle" font-size="21" fill="#DC2626">Нет свободного канала хотя бы на одном участке или абонент занят - "занято"</text>

  <line x1="40" y1="330" x2="1160" y2="330" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Коммутация пакетов -->
  <text x="40" y="385" font-size="28" font-weight="bold" fill="#0E1830">Коммутация пакетов: каждый пакет с адресом, общие линии</text>
  <rect x="40" y="450" width="120" height="70" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="100" y="493" text-anchor="middle" font-size="24" fill="#0E1830">A</text>
  <rect x="1040" y="450" width="120" height="70" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="1100" y="493" text-anchor="middle" font-size="24" fill="#0E1830">B</text>
  <line x1="160" y1="485" x2="1040" y2="485" stroke="#94A3B8" stroke-width="6"/>
  <g fill="#0E1830">
    <rect x="340" y="440" width="80" height="90" rx="10"/><rect x="600" y="440" width="80" height="90" rx="10"/><rect x="860" y="440" width="80" height="90" rx="10"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#FFFFFF"><text x="380" y="491">S1</text><text x="640" y="491">S2</text><text x="900" y="491">S3</text></g>
  <!-- буферы -->
  <g fill="#FEF3C7" stroke="#B45309" stroke-width="2">
    <rect x="350" y="540" width="18" height="24"/><rect x="372" y="540" width="18" height="24"/><rect x="394" y="540" width="18" height="24"/>
    <rect x="610" y="540" width="18" height="24"/>
    <rect x="870" y="540" width="18" height="24"/><rect x="892" y="540" width="18" height="24"/>
  </g>
  <text x="380" y="590" text-anchor="middle" font-size="18" fill="#B45309">очередь</text>
  <!-- пакеты на линиях -->
  <g>
    <rect x="200" y="470" width="50" height="30" rx="4" fill="#14B8A6"/><rect x="200" y="470" width="14" height="30" fill="#0F766E"/>
    <rect x="480" y="470" width="50" height="30" rx="4" fill="#F59E0B"/><rect x="480" y="470" width="14" height="30" fill="#B45309"/>
    <rect x="720" y="470" width="50" height="30" rx="4" fill="#14B8A6"/><rect x="720" y="470" width="14" height="30" fill="#0F766E"/>
    <rect x="790" y="470" width="50" height="30" rx="4" fill="#A78BFA"/><rect x="790" y="470" width="14" height="30" fill="#6D28D9"/>
    <rect x="960" y="470" width="50" height="30" rx="4" fill="#F59E0B"/><rect x="960" y="470" width="14" height="30" fill="#B45309"/>
  </g>
  <text x="600" y="630" text-anchor="middle" font-size="21" fill="#0F766E">Тёмная часть пакета - заголовок с адресом. Пакеты разных пользователей идут вперемешку.</text>
  <text x="600" y="665" text-anchor="middle" font-size="21" fill="#475569">Коммутатор принимает пакет целиком, ставит в очередь и отправляет дальше (store-and-forward)</text>
</svg>
