id: 4
title: Коммутация каналов и пакетов
status: published
summary: >
  Как данные идут через транзитные узлы: телефонная сеть резервирует канал на весь
  разговор, интернет режет данные на пакеты с адресами. Разбираем store-and-forward,
  очереди и потери, дейтаграммы, логические соединения и виртуальные каналы, из чего
  складывается задержка - и почему каждый узел на пути может прочитать твой пакет.

quiz:
  - q: Что происходит в сети с коммутацией каналов до начала передачи данных?
    options:
      - Данные делятся на пакеты с адресами
      - На всём пути резервируется доля каждой линии
      - Каждый коммутатор выбирает маршрут для каждого пакета
      - Ничего, данные передаются сразу
    answer: 1
    explain: >
      В канальной сети сначала устанавливается соединение: на всех линиях пути закрепляются
      элементарные каналы, и получается составной канал от абонента до абонента. Пакеты
      с адресами и выбор пути для каждого пакета - это коммутация пакетов.

  - q: Почему элементарный канал цифровой телефонии равен именно 64 Кбит/с?
    options:
      - Так исторически решили первые телефонные компании
      - 8000 замеров голоса в секунду по 8 бит
      - Столько помещается в одну пару медных проводов
      - Это половина скорости первых модемов
    answer: 1
    explain: >
      Для цифровой передачи голос измеряют 8000 раз в секунду и каждый замер записывают
      одним байтом: 8000 × 8 = 64 000 бит/с. Это расчёт, а не произвольная договорённость
      и не предел провода.

  - q: Почему коммутация каналов неэффективна для компьютерного трафика?
    options:
      - Трафик идёт всплесками, канал в паузах простаивает
      - Каналы не умеют передавать цифровые данные
      - Канальная сеть не работает дальше одного города
      - Канальные коммутаторы часто теряют данные
    answer: 0
    explain: >
      Канал закреплён за абонентами на весь сеанс, даже когда они ничего не передают.
      Для трафика со всплесками и паузами это значит, что пропускная способность
      большую часть времени пропадает. Цифровые данные канал передаёт отлично, а данные
      в установленном канале как раз не теряются.

  - q: Что означает принцип store-and-forward?
    options:
      - Коммутатор хранит копии всех пакетов на случай потери
      - Отправитель хранит пакет, пока не получит подтверждение
      - Коммутатор принимает пакет целиком и только потом отправляет дальше
      - Пакеты хранятся на сервере, пока получатель их не заберёт
    answer: 2
    explain: >
      Пакетный коммутатор должен сначала принять пакет целиком в буфер, проверить
      контрольную сумму и прочитать адрес назначения, и только потом решить, куда его
      передать. Копии на случай потери он не хранит, а подтверждения - забота конечных
      узлов.

  - q: Коммутатор выбросил пакет, потому что его буфер переполнен. Как это оценить?
    options:
      - Это авария: сеть с коммутацией пакетов не должна терять данные
      - Это нормальное поведение пакетной сети при перегрузке
      - Это признак того, что пакет был повреждён
      - Так бывает только в беспроводных сетях
    answer: 1
    explain: >
      Пакетная сеть ничего не гарантирует: при долгой перегрузке буферы переполняются,
      и новые пакеты выбрасываются. Это штатная ситуация, а восстанавливать потерянное
      будут протоколы на концах, например TCP. С повреждением пакета или типом сети
      это не связано.

  - q: Какой способ продвижения пакетов использует протокол IP?
    options:
      - Виртуальные каналы с метками
      - Логические соединения с нумерацией пакетов
      - Коммутацию каналов
      - Дейтаграммы: каждый пакет обрабатывается независимо
    answer: 3
    explain: >
      IP - дейтаграммный протокол: каждый пакет несёт полный адрес назначения и
      продвигается независимо, доставка по возможности (best effort). Логические
      соединения - это TCP, виртуальные каналы с метками - MPLS.

  - q: Чем виртуальный канал отличается от канала в сети с коммутацией каналов?
    options:
      - Ничем, это одно и то же
      - По нему идут отдельные пакеты, а не поток с постоянной скоростью
      - По нему данные идут без заголовков, как в телефонной сети
      - Виртуальный канал работает только внутри одного здания
    answer: 1
    explain: >
      В виртуальном канале закреплён маршрут, но по нему идут отдельные пакеты с метками,
      которые могут стоять в очередях. В коммутации каналов данные идут непрерывным
      потоком с постоянной скоростью по зарезервированному каналу.

  - q: В нашем замере пинг из Швеции до сервера в Токио не опускается ниже 250 мс даже на отличном канале. Что в первую очередь ограничивает задержку?
    options:
      - Слишком маленькая пропускная способность домашнего интернета
      - Медленная обработка пакетов в компьютере
      - Скорость распространения сигнала и длина пути
      - Шифрование трафика
    answer: 2
    explain: >
      Сигнал идёт по кабелю примерно со скоростью 200 000 км/с, а реальный путь до
      Японии - это многие тысячи километров кабелей, не по прямой. Это физический предел,
      который не исправить ни скоростью тарифа, ни мощностью компьютера. Маленький
      пакет пинга почти не зависит от пропускной способности.

  - q: Почему шифровать данные нужно на концах, а не полагаться на то, что узлы на пути честные?
    options:
      - Любой узел на пути держит пакет целиком и может его изменить
      - Транзитные узлы не умеют шифровать трафик
      - Шифрование на транзитных узлах слишком медленное и дорогое
      - Узлы на пути обычно принадлежат одному провайдеру
    answer: 0
    explain: >
      По принципу store-and-forward каждый узел на пути держит пакет целиком в своей
      памяти. Узлы принадлежат разным компаниям в разных странах, и проверить их
      честность невозможно. Поэтому доверять можно только конечным точкам и защищать
      данные шифрованием и проверкой подлинности на концах.

open_questions:
  - q: Объясни своими словами, почему интернет построен на коммутации пакетов, хотя пакетная сеть не даёт гарантий и в расчёте Олифера даже медленнее канальной для одного пользователя.
    reference: >
      Компьютерный трафик идёт всплесками с долгими паузами. В канальной сети канал
      закреплён за абонентом весь сеанс и в паузах простаивает, никто другой не может
      им воспользоваться. В пакетной сети ничего не резервируется, пакеты разных
      пользователей идут по общим линиям, их всплески накладываются на паузы друг друга,
      и линии почти всё время заняты полезной работой. Для одного пользователя с
      выделенным каналом пакеты могут быть медленнее: появляются расходы на заголовки,
      приём пакетов в буфер, очереди и интервалы между пакетами, которых нет у готового
      канала. Но в целом сеть обслуживает гораздо больше пользователей
      на тех же линиях. Это компромисс: эффективность для всех в обмен на гарантии
      для каждого.
    key_points:
      - компьютерный трафик идёт всплесками, закреплённый канал простаивает в паузах
      - в пакетной сети линии делятся между многими пользователями, всплески сглаживаются
      - для одного пользователя пакеты могут быть медленнее - появляются расходы, которых нет у готового канала
      - выигрыш - эффективность использования линий для всех, это компромисс

  - q: Из чего складывается задержка пакета на пути от отправителя к получателю? Какую из составляющих нельзя уменьшить никаким оборудованием и почему?
    reference: >
      Задержка складывается из времени передачи в линию (объём пакета делить на
      пропускную способность), времени распространения сигнала (расстояние делить на
      скорость сигнала, около 200 000 км/с), ожидания в очередях коммутаторов и обработки
      в узлах. Кроме того, из-за store-and-forward каждый коммутатор ждёт, пока пакет
      придёт целиком. Время распространения ограничено физикой: сигнал не может идти
      быстрее, чем позволяет среда, поэтому для заданного расстояния его не сократить,
      можно только сократить сам путь.
    key_points:
      - передача в линию - объём делить на скорость линии
      - распространение - расстояние делить на скорость сигнала
      - очереди и обработка в коммутаторах
      - распространение ограничено физикой, его не ускорить оборудованием

  - q: Ты выполнил tracepath до сайта и увидел 14 промежуточных узлов разных компаний. Что это значит для безопасности твоих данных и как это учитывают при построении защиты?
    reference: >
      Каждый из этих узлов по принципу store-and-forward получает пакет целиком в свою
      память и технически может его прочитать, изменить, задержать или выбросить, то есть
      нарушить конфиденциальность, целостность или доступность. Узлы принадлежат разным
      организациям, их честность проверить нельзя. Поэтому защиту строят на концах:
      шифрование и проверка подлинности между конечными точками (например, TLS), не
      полагаясь на доверие к пути. От задержки или уничтожения пакетов шифрование при
      этом не защищает.
    key_points:
      - каждый узел получает пакет целиком и может прочитать, изменить или выбросить
      - узлы принадлежат разным организациям, доверять им нельзя
      - защита строится на концах - шифрование и проверка подлинности (TLS)
      - шифрование не защищает доступность
