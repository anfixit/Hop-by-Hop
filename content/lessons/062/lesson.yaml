id: 62
title: "Разрешение имени: stub, рекурсивный резолвер, root, TLD, authoritative"
status: published
summary: >
  Кто на самом деле находит адрес по имени: stub-резолвер ОС, рекурсивный
  резолвер, корневые серверы, серверы TLD и авторитетные серверы. Рекурсивные и
  итеративные запросы, подсказки корня и priming, кэш и TTL, QNAME-минимизация,
  транспорт. На практике - свой резолвер BIND над корнем и зонами из урока 61:
  журналы запросов каждого сервера, ответ из кэша, dig +trace, отказ в рекурсии.
  Безопасность: разделение ролей и закрытые резолверы.

quiz:
  - q: Что делает stub-резолвер, получив запрос приложения?
    options:
      - Сам обходит корень, TLD и авторитетные серверы
      - Отправляет рекурсивный запрос одному резолверу
      - Ищет имя только в файле /etc/hosts и больше нигде
      - Рассылает запрос широковещательно по всей сети
    answer: 1
    explain: >
      Stub по дереву не ходит: он отправляет запрос с флагом rd настроенному
      резолверу и ждёт окончательного ответа. В опыте getent получил адрес, а
      резолвер получил от клиента один вопрос.

  - q: Как сервер отвечает на итеративный запрос?
    options:
      - Переадресует запрос другому резолверу сети
      - Отвечает только по протоколу TCP, порт 53
      - Отдаёт то, что знает, - ответ или направление
      - Обязан найти окончательный ответ за клиента
    answer: 2
    explain: >
      На итеративный запрос (без rd) сервер отвечает тем, что знает: ответом или
      направлением. Найти окончательный ответ просит рекурсивный запрос.
      Резолвер обходит дерево итеративными запросами.

  - q: Что такое priming?
    options:
      - Запрос актуального списка корневых серверов
      - Повторный запрос имени перед истечением TTL
      - Проверка подписей корневой зоны при старте
      - Регистрация резолвера у корневых серверов
    answer: 0
    explain: >
      Файл подсказок может устареть, поэтому резолвер спрашивает у одного из
      корневых серверов актуальный список (NS для "."). В опыте корень получил
      вопрос ". IN NS".

  - q: Какую часть имени www.corp.lab резолвер сообщил корню?
    options:
      - Полное имя www.corp.lab
      - Только corp.lab, вопрос NS
      - Ничего, корень не опрашивался
      - Только метку lab, вопрос NS
    answer: 3
    explain: >
      Резолвер сообщает каждому серверу только ту часть имени, которая нужна для
      направления: корню - lab, серверу lab. - corp.lab, и только авторитетному
      серверу - полное имя. Служебные вопросы об адресах серверов имён при этом
      ушли полными именами.

  - q: Почему при повторном запросе ни один авторитетный сервер не получил вопроса?
    options:
      - Резолвер ответил из кэша, TTL ещё не истёк
      - Авторитетные серверы отключились после ответа
      - Клиент запомнил ответ и не отправлял запрос
      - Повторные запросы блокирует файервол
    answer: 0
    explain: >
      Резолвер хранит ответы и направления столько, сколько разрешает TTL. В
      опыте TTL в ответе был 3598: оставшееся время жизни записи в кэше.

  - q: Что означают флаги ответа "qr rd ra" без aa?
    options:
      - Ответ дал авторитетный сервер зоны
      - Ответ взят из файла /etc/hosts клиента
      - Ответ дал корень, рекурсия запрещена
      - Ответ дал резолвер, рекурсия доступна
    answer: 3
    explain: >
      ra - recursion available: так отвечает рекурсивный резолвер. Флага aa нет,
      потому что резолвер не авторитетен для зоны, он лишь нашёл ответ.

  - q: Как ответил авторитетный сервер corp.lab. на вопрос о чужом имени с rd?
    options:
      - Нашёл адрес и вернул его с флагом aa
      - Переслал вопрос корневому серверу
      - Отказал, REFUSED, рекурсии у него нет
      - Вернул направление на корневой сервер
    answer: 2
    explain: >
      Авторитетный сервер с recursion no отвечает только про свои зоны. dig
      предупредил: рекурсию просили, но она недоступна.

  - q: Почему открытый резолвер считается ошибкой конфигурации?
    options:
      - Он отвечает медленнее закрытого резолвера
      - Его используют для атак с усилением
      - Он не умеет кэшировать ответы серверов
      - Он не поддерживает QNAME-минимизацию
    answer: 1
    explain: >
      Резолвер, отвечающий всем, превращает маленький запрос с подделанным
      адресом отправителя в большой ответ жертве. Рекурсию ограничивают своей
      сетью, как allow-recursion в опыте: чужой клиент получил REFUSED.

open_questions:
  - q: Опиши путь от вызова getaddrinfo до адреса, когда кэш резолвера пуст.
    reference: >
      Приложение вызывает getaddrinfo, stub-резолвер libc отправляет рекурсивный
      запрос (rd) резолверу из /etc/resolv.conf. Резолвер берёт адреса корня из
      подсказок (и обновляет их запросом NS для "."), спрашивает корень и получает
      направление на серверы TLD, спрашивает TLD и получает направление на
      авторитетные серверы зоны, спрашивает их и получает ответ с aa. При
      QNAME-минимизации каждому серверу сообщается только нужная часть имени.
      Резолвер кэширует всё на TTL и возвращает клиенту окончательный ответ с ra.
    key_points:
      - stub и рекурсивный запрос
      - подсказки корня и priming
      - итеративный обход корень, TLD, авторитетный
      - кэш и QNAME-минимизация

  - q: Чем авторитетный сервер отличается от рекурсивного резолвера и почему их разделяют?
    reference: >
      Авторитетный сервер хранит зоны и отвечает про них всем (флаг aa), рекурсию
      не выполняет. Резолвер обычно не хранит своих зон, а ищет ответы по дереву для своих
      клиентов и кэширует их (флаг ra). Роли разделяют, потому что у них разные
      правила доступа: авторитетный должен быть открыт всему интернету, а резолвер
      - только своим. Совмещённый открытый сервер можно использовать для атак с
      усилением и попыток испортить общий кэш.
    key_points:
      - aa и ra
      - зоны против кэша
      - разные правила доступа
      - открытый резолвер опасен

  - q: Что можно увидеть с помощью dig +trace и чем это полезно?
    reference: >
      dig +trace сам выполняет работу резолвера: берёт список корневых серверов
      у настроенного резолвера и дальше идёт по дереву итеративно, показывая
      ответ каждого уровня - направление корня, направление TLD, окончательный
      ответ авторитетного сервера. Так видно, на каком уровне ломается
      разрешение: неверное делегирование, недоступный сервер, нет записи.
    key_points:
      - dig сам обходит дерево
      - ответ каждого уровня
      - поиск места поломки
