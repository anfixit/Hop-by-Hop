<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Как резолвер находит www.corp.lab</text>
  <g font-size="16" fill="#0E1830">
    <rect x="40" y="110" width="220" height="70" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="150" y="141" text-anchor="middle" font-weight="bold">приложение</text><text x="150" y="164" text-anchor="middle" font-size="13">браузер, curl, ssh</text>
    <rect x="40" y="260" width="220" height="80" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><text x="150" y="292" text-anchor="middle" font-weight="bold">stub-резолвер</text><text x="150" y="316" text-anchor="middle" font-size="13">libc: getaddrinfo</text>
    <rect x="410" y="240" width="260" height="120" rx="12" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/><text x="540" y="274" text-anchor="middle" font-weight="bold">рекурсивный резолвер</text><text x="540" y="300" text-anchor="middle" font-size="13">кэш на TTL</text><text x="540" y="322" text-anchor="middle" font-size="13">подсказки корня</text><text x="540" y="344" text-anchor="middle" font-size="13">рекурсия только для своих</text>
    <rect x="900" y="80" width="260" height="80" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="1030" y="113" text-anchor="middle" font-weight="bold">корень "."</text><text x="1030" y="138" text-anchor="middle" font-size="13">знает только TLD</text>
    <rect x="900" y="260" width="260" height="80" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1030" y="293" text-anchor="middle" font-weight="bold">сервер TLD lab.</text><text x="1030" y="318" text-anchor="middle" font-size="13">знает свои делегирования</text>
    <rect x="900" y="440" width="260" height="80" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="1030" y="473" text-anchor="middle" font-weight="bold">авторитетный corp.lab.</text><text x="1030" y="498" text-anchor="middle" font-size="13">знает ответ</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="150" y1="180" x2="150" y2="258"/>
    <line x1="262" y1="285" x2="408" y2="285"/>
    <line x1="408" y1="320" x2="262" y2="320"/>
    <line x1="672" y1="260" x2="898" y2="125"/>
    <line x1="672" y1="300" x2="898" y2="300"/>
  </g>
  <line x1="672" y1="340" x2="898" y2="475" stroke="#15803D" stroke-width="2.5"/>
  <g fill="#475569"><polygon points="143,246 157,246 150,258"/><polygon points="396,279 396,291 408,285"/><polygon points="274,314 274,326 262,320"/><polygon points="898,125 890.8,136.3 884.6,126.1"/><polygon points="886,294 886,306 898,300"/></g>
  <polygon points="898,475 884.6,473.9 890.8,463.7" fill="#15803D"/>
  <g font-size="14" fill="#0E1830">
    <text x="335" y="276" text-anchor="middle">1. www.corp.lab? rd</text>
    <text x="335" y="342" text-anchor="middle">5. 10.0.0.80, ra</text>
    <text x="700" y="160" font-family="monospace" font-size="13">2. lab NS?</text>
    <text x="790" y="215" font-size="13" fill="#B91C1C">направление</text>
    <text x="700" y="290" font-family="monospace" font-size="13">3. corp.lab NS?</text>
    <text x="790" y="322" font-size="13" fill="#2563EB">направление</text>
    <text x="640" y="430" font-family="monospace" font-size="13">4. www.corp.lab A?</text>
    <text x="760" y="455" font-size="13" fill="#15803D">ответ, aa</text>
  </g>
  <rect x="40" y="420" width="560" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-size="15" fill="#0E1830">
    <text x="60" y="452"><tspan font-weight="bold">1 и 5:</tspan> рекурсивный запрос и ответ.</text>
    <text x="60" y="480"><tspan font-weight="bold">2-4:</tspan> итеративные запросы, без rd.</text>
    <text x="60" y="508"><tspan font-weight="bold">QNAME-минимизация:</tspan> каждому серверу -</text>
    <text x="60" y="530">только нужная ему часть имени.</text>
    <text x="60" y="558"><tspan font-weight="bold">Кэш:</tspan> в следующий раз - сразу шаг 5.</text>
  </g>
</svg>
