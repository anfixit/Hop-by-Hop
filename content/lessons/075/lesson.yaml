id: 75
title: "HTTP/1.1: запросы, ответы, заголовки"
status: published
summary: >
  Как устроен HTTP/1.1: URL, запрос-ответ поверх TCP, формат сообщений
  (стартовая строка, заголовки, пустая строка, тело, CR LF), методы и их
  безопасность и идемпотентность, коды состояния, важные заголовки, постоянные
  соединения, кэширование с ETag и 304, передача частями, cookies. На практике -
  свой сервер HTTP/1.1 в пространстве имён, запрос руками через /dev/tcp, curl,
  keep-alive, условный запрос, chunked, cookies и tcpdump. Безопасность: что
  утекает в открытом HTTP.

quiz:
  - q: Что отделяет заголовки HTTP-сообщения от тела?
    options:
      - Заголовок Content-Type
      - Пустая строка из одного CR LF
      - Символ точки с запятой
      - Новое TCP-соединение
    answer: 1
    explain: >
      После заголовков идёт пустая строка (только CR LF), затем тело. В опыте
      cat -A показал её как ^M$ без текста.

  - q: Зачем в HTTP/1.1 обязателен заголовок Host?
    options:
      - На одном адресе работает много сайтов
      - Без него нельзя открыть TCP-соединение
      - Он содержит адрес клиента для ответа
      - Он нужен только для соединений HTTPS
    answer: 0
    explain: >
      На уровне HTTP именно Host говорит серверу, какой из сайтов на адресе нужен. В опыте запрос без него
      получил 400 Bad Request.

  - q: Какой метод идемпотентен, но не безопасен?
    options:
      - GET
      - POST
      - PUT
      - HEAD
    answer: 2
    explain: >
      PUT меняет ресурс, но повтор даёт тот же результат. GET и HEAD безопасны,
      POST ни безопасен, ни идемпотентен.

  - q: Что означает ответ 304 Not Modified?
    options:
      - Ресурс навсегда переехал по новому адресу
      - Клиенту запрещён доступ к ресурсу
      - Сервер временно перегружен запросами
      - Копия у клиента ещё годится, тело не нужно
    answer: 3
    explain: >
      Ответ на условный запрос с If-None-Match или If-Modified-Since. В опыте
      пришёл 304 и 0 байт тела.

  - q: Как получатель узнаёт конец тела ответа при keep-alive?
    options:
      - По Content-Length или частям chunked
      - По закрытию TCP-соединения сервером
      - По специальному символу в конце тела
      - По таймауту в одну секунду после данных
    answer: 0
    explain: >
      Соединение остаётся открытым, поэтому длина задаётся явно: Content-Length
      или передача частями с завершающей частью нулевой длины.

  - q: Что показал опыт с двумя запросами в одном вызове curl?
    options:
      - Каждый запрос открыл своё TCP-соединение
      - Второй запрос пошёл по тому же соединению
      - Второй запрос был сразу отклонён сервером
      - Оба запроса ушли в одном TCP-сегменте
    answer: 1
    explain: >
      Для второго запроса не открылось ни одного нового соединения, и порт клиента
      тот же: HTTP/1.1 держит соединение открытым.

  - q: Чем является заголовок Authorization с Basic-аутентификацией?
    options:
      - Подписью запроса закрытым ключом
      - Хешем пароля с солью от сервера
      - Логином и паролем в кодировке base64
      - Одноразовым кодом из приложения TOTP
    answer: 2
    explain: >
      Это кодирование, а не шифрование: в опыте base64 -d сразу дал
      student:demo123. Без TLS пароль идёт открытым текстом.

  - q: Что делает атрибут Secure у cookie?
    options:
      - Шифрует cookie на диске браузера
      - Запрещает скриптам страницы читать cookie
      - Не отправляет cookie на чужие сайты
      - Отправляет cookie только по HTTPS
    answer: 3
    explain: >
      Secure не даёт cookie уйти открытым текстом. Недоступность для скриптов -
      HttpOnly, ограничение отправки с чужих сайтов - SameSite.

open_questions:
  - q: Опиши формат запроса и ответа HTTP/1.1.
    reference: >
      Стартовая строка (в запросе - метод, путь, версия; в ответе - версия, код,
      фраза), заголовки вида "Имя: значение", пустая строка и необязательное тело.
      Строки оканчиваются CR LF. Длина тела - Content-Length или передача частями
      (Transfer-Encoding: chunked). В HTTP/1.1 обязателен Host, соединение по
      умолчанию постоянное.
    key_points:
      - стартовая строка
      - заголовки и пустая строка
      - Content-Length или chunked
      - Host и keep-alive

  - q: Как работают кэширование и cookies в HTTP?
    reference: >
      Кэш хранит ответы, пока они свежие (Cache-Control: max-age). Потом он задаёт
      условный запрос с If-None-Match (версия из ETag) или If-Modified-Since; если
      ресурс не изменился, сервер отвечает 304 без тела. Cookies добавляют
      состояние: сервер присылает Set-Cookie, браузер возвращает Cookie в
      следующих запросах к сайту - так работают сеансы и, увы, слежка.
    key_points:
      - max-age и свежесть
      - ETag, If-None-Match, 304
      - Set-Cookie и Cookie

  - q: Что утекает в открытом HTTP и как от этого защищаться?
    reference: >
      Любой узел на пути видит и может изменить путь с параметрами, заголовки,
      cookies сеансов, пароли (Basic - лишь base64) и содержимое; украденный
      cookie даёт вход без пароля. Защита: только HTTPS с перенаправлением с HTTP,
      HSTS, атрибуты cookies Secure, HttpOnly и SameSite, никаких секретов в URL и
      никакой Basic-аутентификации без TLS.
    key_points:
      - видно и изменяемо всё
      - кража cookie сеанса
      - HTTPS и HSTS
      - флаги cookies
