id: 29
title: "DHCP: как компьютер получает адрес и настройки"
status: published
summary: >
  Как компьютер без адреса находит DHCP-сервер и получает адрес, маску, шлюз и DNS:
  сообщения Discover, Offer, Request и ACK, аренда, продление, ретранслятор, режимы
  сервера и влияние динамических адресов на файервол. На практике - сервер и два
  клиента в пространствах имён: пакеты в tcpdump, продление аренды, закреплённый
  адрес. Как DHCP используют во вред (принципы) и как его защищают: snooping,
  доверенные порты, ограничения на порту, 802.1X.

quiz:
  - q: Почему первое сообщение DHCP клиент отправляет с адреса 0.0.0.0 на 255.255.255.255?
    options:
      - Адрес 0.0.0.0 зарезервирован для шлюза по умолчанию
      - Сервер принимает запросы только с широковещательных адресов
      - У клиента ещё нет адреса и он не знает адреса сервера
      - Так маршрутизаторы быстрее доставляют пакет серверу
    answer: 2
    explain: >
      У клиента нет своего адреса, а адреса сервера он не знает. Поэтому он использует
      "нулевой" адрес отправителя и ограниченное широковещание, которое получают все
      узлы его сети.

  - q: Какие порты использует DHCP?
    options:
      - UDP 67 у сервера и UDP 68 у клиента
      - TCP 67 у сервера и TCP 68 у клиента
      - UDP 53 у сервера и UDP 68 у клиента
      - UDP 67 у клиента и UDP 68 у сервера
    answer: 0
    explain: >
      DHCP работает поверх UDP: сервер слушает порт 67, клиент порт 68. Эти порты он
      унаследовал от BOOTP.

  - q: В каком порядке идут сообщения при получении адреса?
    options:
      - Request, Offer, Discover, ACK
      - Offer, Discover, ACK, Request
      - Discover, Request, Offer, ACK
      - Discover, Offer, Request, ACK
    answer: 3
    explain: >
      Клиент ищет сервер (Discover), сервер предлагает адрес (Offer), клиент принимает
      предложение (Request), сервер подтверждает (ACK).

  - q: Зачем клиент отправляет Request широковещательно, если сервер уже выбран?
    options:
      - Чтобы другие серверы вернули свои адреса в пулы
      - Чтобы шлюз по умолчанию узнал MAC-адрес клиента
      - Чтобы маршрутизатор запомнил адрес клиента у себя
      - Потому что стандарт запрещает unicast в DHCP
    answer: 0
    explain: >
      В Request указано, чьё предложение принято. Остальные серверы, получив его, узнают,
      что выбраны не они, и освобождают адреса, которые предлагали. Unicast в DHCP
      используется, например, при продлении аренды.

  - q: Как по умолчанию (RFC 2131) клиент продлевает аренду на половине срока?
    options:
      - Широковещательно ищет любой другой сервер сети
      - Заново проходит все четыре шага с сообщения Discover
      - Отправляет Request напрямую выдавшему серверу
      - Отправляет ICMP-запрос шлюзу по умолчанию
    answer: 2
    explain: >
      По умолчанию на 50% срока (T1) клиент отправляет Request напрямую выдавшему серверу.
      Широковещательный поиск любого сервера начинается только на 87,5% (T2), если
      прежний не отвечает.

  - q: Что даёт динамическое распределение адресов с ограниченным сроком аренды?
    options:
      - Можно обслужить больше устройств, чем адресов в пуле
      - Клиент получает один и тот же адрес при каждом входе
      - Адреса могут повторяться, зато сеть работает быстрее
      - Сервер не нужен, клиенты договариваются между собой
    answer: 0
    explain: >
      Адрес возвращается в пул, когда клиент уходит или аренда истекает. У Олифера
      500 мобильных сотрудников обходятся пулом из 64 адресов, так как одновременно в офисе
      их не больше 50.

  - q: Зачем нужен DHCP-ретранслятор (relay)?
    options:
      - Чтобы шифровать сообщения DHCP между клиентом и сервером
      - Чтобы клиент мог выбирать из нескольких серверов сам
      - Чтобы сервер узнавал MAC-адреса клиентов в других сетях
      - Чтобы один сервер обслуживал клиентов нескольких сетей
    answer: 3
    explain: >
      Широковещательные запросы не проходят через маршрутизатор. Ретранслятор принимает их
      и передаёт обычным пакетом серверу в другой сети, дописав адрес своего интерфейса,
      и один сервер обслуживает много сетей.

  - q: Как DHCP snooping защищает от постороннего DHCP-сервера?
    options:
      - Шифрует сообщения и проверяет подпись сервера
      - Отсекает ответы сервера с недоверенных портов
      - Сам раздаёт адреса вместо остальных серверов
      - Выдаёт адреса только клиентам со статическими записями
    answer: 1
    explain: >
      Порты коммутатора делят на доверенные (к ним подключён настоящий сервер или
      ретранслятор) и недоверенные (пользовательские). Ответы сервера с недоверенных
      портов отбрасываются. Шифрования и подписей в DHCP при этом нет.

open_questions:
  - q: Опиши, как компьютер получает адрес по DHCP, и объясни, почему первые сообщения широковещательные.
    reference: >
      У клиента нет адреса, а адреса сервера он не знает. Он отправляет Discover с адреса
      0.0.0.0 (по RFC 2131) на 255.255.255.255 (UDP, порт клиента 68, сервера 67), и его получают все
      узлы сети. Серверы отвечают сообщениями Offer с предлагаемым адресом и параметрами
      (маска, шлюз, DNS, срок аренды). Клиент выбирает одно предложение и отправляет
      Request; он тоже широковещательный, чтобы остальные серверы узнали, что выбраны не
      они, и вернули адреса в пулы. Выбранный сервер отвечает ACK, после чего клиент
      настраивает интерфейс.
    key_points:
      - Discover с 0.0.0.0 на 255.255.255.255, порты 68 и 67
      - Offer с адресом и параметрами
      - Request широковещательно, остальные серверы освобождают адреса
      - ACK подтверждает, клиент настраивает интерфейс

  - q: Что такое аренда адреса в DHCP и как она продлевается?
    reference: >
      Адрес выдаётся не навсегда, а на срок аренды, иначе адреса ушедших из сети хостов
      были бы потеряны. По умолчанию на 50% срока клиент отправляет Request напрямую
      выдавшему серверу; получив ACK, он продлевает аренду. Если сервер молчит, на 87,5%
      срока клиент рассылает Request широковещательно, и ответить может любой сервер.
      Если срок вышел, а ответа нет, адрес нужно перестать использовать и начать с
      Discover. Срок выбирает администратор по режиму работы пользователей.
    key_points:
      - аренда на ограниченный срок, чтобы адреса возвращались в пул
      - примерно на половине срока Request прямо выдавшему серверу
      - позже широковещательно любому серверу
      - истёк срок - начать заново с Discover

  - q: Как злоупотребляют DHCP (на уровне принципа) и как это предотвращают?
    reference: >
      В DHCP нет проверки подлинности, а клиент обычно берёт первое пришедшее
      предложение, поэтому посторонний сервер в сети может определить клиенту шлюз и DNS, то
      есть путь трафика; пул адресов конечен, и поток выдуманных запросов может его
      исчерпать; сообщения открыты и раскрывают сведения о клиенте. Защита на
      коммутаторе: DHCP snooping с доверенными и недоверенными портами, таблица привязок,
      ограничение числа MAC-адресов и скорости запросов на порту, 802.1X, VLAN и
      отдельные пулы, короткая аренда в гостевых сетях, мониторинг пула и посторонних
      серверов, журнал аренд.
    key_points:
      - нет проверки подлинности, чужой сервер задаёт шлюз и DNS
      - пул можно исчерпать
      - DHCP snooping, доверенные порты
      - ограничения на порту, 802.1X, мониторинг и журнал
