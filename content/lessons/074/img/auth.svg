<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Аутентификация</text>
  <g font-size="15" fill="#0E1830">
    <rect x="40" y="75" width="360" height="210" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="60" y="105" font-weight="bold" font-size="18">Факторы</text>
    <text x="60" y="137">знание: пароль, PIN</text>
    <text x="60" y="163">владение: телефон, ключ</text>
    <text x="60" y="189">свойство: отпечаток, лицо</text>
    <text x="60" y="225">многофакторная - разные типы,</text>
    <text x="60" y="249">а не два пароля подряд</text>
    <rect x="420" y="75" width="360" height="210" rx="12" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/>
    <text x="440" y="105" font-weight="bold" font-size="18">Хранение паролей</text>
    <text x="440" y="137">уникальная соль на запись</text>
    <text x="440" y="163">медленная функция: Argon2id,</text>
    <text x="440" y="187">scrypt, bcrypt, PBKDF2</text>
    <text x="440" y="223" font-family="monospace" font-size="14">SHA-256: сотни тысяч в секунду</text>
    <text x="440" y="249" font-family="monospace" font-size="14">scrypt:  единицы в секунду</text>
    <rect x="800" y="75" width="360" height="210" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="820" y="105" font-weight="bold" font-size="18">Вызов-ответ</text>
    <text x="820" y="137">сервер: случайный вызов</text>
    <text x="820" y="163">клиент: HMAC(ключ, вызов)</text>
    <text x="820" y="189">ключ не идёт по сети</text>
    <text x="820" y="225">повтор старого ответа</text>
    <text x="820" y="249">не подходит к новому вызову</text>
    <rect x="40" y="310" width="540" height="230" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
    <text x="60" y="340" font-weight="bold" font-size="18">TOTP: код из секрета и времени</text>
    <text x="60" y="372" font-family="monospace" font-size="14">HMAC-SHA1(секрет, номер 30-с интервала) → 6 цифр</text>
    <text x="60" y="404">перехваченный код быстро устаревает</text>
    <text x="60" y="436">но поддельный сайт перешлёт его</text>
    <text x="60" y="460">на настоящий сразу же:</text>
    <text x="60" y="492" font-weight="bold" fill="#B91C1C">от фишинга не защищает</text>
    <rect x="620" y="310" width="540" height="230" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="640" y="340" font-weight="bold" font-size="18">FIDO2, passkeys</text>
    <text x="640" y="372">закрытый ключ на устройстве, свой для сайта</text>
    <text x="640" y="404">вход - подпись вызова сервера</text>
    <text x="640" y="436">браузер вписывает в подпись адрес сайта:</text>
    <text x="640" y="460">для подделки подпись не подойдёт</text>
    <text x="640" y="492" font-weight="bold" fill="#15803D">устойчиво к фишингу</text>
  </g>
</svg>
