id: 74
title: "Аутентификация: пароли, факторы, протоколы"
status: published
summary: >
  Аутентификация и авторизация, факторы и многофакторность, слабости паролей и их
  правильное хранение (соль, медленные функции, современные правила NIST),
  протоколы вызов-ответ, атака отражения, Kerberos и сертификаты, одноразовые коды
  HOTP и TOTP, фишингоустойчивые FIDO2 и passkeys. На практике - соль и формат
  /etc/shadow, цена проверки пароля для быстрых и медленных функций, вызов-ответ на
  HMAC и TOTP по тестовым векторам RFC 6238. Безопасность: перебор и утечки
  паролей.

quiz:
  - q: Что из этого настоящая двухфакторная аутентификация?
    options:
      - Пароль и ответ на контрольный вопрос
      - Пароль и код из приложения на телефоне
      - Два разных пароля подряд при входе
      - Пароль и PIN-код от той же учётной записи
    answer: 1
    explain: >
      Факторы должны быть разных типов: пароль - знание, телефон с секретом -
      владение. Пароль и контрольный вопрос - оба знание.

  - q: Зачем к паролю добавляют уникальную соль?
    options:
      - Чтобы одинаковые пароли давали разные хеши
      - Чтобы пароль стал длиннее для пользователя
      - Чтобы хеш нельзя было вычислить без сети
      - Чтобы соль служила вторым секретным ключом
    answer: 0
    explain: >
      В опыте без соли у Алисы и Боба хеши совпали, с солью - разные. Соль хранится
      открыто: ей нужно быть уникальной, а не секретной.

  - q: Почему пароли хранят медленными функциями вроде scrypt?
    options:
      - Они дают заметно более короткий хеш
      - Они позволяют восстановить исходный пароль
      - Каждая проверка пароля стоит дорого
      - Им совсем не требуется соль
    answer: 2
    explain: >
      В опыте SHA-256 проверял сотни тысяч паролей в секунду, scrypt и PBKDF2 -
      единицы, от силы десяток. Перебор миллиарда паролей превращается из минут
      в годы на одном ядре.

  - q: Что даёт схема вызов-ответ?
    options:
      - Пароль передаётся по сети в зашифрованном виде
      - Старый ответ подходит и для следующего входа
      - Клиент каждый раз отвечает одно и то же
      - Секрет не уходит в сеть, повтор не проходит
    answer: 3
    explain: >
      Клиент отвечает HMAC от случайного вызова. В опыте подслушанный ответ,
      повторённый на новый вызов, отвергнут.

  - q: Что такое атака отражения?
    options:
      - Противник заставляет сторону ответить на её же вызов
      - Противник подслушивает пароль в открытом трафике
      - Противник перебирает пароли по большому словарю
      - Противник подменяет сертификат настоящего сервера
    answer: 0
    explain: >
      Через параллельный сеанс противник получает от стороны ответ на её же
      вызов. Защита - разные ключи или вызовы для направлений, инициатор
      доказывает себя первым.

  - q: Из чего вычисляется код TOTP?
    options:
      - Из пароля пользователя и его логина
      - Из общего секрета и текущего времени
      - Из случайного числа, присланного по SMS
      - Из открытого ключа сервера
    answer: 1
    explain: >
      HMAC-SHA1 от номера 30-секундного интервала на общем секрете с усечением до
      цифр. В опыте коды совпали с тестовыми векторами RFC 6238.

  - q: Почему TOTP не защищает от фишинга?
    options:
      - Код можно вычислить по логину и почте
      - Код действует несколько дней подряд
      - Поддельный сайт сразу перешлёт код
      - Код передаётся вовсе без шифрования
    answer: 2
    explain: >
      Пользователь вводит код на поддельном сайте, а тот за секунды использует его
      на настоящем. FIDO2 и passkeys привязаны к адресу сайта и от этого защищены.

  - q: Что советуют современные правила NIST о паролях?
    options:
      - Менять пароль каждые 30 дней
      - Обязательно заглавная, цифра и символ
      - Блокировать вход после трёх ошибок навсегда
      - Длинные фразы и проверка по спискам утечек
    answer: 3
    explain: >
      SP 800-63B: не требовать смены без признаков утечки, не навязывать правила
      состава, разрешать длинные пароли, проверять по спискам утёкших и
      ограничивать частоту попыток.

open_questions:
  - q: Как правильно хранить пароли пользователей и почему?
    reference: >
      Не открыто и не быстрым хешем, а медленной функцией выработки ключа
      (Argon2id, scrypt, bcrypt, PBKDF2 с большим числом итераций) с уникальной
      случайной солью на запись. Соль делает хеши одинаковых паролей разными и
      обесценивает заранее вычисленные таблицы, медленная функция делает каждую
      проверку дорогой: в опыте SHA-256 давал сотни тысяч проверок в секунду, а
      scrypt - единицы, и перебор утёкшей базы растягивается на годы на ядро; видеокарты ускоряют
      перебор, но для медленных функций он остаётся в сотни тысяч раз дороже.
    key_points:
      - медленная функция
      - уникальная соль
      - цена перебора после утечки

  - q: Сравни пароль, TOTP и FIDO2 по устойчивости к перехвату и фишингу.
    reference: >
      Пароль многоразовый: перехваченный или выманенный работает, пока его не
      сменят. TOTP - код из общего секрета и времени, перехваченный быстро
      устаревает, но поддельный сайт может сразу переслать его на настоящий.
      FIDO2 и passkeys - подпись вызова закрытым ключом, привязанная к адресу
      сайта; секрет не покидает устройство, и подпись для поддельного сайта не
      подойдёт настоящему.
    key_points:
      - многоразовый пароль
      - TOTP и пересылка кода
      - привязка FIDO2 к сайту

  - q: Почему протоколы аутентификации трудно спроектировать правильно?
    reference: >
      Даже простая схема вызов-ответ может иметь тонкие дыры: укороченный протокол
      взаимной аутентификации ломается атакой отражения через параллельный сеанс.
      Нужны правила: инициатор доказывает себя первым, разные ключи или наборы
      вызовов для направлений, устойчивость к параллельным сеансам, защита от
      повтора одноразовыми числами и метками времени. Поэтому используют
      проверенные протоколы - Kerberos, TLS с сертификатами, FIDO2.
    key_points:
      - атака отражения
      - правила проектирования
      - nonce и метки времени
      - проверенные протоколы
