id: 60
title: "IDS/IPS, NetFlow, аудит, сегментация сети и DMZ"
status: published
summary: >
  Как строят защиту вокруг файервола: сегментация сети на зоны и DMZ, учёт потоков
  NetFlow и IPFIX, аудит и журналы, системы обнаружения и предотвращения вторжений
  (сетевые и хостовые, сигнатурные и по аномалиям). На практике - три зоны вокруг
  файервола с политикой в nftables, проверка доступности, счётчики запретов как
  аудит и итоговые записи conntrack как записи потоков. Безопасность: принцип
  обнаружения, ложные срабатывания и эшелонированная защита.

quiz:
  - q: Что такое DMZ?
    options:
      - Зона без файервола для быстрых служб
      - Зона для служб, доступных извне
      - Внутренняя сеть администраторов
      - Резервный канал к провайдеру
    answer: 1
    explain: >
      В DMZ ставят серверы, к которым обращаются из интернета: сайт, почту,
      публичный DNS. Её отделяют от внутренней сети, чтобы взлом публичного
      сервера не открывал доступ внутрь.

  - q: Почему из DMZ во внутреннюю сеть правила строже, чем откуда бы то ни было?
    options:
      - Во внутренней сети нет файервола
      - Из DMZ идёт больше всего трафика
      - Серверы DMZ взламывают первыми
      - DMZ работает только по IPv6
    answer: 2
    explain: >
      Серверы DMZ доступны всему интернету, и именно их атакуют в первую очередь.
      Взломанный сервер не должен становиться мостом во внутреннюю сеть. В опыте
      из DMZ нельзя было ни к базе данных, ни в интернет: сайту это не нужно.

  - q: Какие сведения содержит запись потока NetFlow или IPFIX?
    options:
      - Адреса, порты, время, пакеты, байты
      - Полное содержимое каждого пакета потока
      - Пароли и куки, переданные в потоке
      - Только адрес получателя потока
    answer: 0
    explain: >
      Учёт потоков собирает метаданные: кто, с кем, когда и сколько, без
      содержимого. В опыте итоговая запись conntrack показала адреса, порт, пакеты
      и байты в обе стороны.

  - q: Почему учёт потоков стал главным способом видеть трафик сегодня?
    options:
      - Он работает быстрее файервола
      - Он заменяет все системы обнаружения атак
      - Он показывает пароли в трафике
      - Содержимое трафика почти всё зашифровано
    answer: 3
    explain: >
      TLS скрывает содержимое, и читать его на сетевом уровне нельзя, а метаданные
      потоков остаются видны и позволяют замечать необычные объёмы и направления.

  - q: Чем IPS отличается от IDS?
    options:
      - IPS сама блокирует подозрительное
      - IPS работает только на хосте
      - IPS только пишет журнал, без всяких тревог
      - IPS не анализирует трафик
    answer: 0
    explain: >
      IDS обнаруживает и поднимает тревогу. IPS стоит на пути трафика и блокирует
      сама. Плата - риск оборвать легитимное соединение при ложном срабатывании.

  - q: Чем поиск аномалий отличается от сигнатурного обнаружения?
    options:
      - Он ищет только уже известные атаки
      - Он сравнивает поведение с нормой
      - Он работает только с HTTPS
      - Он не даёт ложных срабатываний
    answer: 1
    explain: >
      Сигнатуры ловят известное, уверенно и конкретно. Поиск аномалий сравнивает
      поведение с нормой и замечает и новое, но тревога расплывчатая и ложных
      срабатываний больше.

  - q: Почему даже точная система обнаружения выдаёт в основном ложные тревоги?
    options:
      - Потому что она всегда настроена неправильно
      - Потому что сигнатуры устаревают за день
      - Потому что настоящие атаки редки
      - Потому что тревоги пишутся без проверки
    answer: 2
    explain: >
      Это ошибка базовой оценки, которую разбирает Таненбаум: событий много,
      атак мало, и даже небольшая доля ошибок даёт больше ложных тревог, чем
      настоящих. Поэтому систему настраивают под свою сеть и отсекают шум.

  - q: Как правильно хранить журналы событий безопасности?
    options:
      - Только на том узле, где созданы
      - Удалять их сразу после прочтения
      - Хранить без синхронизации времени
      - На отдельном защищённом сервере
    answer: 3
    explain: >
      Взломщик узла попытается стереть следы. Журналы отправляют на отдельный
      сервер, защищают от изменения, синхронизируют время на всех узлах и
      анализируют автоматически.

open_questions:
  - q: Как устроена сегментация с DMZ и какие правила действуют между зонами?
    reference: >
      Сеть делят на зоны с разным уровнем доверия, связи между ними идут только
      через файервол и только нужные. DMZ - зона для служб, доступных извне (сайт,
      почта, публичный DNS). Из внешней сети - только к службам DMZ на нужные
      порты; из внутренней сети - в DMZ и наружу, внутрь - только ответы; из DMZ
      внутрь - строже всего, в идеале ничего, и наружу тоже минимум: взломанный
      публичный сервер не должен становиться мостом. Серверы DMZ настраивают на
      минимум функций. Развитие идеи - микросегментация и zero trust.
    key_points:
      - зоны и связи только через файервол
      - DMZ для публичных служб
      - из DMZ внутрь и наружу - минимум
      - микросегментация и zero trust

  - q: Что такое учёт потоков (NetFlow, IPFIX) и как его можно получить в Linux?
    reference: >
      Поток - пакеты с одинаковыми адресами, портами и протоколом. Экспортёр
      (маршрутизатор, датчик) учитывает для каждого потока время, пакеты и байты и
      отправляет запись коллектору; анализатор ищет аномалии. Содержимое не
      учитывается - это метаданные, как телефонный счёт; поэтому учёт работает и
      для зашифрованного трафика. В Linux основа - записи conntrack со счётчиками
      (nf_conntrack_acct=1): при удалении записи conntrack -E выдаёт итог с
      пакетами и байтами в обе стороны; экспортёры NetFlow и IPFIX (softflowd,
      ipt_NETFLOW) ведут такой же учёт и отправляют записи коллектору.
    key_points:
      - поток и его поля
      - экспортёр, коллектор, анализатор
      - метаданные без содержимого
      - conntrack со счётчиками в Linux

  - q: Какие виды систем обнаружения вторжений бывают и в чём их главные трудности?
    reference: >
      IDS обнаруживает и предупреждает, IPS стоит на пути и блокирует. Сетевые
      смотрят на трафик (часто с зеркального порта), хостовые - на события и данные
      узла после расшифровки. Сигнатурные ловят известное, по аномалиям - отклонения
      от нормы, включая новое. Трудности: ложные срабатывания (атаки редки, и даже
      точная система тревожит в основном ложно), риск IPS оборвать легитимное
      соединение, шифрование скрывает содержимое от сетевых систем, сама система -
      ценная цель. Поэтому защиту строят слоями: сегментация, учёт потоков, журналы,
      IDS и хостовая защита, готовность действовать.
    key_points:
      - IDS и IPS, сетевые и хостовые
      - сигнатуры и аномалии
      - ложные срабатывания, шифрование
      - эшелонированная защита
