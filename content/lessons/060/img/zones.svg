<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Зоны, DMZ и наблюдение</text>
  <g font-size="15" fill="#0E1830">
    <rect x="30" y="200" width="230" height="110" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="145" y="235" text-anchor="middle" font-weight="bold">внешняя сеть</text><text x="145" y="262" text-anchor="middle" font-size="13">интернет</text>
    <rect x="480" y="200" width="240" height="110" rx="12" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/><text x="600" y="235" text-anchor="middle" font-weight="bold">файервол</text><text x="600" y="262" text-anchor="middle" font-size="13">политика между зонами</text><text x="600" y="284" text-anchor="middle" font-size="13">учёт потоков, журналы</text>
    <rect x="900" y="90" width="270" height="110" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1035" y="125" text-anchor="middle" font-weight="bold">DMZ</text><text x="1035" y="152" text-anchor="middle" font-size="13">публичный сайт, почта</text><text x="1035" y="174" text-anchor="middle" font-size="13">"бастионы": минимум функций</text>
    <rect x="900" y="310" width="270" height="110" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="1035" y="345" text-anchor="middle" font-weight="bold">внутренняя сеть</text><text x="1035" y="372" text-anchor="middle" font-size="13">рабочие места, база данных</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none"><line x1="260" y1="255" x2="480" y2="255"/><line x1="720" y1="235" x2="900" y2="150"/><line x1="720" y1="275" x2="900" y2="365"/></g>
  <g font-size="13">
    <text x="370" y="240" text-anchor="middle" fill="#15803D">→ DMZ только :80</text>
    <text x="370" y="280" text-anchor="middle" fill="#B91C1C">→ внутрь: нельзя</text>
    <text x="885" y="112" text-anchor="end" fill="#B91C1C">DMZ → внутрь: нельзя, наружу: минимум</text>
    <text x="885" y="415" text-anchor="end" fill="#15803D">изнутри → DMZ и наружу: можно</text>
  </g>
  <rect x="30" y="450" width="1140" height="90" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-size="15" fill="#0E1830">
    <text x="50" y="480"><tspan font-weight="bold">NetFlow / IPFIX:</tspan> кто, с кем, сколько - без содержимого.  <tspan font-weight="bold">Аудит:</tspan> журналы на отдельном сервере.</text>
    <text x="50" y="510"><tspan font-weight="bold">IDS:</tspan> обнаруживает и предупреждает.  <tspan font-weight="bold">IPS:</tspan> блокирует.  Ложные срабатывания - главная трудность.</text>
  </g>
</svg>