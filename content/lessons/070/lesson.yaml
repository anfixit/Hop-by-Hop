id: 70
title: "Хеш-функции, MAC, HMAC"
status: published
summary: >
  Криптографические хеш-функции: стойкость к прообразу, второму прообразу и
  коллизиям, лавинный эффект; MD5 и SHA-1 сломаны, SHA-2, SHA-3 и BLAKE2 в
  строю. Парадокс дней рождения и половинная стойкость к коллизиям. MAC и HMAC,
  почему не H(ключ || сообщение), сравнение за постоянное время. На практике -
  лавинный эффект, длины хешей, второй прообраз и коллизия 20-битного хеша, HMAC
  в Python и openssl, проверка файла sha256sum. Безопасность: атака "дней
  рождения".

quiz:
  - q: Что такое коллизия хеш-функции?
    options:
      - Хеш, который нельзя вычислить быстро
      - Сообщение, хеш которого равен нулю
      - Два разных сообщения с одинаковым хешем
      - Ошибка при подсчёте хеша файла
    answer: 2
    explain: >
      Стойкость к коллизиям означает, что такую пару нельзя найти. У MD5 и SHA-1
      коллизии уже найдены, поэтому они сломаны.

  - q: Сколько попыток нужно, чтобы найти коллизию n-битного хеша?
    options:
      - Около 2^n попыток
      - Около 2^(n/2) попыток
      - Около n попыток
      - Около n^2 попыток
    answer: 1
    explain: >
      Парадокс дней рождения: пар растёт квадратично. В опыте для 20-битного хеша
      коллизия нашлась за 610 попыток, а подделка под заданный хеш - за 349 981.

  - q: Что показал опыт с изменением одной цифры в тексте?
    options:
      - Различаются около половины бит хеша
      - Хеши совпали, ведь текст почти тот же
      - Хеши отличаются только одним байтом
      - Хеш стал вдвое длиннее прежнего
    answer: 0
    explain: >
      Лавинный эффект: различались 122 бита из 256. По хешам нельзя понять, что
      сообщения похожи.

  - q: Почему голый хеш не защищает от активного противника?
    options:
      - Хеш слишком короткий для проверки
      - Хеш нельзя вычислить для больших файлов
      - Хеш раскрывает содержимое сообщения
      - Противник пересчитает хеш для подмены
    answer: 3
    explain: >
      Хеш вычисляет кто угодно. Защищает MAC: тег из сообщения и секретного ключа
      может создать только владелец ключа, как HMAC в опыте.

  - q: Почему HMAC устроен как два вложенных хеша, а не H(ключ || сообщение)?
    options:
      - Наивная схема уязвима к удлинению текста
      - Два хеша дают вдвое более длинный тег
      - Вложенный хеш работает вдвое быстрее
      - Иначе тег нельзя проверить на сервере
    answer: 0
    explain: >
      У MD5, SHA-1, SHA-256 и SHA-512 по тегу H(ключ || m) можно вычислить тег
      для сообщения с дописанным концом без ключа. Внешний хеш HMAC это закрывает.

  - q: Зачем сравнивать теги функцией compare_digest?
    options:
      - Она быстрее обычного сравнения строк
      - Она сама вычисляет новый тег
      - Она сравнивает за постоянное время
      - Она шифрует тег перед сравнением
    answer: 2
    explain: >
      Обычное сравнение останавливается на первом несовпадении, и по времени
      ответа можно подбирать тег побайтно.

  - q: Какой хеш не следует использовать для безопасности?
    options:
      - SHA-256
      - SHA3-256
      - BLAKE2b
      - SHA-1
    answer: 3
    explain: >
      Для SHA-1 найдены практические коллизии (2017 и позже), как и для MD5.

  - q: Как защититься от атаки "дней рождения" при подписании документов?
    options:
      - Подписывать только PDF, а не текст
      - Брать длинный хеш и своё случайное поле
      - Хранить хеш рядом с самим документом
      - Использовать хеш покороче для скорости
    answer: 1
    explain: >
      256-битный хеш поднимает стойкость к коллизиям до 2^128, а своё случайное
      значение в подписываемом документе не даёт противнику заранее подготовить
      пару.

open_questions:
  - q: Какими свойствами должна обладать криптографическая хеш-функция?
    reference: >
      Хеш легко вычислить, результат фиксированной длины. Стойкость к нахождению
      прообраза (по хешу не найти данные), второго прообраза (под данное
      сообщение не подобрать другое с тем же хешем) и коллизий (не найти любые
      два сообщения с одним хешем). Лавинный эффект: изменение бита меняет около
      половины бит хеша. MD5 и SHA-1 уже не стойки к коллизиям, поэтому для безопасности не годятся.
    key_points:
      - прообраз и второй прообраз
      - коллизии
      - лавинный эффект
      - MD5 и SHA-1 сломаны

  - q: Объясни парадокс дней рождения и его значение для хешей.
    reference: >
      Чтобы найти совпадение с конкретным значением, нужно около 2^n попыток, а
      чтобы найти любую совпадающую пару, - около 2^(n/2), потому что пар растёт
      квадратично. Поэтому стойкость хеша к коллизиям - половина его длины. В
      опыте 20-битный хеш дал коллизию за 610 попыток. Противник, готовящий
      документы, может найти пару хорошего и плохого с одним хешем и подменить
      после подписи.
    key_points:
      - 2^n против 2^(n/2)
      - половинная стойкость
      - подмена подписанного документа

  - q: Чем MAC отличается от хеша и от цифровой подписи?
    reference: >
      Хеш вычисляет кто угодно, поэтому он не защищает от активного противника.
      MAC вычисляется из сообщения и общего секретного ключа: правильный тег может
      сделать только владелец ключа. HMAC - стандартная конструкция. Но ключ общий,
      и проверяющий сам может создать тег, поэтому MAC не доказывает авторство
      третьей стороне; это делает цифровая подпись с закрытым ключом.
    key_points:
      - хеш без ключа
      - MAC с общим ключом
      - HMAC
      - подпись для третьей стороны
