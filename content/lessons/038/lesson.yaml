id: 38
title: "Завершение TCP-соединения: FIN, RST и TIME-WAIT"
status: published
summary: >
  Почему закончить разговор не так просто, как кажется: асимметричный и симметричный разрыв,
  задача двух армий. Закрытие через FIN по направлениям, полузакрытое соединение, шесть
  состояний закрытия, зачем нужен TIME-WAIT и откуда "Address already in use". RST -
  когда он отправляется и чем опасен. Полуоткрытые соединения и keepalive. На практике -
  закрытие по шагам с состояниями, занятый порт, два вида сброса, исчезнувший
  собеседник. Подделка сегментов и сброс соединений посторонним - принцип и защита.

quiz:
  - q: Что означает сегмент с флагом FIN?
    options:
      - Соединение закрыто в обе стороны сразу
      - У отправителя больше нет данных
      - Получатель должен прекратить передачу
      - Предыдущий сегмент был получен с ошибкой
    answer: 1
    explain: >
      FIN закрывает только одно направление: отправитель больше ничего не передаст, но
      принимать может. Соединение закрыто, когда FIN отправили и получили подтверждение
      обе стороны.

  - q: Клиент отправил FIN и получил на него подтверждение, но FIN от сервера ещё не пришёл. Что может делать сервер?
    options:
      - Ничего, соединение уже разорвано
      - Только подтверждать сегменты клиента
      - Только отправить RST для закрытия
      - Продолжать передавать клиенту данные
    answer: 3
    explain: >
      Это полузакрытое соединение: клиент (состояние FIN-WAIT-2) больше не передаёт, но
      принимает. В опыте сервер отправил "bye" через полторы секунды после FIN клиента,
      и клиент его получил.

  - q: Одна сторона отправила FIN раньше другой. У кого после закрытия останется состояние TIME-WAIT?
    options:
      - У той, которая отправила FIN первой
      - У той, которая отправила FIN второй
      - У сервера, независимо от порядка
      - У обеих сторон одновременно
    answer: 0
    explain: >
      TIME-WAIT проходит тот, кто закрывал первым: он отправляет последнее
      подтверждение и должен быть готов повторить его. Закрывающий вторым удаляет запись
      сразу, как только получил подтверждение своего FIN.

  - q: Зачем нужно ожидание в состоянии TIME-WAIT?
    options:
      - Чтобы программа успела дочитать данные из буфера до конца
      - Чтобы сервер успел освободить память и записи соединений
      - Чтобы ответить на повторный FIN и переждать старые сегменты
      - Чтобы клиент мог быстро открыть такое же соединение заново
    answer: 2
    explain: >
      Последнее подтверждение может потеряться, и тогда на повторный FIN нужно
      ответить. Кроме того, за это время из сети исчезают задержавшиеся сегменты,
      которые могли бы попасть в новое соединение с теми же адресами и портами.

  - q: Сервер остановили и сразу запустили снова, он сообщил "Address already in use". Какая причина самая вероятная?
    options:
      - Порт занят записью в состоянии TIME-WAIT
      - Клиент ещё не получил подтверждение FIN
      - Порт заблокирован файерволом на сервере
      - В системе закончились свободные порты
    answer: 0
    explain: >
      Если сервер закрывал соединения первым, на его порту около минуты остаются записи
      в TIME-WAIT, и без параметра SO_REUSEADDR занять порт нельзя. Поэтому серверные
      программы ставят этот параметр перед bind.

  - q: Программа закрыла соединение, не прочитав данные, которые ей прислали. Что отправит ядро Linux?
    options:
      - FIN, как при обычном закрытии
      - Ничего, пока не истечёт таймер
      - Подтверждение с нулевым окном
      - RST вместо обычного FIN
    answer: 3
    explain: >
      Непрочитанные данные пропали, и отправитель должен об этом узнать, поэтому ядро
      сбрасывает соединение. Другая сторона получит ошибку "Connection reset by peer".

  - q: Сервер выключили из розетки. Клиент только ждёт данных и keepalive не включал. Когда он узнает об обрыве?
    options:
      - Сразу, ядро получит от сервера RST
      - Никогда, пока сам не начнёт слать
      - Через 60 секунд по TIME-WAIT
      - Через два времени жизни пакета
    answer: 1
    explain: >
      Выключенный узел ничего не отправит, а ожидающая сторона сама ничего не проверяет:
      соединение остаётся полуоткрытым. Обрыв обнаружат либо проверки keepalive, либо
      неудачные повторы, когда клиент попробует что-то отправить.

  - q: От чего TLS поверх TCP не защищает?
    options:
      - От чтения данных наблюдателем на пути
      - От вставки чужих данных в поток
      - От сброса соединения поддельным RST
      - От подмены данных в пути
    answer: 2
    explain: >
      TLS шифрует и удостоверяет данные, но заголовок TCP остаётся открытым и
      неподписанным. Наблюдатель на пути знает порты и номера и может отправить
      поддельный RST. Защищают от этого аутентификация сегментов (TCP-AO), туннель или
      QUIC.

open_questions:
  - q: Какие сегменты передаются при закрытии TCP-соединения и через какие состояния проходят стороны?
    reference: >
      Каждое направление закрывается отдельно. Сторона, закрывающая первой, отправляет
      FIN (состояние FIN-WAIT-1), получает подтверждение (FIN-WAIT-2) и ждёт FIN от
      другой стороны; в это время соединение полузакрыто, вторая сторона ещё может
      передавать данные. Вторая сторона после получения FIN находится в CLOSE-WAIT, а
      отправив свой FIN - в LAST-ACK. Первая сторона подтверждает чужой FIN и переходит
      в TIME-WAIT, вторая после этого подтверждения сразу удаляет запись. Обычно это
      четыре сегмента: FIN, ACK, FIN, ACK; ACK и FIN второй стороны могут слиться в
      один. FIN занимает один порядковый номер.
    key_points:
      - FIN закрывает одно направление, полузакрытое соединение
      - FIN-WAIT-1, FIN-WAIT-2, TIME-WAIT у закрывающего первым
      - CLOSE-WAIT, LAST-ACK у закрывающего вторым
      - четыре сегмента (или три), FIN занимает номер

  - q: Зачем нужен TIME-WAIT и чем FIN отличается от RST?
    reference: >
      TIME-WAIT - ожидание у стороны, закрывшей соединение первой (по стандарту два MSL,
      в Linux 60 секунд). Оно нужно, чтобы ответить на повторный FIN, если последнее
      подтверждение потерялось, и чтобы из сети исчезли старые сегменты, которые могли
      бы попасть в новое соединение с теми же адресами и портами. Следствие - ошибка
      "Address already in use" при быстром перезапуске сервера и параметр SO_REUSEADDR.
      FIN - вежливое закрытие одного направления с подтверждением, данные не теряются.
      RST обрывает соединение сразу в обе стороны, без подтверждений и без TIME-WAIT,
      данные в пути могут пропасть; он отправляется на закрытый порт, для неизвестного
      соединения, при закрытии с непрочитанными данными или при закрытии со сбросом.
    key_points:
      - ответить на повторный FIN
      - дать исчезнуть старым сегментам
      - FIN - одно направление, с подтверждением
      - RST - сразу, данные могут пропасть

  - q: Как посторонний может оборвать или подделать TCP-соединение и что от этого защищает?
    reference: >
      Сегмент TCP принимается по адресам, портам и порядковому номеру, подписи в
      заголовке нет. Посторонний вне пути должен угадать порты и номера; от него
      защищают случайные начальные номера и временные порты и строгая проверка по RFC
      5961: RST принимается только с точным номером, а на RST с номером в окне, но не
      точным, отправляется проверочное подтверждение (challenge ACK). Наблюдатель на пути (оператор, устройство
      фильтрации) видит все номера и может отправить поддельный RST обеим сторонам или
      вставить данные. От него защищает только криптография: TLS удостоверяет данные, но
      не спасает от сброса; аутентификация сегментов (TCP-AO), шифрованный туннель или
      QUIC защищают и само соединение.
    key_points:
      - нужны адреса, порты и номер в заголовке без подписи
      - вне пути - случайные номера и порты, RFC 5961
      - на пути - номера видны, поддельный RST
      - TLS защищает данные, но не от сброса; TCP-AO, туннель, QUIC
