id: 73
title: "Подписи, сертификаты, X.509, PKI, цепочка доверия"
status: published
summary: >
  Цифровая подпись и неотрицаемость, сертификат как подписанная связка имени и
  ключа, поля и расширения X.509 (subjectAltName, basicConstraints, keyUsage),
  удостоверяющие центры, корневые и промежуточные, цепочка доверия, отзыв (CRL,
  OCSP) и короткие сроки с ACME. На практике - своя мини-PKI на openssl,
  проверка цепочки, имени, срока и отзыва, TLS-сервер и клиент в пространстве
  имён. Безопасность: компрометация удостоверяющих центров, Certificate
  Transparency и CAA.

quiz:
  - q: Чем цифровая подпись отличается от MAC?
    options:
      - Подпись шифрует содержимое сообщения
      - Подпись всегда короче любого MAC
      - Подпись проверит любой с открытым ключом
      - Подпись обходится без хеш-функции
    answer: 2
    explain: >
      MAC вычисляется общим секретным ключом, и проверить его может только
      знающий ключ. Подпись создаёт владелец закрытого ключа, а проверяет любой -
      отсюда неотрицаемость.

  - q: Какое поле сертификата перечисляет имена, для которых он действует?
    options:
      - subjectAltName
      - issuer
      - basicConstraints
      - serialNumber
    answer: 0
    explain: >
      Браузеры проверяют имя по subjectAltName, а не по CN. В опыте там были
      www.corp.lab и corp.lab, и для bank.example проверка дала hostname mismatch.

  - q: Что означает ошибка unable to get local issuer certificate?
    options:
      - Сертификат сервера уже отозван центром
      - Имя сервера не совпадает с сертификатом
      - Срок действия сертификата истёк
      - Клиенту не хватает звена цепочки до корня
    answer: 3
    explain: >
      В опыте так было без промежуточного сертификата: связать сертификат сервера
      с корнем нельзя. Частая ошибка - сервер не присылает промежуточный.

  - q: Что означает basicConstraints CA:FALSE?
    options:
      - Сертификат не прошёл проверку подписи
      - Нельзя выпускать им другие сертификаты
      - Ключ нельзя использовать для подписи
      - Сертификат выдан без удостоверяющего центра
    answer: 1
    explain: >
      Сертификат сервера - конечный. У промежуточного УЦ в опыте было CA:TRUE с
      pathlen:0: он выдаёт сертификаты только конечным владельцам.

  - q: Почему корневой сертификат сервер не присылает?
    options:
      - Он хранится только у промежуточного УЦ
      - Он слишком велик для рукопожатия
      - Его запрещено передавать по сети
      - Он должен быть у клиента заранее
    answer: 3
    explain: >
      Доверие начинается с хранилища корней ОС или браузера. Присланный сервером
      корень ничего бы не доказал - его может прислать и посредник.

  - q: Почему индустрия сокращает сроки сертификатов?
    options:
      - Чтобы ограничить вред при ненадёжном отзыве
      - Чтобы быстрее росли продажи сертификатов
      - Короткие сертификаты меньше по размеру
      - Чтобы сертификаты работали без цепочки
    answer: 0
    explain: >
      Списки отзыва отстают, и клиенты часто их не проверяют. Короткий срок и
      автоматическое продление (ACME) быстрее выводят из строя украденные ключи.

  - q: Что даёт Certificate Transparency?
    options:
      - Шифрует сертификаты при передаче
      - Запрещает УЦ выпускать сертификаты
      - Делает выпуск видимым в журналах
      - Заменяет проверку цепочки доверия
    answer: 2
    explain: >
      Сертификаты записываются в открытые журналы, браузеры требуют подтверждения
      записи. Владелец домена видит любой выпуск на своё имя, как было с Symantec.

  - q: Чем опасна компрометация удостоверяющего центра?
    options:
      - Все сайты сразу перестают открываться
      - Он выпускает сертификат на любое имя
      - Ключи всех сайтов становятся известны
      - Отзываются все сертификаты в мире
    answer: 1
    explain: >
      Доверенный УЦ может подписать сертификат для чужого домена, и цепочка у
      клиента сойдётся. Так случилось с DigiNotar в 2011 году.

open_questions:
  - q: Как клиент проверяет сертификат сервера?
    reference: >
      Сервер присылает свой сертификат и промежуточные. Клиент строит цепочку до
      корня из своего хранилища, проверяя каждую подпись открытым ключом
      следующего звена. Проверяются сроки, имя в subjectAltName, ограничения
      basicConstraints (CA:TRUE у УЦ) и назначение ключей, при возможности - отзыв
      (CRL, OCSP). Строгий клиент при любой ошибке - unable to get local issuer, hostname
      mismatch, certificate has expired, certificate revoked - обрывает соединение;
      но проверку отзыва клиент может и пропустить.
    key_points:
      - цепочка до доверенного корня
      - сроки и имя в SAN
      - basicConstraints и keyUsage
      - отзыв

  - q: Почему отзыв сертификатов работает плохо и как с этим справляются?
    reference: >
      CRL публикуются периодически и отстают, OCSP раскрывает посещения и при
      недоступности клиенты часто продолжают работу; без явной проверки отзыв
      вообще не учитывается, как в опыте без -crl_check. Поэтому сроки
      сертификатов сокращаются (сейчас до 200 дней, к 2029 году до 47), продление
      автоматизируют протоколом ACME, а браузеры распространяют сведения об отзыве
      своими механизмами.
    key_points:
      - CRL отстаёт, OCSP и приватность
      - мягкий отказ
      - короткие сроки и ACME

  - q: Что такое компрометация УЦ и как от неё защищаются?
    reference: >
      Любой доверенный УЦ может выпустить сертификат на любое имя, поэтому взлом
      или ошибка одного центра (Comodo, DigiNotar 2011; Symantec) даёт посреднику
      подлинный на вид сертификат. Защита: Certificate Transparency - публичные
      журналы всех выпусков и их мониторинг, CAA в DNS, короткие сроки, удаление
      недобросовестных УЦ из хранилищ, закрепление ключей в собственных клиентах.
    key_points:
      - любой УЦ на любое имя
      - примеры инцидентов
      - CT и мониторинг
      - CAA, сроки, закрепление
