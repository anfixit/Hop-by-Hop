id: 27
title: "Фрагментация, MTU и Path MTU Discovery"
status: published
summary: >
  Что такое MTU и MTU пути, как IP делит пакет на фрагменты и собирает его у
  получателя (Identification, смещение в единицах по 8 байт, MF, DF), почему
  фрагментации стараются избегать и как работает Path MTU Discovery, включая
  "чёрные дыры" при заблокированном ICMP. На практике - узкий участок с MTU 1000:
  фрагменты в tcpdump, отказ маршрутизатора при DF и запомненный MTU пути. В
  безопасности - как безопасно обращаться с фрагментами.

quiz:
  - q: Что такое MTU пути (Path MTU)?
    options:
      - Самый большой MTU среди всех участков пути
      - Самый маленький MTU среди участков пути
      - Средний MTU всех участков пути
      - MTU первого участка после отправителя
    answer: 1
    explain: >
      Пакет должен пройти по каждому участку, поэтому решает самое узкое место: самый
      маленький MTU на пути.

  - q: Кто собирает фрагменты IP-пакета обратно?
    options:
      - Маршрутизатор на выходе из узкой сети
      - Каждый маршрутизатор на пути по очереди
      - Только получатель, которому шёл пакет
      - Коммутатор в сети получателя
    answer: 2
    explain: >
      Фрагментация в IP непрозрачная: фрагменты могут идти разными путями, поэтому
      маршрутизаторы их не собирают, это делает только получатель.

  - q: В опыте первый фрагмент нёс 976 байт данных, хотя влезало 980. Почему?
    options:
      - Данные фрагмента должны быть кратны 8 байтам
      - Четыре байта занимает контрольная сумма фрагмента
      - Маршрутизатор оставляет запас на опции IP
      - Так совпало случайно, размер выбирается произвольно
    answer: 0
    explain: >
      Смещение фрагмента хранится в единицах по 8 байт, поэтому данные каждого
      фрагмента, кроме последнего, кратны 8: из 980 байт получается 976.

  - q: Как получатель понимает, что фрагменты принадлежат одному пакету?
    options:
      - По одинаковому значению TTL
      - По одинаковой длине всех фрагментов
      - По порядку прихода фрагментов
      - По одному Identification и адресам
    answer: 3
    explain: >
      У всех фрагментов одного пакета одинаковые Identification, адреса отправителя и
      получателя и протокол. Длина и порядок прихода могут быть любыми.

  - q: Что делает маршрутизатор с пакетом с флагом DF, который не помещается в следующую сеть?
    options:
      - Делит его на фрагменты, не глядя на флаг
      - Отправляет его по другому, более широкому пути
      - Обрезает пакет до допустимого размера
      - Уничтожает и сообщает отправителю MTU по ICMP
    answer: 3
    explain: >
      DF запрещает фрагментацию. Маршрутизатор уничтожает пакет и отправляет ICMP
      "нужна фрагментация, но стоит DF" с MTU следующего участка, как в опыте.

  - q: Почему фрагментации стараются избегать?
    options:
      - Фрагменты не поддерживаются в IPv4
      - Потеря одного фрагмента губит весь пакет
      - Фрагменты всегда приходят не по порядку
      - Маршрутизаторы собирают каждый такой пакет
    answer: 1
    explain: >
      Если потерялся хотя бы один фрагмент, получатель выбрасывает все остальные. Если
      нужна надёжность, верхний уровень (например, TCP) отправит данные заново целиком.
      Плюс лишние заголовки и нагрузка на сборку.

  - q: Что такое "чёрная дыра" PMTU?
    options:
      - Маршрутизатор без маршрута по умолчанию
      - Сеть, в которой все пакеты теряются
      - Узкое место, скрытое блокировкой ICMP
      - Узел, который собирает все фрагменты в сети
    answer: 2
    explain: >
      Если ICMP-сообщения "нужна фрагментация" блокируются по пути, отправитель не
      узнаёт о малом MTU: маленькие пакеты проходят, большие молча пропадают, и
      соединение зависает.

  - q: Какая мера делает обработку фрагментов на межсетевом экране безопаснее?
    options:
      - Собирать пакет из фрагментов перед проверкой
      - Проверять каждый фрагмент отдельно, не собирая
      - Разрешать все фрагменты, кроме первого
      - Блокировать все ICMP-сообщения на границе
    answer: 0
    explain: >
      Решение нужно принимать по целому пакету, поэтому фрагменты собирают до проверки
      (в Linux это делает модуль дефрагментации, на который опирается conntrack). Блокировка всего ICMP, наоборот, ломает Path MTU
      Discovery.

open_questions:
  - q: Объясни, как работает фрагментация в IP и какие поля заголовка для этого нужны.
    reference: >
      Если пакет не помещается в MTU следующей сети и не стоит DF, маршрутизатор (или
      сам отправитель) делит его на фрагменты, каждый с полным заголовком IP. Во всех фрагментах одинаковый
      Identification; смещение показывает положение данных фрагмента в исходном пакете
      в единицах по 8 байт, поэтому данные всех фрагментов, кроме последнего, кратны 8;
      флаг MF стоит у всех фрагментов, кроме последнего. Маршрутизаторы фрагменты не
      собирают, собирает только получатель. Если какой-то фрагмент не пришёл до истечения
      таймера, весь пакет выбрасывается.
    key_points:
      - деление на маршрутизаторе, полный заголовок у каждого фрагмента
      - Identification, смещение в единицах по 8 байт, MF
      - сборка только у получателя
      - потеря фрагмента губит весь пакет

  - q: Как работает Path MTU Discovery и что может ему помешать?
    reference: >
      Отправитель ставит в пакетах флаг DF. Если на пути узкое место, маршрутизатор
      уничтожает пакет и отправляет ICMP-сообщение "нужна фрагментация, но стоит DF" с
      MTU следующего участка. Отправитель запоминает этот MTU для получателя (в Linux на
      10 минут) и отправляет пакеты меньше. Если ICMP-сообщения блокируются по пути,
      отправитель не узнаёт о малом MTU: большие пакеты молча пропадают, соединения
      зависают (чёрная дыра PMTU). Лечится пропуском нужных ICMP и уменьшением MSS на
      маршрутизаторах и VPN-шлюзах.
    key_points:
      - DF в пакетах отправителя
      - ICMP "нужна фрагментация" с MTU, отправитель запоминает
      - блокировка ICMP создаёт чёрную дыру
      - пропуск ICMP и MSS clamping

  - q: Как безопасно обращаться с фрагментами в сети?
    reference: >
      Межсетевой экран должен принимать решение по целому пакету, поэтому фрагменты
      собирают до проверки (в Linux - модуль дефрагментации, на который опирается conntrack). Фрагменты с противоречивыми или
      перекрывающимися данными отбрасывают, в IPv6 перекрытие запрещено стандартом.
      Ресурсы на сборку ограничивают по времени и памяти, чтобы поток фрагментов не занял
      всю память. При этом нельзя ломать Path MTU Discovery: ICMP "нужна фрагментация"
      надо пропускать, на туннелях уменьшать MSS. И по возможности избегать фрагментации
      вовсе, выбирая размер пакетов меньше MTU пути.
    key_points:
      - сборка перед проверкой
      - отбрасывание подозрительных фрагментов
      - ограничение времени и памяти на сборку
      - не ломать PMTUD, избегать фрагментации
