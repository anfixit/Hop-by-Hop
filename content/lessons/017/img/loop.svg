<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Петля: широковещательный кадр кружит без конца</text>

  <!-- компьютер A -->
  <rect x="60" y="235" width="140" height="60" rx="10" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="130" y="272" text-anchor="middle" font-size="20" fill="#0E1830">компьютер A</text>
  <line x1="200" y1="265" x2="330" y2="265" stroke="#64748B" stroke-width="3"/>
  <text x="265" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#B91C1C">F0</text>

  <!-- коммутаторы -->
  <rect x="330" y="215" width="170" height="100" rx="12" fill="#0E1830"/>
  <text x="415" y="272" text-anchor="middle" font-size="22" fill="#FFFFFF">коммутатор 1</text>
  <rect x="820" y="215" width="170" height="100" rx="12" fill="#0E1830"/>
  <text x="905" y="272" text-anchor="middle" font-size="22" fill="#FFFFFF">коммутатор 2</text>

  <!-- два кабеля -->
  <path d="M500 240 C600 150 720 150 820 240" fill="none" stroke="#64748B" stroke-width="3"/>
  <path d="M500 290 C600 380 720 380 820 290" fill="none" stroke="#64748B" stroke-width="3"/>
  <text x="660" y="140" text-anchor="middle" font-size="16" fill="#475569">кабель 1</text>
  <text x="660" y="405" text-anchor="middle" font-size="16" fill="#475569">кабель 2</text>

  <!-- копии туда -->
  <text x="610" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#B91C1C">F1 -&gt;</text>
  <text x="610" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#B91C1C">F2 -&gt;</text>
  <!-- копии обратно -->
  <text x="720" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">&lt;- F3</text>
  <text x="720" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#C2410C">&lt;- F4</text>

  <!-- другие порты коммутатора 2 -->
  <line x1="990" y1="265" x2="1100" y2="265" stroke="#64748B" stroke-width="3"/>
  <text x="1045" y="252" text-anchor="middle" font-size="16" fill="#B91C1C">F1, F2</text>
  <rect x="1100" y="240" width="70" height="50" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="1135" y="271" text-anchor="middle" font-size="16" fill="#0E1830">B</text>

  <g font-size="18" fill="#0E1830">
    <text x="60" y="455">1. Коммутатор 1 рассылает F0 на все порты, кроме входного: по двум кабелям уходят F1 и F2.</text>
    <text x="60" y="482">2. Коммутатор 2 не знает, что это копии, и рассылает каждую дальше, в том числе обратно (F3, F4).</text>
    <text x="60" y="509">3. Коммутатор 1 снова рассылает их... Счётчика переходов у кадра Ethernet нет:</text>
    <text x="60" y="536">    кадры кружат бесконечно, B получает дубли, таблицы скачут, а при нескольких петлях копии множатся.</text>
  </g>
</svg>
