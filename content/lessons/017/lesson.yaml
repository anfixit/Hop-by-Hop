id: 17
title: "Петли и STP: как коммутаторы строят дерево без петель"
status: published
summary: >
  Почему петля из коммутаторов кладёт сеть и как протокол покрывающего дерева (STP,
  IEEE 802.1D) её разрывает: выбор корневого моста, корневые и назначенные порты,
  BPDU, таймеры и состояния портов, ускоренный RSTP. На практике - два учебных
  коммутатора в Linux, соединённые петлёй: выбор корня, переключение при обрыве,
  смена корня, защита от BPDU и защита корня. В безопасности - атака на выбор
  корневого моста и как от неё защищаются.

quiz:
  - q: Почему широковещательный кадр в петле из коммутаторов кружит бесконечно?
    options:
      - У кадра Ethernet нет поля, которое ограничивало бы его жизнь
      - Коммутаторы шифруют кадр заново на каждом переходе по петле
      - Контрольная сумма кадра портится, и его пересылают повторно
      - Коммутаторы специально повторяют кадры, пока их не подтвердят
    answer: 0
    explain: >
      У IP-пакета есть счётчик переходов, а у кадра Ethernet нет. Коммутатор не может
      отличить копию от нового кадра и рассылает каждую дальше, поэтому кадры в петле
      живут, пока её не разорвут, а при нескольких петлях ещё и размножаются.

  - q: Какой коммутатор становится корневым мостом?
    options:
      - С наибольшим числом портов в сети
      - С наименьшим идентификатором моста
      - Тот, который включили первым
      - С самыми быстрыми связями до соседей
    answer: 1
    explain: >
      Идентификатор моста - это приоритет (по умолчанию 32768) и MAC-адрес. Корнем
      становится коммутатор с наименьшим идентификатором. Если приоритеты не меняли,
      это коммутатор с наименьшим MAC-адресом.

  - q: Что такое корневой порт коммутатора?
    options:
      - Порт, к которому подключён самый важный сервер сети
      - Порт, на который администратор подключает свой ноутбук
      - Порт с самым коротким путём до корневого моста
      - Порт, который заблокирован для разрыва петли
    answer: 2
    explain: >
      У каждого коммутатора, кроме самого корня, есть ровно один корневой порт - тот,
      через который путь до корня самый короткий. У корня корневого порта нет.

  - q: Что делает заблокированный порт STP?
    options:
      - Полностью выключен и совсем ничего не принимает
      - Пересылает кадры, но не учится по адресам
      - Учится по адресам, но кадры не пересылает
      - Не пересылает кадры, но принимает все BPDU
    answer: 3
    explain: >
      Заблокированный порт не пересылает пользовательские кадры и не учится по ним, но
      продолжает принимать BPDU. Так коммутатор знает, что запасная связь жива, и может
      включить её при отказе основной. В опыте BPDU guard сработал как раз на
      заблокированном порту.

  - q: Почему в классическом STP запасной порт включается только через 30 секунд?
    options:
      - Столько нужно, чтобы кабель прогрелся после сбоя
      - Порт по 15 секунд проходит прослушивание и обучение
      - Коммутатор ждёт подтверждения от администратора сети
      - Коммутатор проверяет кабель тестовыми кадрами полминуты
    answer: 1
    explain: >
      Прежде чем пересылать кадры, порт 15 секунд (forward delay) прослушивает BPDU и ещё
      15 секунд учится по адресам. Если отказ замечен только по тишине, добавляются
      20 секунд max age. RSTP сокращает это до секунд.

  - q: Чем RSTP ускоряет перестройку дерева?
    options:
      - Отказывается от BPDU и узнаёт топологию по пользовательским кадрам
      - Заранее выбирает запасные порты и быстрее обнаруживает отказ
      - Разрешает петли и просто выбрасывает повторные копии кадров
      - Поручает выбор дерева центральному серверу управления сетью
    answer: 1
    explain: >
      Альтернативные и резервные порты в RSTP выбираются заранее, вместе с основными, и
      при отказе альтернативный сразу становится корневым. Отказ обнаруживается за три
      пропущенных Hello (6 секунд), а тупиковые порты для компьютеров включаются сразу.

  - q: Почему устройство злоумышленника может стать корневым мостом?
    options:
      - BPDU шифруются общим ключом, который легко подобрать
      - Корнем становится последний подключённый мост
      - Никто не проверяет BPDU и объявленный в них корень
      - Коммутаторы выбирают корень по наибольшему MAC-адресу
    answer: 2
    explain: >
      BPDU не подписаны, и коммутаторы верят любому, кто на них говорит. Достаточно
      объявить приоритет меньше, чем у настоящего корня, как сделал swb в шаге 7 опыта.

  - q: Что делает BPDU guard, когда на порту появляется BPDU?
    options:
      - Сразу выключает порт
      - Делает порт корневым
      - Пересылает BPDU корню
      - Меняет приоритет моста
    answer: 0
    explain: >
      BPDU guard включают на портах для компьютеров, где BPDU появляться не должны. Если
      BPDU всё же пришёл, значит, там оказался коммутатор или атакующий, и порт
      выключается, как в шаге 5 опыта.

  - q: Для чего нужна защита корня (root guard)?
    options:
      - Чтобы корневой мост не выключили удалённо по сети
      - Чтобы через этот порт корнем не стал чужой коммутатор
      - Чтобы корневой мост шифровал свои BPDU и не был подделан
      - Чтобы корневой мост не пересылал широковещательные кадры
    answer: 1
    explain: >
      Если на порту с защитой корня появляется BPDU с "лучшим" корнем, порт не меняет
      корень, а блокируется. В опыте swa не признал swb корнем, и его порты остались
      в прослушивании: сеть разделилась, но чужой корень не принят.

open_questions:
  - q: Объясни, как STP строит покрывающее дерево и что происходит с портами, которые в него не вошли.
    reference: >
      Коммутаторы обмениваются BPDU на групповой адрес 01:80:C2:00:00:00. Сначала
      выбирается корневой мост - коммутатор с наименьшим идентификатором (приоритет +
      MAC-адрес): каждый сначала считает корнем себя и признаёт кандидата с меньшим
      идентификатором. Затем каждый коммутатор, кроме корня, выбирает корневой порт - с
      наименьшим расстоянием до корня (сумма стоимостей связей). Потом на каждом
      сегменте выбирается назначенный порт - порт коммутатора, ближайшего к корню; у
      корня все порты назначенные. Остальные порты блокируются: они не пересылают кадры
      и не учатся, но принимают BPDU, чтобы при отказе дерево можно было перестроить.
    key_points:
      - BPDU и выбор корня по наименьшему идентификатору (приоритет + MAC)
      - корневой порт - кратчайший путь к корню
      - назначенный порт на каждом сегменте
      - остальные блокируются, но принимают BPDU

  - q: Почему классический STP медленно восстанавливает связь после отказа и как это исправляет RSTP?
    reference: >
      В STP порт перед продвижением проходит прослушивание и обучение, по forward delay
      15 секунд каждое, то есть 30 секунд. Если отказ произошёл не на своей связи и
      коммутатор замечает его только по отсутствию Hello, добавляется max age 20
      секунд, всего больше 50 секунд. RSTP (802.1w) убирает прослушивание, сразу
      включает тупиковые порты, обнаруживает отказ за 3 пропущенных Hello (6 секунд) и
      заранее выбирает альтернативные и резервные порты, которые при отказе сразу берут
      на себя роль корневого или назначенного. Поэтому перестройка занимает секунды.
    key_points:
      - прослушивание и обучение по 15 секунд
      - max age 20 секунд при отказе, замеченном по тишине
      - RSTP - тупиковые порты, 3 Hello, альтернативные и резервные порты
      - перестройка за секунды

  - q: В чём суть атаки на выбор корневого моста и какие меры от неё защищают?
    reference: >
      BPDU не подписаны и не проверяются, поэтому устройство, подключённое к порту со
      STP, может объявить идентификатор меньше, чем у настоящего корня, и дерево
      перестроится вокруг него. Если оно подключено к двум коммутаторам, часть трафика
      может пойти через него (человек посередине); частые перестройки ещё и нарушают
      доступность. Защита: сознательно задать наименьший приоритет корню в ядре сети;
      на портах для компьютеров включать BPDU guard, который выключает порт при
      появлении BPDU; на портах, за которыми корня быть не должно, - root guard,
      блокирующий порт при "лучшем" BPDU; не отключать STP и следить за сменами корня.
    key_points:
      - BPDU не проверяются, достаточно объявить меньший идентификатор
      - последствия - перехват части трафика или нарушение доступности
      - приоритет корня задан сознательно
      - BPDU guard на пользовательских портах, root guard в сторону коммутаторов доступа
