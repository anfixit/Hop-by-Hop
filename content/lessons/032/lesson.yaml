id: 32
title: "Протоколы маршрутизации: RIP и OSPF"
status: published
summary: >
  Как маршрутизаторы сами строят таблицы: статическая и динамическая маршрутизация,
  вектор расстояний и состояние связей. RIP: метрика в шагах, 30 и 180 секунд, 16 как
  бесконечность, счёт до бесконечности и приёмы против него. OSPF: Hello, LSA, общая
  карта и алгоритм Дейкстры, стоимость, ECMP, DR, области. На практике - кольцо из
  четырёх маршрутизаторов на BIRD: RIP с отравленным обратным маршрутом, OSPF с двумя
  равными путями, смена стоимости, тихий отказ линии и сосед с неверным ключом.
  Ложные маршруты - принципы и защита.

quiz:
  - q: Что рассылает соседям маршрутизатор с протоколом вектора расстояний?
    options:
      - Полную карту сети со всеми линиями
      - Список сетей и расстояние до каждой
      - Только сообщения Hello без маршрутов
      - Копии всех проходящих через него пакетов
    answer: 1
    explain: >
      Маршрутизатор RIP рассылает вектор: какие сети он знает и как до них далеко.
      Сосед прибавляет расстояние до отправителя и выбирает лучшее. Полную карту
      рассылают протоколы состояния связей.

  - q: Что в RIP означает метрика 16?
    options:
      - Сеть недоступна
      - Сеть в 16 шагах
      - Линия 16 Мбит/с
      - Приоритет 16
    answer: 0
    explain: >
      В RIP 16 - это "бесконечность", сеть недоступна. Поэтому RIP годится для сетей,
      где путь не длиннее 15 маршрутизаторов, зато счёт до бесконечности кончается
      быстро.

  - q: Почему в дистанционно-векторных протоколах возникает счёт до бесконечности?
    options:
      - Они считают путь алгоритмом Дейкстры
      - Сообщения RIP идут без проверки подлинности
      - Маршрутизаторы слишком часто шлют сообщения Hello
      - Маршрутизатор не видит, что путь идёт через него
    answer: 3
    explain: >
      Сосед сообщает только расстояние, а не путь. Маршрутизатор может принять путь,
      который проходит через него же, и расстояние растёт на единицу за обмен, пока не
      дойдёт до "бесконечности".

  - q: Что делает приём "отравленный обратный маршрут" (poisoned reverse)?
    options:
      - Говорит соседу, что через меня сеть недоступна
      - Удаляет из таблицы все маршруты от этого соседа
      - Шифрует векторы, чтобы их никто не подменил
      - Меняет метрику всех своих маршрутов на единицу
    answer: 0
    explain: >
      Маршрутизатор сообщает соседу маршруты, которые узнал от него же, с метрикой 16:
      "через меня туда не ходи". В опыте так r2 отправил r1 его же сеть с метрикой 16.

  - q: Как маршрутизатор OSPF узнаёт кратчайшие пути?
    options:
      - Берёт лучший вектор расстояний от соседей
      - Спрашивает сервер маршрутов в своей области
      - Сам по общей карте с помощью алгоритма Дейкстры
      - Выбирает путь с наименьшим числом шагов по RIP
    answer: 2
    explain: >
      Каждый рассылает всем описание своих связей (LSA), у всех одна карта области, и
      каждый сам считает кратчайшие пути алгоритмом Дейкстры.

  - q: Как обычно задают стоимость линии в OSPF?
    options:
      - По числу маршрутизаторов на пути
      - Обратно пропорционально её скорости
      - По задержке, измеренной сообщением ECHO
      - Случайно, чтобы делить нагрузку
    answer: 1
    explain: >
      У многих производителей по умолчанию стоимость - эталонная скорость (обычно
      100 Мбит/с), делённая на скорость линии; в BIRD по умолчанию просто 10.
      Путь с наименьшей суммой стоимостей побеждает, администратор может задать её сам.

  - q: Что делает OSPF, если до сети есть два пути одинаковой стоимости?
    options:
      - Оставляет путь, о котором узнал первым
      - Выбирает путь через соседа с меньшим ID
      - Отключает один путь до отказа другого пути
      - Использует оба и делит между ними трафик
    answer: 3
    explain: >
      Это ECMP (Equal-Cost Multi-Path). В опыте у r1 до сети r3 два равных пути, и в
      таблице ядра стоит маршрут с двумя nexthop.

  - q: Какая мера защищает OSPF от чужого маршрутизатора в сети?
    options:
      - Увеличить интервал Hello до 60 секунд
      - Проверять сообщения по общему ключу
      - Перейти с OSPF на протокол RIPv1
      - Поставить всем линиям стоимость 1
    answer: 1
    explain: >
      С криптографической проверкой подлинности сообщения без верного ключа
      отбрасываются, и соседом не стать, как r5 в опыте. Её дополняют пассивными
      интерфейсами, фильтрами пакетов и маршрутов.

open_questions:
  - q: Чем отличаются протоколы вектора расстояний и состояния связей?
    reference: >
      В векторе расстояний (RIP) маршрутизатор сообщает соседям список сетей и
      расстояний; сосед прибавляет расстояние до него и выбирает лучшее. Сведения идут из
      вторых рук, маршрутизатор не знает всей топологии, отсюда счёт до бесконечности и
      медленное схождение. В состоянии связей (OSPF, IS-IS) каждый рассылает всем
      описание своих связей, у всех одна карта, пути каждый считает сам алгоритмом
      Дейкстры; схождение быстрое, но нужно больше памяти и вычислений.
    key_points:
      - вектор - расстояния соседям, состояние связей - свои связи всем
      - из вторых рук против общей карты
      - счёт до бесконечности у вектора расстояний
      - Дейкстра, быстрое схождение, больше ресурсов

  - q: Что такое счёт до бесконечности и как с ним борются в RIP?
    reference: >
      Когда сеть пропадает, соседи продолжают сообщать устаревшие расстояния до неё, и
      маршрутизатор может принять путь через самого себя; расстояние растёт на единицу за
      обмен, а пакеты ходят по петле. RIP ограничивает бесконечность числом 16, применяет
      расщепление горизонта (не сообщать соседу маршрут, узнанный от него),
      отравленный обратный маршрут (сообщать с метрикой 16), мгновенные обновления и
      замораживание. Эти приёмы сокращают петли, но не исключают их для петель из трёх
      и более маршрутизаторов.
    key_points:
      - устаревшие сведения и петля
      - 16 как бесконечность
      - расщепление горизонта и отравленный обратный маршрут
      - мгновенные обновления, замораживание, не всё решают

  - q: Почему протоколам маршрутизации нельзя верить всем подряд и как их защищают?
    reference: >
      Маршрутизатор принимает маршруты от соседей и передаёт дальше, поэтому
      неисправный или посторонний маршрутизатор, ставший соседом, может объявить ложные
      маршруты, и трафик уйдёт не туда. Защита: криптографическая проверка подлинности
      сообщений (OSPF с HMAC-SHA), пассивные интерфейсы в сторону пользователей, фильтры
      пакетов протоколов маршрутизации на портах доступа, фильтры принимаемых маршрутов,
      отдельная сеть управления и наблюдение за соседями и картой.
    key_points:
      - доверие к соседям, ложные маршруты
      - проверка подлинности сообщений
      - пассивные интерфейсы и фильтры
      - наблюдение
