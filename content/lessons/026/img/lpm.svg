<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#0E1830">Самый длинный совпадающий префикс</text>

  <g font-size="18" fill="#0E1830">
    <text x="60" y="100" font-weight="bold">таблица маршрутов</text>
    <text x="700" y="100" font-weight="bold">пакет для 10.20.30.41: какие строки подходят?</text>
  </g>
  <g font-size="17" font-family="monospace" fill="#0E1830">
    <rect x="60" y="120" width="580" height="46" fill="#F1F5F9" stroke="#94A3B8"/><text x="80" y="150">0.0.0.0/0     </text><text x="300" y="150">via 192.0.2.254</text>
    <rect x="60" y="166" width="580" height="46" fill="#DBEAFE" stroke="#2563EB"/><text x="80" y="196">10.20.0.0/16  </text><text x="300" y="196">via 198.51.100.254</text>
    <rect x="60" y="212" width="580" height="46" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="80" y="242">10.20.30.0/24 </text><text x="300" y="242">via 203.0.113.254</text>
    <rect x="60" y="258" width="580" height="46" fill="#F1F5F9" stroke="#94A3B8"/><text x="80" y="288">10.20.30.40/32</text><text x="300" y="288">via 192.0.2.254</text>
  </g>
  <g font-size="17" fill="#0E1830">
    <text x="700" y="150">подходит: /0 совпадает с любым адресом</text>
    <text x="700" y="196">подходит: совпали все 16 бит префикса</text>
    <text x="700" y="242" font-weight="bold" fill="#15803D">подходит: 24 бита префикса - самый длинный, выбран</text>
    <text x="700" y="288">не подходит: нужен ровно 10.20.30.40</text>
  </g>

  <rect x="60" y="340" width="1080" height="190" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g font-size="17" fill="#0E1830">
    <text x="80" y="372" font-weight="bold">Итог по разным адресам (из опыта)</text>
    <text x="80" y="404" font-family="monospace">10.20.30.40</text><text x="250" y="404" font-family="monospace">-&gt; /32</text><text x="350" y="404" font-family="monospace">-&gt; via 192.0.2.254</text><text x="640" y="404">(точнее всего)</text>
    <text x="80" y="432" font-family="monospace">10.20.30.41</text><text x="250" y="432" font-family="monospace">-&gt; /24</text><text x="350" y="432" font-family="monospace">-&gt; via 203.0.113.254</text>
    <text x="80" y="460" font-family="monospace">10.20.99.1</text><text x="250" y="460" font-family="monospace">-&gt; /16</text><text x="350" y="460" font-family="monospace">-&gt; via 198.51.100.254</text>
    <text x="80" y="488" font-family="monospace">8.8.8.8</text><text x="250" y="488" font-family="monospace">-&gt; /0</text><text x="350" y="488" font-family="monospace">-&gt; via 192.0.2.254</text><text x="640" y="488">(по умолчанию)</text>
    <text x="80" y="516">Порядок строк не важен: решает длина совпавшего префикса, а при равной длине - метрика.</text>
  </g>
</svg>
