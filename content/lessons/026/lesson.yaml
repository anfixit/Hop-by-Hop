id: 26
title: "Маршрутизация: таблица маршрутов, самый длинный префикс и шлюз по умолчанию"
status: published
summary: >
  Как выбирается путь пакета: маршрутизируют и компьютеры, и маршрутизаторы; поля
  таблицы маршрутов; подключённые, статические и динамические записи; маршрут по
  умолчанию и зона без умолчаний; правило самого длинного совпадающего префикса и
  метрика. На практике - учебный маршрутизатор в Linux и ip route get для разных
  адресов. И почему таблица маршрутов важна для безопасности.

quiz:
  - q: Компьютер отправляет пакет на адрес в другой сети. Что он делает?
    options:
      - Отдаёт пакет шлюзу, не меняя адрес получателя
      - Меняет адрес получателя на адрес шлюза по умолчанию
      - Рассылает пакет всем в своей сети, чтобы нашёлся путь
      - Спрашивает у получателя по ARP его MAC-адрес
    answer: 0
    explain: >
      Для другой сети пакет отдаётся шлюзу: ARP спрашивает MAC-адрес маршрутизатора, а
      IP-адрес получателя в пакете остаётся прежним.

  - q: Что означает запись 0.0.0.0/0 в таблице маршрутов?
    options:
      - Маршрут к адресу 0.0.0.0
      - Запрет всех пакетов
      - Маршрут к своей сети
      - Маршрут по умолчанию
    answer: 3
    explain: >
      Префикс нулевой длины совпадает с любым адресом. Это маршрут по умолчанию: он
      используется, когда ни одна более точная запись не подошла.

  - q: В таблице есть 10.20.0.0/16 через A и 10.20.30.0/24 через B. Куда пойдёт пакет для 10.20.30.5?
    options:
      - Через A, потому что эта запись стоит выше
      - Через B, потому что его префикс длиннее
      - По обоим маршрутам по очереди
      - Через шлюз по умолчанию
    answer: 1
    explain: >
      Адрес подходит под обе записи, выбирается самая длинная совпадающая - /24. Порядок
      строк в таблице значения не имеет.

  - q: Когда учитывается метрика маршрута?
    options:
      - Всегда, раньше длины префикса
      - Только для маршрута по умолчанию
      - При одинаковой длине префикса
      - Только для подключённых сетей
    answer: 2
    explain: >
      Сначала выбирается самый длинный префикс. Если несколько записей с одинаковой
      длиной, побеждает меньшая метрика, как в опыте: 50 против 100.

  - q: Откуда берётся маршрут к сети, подключённой к интерфейсу?
    options:
      - Его сообщает соседний маршрутизатор по протоколу RIP
      - Система добавляет его сама при назначении адреса
      - Администратор всегда вносит его вручную
      - Его выдаёт провайдер вместе с IP-адресом
    answer: 1
    explain: >
      Как только интерфейсу назначен адрес с префиксом, ядро добавляет маршрут к его
      сети (в Linux - с пометкой proto kernel).

  - q: Почему в опыте Linux не дал указать шлюзом адрес из неподключённой сети?
    options:
      - Иначе пакет не пройдёт проверку TTL
      - Так требует протокол маршрутизации
      - Шлюз должен быть в сети получателя
      - Кадр шлюзу шлют напрямую, по ARP
    answer: 3
    explain: >
      Пакет шлюзу передаётся в кадре на его MAC-адрес, а его можно узнать через ARP
      только в своей сети. Поэтому ядро и ответило "Nexthop has invalid gateway".

  - q: Что произойдёт с пакетом, если ни одна запись не подошла и маршрута по умолчанию нет?
    options:
      - Пакет отбросят и сообщат о недоступности
      - Пакет будет разослан во все сети по очереди
      - Пакет подождёт, пока появится маршрут
      - Пакет отправят обратно через тот же интерфейс
    answer: 0
    explain: >
      Пути нет, и пакет отбрасывается, а отправителю сообщается, что сеть недоступна. В
      опыте ядро ответило "Network is unreachable".

  - q: Почему маршрут к одному узлу (/32) опасен, если его добавит посторонний?
    options:
      - Он удаляет маршрут по умолчанию из таблицы
      - Он заменяет адрес отправителя в пакетах
      - Он побеждает, и трафик уйдёт куда указано
      - Он делает адрес узла недоступным для ARP
    answer: 2
    explain: >
      /32 - самый длинный префикс, поэтому он побеждает все общие маршруты, и трафик к
      этому адресу пойдёт туда, куда указал добавивший. Поэтому стоит следить за
      неожиданными записями в таблице.

open_questions:
  - q: Объясни, как по таблице маршрутов выбирается путь для пакета.
    reference: >
      Берётся адрес получателя и сравнивается со всеми записями таблицы: сеть и маска.
      Подходят все записи, чей префикс совпадает с адресом; маршрут по умолчанию
      0.0.0.0/0 подходит всегда. Из подходящих выбирается самая длинная (самый длинный
      совпадающий префикс), при равной длине - с меньшей метрикой. Порядок строк не
      важен. Если запись без шлюза (подключённая сеть), пакет доставляется напрямую, если
      со шлюзом - отдаётся следующему маршрутизатору, а его MAC-адрес узнаётся через ARP.
      Если ничего не подошло и маршрута по умолчанию нет, пакет отбрасывается.
    key_points:
      - сравнение адреса с сетями и масками
      - самый длинный префикс, затем метрика
      - напрямую или через следующий маршрутизатор
      - без подходящей записи пакет отбрасывается

  - q: Что такое маршрут по умолчанию и зачем он нужен?
    reference: >
      Маршрут по умолчанию 0.0.0.0/0 указывает шлюз для всех сетей, о которых нет
      отдельной записи. Благодаря ему компьютерам и небольшим маршрутизаторам не нужно
      знать пути ко всем сетям интернета: у домашнего компьютера это его сеть и маршрут
      к роутеру, у роутера - сеть квартиры и маршрут к провайдеру. Только маршрутизаторы
      в ядре интернета работают без маршрута по умолчанию (зона, свободная от умолчаний)
      и знают пути ко всем префиксам. Без маршрута по умолчанию пакеты в неизвестные
      сети отбрасываются.
    key_points:
      - 0.0.0.0/0 совпадает с любым адресом
      - один шлюз для всех неизвестных сетей
      - маленькие таблицы у компьютеров и роутеров
      - зона без умолчаний в ядре интернета

  - q: Почему таблица маршрутов важна для безопасности?
    reference: >
      Кто управляет таблицей маршрутов, тот решает, куда пойдёт трафик. Более точный
      маршрут, например к одному узлу, побеждает общие маршруты, поэтому посторонняя
      запись может увести трафик к злоумышленнику; законно так же работают VPN-клиенты.
      Динамические маршруты от соседей и сообщения ICMP Redirect могут быть
      поддельными, и доверять им без проверки опасно. Запрещённые маршруты (unreachable,
      blackhole) защищают: не
      выпускают пакеты в частные сети и отбрасывают атакующий трафик. Таблицу своих
      серверов стоит проверять.
    key_points:
      - кто управляет таблицей, тот направляет трафик
      - точный маршрут побеждает, посторонние записи опасны
      - ложные динамические маршруты и ICMP Redirect
      - unreachable и blackhole как защита
