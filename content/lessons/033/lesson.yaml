id: 33
title: "BGP и устройство интернета: автономные системы и пиринг"
status: published
summary: >
  Как устроен интернет из независимых сетей: автономные системы и их номера, транзит и
  пиринг, точки обмена трафиком, уровни провайдеров. BGP как протокол вектора путей:
  TCP 179, соседи вручную, атрибуты AS_PATH, NEXT_HOP, LOCAL_PREF, MED, eBGP и iBGP,
  порядок выбора пути и управление трафиком. На практике - четыре AS на BIRD: выбор по
  длине пути, политика через LOCAL_PREF, удлинение пути и проверка происхождения по
  ROA. Перехват префиксов и утечки маршрутов - принципы и защита.

quiz:
  - q: Что такое автономная система?
    options:
      - Сеть, которая работает без подключения к интернету
      - Группа сетей под одним управлением с общей политикой
      - Маршрутизатор, на котором работает протокол BGP
      - Любая сеть, у которой есть собственный DNS-сервер
    answer: 1
    explain: >
      Автономная система - совокупность сетей под единым административным управлением
      с общей политикой маршрутизации, обычно сеть провайдера, компании или облака.

  - q: Как соседи BGP обмениваются маршрутами?
    options:
      - Рассылают векторы по UDP на групповой адрес
      - Шлют сообщения прямо в IP с протоколом 89
      - Держат сеанс TCP на порту 179 с заданным соседом
      - Передают всю карту сети лавиной всем маршрутизаторам
    answer: 2
    explain: >
      BGP работает поверх TCP (порт 179), и соседей администратор задаёт вручную: адрес
      и номер AS. UDP и групповые адреса - это RIP, протокол 89 - OSPF.

  - q: Как BGP отсекает петли маршрутов между автономными системами?
    options:
      - Ограничивает путь 15 шагами, как RIP
      - Отбрасывает путь со своим номером AS
      - Проверяет каждый маршрут по базе RPKI
      - Уменьшает TTL в каждом сообщении UPDATE
    answer: 1
    explain: >
      Каждая AS дописывает свой номер в AS_PATH. Если маршрутизатор видит в пути свой
      номер, маршрут уже прошёл через его AS, и объявление отбрасывается.

  - q: Какой атрибут BGP сравнивается первым при выборе пути?
    options:
      - LOCAL_PREF, предпочтение внутри своей AS
      - Длина AS_PATH, число автономных систем
      - MED, подсказка соседа о точке входа
      - Стоимость пути IGP до следующего шага
    answer: 0
    explain: >
      Первым сравнивается LOCAL_PREF: так администратор задаёт политику, например
      "маршруты от клиентов лучше маршрутов от провайдеров". Длина пути - только потом,
      как в шаге 3 опыта.

  - q: Как AS может сделать свой путь менее привлекательным для соседей?
    options:
      - Поставить LOCAL_PREF 0 всем своим маршрутам
      - Уменьшить MTU на внешнем интерфейсе
      - Перестать отвечать на сообщения KEEPALIVE
      - Повторить свой номер AS в пути несколько раз
    answer: 3
    explain: >
      Удлинение пути (prepend) делает AS_PATH длиннее, и соседи при прочих равных
      выберут другой путь. LOCAL_PREF действует только внутри своей AS и соседям не
      передаётся.

  - q: Что значит, что пиринг не транзитивен?
    options:
      - Из пиринга с двумя сетями не следует транзит между ними через нас
      - Пиринговые сеансы нельзя устанавливать через точки обмена трафиком
      - Две сети могут пиринговать, только если у них одинаковые номера AS
      - Маршруты от пира нельзя записывать в таблицу маршрутизации ядра
    answer: 0
    explain: >
      Пиры объявляют друг другу только свои сети и сети клиентов. Если AS3 пирингует с
      AS2 и с AS4, AS4 не получит через AS3 маршрутов к AS2 и пойдёт к ней через своего
      провайдера.

  - q: Почему перехват префикса более длинным объявлением так опасен?
    options:
      - Более длинный префикс всегда шифруется, и его не проверить
      - BGP принимает только первое объявление каждого префикса
      - Самый длинный совпадающий префикс побеждает при пересылке
      - Короткие префиксы маршрутизаторы автоматически удаляют
    answer: 2
    explain: >
      При пересылке побеждает самый длинный совпадающий префикс, независимо от
      атрибутов BGP. Поэтому чужое объявление /25 перетянет трафик у честного /24 везде,
      где его приняли.

  - q: Что проверяет проверка происхождения по RPKI (ROV)?
    options:
      - Что весь путь AS_PATH подписан каждой сетью
      - Что сеанс BGP защищён паролем от подмены
      - Что трафик по маршруту шифруется от начала до конца
      - Что AS вправе объявлять этот префикс такой длины
    answer: 3
    explain: >
      ROA говорит, какая AS может объявлять блок и до какой длины. ROV сверяет с этим
      происхождение маршрута (последнюю AS в пути). Весь путь она не проверяет.

open_questions:
  - q: Чем BGP отличается от OSPF и зачем он нужен?
    reference: >
      OSPF работает внутри одной автономной системы и ищет самый короткий путь; все
      маршрутизаторы под одним управлением и видят общую карту. BGP работает между AS,
      принадлежащими разным хозяевам, и выполняет политику: кому какие маршруты
      объявлять и какие предпочитать, по договорам транзита и пиринга. Это протокол
      вектора путей: соседи, заданные вручную, по TCP 179 передают префиксы с атрибутами
      (AS_PATH, NEXT_HOP, LOCAL_PREF, MED); петли отсекаются по AS_PATH. Внутри AS
      маршруты BGP разносит iBGP.
    key_points:
      - внутри AS против между AS
      - политика вместо кратчайшего пути
      - вектор путей, TCP 179, соседи вручную, атрибуты
      - петли по AS_PATH, eBGP и iBGP

  - q: Как BGP выбирает путь и как AS влияет на свой исходящий и входящий трафик?
    reference: >
      Маршруты к одному префиксу сравниваются по очереди: наибольший LOCAL_PREF, самый
      короткий AS_PATH, меньший ORIGIN, меньший MED, eBGP лучше iBGP, меньшая стоимость
      IGP до следующего шага (ранний выход). Исходящим трафиком AS управляет через LOCAL_PREF:
      её маршрутизаторы выбирают нужный выход. На входящий трафик она влияет косвенно:
      удлиняет свой путь повторением номера AS для одних соседей или объявляет более
      длинные префиксы через нужное подключение.
    key_points:
      - LOCAL_PREF, AS_PATH, ORIGIN, MED, eBGP/iBGP, IGP
      - исходящий - LOCAL_PREF
      - входящий - prepend и более длинные префиксы
      - политика важнее длины пути

  - q: Что такое перехват префикса и утечка маршрутов и как от них защищаются?
    reference: >
      Перехват - объявление чужого адресного блока как своего; если оно более длинное,
      оно побеждает честное по правилу самого длинного префикса, и трафик уходит не туда.
      Утечка - передача маршрутов не тем соседям, например от одного провайдера другому.
      Чаще это ошибки. Защита: фильтры префиксов на сеансах с клиентами и лимиты числа
      маршрутов, RPKI с ROA и проверка происхождения (отбрасывать invalid), правила по
      ролям соседей, защита сеансов (TCP-AO, GTSM), наблюдение за своими префиксами.
      ROV проверяет только происхождение, не весь путь.
    key_points:
      - перехват и более длинный префикс
      - утечка маршрутов
      - фильтры и лимиты на сеансах
      - RPKI, ROA, проверка происхождения, наблюдение
