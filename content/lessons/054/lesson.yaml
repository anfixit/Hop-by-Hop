id: 54
title: "nftables: семейства, наборы, словари; переход с iptables"
status: published
summary: >
  nftables как преемник iptables: одна программа для всех семейств, таблицы и
  цепочки с нуля, базовые и обычные цепочки, несколько действий в правиле, наборы
  с типами и флагами, словари данных и вердиктов, журнал, атомарная загрузка и
  хранение правил, переход с iptables. На практике - таблица inet с набором портов,
  набором адресов администраторов и словарём вердиктов, изменение набора на ходу,
  элементы с временем жизни, счётчики и iptables-translate.

quiz:
  - q: Что в nftables заменяет отдельные программы iptables и ip6tables?
    options:
      - Две программы nft4 и nft6 с общим форматом
      - Одна программа nft и семейство inet
      - Модуль ipset в ядре Linux
      - Таблица filter, созданная заранее
    answer: 1
    explain: >
      В nftables одна программа nft для всех семейств, а семейство inet позволяет
      написать одни правила сразу для IPv4 и IPv6. В опыте одна таблица inet
      открыла сайт по обоим протоколам.

  - q: Как в опыте открыли порт 8080, не перезагружая правила?
    options:
      - Добавили правило в начало цепочки
      - Сменили политику цепочки на accept
      - Добавили элемент в набор web_ports
      - Перезапустили службу nftables
    answer: 2
    explain: >
      Правило ссылалось на именованный набор @web_ports. Команда nft add element
      добавила в него 8080, и порт открылся сразу, правила остались прежними.

  - q: Что делает словарь вердиктов (vmap)?
    options:
      - Выдаёт вердикт по значению поля пакета
      - Хранит адреса для замены при NAT
      - Записывает все вердикты в журнал ядра
      - Объединяет таблицы ip и ip6 в одну
    answer: 0
    explain: >
      vmap сопоставляет ключу вердикт: tcp dport vmap { 22 : jump admin, 80 :
      accept }. Одна проверка вместо цепочки правил. Адреса для NAT выдаёт
      словарь данных.

  - q: Почему в опыте порт 22 по IPv6 был закрыт даже для компьютера администратора?
    options:
      - nftables не умеет фильтровать IPv6
      - Цепочка admin не работает в семействе inet
      - Порт 22 не слушал IPv6 на сервере
      - В наборе admins были только адреса IPv4
    answer: 3
    explain: >
      Набор admins имеет тип ipv4_addr. Соединение по IPv6 попало в цепочку admin,
      не нашлось в наборе и получило отказ. Для IPv6 нужен свой набор и правило с
      ip6 saddr.

  - q: Что даёт флаг timeout у набора?
    options:
      - Элементы исчезают по истечении срока
      - Правило с набором срабатывает с задержкой
      - Соединения закрываются по таймауту
      - В набор нельзя добавлять элементы
    answer: 0
    explain: >
      Элемент добавляется со сроком жизни и исчезает сам. В опыте элемент с
      timeout 2s через 3 секунды пропал. Так делают временные блокировки.

  - q: Что произойдёт, если в файле, загружаемом nft -f, есть ошибка?
    options:
      - Применятся правила до строки с ошибкой
      - Все правила на машине будут удалены
      - Ничего не применится, старое останется
      - Ошибочное правило будет пропущено
    answer: 2
    explain: >
      nft -f загружает файл как одну транзакцию: либо весь, либо ничего. Проверить
      файл без применения можно командой nft -c -f.

  - q: Как перевести команду iptables в синтаксис nftables?
    options:
      - nft-import-rules
      - iptables-convert
      - nft-migrate-rules
      - iptables-translate
    answer: 3
    explain: >
      iptables-translate переводит отдельную команду, iptables-restore-translate -
      целый сохранённый набор. Перевод дословный, его стоит доработать: таблица
      inet, наборы вместо повторяющихся правил.

  - q: Чем базовая цепочка nftables отличается от обычной?
    options:
      - Она привязана к хуку и имеет политику
      - Она может содержать только одно правило
      - Она работает только с IPv4
      - Она создаётся ядром автоматически
    answer: 0
    explain: >
      У базовой цепочки есть тип, хук, приоритет и политика. Обычная ни к чему не
      привязана, в неё переходят из правил через jump или goto, как в цепочку
      admin в опыте.

open_questions:
  - q: Чем nftables отличается от iptables?
    reference: >
      Одна программа nft для всех семейств (ip, ip6, inet, arp, bridge, netdev)
      вместо iptables, ip6tables, arptables, ebtables; inet - одни правила на IPv4
      и IPv6. Таблицы и цепочки не созданы заранее, их задаёт пользователь; базовые
      цепочки привязаны к хуку с типом, приоритетом и политикой, обычные
      вызываются через jump и goto. В правиле несколько действий (счётчик, журнал,
      вердикт). Встроены наборы и словари. Файл правил применяется атомарно через
      nft -f. Внутри ядра правила выполняет виртуальная машина nf_tables.
    key_points:
      - одна программа, семейства, inet
      - таблицы и цепочки с нуля, базовые и обычные
      - наборы и словари
      - атомарная загрузка

  - q: Что такое наборы и словари в nftables и зачем они нужны?
    reference: >
      Набор - множество значений (порты, адреса, сети, сцепления вроде адрес и
      порт), с которым правило сравнивает поле пакета за одну операцию поиска.
      Именованный набор меняют на ходу командами nft add/delete element, не трогая
      правила; флаги interval, timeout и dynamic дают диапазоны, срок жизни
      элементов и пополнение из правил. Словарь сопоставляет ключу значение:
      словарь данных - например, адрес для NAT, словарь вердиктов (vmap) - сам
      вердикт. Они заменяют десятки правил и работают быстро даже на тысячах
      элементов.
    key_points:
      - набор, поиск за одну операцию
      - изменение на ходу, флаги
      - словарь данных и вердиктов
      - вместо множества правил

  - q: Как хранить правила nftables и как перейти на них с iptables?
    reference: >
      Правила держат в файле (в Debian и Ubuntu /etc/nftables.conf, его загружает
      nftables.service), начинают его с flush ruleset (или, если рядом есть таблицы Docker и
      iptables-nft, пересоздают только свою таблицу) и загружают nft -f -
      атомарно; проверка без применения - nft -c -f. Переход: iptables-translate и
      ip6tables-translate для отдельных команд, iptables-restore-translate для
      сохранённого набора, затем доработка (inet, наборы); либо оставить
      iptables-nft. Свои таблицы живут рядом с таблицами iptables-nft и Docker, но
      пакет должен быть разрешён во всех таблицах на пути.
    key_points:
      - файл, nft -f, flush ruleset, nft -c
      - iptables-translate, restore-translate
      - доработка перевода
      - разрешение во всех таблицах
