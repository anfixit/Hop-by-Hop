name: Telegram notify
description: Отправить итог пайплайна в Telegram

inputs:
  status:
    description: success | failure | cancelled
    required: true
  title:
    description: Что за пайплайн (Тесты, Деплой)
    required: true
  bot-token:
    required: true
  chat-id:
    required: true

runs:
  using: composite
  steps:
    - name: Send message
      shell: bash
      # Всё пользовательское (текст коммита, ветка) передаётся через env, а не подставляется
      # в скрипт через ${{ }}: иначе коммит с `$(...)` в сообщении выполнится как команда.
      env:
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        BOT_TOKEN: ${{ inputs.bot-token }}
        CHAT_ID: ${{ inputs.chat-id }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        COMMIT_MSG: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message || github.event.pull_request.title || '' }}
        SHA: ${{ github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "Секреты для уведомлений не заданы, пропускаю"; exit 0
        fi
        case "$STATUS" in
          success)   icon="✅" ;;
          failure)   icon="❌" ;;
          cancelled) icon="⚪️" ;;
          *)         icon="❔" ;;
        esac
        esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
        subject=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-200 | esc)
        text="$icon <b>$(printf '%s' "$TITLE" | esc)</b>: $STATUS
        $(printf '%s' "$REPO" | esc) · $(printf '%s' "$REF" | esc) · ${SHA:0:7}
        $subject
        by $(printf '%s' "$ACTOR" | esc)
        <a href=\"$RUN_URL\">Открыть запуск</a>"
        curl -sS --fail-with-body -o /dev/null "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHAT_ID}" \
          --data-urlencode "text=${text}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "disable_web_page_preview=true"
